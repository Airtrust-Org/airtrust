<!DOCTYPE html>
<html>
  <head>
    <title>AirTrust - Force Refresh</title>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #2563eb;
        margin-bottom: 20px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin: 10px 5px;
      }
      button:hover {
        background: #1d4ed8;
      }
      .log {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 15px;
        margin-top: 20px;
        font-family: monospace;
        font-size: 14px;
        max-height: 300px;
        overflow-y: auto;
      }
      .success {
        color: #10b981;
      }
      .error {
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🔄 AirTrust - Limpeza Total de Cache</h1>
      <p>
        Use este utilitário para forçar a atualização completa do sistema, removendo todos os
        caches.
      </p>

      <button onclick="clearAllCaches()">🧹 Limpar Tudo e Recarregar</button>
      <button onclick="unregisterSW()">⚙️ Desregistrar Service Worker</button>
      <button onclick="window.location.href='http://localhost:3000'">🏠 Ir para Dashboard</button>

      <div class="log" id="log"></div>
    </div>

    <script>
      function log(msg, type = 'info') {
        const logEl = document.getElementById('log');
        const className = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
        logEl.innerHTML += `<div class="${className}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      async function unregisterSW() {
        log('🔍 Procurando Service Workers...');
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          log(`Encontrados ${registrations.length} service workers`);

          for (const registration of registrations) {
            await registration.unregister();
            log(`✅ Service Worker desregistrado: ${registration.scope}`, 'success');
          }

          if (registrations.length === 0) {
            log('ℹ️  Nenhum service worker registrado');
          }
        } else {
          log('⚠️  Service Worker não suportado neste navegador', 'error');
        }
      }

      async function clearAllCaches() {
        log('🚀 Iniciando limpeza completa...');

        // 1. Service Workers
        await unregisterSW();

        // 2. Cache Storage API
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          log(`🗑️  Encontrados ${cacheNames.length} caches`);

          for (const cacheName of cacheNames) {
            await caches.delete(cacheName);
            log(`✅ Cache deletado: ${cacheName}`, 'success');
          }
        }

        // 3. LocalStorage
        try {
          const lsKeys = Object.keys(localStorage);
          log(`🗑️  Limpando ${lsKeys.length} itens do LocalStorage`);
          localStorage.clear();
          log('✅ LocalStorage limpo', 'success');
        } catch (e) {
          log(`⚠️  Erro ao limpar LocalStorage: ${e}`, 'error');
        }

        // 4. SessionStorage
        try {
          sessionStorage.clear();
          log('✅ SessionStorage limpo', 'success');
        } catch (e) {
          log(`⚠️  Erro ao limpar SessionStorage: ${e}`, 'error');
        }

        // 5. IndexedDB
        if ('indexedDB' in window) {
          try {
            const dbs = await indexedDB.databases();
            log(`🗑️  Encontrados ${dbs.length} databases IndexedDB`);
            for (const db of dbs) {
              if (db.name) {
                indexedDB.deleteDatabase(db.name);
                log(`✅ Database deletado: ${db.name}`, 'success');
              }
            }
          } catch (e) {
            log(`⚠️  Erro ao limpar IndexedDB: ${e}`, 'error');
          }
        }

        log('🎉 Limpeza completa! Recarregando em 2 segundos...', 'success');

        setTimeout(() => {
          window.location.href = 'http://localhost:3000';
          window.location.reload();
        }, 2000);
      }

      // Log inicial
      log('✅ Utilitário de limpeza carregado');
      log('ℹ️  Clique em "Limpar Tudo e Recarregar" para forçar atualização');
    </script>
  </body>
</html>
