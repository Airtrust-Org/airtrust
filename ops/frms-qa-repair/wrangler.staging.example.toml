# TEMPLATE ONLY. Provisioning/deploy requires coordinated approval and official workflow.
# No public ingress; service binding may be granted only to the governed runner.
name = "airtrust-frms-qa-private-staging"
main = "worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "staging"
D1_ID = "bf9963f4-eb12-439b-a830-20bbf577ac22"
# RELEASE_SHA, APPROVAL_KEY_SHA256 and PRIVATE_STORAGE_VERIFIED must be set
# by the reviewed deployment workflow, never by an RPC request.
# Secrets: PREIMAGE_KEY_HEX, APPROVAL_PUBLIC_KEY_PEM, D1_READ_TOKEN,
# CLOUDFLARE_ACCOUNT_ID. No Ed25519 private signing key in this service.

[[d1_databases]]
binding = "DB"
database_name = "airtrust-db-staging-baseline-20260701"
database_id = "bf9963f4-eb12-439b-a830-20bbf577ac22"

[[r2_buckets]]
binding = "PREIMAGES"
bucket_name = "REQUIRES_APPROVED_PRIVATE_BUCKET"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "FrmsQaCoordinator"

[[migrations]]
tag = "frms-qa-private-v1"
new_sqlite_classes = ["FrmsQaCoordinator"]
