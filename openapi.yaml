  /api/auth:
    description: Prefix montado no runtime via app.route em worker-airtrust/src/index.ts
    x-mounted-prefix: true
  /api/auth/login:
    post:
      summary: Login com email e senha
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
      responses:
        '200':
          description: Login realizado com sucesso
        '401':
          description: Credenciais inválidas
  /api/auth/refresh:
    post:
      summary: Renovar access token com refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token renovado
        '401':
          description: Refresh token inválido
  /api/auth/forgot-password:
    post:
      summary: Solicitar recuperação de senha
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Resposta neutra para evitar enumeração de usuários
        '429':
          description: Limite de tentativas excedido
  /api/auth/reset-password:
    post:
      summary: Redefinir senha com token temporário
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, senha]
              properties:
                token:
                  type: string
                senha:
                  type: string
      responses:
        '200':
          description: Senha redefinida
        '401':
          description: Token inválido ou expirado
        '429':
          description: Limite de tentativas excedido
