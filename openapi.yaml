  /api/integracoes/sigvoos/historico:
    get:
      summary: Histórico recente de sincronizações SIGVOOS
      tags: [Integracoes, SIGVOOS]
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Histórico retornado
  /api/integracoes/sigvoos/sincronizar-frms:
    post:
      summary: Executar sincronização SIGVOOS para FRMS
      tags: [Integracoes, SIGVOOS]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  pattern: '^\\d{4}-\\d{2}-\\d{2}$'
                to:
                  type: string
                  pattern: '^\\d{4}-\\d{2}-\\d{2}$'
                clearExisting:
                  type: boolean
      responses:
        '200':
          description: Sincronização concluída
        '400':
          description: Período inválido
