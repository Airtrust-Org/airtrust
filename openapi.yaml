openapi: 3.0.3
info:
  title: AirTrust API (Runtime Prefix Catalog)
  description: |
    Catálogo dos prefixes montados atualmente no Worker.
    Esta spec substitui o contrato antigo v2 para evitar drift silencioso.
    O contrato legado permanece em openapi.v2.legacy.yaml.
  version: 3.0.0-runtime
servers:
  - url: https://airtrust-api-production.airtrust.workers.dev
    description: Worker produção
  - url: http://localhost:8787
    description: Worker local
paths:
  /api/health:
    get:
      summary: Health check da API
      tags: [Health]
      responses:
        '200':
          description: Serviço saudável
  /api:
    description: Prefix montado no runtime via app.route em worker-airtrust/src/index.ts
    x-mounted-prefix: true
  /api/admin:
    description: Prefix montado no runtime via app.route em worker-airtrust/src/index.ts
    x-mounted-prefix: true
  /api/admin/perfis:
