stages:
  - validate
  - test

default:
  tags:
    - airtrust-local

lint:
  stage: validate
  image: node:24
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
  variables:
    VITE_API_URL: "http://127.0.0.1:8787"

build-content-gates:
  stage: validate
  image: node:24
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    # ci-demo-data-check.sh and production-audit-check.sh (run below via
    # check:demo-data) hard-require `rg` with set -euo pipefail and no
    # fallback; it is not an npm dependency, so it must be installed here.
    - apt-get update && apt-get install -y --no-install-recommends ripgrep
    - npm ci --cache .npm --prefer-offline
  script:
    - chmod +x ./scripts/ci-demo-data-check.sh ./scripts/ci-internal-docs-check.sh ./scripts/production-audit-check.sh
    - ./scripts/ci-internal-docs-check.sh --test
    - ./scripts/ci-internal-docs-check.sh
    - VITE_API_URL=http://127.0.0.1:8787 npm run build
    - npm run check:demo-data
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - dist/

frontend-coverage:
  stage: test
  image: node:24
  needs: []
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends sqlite3
    - sqlite3 --version
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test:coverage
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/

worker-typecheck:
  stage: test
  image: node:24
  needs: []
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    # Worker source imports shared/root modules (zod, exceljs, date-fns,
    # src/react-app/types/*) — root install is required before the worker
    # typecheck can resolve them, same as worker-tests-1/2 below.
    - npm ci --cache .npm --prefer-offline
    - npm ci --prefix worker-airtrust --cache .npm --prefer-offline
  script:
    - cd worker-airtrust
    - npx tsc --noEmit

worker-tests-1:
  stage: test
  image: node:24
  needs: []
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends sqlite3
    - sqlite3 --version
    - npm ci --cache .npm --prefer-offline
    - npm ci --prefix worker-airtrust --cache .npm --prefer-offline
  script:
    - cd worker-airtrust
    - npx vitest run --shard=1/2

worker-tests-2:
  stage: test
  image: node:24
  needs: []
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends sqlite3
    - sqlite3 --version
    - npm ci --cache .npm --prefer-offline
    - npm ci --prefix worker-airtrust --cache .npm --prefer-offline
  script:
    - cd worker-airtrust
    - npx vitest run --shard=2/2

lms-smoke:
  stage: test
  image: node:24
  needs: []
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends sqlite3
    - sqlite3 --version
    - npm ci --cache .npm --prefer-offline
    - npm ci --prefix worker-airtrust --cache .npm --prefer-offline
  script:
    - |
      JWT_SECRET="$(openssl rand -hex 32)"
      cat > worker-airtrust/.dev.vars <<EOFVARS
      JWT_SECRET=$JWT_SECRET
      EOFVARS
    - npm run setup:lms:local:reset
    - npm run integrity:ci
    - |
      npm run dev:worker:local > airtrust-worker.log 2>&1 &
      echo $! > /tmp/airtrust-worker.pid
      for i in $(seq 1 60); do
        if curl -fsS http://localhost:8787/api/health >/dev/null; then
          echo "Local worker ready"
          break
        fi
        if [ "$i" -eq 60 ]; then
          cat airtrust-worker.log
          exit 1
        fi
        sleep 2
      done
    - npm run smoke:lms:local
  after_script:
    - |
      if [ -f /tmp/airtrust-worker.pid ]; then
        kill "$(cat /tmp/airtrust-worker.pid)" || true
      fi
      rm -f worker-airtrust/.dev.vars
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - airtrust-worker.log

public-e2e:
  stage: test
  image: node:24
  needs: []
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright install --with-deps chromium
  script:
    - CI=true VITE_API_URL=http://127.0.0.1:8787 npx playwright test --config=playwright.ci.config.ts
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - test-results/
