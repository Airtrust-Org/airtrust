stages:
  - validate
  - test
  - build

lint:
  stage: validate
  image: node:24
  before_script:
    - npm ci
  script:
    - npm run lint
  variables:
    VITE_API_URL: "http://127.0.0.1:8787"

check-demo-data:
  stage: validate
  image: node:24
  before_script:
    - npm ci
  script:
    - chmod +x ./scripts/ci-internal-docs-check.sh ./scripts/production-audit-check.sh
    - ./scripts/ci-internal-docs-check.sh --test
    - ./scripts/ci-internal-docs-check.sh
    - npm run build
    - npm run check:demo-data
  variables:
    VITE_API_URL: "http://127.0.0.1:8787"

test:
  stage: test
  image: node:24
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends sqlite3
    - sqlite3 --version
    - npm ci
  script:
    - npm run test:run

worker-tests:
  stage: test
  image: node:24
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends sqlite3
    - sqlite3 --version
    - npm ci
    - npm ci --prefix worker-airtrust
  script:
    - cd worker-airtrust
    - npx tsc --noEmit
    - npx vitest run

lms-smoke:
  stage: test
  image: node:24
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends sqlite3
    - npm ci
    - cd worker-airtrust
    - npm ci
    - cd ..
  script:
    - JWT_SECRET="$(openssl rand -hex 32)"
    - echo "JWT_SECRET=$JWT_SECRET" > worker-airtrust/.dev.vars
    - npm run setup:lms:local:reset
    - npm run integrity:ci
    - nohup npm run dev:worker:local > airtrust-worker.log 2>&1 &
    - echo $! > airtrust-worker.pid
    - |
      for i in $(seq 1 60); do
        if curl -fsS http://localhost:8787/api/health >/dev/null; then
          echo "Local worker ready"
          break
        fi
        sleep 2
        if [ "$i" = "60" ]; then
          cat airtrust-worker.log
          exit 1
        fi
      done
    - npm run smoke:lms:local
  after_script:
    - cat airtrust-worker.log 2>/dev/null || true
    - if [ -f airtrust-worker.pid ]; then kill "$(cat airtrust-worker.pid)" || true; fi
    - rm -f worker-airtrust/.dev.vars
  artifacts:
    when: on_failure
    paths:
      - airtrust-worker.log
    expire_in: 7 days

build:
  stage: build
  image: node:24
  before_script:
    - npm ci
  script:
    - npm run build
  variables:
    VITE_API_URL: "http://127.0.0.1:8787"
