stages:
  - validate
  - test
  - build

default:
  image: node:24
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null

lint:
  stage: validate
  script:
    - npm run lint
  variables:
    CI: "true"
    VITE_API_URL: http://127.0.0.1:8787

check-demo-data:
  stage: validate
  script:
    - chmod +x ./scripts/ci-internal-docs-check.sh ./scripts/production-audit-check.sh
    - ./scripts/ci-internal-docs-check.sh --test
    - ./scripts/ci-internal-docs-check.sh
    - npm run build
    - npm run check:demo-data
  variables:
    VITE_API_URL: http://127.0.0.1:8787

test:
  stage: test
  script:
    - npm run test:run

worker-tests:
  stage: test
  script:
    - cd worker-airtrust
    - npm ci --cache ../.npm --prefer-offline
    - npx tsc --noEmit
    - npx vitest run

lms-smoke:
  stage: test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends sqlite3
    - npm ci --cache .npm --prefer-offline
    - cd worker-airtrust && npm ci --cache ../.npm --prefer-offline && cd ..
  script:
    - |
      JWT_SECRET="$(openssl rand -hex 32)"
      cat > worker-airtrust/.dev.vars <<EOFVARS
      JWT_SECRET=$JWT_SECRET
      EOFVARS
    - npm run setup:lms:local:reset
    - npm run integrity:ci
    - |
      npm run dev:worker:local > /tmp/airtrust-worker.log 2>&1 &
      echo $! > /tmp/airtrust-worker.pid
      for i in $(seq 1 60); do
        if curl -fsS http://localhost:8787/api/health >/dev/null; then
          echo "Local worker ready"
          break
        fi
        sleep 2
        if [ "$i" = "60" ]; then
          cat /tmp/airtrust-worker.log
          exit 1
        fi
      done
    - npm run smoke:lms:local
  after_script:
    - cat /tmp/airtrust-worker.log 2>/dev/null || true
    - if [ -f /tmp/airtrust-worker.pid ]; then kill "$(cat /tmp/airtrust-worker.pid)" || true; fi
    - rm -f worker-airtrust/.dev.vars
  artifacts:
    when: on_failure
    paths:
      - /tmp/airtrust-worker.log
    expire_in: 7 days

build:
  stage: build
  script:
    - npm run build
  variables:
    VITE_API_URL: http://127.0.0.1:8787
