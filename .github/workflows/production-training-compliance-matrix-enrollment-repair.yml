name: Production Training Compliance Matrix Enrollment Repair

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA reviewed for matrix enrollment repair
        required: true
        type: string
      mode:
        description: dry-run is read-only; apply repairs exact reviewed candidates
        required: true
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirmation:
        description: Exact confirmation required by the selected mode
        required: true
        type: string
      reviewed_dry_run_run_id:
        description: Required for apply; successful dry-run run on this same SHA
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: production-training-compliance-matrix-enrollment-repair
  cancel-in-progress: false

env:
  PROD_API_BASE_URL: https://api.airtrust.online

jobs:
  repair:
    name: Governed Production Compliance Matrix Enrollment Repair
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      E2E_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}
      E2E_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}
    steps:
      - name: Validate immutable dispatch
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo MAIN_REF_REQUIRED >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo EXPECTED_SHA_INVALID >&2; exit 1; }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo EXPECTED_SHA_MISMATCH >&2; exit 1; }
          if [[ "$MODE" == dry-run ]]; then
            [[ "$CONFIRMATION" == AIRTRUST_PRODUCTION_DRYRUN_COMPLIANCE_MATRIX_ENROLLMENT_REPAIR ]] || { echo DRYRUN_CONFIRMATION_REQUIRED >&2; exit 1; }
          elif [[ "$MODE" == apply ]]; then
            [[ "$CONFIRMATION" == AIRTRUST_PRODUCTION_APPLY_COMPLIANCE_MATRIX_ENROLLMENT_REPAIR_NO_EMAIL ]] || { echo APPLY_CONFIRMATION_REQUIRED >&2; exit 1; }
          else
            echo INVALID_MODE >&2; exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker-airtrust/package-lock.json
      - run: npm --prefix worker-airtrust ci

      - name: Verify official release gates on exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-release-gates.mjs

      - name: Require production credentials
        env:
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$D1_TOKEN" ]] || { echo PRODUCTION_D1_TOKEN_MISSING >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo CLOUDFLARE_ACCOUNT_ID_MISSING >&2; exit 1; }
          [[ -n "$E2E_EMAIL" && -n "$E2E_PASSWORD" ]] || { echo PRODUCTION_ADMIN_CREDENTIALS_MISSING >&2; exit 1; }
          [[ "$E2E_EMAIL" != *'staging.airtrust.invalid'* ]] || { echo STAGING_QA_IDENTITY_REJECTED >&2; exit 1; }

      - name: Verify reviewed dry-run predecessor and load exact candidate sets
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN: ${{ inputs.reviewed_dry_run_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_RUN" =~ ^[1-9][0-9]*$ ]] || { echo REVIEWED_DRY_RUN_RUN_ID_REQUIRED >&2; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN")"
          [[ "$(jq -r .name <<<"$run_json")" == 'Production Training Compliance Matrix Enrollment Repair' ]] || { echo REVIEWED_WORKFLOW_MISMATCH >&2; exit 1; }
          [[ "$(jq -r .conclusion <<<"$run_json")" == success ]] || { echo REVIEWED_DRY_RUN_NOT_SUCCESSFUL >&2; exit 1; }
          [[ "$(jq -r .head_sha <<<"$run_json")" == "$EXPECTED_SHA" ]] || { echo REVIEWED_DRY_RUN_SHA_MISMATCH >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/reviewed"
          gh run download "$REVIEWED_RUN" --repo "$GITHUB_REPOSITORY" --name "production-training-compliance-matrix-enrollment-repair-dry-run-$EXPECTED_SHA" --dir "$RUNNER_TEMP/reviewed"
          evidence="$RUNNER_TEMP/reviewed/result.json"
          test -s "$evidence"
          for key in missing wrong no_course; do
            count="$(jq -r ".${key}_count" "$evidence")"
            hash="$(jq -r ".${key}_hash" "$evidence")"
            [[ "$count" =~ ^[0-9]+$ ]] || { echo "REVIEWED_${key}_COUNT_INVALID" >&2; exit 1; }
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]] || { echo "REVIEWED_${key}_HASH_INVALID" >&2; exit 1; }
            upper="$(tr '[:lower:]' '[:upper:]' <<<"$key")"
            echo "TRAINING_COMPLIANCE_EXPECTED_${upper}_COUNT=$count" >> "$GITHUB_ENV"
            echo "TRAINING_COMPLIANCE_EXPECTED_${upper}_HASH=$hash" >> "$GITHUB_ENV"
          done
          [[ "$(jq -r .unsafe_wrong_count "$evidence")" == 0 ]] || { echo REVIEWED_UNSAFE_WRONG_NOT_ZERO >&2; exit 1; }
          [[ "$(jq -r .ambiguous_course_count "$evidence")" == 0 ]] || { echo REVIEWED_AMBIGUOUS_COURSES_NOT_ZERO >&2; exit 1; }
          echo "REVIEWED_DRY_RUN_VERIFIED=$REVIEWED_RUN" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture D1 Time Travel recovery point
        if: ${{ inputs.mode == 'apply' }}
        working-directory: worker-airtrust
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          npx wrangler d1 time-travel info airtrust-db --env production --timestamp="$ts" > "$RUNNER_TEMP/recovery.txt"
          test -s "$RUNNER_TEMP/recovery.txt"
          echo "TRAINING_COMPLIANCE_MATRIX_REPAIR_RECOVERY_TIMESTAMP_UTC=$ts" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/recovery.txt"

      - name: Execute exact matrix repair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRAINING_COMPLIANCE_MATRIX_REPAIR_MODE: ${{ inputs.mode }}
          TRAINING_COMPLIANCE_MATRIX_REPAIR_CONFIRMATION: ${{ inputs.confirmation }}
          TRAINING_COMPLIANCE_PRODUCTION_DB_NAME: airtrust-db
        run: |
          set -euo pipefail
          node scripts/production/training-compliance-matrix-enrollment-repair.mjs "${{ inputs.mode }}" > "$RUNNER_TEMP/result.json"
          test -s "$RUNNER_TEMP/result.json"

      - name: Publish sanitized summary
        if: always()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/result.json" || exit 0
          jq '{mode,source_sha,empresa_id,expected_pairs,missing_count,missing_hash,wrong_count,wrong_hash,unsafe_wrong_count,no_course_count,no_course_hash,no_course_codes,ambiguous_course_count,email_disabled,invitation_endpoint_called,mutation_executed,created_courses,created_enrollments,ignored_existing,cancelled_wrong_enrollments,post_expected_pairs,post_missing_count,post_wrong_count,post_no_course_count,postconditions_verified,pii_emitted}' "$RUNNER_TEMP/result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v7
        with:
          name: production-training-compliance-matrix-enrollment-repair-${{ inputs.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error
          retention-days: 30
