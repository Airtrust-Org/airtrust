name: Pilot Schema 0564 Metadata Readback (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/staging-pilot-schema-0564-readback.yml'
      - 'scripts/staging/pilot-schema-0564-readback.mjs'
      - 'scripts/__tests__/pilot-schema-0564-readback.test.mjs'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current Pilot PR 1623 HEAD; metadata does not certify runtime
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'airtrust-staging-mutations-and-scorm-qa' || format('pilot-schema-readback-test-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/__tests__/pilot-schema-0564-readback.test.mjs
  readback:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Bind metadata inspection to current same-repository Pilot PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          node --input-type=module <<'NODE'
          const sha=process.env.RELEASE_SHA;
          if(!/^[a-f0-9]{40}$/.test(sha||''))throw Error('PILOT_RELEASE_SHA_REQUIRED');
          const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/pulls/1623',{
            headers:{authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json'},
            signal:AbortSignal.timeout(30000),redirect:'error'
          });
          if(!response.ok)throw Error('PILOT_PR_LOOKUP_FAILED');
          const pr=await response.json();
          if(pr.state!=='open'||pr.base?.ref!=='main'||pr.head?.repo?.full_name!==process.env.GITHUB_REPOSITORY||pr.head?.repo?.fork||pr.head?.sha!==sha)
            throw Error('PILOT_PR_HEAD_OR_ORIGIN_MISMATCH');
          NODE
      - name: Read fixed staging schema metadata using dedicated read-only token
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_READONLY_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READONLY_API_TOKEN }}
        run: node scripts/staging/pilot-schema-0564-readback.mjs
