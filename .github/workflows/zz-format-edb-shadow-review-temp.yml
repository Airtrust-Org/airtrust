name: Temporary Format eDB Shadow Review

on:
  push:
    branches:
      - feat/edb-shadow-pic-review-evidence-20260802

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edb-shadow-pic-review-evidence-20260802
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci

      - name: Format focused files
        run: >-
          npx prettier --write
          src/react-app/pages/controle-voos/EdbShadowReviewEvidencePanel.tsx
          src/react-app/pages/controle-voos/__tests__/edb-shadow-review-evidence.test.tsx
          worker-airtrust/src/__tests__/services/edb-shadow-review-evidence.test.ts
          worker-airtrust/src/routes/edb-shadow-preview.ts
          worker-airtrust/src/services/edb/shadow-review-evidence.ts

      - name: Commit formatted files
        run: |
          rm .github/workflows/zz-format-edb-shadow-review-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react-app/pages/controle-voos/EdbShadowReviewEvidencePanel.tsx
          git add src/react-app/pages/controle-voos/__tests__/edb-shadow-review-evidence.test.tsx
          git add worker-airtrust/src/__tests__/services/edb-shadow-review-evidence.test.ts
          git add worker-airtrust/src/routes/edb-shadow-preview.ts
          git add worker-airtrust/src/services/edb/shadow-review-evidence.ts
          git add .github/workflows/zz-format-edb-shadow-review-temp.yml
          git commit -m "style(edb): format shadow review evidence flow"
          git push origin HEAD:feat/edb-shadow-pic-review-evidence-20260802
