name: PR 715 format once

on:
  push:
    branches:
      - feat/edb-technical-status-shadow-contracts-20260802

permissions:
  contents: write

jobs:
  format-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/edb-technical-status-shadow-contracts-20260802
          fetch-depth: 0

      - name: Format scoped files and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.6 --write \
            worker-airtrust/src/services/edb/technical-status-shadow-contracts.ts \
            worker-airtrust/src/__tests__/services/edb-technical-status-shadow-contracts.test.ts
          rm -f worker-airtrust/src/__tests__/services/edb-prettier-export-temporary.test.ts
          rm -f .github/workflows/pr-715-format-once.yml
          git diff --check

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No formatter changes to commit"
            exit 0
          fi
          git commit -m "style(edb): apply canonical formatting"
          git push origin HEAD:feat/edb-technical-status-shadow-contracts-20260802
