name: FRMS readiness contract fix

on:
  push:
    branches:
      - feat/frms-operational-readiness-pvt-20260827
    paths:
      - .github/workflows/frms-readiness-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frms-operational-readiness-pvt-20260827
          fetch-depth: 0
      - name: Apply contract correction
        run: python3 .github/scripts/frms_readiness_contract_fix.py
      - name: Commit correction
        run: |
          git config user.name "airtrust-readiness-integrator"
          git config user.email "actions@users.noreply.github.com"
          git add src/react-app/pages/frms/FrmsCheckinFadiga.tsx src/react-app/hooks/useOperationalReadiness.ts worker-airtrust/src/routes/frms-readiness.ts
          git commit -m "fix(frms): align readiness frontend and baseline contracts"
          git push origin HEAD:feat/frms-operational-readiness-pvt-20260827
