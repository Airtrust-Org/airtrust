name: F5 SCORM Staging Evidence - F0 Readiness Gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_F5_STAGING_CANDIDATE'
        required: true
        type: string
      release_sha:
        description: 'Exact already deployed Worker/Pages SHA'
        required: true
        type: string
      grant_id:
        description: 'Fresh, unedited single-candidate F0 authorization comment ID from issue 776'
        required: true
        type: string
      tenant_id:
        description: 'Authorized staging tenant ID for exactly one candidate'
        required: true
        type: string
      course_id:
        description: 'Authorized staging course ID for exactly one candidate'
        required: true
      package_sha256:
        description: 'Original private ZIP SHA-256 from the transfer manifest'
        required: true
        type: string
      zip_bytes:
        description: 'Original private ZIP byte length from the transfer manifest'
        required: true
        type: string
      operation_id:
        description: 'Fresh UUID for the single governed candidate operation'
        required: true
        type: string

# Shared global staging mutation/QA lock. Never overlap other releases.
concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  actions: read
  statuses: read
  pull-requests: read
  issues: read

jobs:
  guard:
    name: Verify exact one-candidate F0 authorization and staging provenance
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Require explicit trusted-main invocation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CONFIRMATION" == AIRTRUST_F5_STAGING_CANDIDATE ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify main ancestry and eight canonical release gates
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          node scripts/ci/verify-release-gates.mjs
      - name: Compare live staging Worker and Pages provenance
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_FRONTEND_BASE_URL: https://staging.airtrust.pages.dev
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response=await fetch('https://airtrust-api-staging.airtrust.workers.dev/api/version');
          if(!response.ok)throw Error('F5_STAGING_WORKER_VERSION_MISSING');
          const v=await response.json();
          if((v.sourceSha??v.data?.sourceSha)!==process.env.RELEASE_SHA)
            throw Error('F5_STAGING_WORKER_RELEASE_SHA_MISMATCH');
          const {assertLiveFrontendShaFromOrigin}=await import('./e2e/lib/live-sha-guard.mjs');
          await assertLiveFrontendShaFromOrigin(process.env.STAGING_FRONTEND_BASE_URL,
            process.env.RELEASE_SHA.slice(0,7));
          NODE
      - name: Verify exact single-candidate F0 authorization (GitHub reads only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          F5_CONFIRMATION: ${{ inputs.confirmation }}
          F5_RELEASE_SHA: ${{ inputs.release_sha }}
          F5_GRANT_ID: ${{ inputs.grant_id }}
          F5_TENANT_ID: ${{ inputs.tenant_id }}
          F5_COURSE_ID: ${{ inputs.course_id }}
          F5_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          F5_ZIP_BYTES: ${{ inputs.zip_bytes }}
          F5_OPERATION_ID: ${{ inputs.operation_id }}
        run: node scripts/staging/f5-candidate-approval-guard.mjs
      - name: Execute one inactive candidate through the pinned F0 adapters
        shell: bash
        env:
          F5_EXECUTOR_PLAN_PATH: ${{ vars.F5_EXECUTOR_PLAN_PATH }}
          F5_PRIVATE_ZIP_PATH: ${{ vars.F5_PRIVATE_ZIP_PATH }}
          F5_F0_ADAPTER_MODULE: ${{ vars.F5_F0_ADAPTER_MODULE }}
          F5_F0_ADAPTER_SHA256: ${{ vars.F5_F0_ADAPTER_SHA256 }}
          F5_EVIDENCE_OUTPUT_PATH: ${{ runner.temp }}/f5-inactive-candidate-evidence.json
          SCORM_QA_ACCESS_TOKEN: ${{ secrets.SCORM_QA_ACCESS_TOKEN }}
          SCORM_QA_READBACK_SECRET: ${{ secrets.SCORM_QA_READBACK_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          F5_CONFIRMATION: ${{ inputs.confirmation }}
          F5_RELEASE_SHA: ${{ inputs.release_sha }}
          F5_GRANT_ID: ${{ inputs.grant_id }}
          F5_TENANT_ID: ${{ inputs.tenant_id }}
          F5_COURSE_ID: ${{ inputs.course_id }}
          F5_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          F5_ZIP_BYTES: ${{ inputs.zip_bytes }}
          F5_OPERATION_ID: ${{ inputs.operation_id }}
          F5_STAGING_API_ORIGIN: https://airtrust-api-staging.airtrust.workers.dev
          F5_STAGING_PAGES_ORIGIN: https://staging.airtrust.pages.dev
        run: |
          set -euo pipefail
          node scripts/staging/run-f5-inactive-candidate.mjs
      - name: Sanitize successful private F5 evidence for audit
        shell: bash
        env:
          F5_EVIDENCE_OUTPUT_PATH: ${{ runner.temp }}/f5-inactive-candidate-evidence.json
          F5_SANITIZED_EVIDENCE_PATH: ${{ runner.temp }}/f5-inactive-candidate-summary.json
          F5_RELEASE_SHA: ${{ inputs.release_sha }}
          F5_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          F5_ZIP_BYTES: ${{ inputs.zip_bytes }}
          F5_OPERATION_ID: ${{ inputs.operation_id }}
        run: node scripts/staging/f5-sanitize-execution-evidence.mjs
      - name: Upload sanitized inactive candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: f5-inactive-candidate-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/f5-inactive-candidate-summary.json
          if-no-files-found: error
          retention-days: 30
