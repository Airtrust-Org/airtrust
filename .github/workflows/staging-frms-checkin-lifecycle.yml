name: Staging FRMS Check-in PVTB KSS Synthetic Lifecycle

# Explicitly authenticated staging-only writes, fixed synthetic tenant 999013.
# No production access, migration, backfill or non-synthetic health data.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AIRTRUST_STAGING_FRMS_CHECKIN_QA
        required: true
        type: string
      expected_deployed_sha:
        description: Exact gated main SHA deployed to staging Worker and Pages
        required: true
        type: string

concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Verify synthetic QA provenance and release gates
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ inputs.expected_deployed_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RELEASE_SHA: ${{ inputs.expected_deployed_sha }}
    steps:
      - name: Require reviewed live main and explicit synthetic-only confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$CONFIRMATION" == AIRTRUST_STAGING_FRMS_CHECKIN_QA ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(gh api repos/Airtrust-Org/airtrust/branches/main --jq .commit.sha)" == "$EXPECTED_SHA" ]] || exit 1
      - uses: actions/checkout@v7
      - name: Require official release checks
        run: node scripts/ci/verify-release-gates.mjs
      - name: Require Worker and Pages exact staging SHA
        run: |
          node --input-type=module <<'NODE'
          const expected=process.env.EXPECTED_SHA;
          const r=await fetch('https://airtrust-api-staging.airtrust.workers.dev/api/version');
          if(!r.ok)throw Error('FRMS_STAGING_VERSION_UNAVAILABLE');
          const d=(await r.json()).data||{};
          if(d.sourceSha!==expected||d.environment!=='staging')throw Error('FRMS_STAGING_WORKER_SHA_MISMATCH');
          const p=await fetch('https://staging.airtrust.pages.dev/');
          if(!p.ok||!(await p.text()).includes(expected.slice(0,7)))throw Error('FRMS_STAGING_PAGES_SHA_MISMATCH');
          console.log('FRMS_STAGING_PROVENANCE_PASS');
          NODE

  synthetic-lifecycle:
    name: Authenticated synthetic daily check-in, readiness and KSS
    needs: guard
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_STAGING_SHA: ${{ inputs.expected_deployed_sha }}
      CONFIRM_STAGING_FRMS_CHECKIN_QA: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install governed tooling
        run: npm --prefix worker-airtrust ci
      - name: Unit test synthetic protocol and privacy contracts
        run: node --test scripts/__tests__/qa-frms-checkin-lifecycle.test.mjs
      - name: Capture staging-only D1 Time Travel recovery point before any QA write
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] || exit 1
          cd worker-airtrust
          npx wrangler d1 info airtrust-db-staging-baseline-20260701 --json > "$RUNNER_TEMP/frms-d1-info.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/frms-d1-info.json','utf8'));
          const db=String(r.uuid??r.database_id??r.id??r.result?.uuid??'');
          if(db!=='bf9963f4-eb12-439b-a830-20bbf577ac22')throw Error('FRMS_QA_STAGING_D1_MISMATCH');
          NODE
          npx wrangler d1 time-travel info airtrust-db-staging-baseline-20260701 --json > "$RUNNER_TEMP/frms-recovery.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/frms-recovery.json','utf8'));
          if(String(r.bookmark??r.result?.bookmark??'').length<8)throw Error('FRMS_QA_RECOVERY_BOOKMARK_MISSING');
          console.log('FRMS_QA_STAGING_D1_RECOVERY_READY');
          NODE
      - name: Submit exactly one synthetic PVT-B check-in and one same-day update
        env:
          STAGING_QA_RECOVERY_VERIFIED: 'true'
        run: node scripts/staging/qa-frms-checkin-lifecycle.mjs
      - name: Verify D1 canonical check-in, readiness trials and immutable KSS provenance (SELECT only)
        shell: bash
        run: |
          set -euo pipefail
          QA_DATE=$(TZ=America/Sao_Paulo date +%F)
          cd worker-airtrust
          npx wrangler d1 execute airtrust-db-staging-baseline-20260701 --remote --json --command "
            SELECT
            (SELECT COUNT(*) FROM frms_fadiga_checkin ch JOIN funcionarios f ON f.id=ch.funcionario_id
             WHERE ch.empresa_id=999013 AND f.matricula='QA-FRMS-UX-01' AND ch.data_checkin='$QA_DATE'
             AND ch.deleted_at IS NULL AND ch.kss_score=4) AS checkins,
            (SELECT COUNT(*) FROM frms_readiness_assessment ra JOIN funcionarios f ON f.id=ra.funcionario_id
             WHERE ra.empresa_id=999013 AND f.matricula='QA-FRMS-UX-01'
             AND ra.reference_date='$QA_DATE' AND ra.protocol_version='airtrust-pvtb-v2'
             AND ra.deleted_at IS NULL) AS readiness,
            (SELECT COUNT(*) FROM frms_readiness_vigilance_trial t JOIN frms_readiness_assessment ra
             ON ra.id=t.assessment_id AND ra.empresa_id=t.empresa_id
             JOIN funcionarios f ON f.id=ra.funcionario_id
             WHERE t.empresa_id=999013 AND f.matricula='QA-FRMS-UX-01'
             AND ra.reference_date='$QA_DATE' AND ra.protocol_version='airtrust-pvtb-v2'
             AND ra.deleted_at IS NULL) AS trials,
            (SELECT COUNT(*) FROM frms_fadiga_evento ev JOIN frms_fadiga_checkin ch
             ON ch.id=ev.checkin_id AND ch.empresa_id=ev.empresa_id
             JOIN funcionarios f ON f.id=ch.funcionario_id
             WHERE ev.empresa_id=999013 AND f.matricula='QA-FRMS-UX-01'
             AND ch.data_checkin='$QA_DATE'
             AND json_extract(ev.payload_json,'$.kss_field_provenance')='CREW_REPORTED') AS kss_events
          " > "$RUNNER_TEMP/frms-lifecycle-counts.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/frms-lifecycle-counts.json','utf8'));
          const row=(Array.isArray(r)?r[0]?.results:r.results)?.[0];
          if(!row||Number(row.checkins)!==1||Number(row.readiness)!==1 ||
             Number(row.trials)!==10||Number(row.kss_events)<2)
            throw Error('FRMS_QA_CANONICAL_POSTCONDITIONS_FAILED');
          console.log('FRMS_QA_D1_POSTCONDITIONS_PASS checkins=1 readiness=1 trials=10 kssEvents>=2 tenant=999013');
          NODE
