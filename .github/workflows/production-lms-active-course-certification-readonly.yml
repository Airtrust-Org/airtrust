name: Production LMS Active Course Certification Readonly

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: 'Exact Worker SHA currently deployed to production'
        required: true
        type: string
      confirmation:
        description: 'Type AIRTRUST_PRODUCTION_LMS_ACTIVE_CERTIFICATION_READONLY'
        required: true
        type: string
      course_ids:
        description: 'Optional comma-separated active course IDs for focused diagnostics'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write

concurrency:
  group: production-lms-active-course-certification-readonly
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PROD_API_BASE_URL: https://api.airtrust.online
  TARGET_COMPANY_ID: '6'

jobs:
  guard:
    name: Guard production LMS active certification
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, 'AIRTRUST_PRODUCTION_LMS_ACTIVE_CERTIFICATION_READONLY '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      expected_sha: ${{ steps.request.outputs.expected_sha }}
      course_ids: ${{ steps.request.outputs.course_ids }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve governed read-only request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          GITHUB_ACTOR: ${{ github.actor }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_production_sha }}
          INPUT_COURSE_IDS: ${{ inputs.course_ids }}
        run: node scripts/validation/resolve-production-lms-active-certification-request.mjs >> "$GITHUB_OUTPUT"

      - name: Require pinned production SHA, actor permission and canonical gates
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          CONFIRMATION: ${{ steps.request.outputs.confirmation }}
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
          RELEASE_SHA: ${{ steps.request.outputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo MAIN_ONLY >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_PRODUCTION_LMS_ACTIVE_CERTIFICATION_READONLY' ]] || { echo CONFIRMATION_REJECTED >&2; exit 1; }
          expected="${EXPECTED_SHA,,}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo EXPECTED_SHA_INVALID >&2; exit 1; }
          git cat-file -e "$expected^{commit}"
          git merge-base --is-ancestor "$expected" HEAD

          if [[ "$EVENT_NAME" == 'issue_comment' ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo COMMENT_PR_NUMBER_INVALID >&2; exit 1; }
            export PR_NUMBER GITHUB_REPOSITORY GITHUB_ACTOR
            node <<'NODE'
          (async () => {
            const repo = process.env.GITHUB_REPOSITORY;
            const prNumber = process.env.PR_NUMBER;
            const actor = process.env.GITHUB_ACTOR;
            const headers = {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
            };
            async function get(path) {
              const response = await fetch(`https://api.github.com${path}`, { headers });
              if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
              return response.json();
            }
            const pr = await get(`/repos/${repo}/pulls/${prNumber}`);
            if (pr.base?.ref !== 'main') throw new Error('PR_BASE_NOT_MAIN');
            if (pr.head?.repo?.full_name !== repo || pr.head?.repo?.fork) throw new Error('PR_FROM_FORK_REJECTED');
            const permission = await get(`/repos/${repo}/collaborators/${actor}/permission`);
            if (!['write', 'push', 'maintain', 'admin'].includes(permission.permission)) {
              throw new Error('ACTOR_PERMISSION_INSUFFICIENT');
            }
          })().catch((error) => {
            console.error(`LMS certification guard failed: ${error.message}`);
            process.exit(1);
          });
          NODE
          fi

          EXPECTED_SHA="$expected" RELEASE_SHA="$expected" node scripts/ci/verify-release-gates.mjs
          live="$(curl -fsS https://api.airtrust.online/api/version | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const b=j.data&&typeof j.data==='object'?j.data:j;process.stdout.write(String(b.sourceSha||b.source_sha||'').toLowerCase())})")"
          [[ "$live" == "$expected" ]] || { echo "PRODUCTION_SHA_MISMATCH:$live" >&2; exit 1; }

  certify:
    name: Certify active courses (${{ matrix.browser }})
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment: production
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      EXPECTED_PRODUCTION_SHA: ${{ needs.guard.outputs.expected_sha }}
      PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}
      PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}
      CERT_BROWSER: ${{ matrix.browser }}
      CERT_COURSE_IDS: ${{ needs.guard.outputs.course_ids }}
      CERT_REPORT_PATH: qa-state/lms-active-certification-${{ matrix.browser }}.json
      CERT_COURSE_TIMEOUT_MS: '25000'
      CERT_MAX_STEPS: '240'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Install Playwright browser
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: npx playwright install ${{ matrix.browser }}
      - name: Run exact-package read-only certification
        id: certify
        shell: bash
        run: |
          set +e
          node scripts/validation/production-lms-active-course-certification-readonly.mjs
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          test -s "$CERT_REPORT_PATH"
      - name: Publish certification summary
        if: always()
        shell: bash
        run: |
          if [[ ! -s "$CERT_REPORT_PATH" ]]; then
            echo "## LMS active certification — $CERT_BROWSER" >> "$GITHUB_STEP_SUMMARY"
            echo "Report missing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.env.CERT_REPORT_PATH, 'utf8'));
          console.log(`## LMS active certification — ${r.browser}`);
          console.log('');
          console.log(`- production SHA: \`${r.production_sha}\``);
          console.log(`- courses: \`${r.course_count}\``);
          console.log(`- PASS: \`${r.pass_count}\``);
          console.log(`- FAIL: \`${r.fail_count}\``);
          console.log(`- writes: \`${r.writes}\``);
          console.log('');
          for (const item of r.results) {
            console.log(`- ${item.status} — #${item.course_id} ${item.titulo}${item.reason ? ` — ${item.reason}` : ''}`);
          }
          NODE
      - name: Publish certification result to trigger PR
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v8
        env:
          CERT_REPORT_PATH: ${{ env.CERT_REPORT_PATH }}
          CERT_BROWSER: ${{ matrix.browser }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const fs = require('node:fs');
            const reportPath = process.env.CERT_REPORT_PATH;
            if (!reportPath || !fs.existsSync(reportPath)) return;
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const lines = [
              `AIRTRUST_LMS_CERTIFICATION_RESULT run_id=${context.runId} browser=${process.env.CERT_BROWSER} production_sha=${report.production_sha} pass=${report.pass_count} fail=${report.fail_count}`,
              ...report.results.map((item) =>
                `- ${item.status} #${item.course_id}${item.reason ? ` — ${item.reason}` : ''}`
              ),
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: lines.join('\n'),
            });

      - name: Upload sanitized certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-lms-active-certification-${{ matrix.browser }}-${{ needs.guard.outputs.expected_sha }}
          path: |
            ${{ env.CERT_REPORT_PATH }}
            qa-state/lms-active-certification-diagnostics/${{ matrix.browser }}/**/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Enforce zero certification failures
        if: always()
        shell: bash
        env:
          CERT_RC: ${{ steps.certify.outputs.rc }}
        run: |
          set -euo pipefail
          [[ "${CERT_RC:-1}" == '0' ]]
