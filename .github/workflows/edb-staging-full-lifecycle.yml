name: eDB Staging Full Synthetic Lifecycle

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_EDB_STAGING_FULL_LIFECYCLE'
        required: true
        type: string
      pr_number:
        description: 'Open same-repository PR whose exact head SHA is already deployed to staging'
        required: true
        type: string
      expected_release_sha:
        description: 'Exact 40-character application release SHA already deployed to staging'
        required: true
        type: string

# Serialize all shared staging activity that can deploy a release or mutate the
# reserved tenant-6 QA fixture.
concurrency:
  group: deploy-airtrust-staging
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  STAGING_D1_NAME: airtrust-db-staging-baseline-20260701
  QA_EDB_PILOT_EMAIL: qa-edb-pilot@staging.airtrust.invalid
  QA_EDB_FULL_FIXTURE_ID: QA-EDB-FULL-${{ github.run_id }}-${{ github.run_attempt }}
  QA_EDB_FULL_MANIFEST_PATH: .qa-edb-full-lifecycle.json

jobs:
  guard:
    name: eDB full lifecycle staging guard
    runs-on: ubuntu-latest
    steps:
      - name: Validate trusted orchestration and candidate release
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_EDB_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo 'MAIN_ONLY' >&2; exit 1; }
          [[ "$CONFIRMATION" == "AIRTRUST_EDB_STAGING_FULL_LIFECYCLE" ]] || { echo 'CONFIRMATION_REJECTED' >&2; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'PR_NUMBER_INVALID' >&2; exit 1; }
          [[ "$EXPECTED_EDB_RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'EXPECTED_RELEASE_SHA_INVALID' >&2; exit 1; }
          [[ "$STAGING_API_BASE_URL" == "https://airtrust-api-staging.airtrust.workers.dev" ]] || { echo 'STAGING_API_REJECTED' >&2; exit 1; }
          [[ "$STAGING_D1_NAME" == "airtrust-db-staging-baseline-20260701" ]] || { echo 'STAGING_D1_REJECTED' >&2; exit 1; }
          [[ "$QA_EDB_FULL_FIXTURE_ID" =~ ^QA-EDB-FULL-[0-9]+-[0-9]+$ ]] || { echo 'FIXTURE_ID_REJECTED' >&2; exit 1; }

          export EXPECTED_EDB_RELEASE_SHA="${EXPECTED_EDB_RELEASE_SHA,,}"
          export PR_NUMBER GITHUB_REPOSITORY GITHUB_ACTOR
          node <<'NODE'
          (async () => {
            const api = 'https://api.github.com';
            const repo = process.env.GITHUB_REPOSITORY;
            const prNumber = process.env.PR_NUMBER;
            const releaseSha = process.env.EXPECTED_EDB_RELEASE_SHA;
            const actor = process.env.GITHUB_ACTOR;
            const headers = {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
            };
            async function get(path) {
              const response = await fetch(`${api}${path}`, { headers });
              if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
              return response.json();
            }

            const pr = await get(`/repos/${repo}/pulls/${prNumber}`);
            if (pr.base?.ref !== 'main') throw new Error('PR_BASE_NOT_MAIN');
            if (pr.head?.repo?.full_name !== repo || pr.head?.repo?.fork) throw new Error('PR_FROM_FORK_REJECTED');

            if (pr.state === 'open') {
              if (pr.head?.sha?.toLowerCase() !== releaseSha) throw new Error('OPEN_PR_HEAD_MISMATCH');
            } else if (pr.merged === true) {
              if (pr.merge_commit_sha?.toLowerCase() !== releaseSha) throw new Error('MERGED_PR_SHA_MISMATCH');
              const mainRef = await get(`/repos/${repo}/git/refs/heads/main`);
              if (mainRef.object?.sha?.toLowerCase() !== releaseSha) throw new Error('RELEASE_SHA_NOT_CURRENT_MAIN');
            } else {
              throw new Error('PR_NOT_OPEN_OR_MERGED');
            }

            const commit = await get(`/repos/${repo}/git/commits/${releaseSha}`);
            if (!commit?.sha) throw new Error('RELEASE_SHA_NOT_FOUND');

            const permission = await get(`/repos/${repo}/collaborators/${actor}/permission`);
            if (!['write', 'push', 'maintain', 'admin'].includes(permission.permission)) {
              throw new Error('ACTOR_PERMISSION_REJECTED');
            }

            console.log(`EDB_STAGING_CANDIDATE_RELEASE_PASS pr=${prNumber} release=${releaseSha}`);
          })().catch((error) => {
            console.error(`[edb-staging-full-lifecycle][GUARD] ${error.message}`);
            process.exit(1);
          });
          NODE

      - name: Checkout trusted orchestration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify official release gates for candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail
          export RELEASE_SHA="${RELEASE_SHA,,}"
          node scripts/ci/verify-release-gates.mjs

  d1-full-lifecycle:
    name: Staging D1 + eDB tenant-6 synthetic full lifecycle
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    env:
      QA_EDB_PILOT_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      EXPECTED_EDB_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRM_STAGING_EDB_PILOT_IDENTITY: AIRTRUST_STAGING_EDB_PILOT_IDENTITY
      CONFIRM_STAGING_EDB_FULL_LIFECYCLE: AIRTRUST_STAGING_EDB_FULL_LIFECYCLE
    steps:
      - name: Require governed staging credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$QA_EDB_PILOT_PASSWORD" ]] || { echo 'STAGING_SMOKE_PASSWORD_MISSING' >&2; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'STAGING_D1_TOKEN_MISSING' >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING' >&2; exit 1; }

      - name: Checkout trusted QA source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install governed QA dependencies
        run: npm ci && npm --prefix worker-airtrust ci

      - name: Syntax-check trusted lifecycle QA scripts
        run: |
          node --check scripts/staging/seed-qa-edb-pilot.mjs
          node --check scripts/staging/seed-qa-edb-full-lifecycle.mjs
          node --check scripts/staging/smoke-edb-full-lifecycle.mjs

      - name: Verify exact deployed candidate release before D1 access
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const baseUrl = String(process.env.STAGING_API_BASE_URL || '').trim();
          const expectedSha = String(process.env.EXPECTED_EDB_RELEASE_SHA || '').trim().toLowerCase();
          if (baseUrl !== 'https://airtrust-api-staging.airtrust.workers.dev') throw new Error('STAGING_API_REJECTED');
          if (!/^[0-9a-f]{40}$/.test(expectedSha)) throw new Error('EXPECTED_RELEASE_SHA_INVALID');
          const response = await fetch(`${baseUrl}/api/version`, { headers: { Accept: 'application/json' } });
          if (!response.ok) throw new Error(`EDB_STAGING_VERSION_HTTP_${response.status}`);
          const payload = await response.json();
          if (payload?.success !== true || payload?.data?.environment !== 'staging') {
            throw new Error('EDB_STAGING_VERSION_PAYLOAD_INVALID');
          }
          const actualSha = String(payload?.data?.sourceSha || '').trim().toLowerCase();
          if (actualSha !== expectedSha) {
            throw new Error(`EDB_STAGING_RELEASE_SHA_MISMATCH expected=${expectedSha} actual=${actualSha || 'missing'}`);
          }
          console.log(`EDB_STAGING_RELEASE_PROVENANCE_PASS sourceSha=${actualSha}`);
          NODE

      - name: Fail closed unless tenant 6 is absent or exactly reserved synthetic tenant
        run: node scripts/staging/seed-qa-edb-full-lifecycle.mjs --preflight

      - name: Validate existing synthetic identity seed without writes
        run: node scripts/staging/seed-qa-edb-pilot.mjs

      - name: Provision exact tenant-6 synthetic identity
        id: identity_apply
        run: node scripts/staging/seed-qa-edb-pilot.mjs --apply

      - name: Validate canonical lifecycle fixture without writes
        run: node scripts/staging/seed-qa-edb-full-lifecycle.mjs

      - name: Provision canonical synthetic flight/RDV fixture
        id: fixture_apply
        run: node scripts/staging/seed-qa-edb-full-lifecycle.mjs --apply

      - name: Exercise complete eDB lifecycle through staging API
        id: lifecycle_smoke
        run: node scripts/staging/smoke-edb-full-lifecycle.mjs

      - name: Record lifecycle safety scope
        if: always()
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          {
            echo '## eDB staging full synthetic lifecycle'
            echo ''
            echo '- environment: staging only'
            echo '- orchestration source: trusted `main` workflow commit'
            echo "- trusted workflow SHA: \`$TRUSTED_WORKFLOW_SHA\`"
            echo "- candidate PR: \`${{ inputs.pr_number }}\`"
            echo "- exact deployed candidate release: \`$EXPECTED_EDB_RELEASE_SHA\`"
            echo '- candidate code is not checked out into the secret-bearing lifecycle job'
            echo '- QA scripts execute from the trusted workflow SHA on `main`'
            echo '- tenant: `6`, accepted only when `codigo=edb_pilot_smoke` (or absent before identity provisioning)'
            echo '- synthetic login: `qa-edb-pilot@staging.airtrust.invalid`'
            echo "- fixture: \`$QA_EDB_FULL_FIXTURE_ID\`"
            echo '- release provenance: candidate PR/head + official release gates + `/api/version` exact SHA before D1 access'
            echo '- concurrency: serialized with official staging deploy and positive eDB pilot via `deploy-airtrust-staging`'
            echo '- canonical fixture: synthetic flight, stage, crew and active RDV only'
            echo '- eDB path: diary + volume + regulatory semantics + P1 + preflight snapshot/ack + revision/signatures + correction/signatures + discrepancy/deferred/corrective/RTS + audit + integrity incident/reconstitution + close volume/diary'
            echo '- final signed state: `OPERATOR_SIGNED`; no ANAC queue/transmission is invoked'
            echo '- mutable canonical fixture cleanup: mandatory and exact-marker scoped'
            echo '- synthetic identity cleanup: runs after every attempted identity apply, including partial-failure/cancellation paths'
            echo '- immutable eDB evidence: retained inside the reserved synthetic tenant; no trigger bypass/deletion'
            echo '- production action: none'
            echo '- ANAC transmission: none'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back exact mutable canonical fixture
        if: ${{ always() && steps.identity_apply.outcome == 'success' }}
        run: node scripts/staging/seed-qa-edb-full-lifecycle.mjs --apply --rollback

      - name: Deactivate exact synthetic identity fixtures
        if: ${{ always() && steps.identity_apply.outcome != 'skipped' }}
        run: node scripts/staging/seed-qa-edb-pilot.mjs --apply --rollback
