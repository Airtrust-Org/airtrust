name: Fix FRMS readiness test mock

on:
  push:
    branches:
      - feat/frms-operational-readiness-pvt-20260827
    paths:
      - .github/workflows/fix-frms-readiness-test-mock.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frms-operational-readiness-pvt-20260827
          fetch-depth: 0
      - name: Patch test mock
        run: python3 .github/scripts/fix_frms_readiness_test_mock.py
      - name: Commit patch
        run: |
          git config user.name "airtrust-readiness-integrator"
          git config user.email "actions@users.noreply.github.com"
          git add src/react-app/pages/frms/__tests__/FrmsCheckinFadiga.test.tsx
          git commit -m "test(frms): prevent readiness mock rerender loop"
          git push origin HEAD:feat/frms-operational-readiness-pvt-20260827
