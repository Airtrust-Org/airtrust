name: Lint and Prettier Check

on:
  pull_request:
    paths: ["**/*"]
  push:
    branches: [ main, chore/** ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint "./src/**/*.{js,jsx,ts,tsx}" --max-warnings=0
      - name: Prettier check
        run: npx prettier --check .
