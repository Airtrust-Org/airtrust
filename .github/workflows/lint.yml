name: Lint and Prettier Check

on:
  pull_request:
    paths: ["**/*"]
  push:
    branches: [ main, chore/** ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run CI safety guards
        run: npm run lint
        env:
          CI: true
          VITE_API_URL: http://127.0.0.1:8787
      - name: Inventory legacy ESLint baseline
        run: npx eslint "./src/**/*.{js,jsx,ts,tsx}" --max-warnings=0 || true
      - name: Inventory legacy Prettier baseline
        run: npx prettier --check . || true
