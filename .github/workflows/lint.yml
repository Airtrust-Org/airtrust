name: Lint and Prettier Check

on:
  pull_request:
    paths: ['**/*']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker-airtrust
      - name: Focused eDB shadow preview tests
        working-directory: worker-airtrust
        run: >-
          npx vitest run
          src/__tests__/services/edb-control-flight-shadow-preview.test.ts
          src/__tests__/routes/edb-shadow-preview.test.ts
          src/__tests__/services/edb-control-flight-draft-projection.test.ts
          --reporter=verbose
