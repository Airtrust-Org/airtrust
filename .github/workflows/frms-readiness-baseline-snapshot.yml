name: FRMS readiness baseline snapshot

on:
  push:
    branches:
      - feat/frms-operational-readiness-pvt-20260827
    paths:
      - .github/workflows/frms-readiness-baseline-snapshot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frms-operational-readiness-pvt-20260827
          fetch-depth: 0
      - name: Apply individual baseline snapshot integration
        run: python3 .github/scripts/frms_readiness_baseline_snapshot.py
      - name: Commit snapshot integration
        run: |
          git config user.name "airtrust-readiness-integrator"
          git config user.email "actions@users.noreply.github.com"
          git add worker-airtrust/src/lib/frms/readiness-persistence.ts worker-airtrust/src/routes/frms-readiness.ts src/react-app/hooks/useOperationalReadiness.ts worker-airtrust/schema-v2/plans/frms-operational-readiness-0471.md worker-airtrust/schema-v2/frms-operational-readiness-0471.json docs/frms/OPERATIONAL_READINESS_PVT_V1.md
          git commit -m "feat(frms): persist individual cognitive baseline snapshot"
          git push origin HEAD:feat/frms-operational-readiness-pvt-20260827
