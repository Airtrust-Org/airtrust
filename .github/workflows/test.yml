name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Generate coverage with threshold (30%+)
        run: npm run test:coverage
        continue-on-error: false

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run credential-free public E2E smoke
        run: npx playwright test --config=playwright.ci.config.ts
        env:
          CI: true
          VITE_API_URL: http://127.0.0.1:8787

      - name: Upload E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-e2e-smoke-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Detect coverage artifact
        id: coverage_artifact
        if: always()
        shell: bash
        run: |
          if [[ -f coverage/coverage-final.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ always() && steps.coverage_artifact.outputs.present == 'true' }}
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

      - name: Comment PR with test results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Unit tests, coverage threshold and credential-free Playwright smoke passed.'
            })
        continue-on-error: true
