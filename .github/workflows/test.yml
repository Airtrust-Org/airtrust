name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export exact Prettier output for SCORM diagnostic
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            worker-airtrust/src/__tests__/routes/lms-relatorios-scorm-pagination.test.ts
            worker-airtrust/src/repositories/lmsRelatoriosRepository.ts
          )
          npx --yes prettier@3.9.6 --write "${files[@]}"
          for file in "${files[@]}"; do
            encoded="$(base64 -w0 "$file")"
            body="PRETTIER_SCORM_FILE:${file}"$'\n'"${encoded}"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body"
          done

      - name: Run tests
        run: npm run test:run

      - name: Generate coverage with threshold (30%+)
        run: npm run test:coverage
        continue-on-error: false

      - name: Detect coverage artifact
        id: coverage_artifact
        if: always()
        shell: bash
        run: |
          if [[ -f coverage/coverage-final.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ always() && steps.coverage_artifact.outputs.present == 'true' }}
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

      - name: Comment PR with test results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Tests passed with 30%+ coverage threshold enforced!'
            })
        continue-on-error: true
