name: Staging CV FRMS 27 Oct Synthetic Crew Fixture
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed current main commit
        required: true
        type: string
      expected_deployed_sha:
        description: Exact Worker and Pages staging commit
        required: true
        type: string
      mode:
        description: Inspect (read-only) or apply synthetic-only fixture
        required: true
        type: choice
        options: [inspect, apply]
      confirmation:
        description: Type AIRTRUST_CV_FRMS_STAGING_FIXTURE_20261027
        required: true
        type: string
permissions:
  contents: read
  checks: read
  statuses: read
concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false
jobs:
  guard:
    name: Verify exact source, staging SHA, gates and authorization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check immutable candidate and release
        shell: bash
        env:
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
          EXPECTED_DEPLOYED: ${{ inputs.expected_deployed_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo MAIN_ONLY; exit 1; }
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$EXPECTED_DEPLOYED" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$EXPECTED_MAIN" == "$GITHUB_SHA" ]] || { echo SHA_MISMATCH; exit 1; }
          [[ "$CONFIRMATION" == AIRTRUST_CV_FRMS_STAGING_FIXTURE_20261027 ]] || { echo CONFIRMATION_INVALID; exit 1; }
          [[ "$MODE" == inspect || "$MODE" == apply ]] || exit 1
          git merge-base --is-ancestor "$EXPECTED_DEPLOYED" "$GITHUB_SHA" || { echo STAGING_SHA_NOT_ANCESTOR; exit 1; }
          live_main=$(git ls-remote https://github.com/Airtrust-Org/airtrust.git refs/heads/main | cut -f1)
          [[ "$live_main" == "$EXPECTED_MAIN" ]] || { echo MAIN_CHANGED; exit 1; }
          node scripts/ci/verify-release-gates.mjs
          node --input-type=module <<'NODE'
          const sha=process.env.EXPECTED_DEPLOYED;
          const worker=await fetch('https://airtrust-api-staging.airtrust.workers.dev/api/version',{headers:{'Cache-Control':'no-store'}});
          if(!worker.ok)throw Error('STAGING_WORKER_UNAVAILABLE');
          const v=await worker.json();
          if(v?.data?.sourceSha!==sha || v?.data?.environment!=='staging')throw Error('STAGING_WORKER_SHA_MISMATCH');
          const pages=await fetch('https://staging.airtrust.pages.dev/',{headers:{'Cache-Control':'no-store'}});
          if(!pages.ok || !(await pages.text()).includes(sha.slice(0,7)))throw Error('STAGING_PAGES_SHA_MISMATCH');
          console.log('CV_FRMS_FIXTURE_PROVENANCE_PASS');
          NODE
  staging-fixture:
    name: Preflight, recovery bookmark and synthetic-only D1 fixture
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate fixture tests
        run: node --test scripts/__tests__/cv-frms-20261027-synthetic-fixture.test.mjs
      - name: Install Cloudflare tooling
        run: npm --prefix worker-airtrust ci
      - name: Read-only synthetic fixture preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_NAME: airtrust-db-staging-baseline-20260701
          STAGING_D1_ID: bf9963f4-eb12-439b-a830-20bbf577ac22
        run: node scripts/staging/seed-cv-frms-coordination-20261027.mjs --inspect
      - name: Verify staging D1 ID and capture recovery bookmark
        if: ${{ inputs.mode == 'apply' }}
        id: recovery
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd worker-airtrust
          npx --no-install wrangler d1 info airtrust-db-staging-baseline-20260701 --json > "$RUNNER_TEMP/cv-frms-info.json"
          npx --no-install wrangler d1 time-travel info airtrust-db-staging-baseline-20260701 --json > "$RUNNER_TEMP/cv-frms-recovery.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const info=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cv-frms-info.json','utf8'));
          const id=String(info.uuid??info.database_id??info.id??info.result?.uuid??'');
          if(id!=='bf9963f4-eb12-439b-a830-20bbf577ac22')throw Error('STAGING_D1_UUID_MISMATCH');
          const state=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cv-frms-recovery.json','utf8'));
          const mark=String(state.bookmark??state.result?.bookmark??'');
          if(!/^[A-Za-z0-9._=-]{8,256}$/.test(mark))throw Error('STAGING_RECOVERY_BOOKMARK_INVALID');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'bookmark='+mark+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Staging D1 recovery bookmark captured and verified.\n');
          console.log('CV_FRMS_STAGING_D1_RECOVERY_READY');
          NODE
      - name: Apply exclusively synthetic QA fixture
        if: ${{ inputs.mode == 'apply' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_NAME: airtrust-db-staging-baseline-20260701
          STAGING_D1_ID: bf9963f4-eb12-439b-a830-20bbf577ac22
          CONFIRM_CV_FRMS_STAGING_FIXTURE: ${{ inputs.confirmation }}
          VERIFIED_STAGING_RECOVERY_BOOKMARK: ${{ steps.recovery.outputs.bookmark }}
        run: node scripts/staging/seed-cv-frms-coordination-20261027.mjs --apply
      - name: Summarize restricted scope
        if: ${{ always() }}
        shell: bash
        run: |
          echo 'Staging-only synthetic QA: tenant 999006; date 2026-10-27.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Does not certify real operational fitness or regulatory compliance.' >> "$GITHUB_STEP_SUMMARY"
