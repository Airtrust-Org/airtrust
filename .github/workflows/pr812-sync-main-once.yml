name: Temporary PR812 main sync

on:
  push:
    branches:
      - fix/cron-scalability-observability-security-20260804
    paths:
      - .github/workflows/pr812-sync-main-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main without rewriting history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin "HEAD:${GITHUB_REF_NAME}"
