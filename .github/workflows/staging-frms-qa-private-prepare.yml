name: FRMS Private Prepare Admin Grant Preflight (No Writes)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AIRTRUST_FRMS_QA_PREPARE_ONLY_F0_APPROVED
        required: true
        type: string
      expected_main_sha:
        description: Exact current main SHA (all eight official gates required)
        required: true
        type: string
      grant_id:
        description: Fresh unedited F0 prepare-only admin comment ID in issue 776
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  issues: read

concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false

jobs:
  grant-preflight:
    name: Verify F0 prepare grant without invoking private Worker
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Test fail-closed grant verification (offline fixtures)
        run: node --test scripts/__tests__/frms-qa-prepare-admin-grant.test.mjs scripts/__tests__/frms-qa-prepare-workflow-contract.test.mjs
      - name: Attest exact admin, main, workflow run, SHA, and eight gates (GitHub GET only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRMS_QA_PREPARE_CONFIRM: ${{ inputs.confirmation }}
          FRMS_QA_PREPARE_EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          FRMS_QA_PREPARE_GRANT_ID: ${{ inputs.grant_id }}
        run: node ops/frms-qa-repair/run-prepare-admin-preflight.mjs
      - name: Record limited scope; never claim prepare success
        if: success()
        run: |
          echo 'FRMS_PREPARE_ADMIN_GRANT_READONLY_PREFLIGHT_PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewed main SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'No private caller, no Worker RPC, no encrypted preimage R2 write, no D1 SQL, no apply, no deployment, no production.' >> "$GITHUB_STEP_SUMMARY"
