name: Legacy Pages Deploy Guard

on:
  workflow_dispatch:

jobs:
  redirect:
    name: Redirect To Deploy AirTrust
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        shell: bash
        run: |
          echo "Legacy Pages deploy is disabled." >&2
          echo "Use the 'Deploy AirTrust' workflow with deploy_pages=true." >&2
          exit 1
