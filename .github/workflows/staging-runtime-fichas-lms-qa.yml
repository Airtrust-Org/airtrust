name: Staging Runtime QA — Fichas and LMS

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA expected on staging
        required: true
        type: string
      confirmation:
        description: Type AIRTRUST_STAGING to run protected runtime QA
        required: true
        type: string
      retain_fixtures_on_failure:
        description: Retain exact synthetic fixture IDs after a failed run
        required: true
        default: false
        type: boolean

concurrency:
  group: airtrust-staging-runtime-fichas-lms-qa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Staging Runtime QA Guard
    runs-on: ubuntu-latest
    environment: staging
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD }}
      STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Fail closed before any fixture action
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo 'AIRTRUST_STAGING_FUNCTIONAL_QA_GUARD_NO_GO: main required' >&2; exit 1; }
          [[ "$CONFIRMATION" == "AIRTRUST_STAGING" ]] || { echo 'AIRTRUST_STAGING_FUNCTIONAL_QA_GUARD_NO_GO: confirmation rejected' >&2; exit 1; }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo 'AIRTRUST_STAGING_FUNCTIONAL_QA_GUARD_NO_GO: expected SHA mismatch' >&2; exit 1; }
          [[ -n "$QA_ADMIN_EMAIL" && -n "$QA_ADMIN_PASSWORD" ]] || { echo 'AIRTRUST_STAGING_FUNCTIONAL_QA_GUARD_NO_GO: required QA secrets absent' >&2; exit 1; }
          [[ -n "$STAGING_SMOKE_EMAIL" && -n "$STAGING_SMOKE_PASSWORD" ]] || { echo 'AIRTRUST_STAGING_FUNCTIONAL_QA_GUARD_NO_GO: required smoke tenant secrets absent' >&2; exit 1; }
          echo "::add-mask::$QA_ADMIN_EMAIL"
          echo "::add-mask::$QA_ADMIN_PASSWORD"
          blocked_host="api.""airtrust.online"
          ! grep -Fq "$blocked_host" scripts/qa/staging-runtime-fichas-lms-qa.mjs || { echo 'AIRTRUST_STAGING_FUNCTIONAL_QA_GUARD_NO_GO: production target found' >&2; exit 1; }
          ! grep -Eqi 'wrangler .*deploy|migration|sincronizar-frms|frms_jornada' scripts/qa/staging-runtime-fichas-lms-qa.mjs || { echo 'AIRTRUST_STAGING_FUNCTIONAL_QA_GUARD_NO_GO: forbidden operation found' >&2; exit 1; }
          echo 'STAGING_GUARD_PASS'

  runtime-qa:
    name: Fichas and LMS Runtime QA
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RETAIN_FIXTURES_ON_FAILURE: ${{ inputs.retain_fixtures_on_failure }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD }}
      STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check QA runner and UI guard tests
        run: |
          node --check scripts/qa/staging-runtime-fichas-lms-qa.mjs
          npm run test:run -- src/react-app/pages/simuladores/fichas/__tests__/index.modes.test.tsx src/react-app/pages/simuladores/fichas/__tests__/route-guards.test.tsx
      - name: Run protected staging runtime QA
        env:
          QA_SUMMARY_PATH: ${{ runner.temp }}/staging-runtime-fichas-lms-summary.json
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$QA_ADMIN_EMAIL"
          echo "::add-mask::$QA_ADMIN_PASSWORD"
          node scripts/qa/staging-runtime-fichas-lms-qa.mjs
      - name: Ensure sanitized QA summary exists
        if: always()
        env:
          QA_SUMMARY_PATH: ${{ runner.temp }}/staging-runtime-fichas-lms-summary.json
        shell: bash
        run: |
          test -f "$QA_SUMMARY_PATH" || printf '{"status":"NO_SUMMARY"}\n' > "$QA_SUMMARY_PATH"
      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-runtime-fichas-lms-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-runtime-fichas-lms-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish sanitized summary
        if: always()
        env:
          QA_SUMMARY_PATH: ${{ runner.temp }}/staging-runtime-fichas-lms-summary.json
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p=process.env.QA_SUMMARY_PATH; const r=JSON.parse(fs.readFileSync(p)); console.log('## Staging runtime QA'); console.log(''); console.log('- Fichas: ' + (r.matrices?.fichas || 'NOT_AVAILABLE')); console.log('- LMS: ' + (r.matrices?.lms || 'NOT_AVAILABLE')); console.log('- Cleanup: ' + (r.cleanup || 'NOT_AVAILABLE')); console.log('- flight_report_id: FLIGHT_REPORT_ID_COMPONENT_INTEGRATION_PASS');" >> "$GITHUB_STEP_SUMMARY"
