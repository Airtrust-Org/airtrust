name: Temporary format PR 631 Header

on:
  push:
    branches:
      - fix/header-accessibility-consolidated-20260801

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/header-accessibility-consolidated-20260801
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Format Header delta
        run: |
          npx --yes prettier@3.9.6 --write -- \
            src/react-app/components/layout/Header.tsx \
            src/react-app/components/layout/__tests__/Header.accessibility.test.tsx
          git diff --check

      - name: Commit formatted delta and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/tmp-format-pr631.yml
          git add -- \
            src/react-app/components/layout/Header.tsx \
            src/react-app/components/layout/__tests__/Header.accessibility.test.tsx
          git commit -m "style(a11y): format header accessibility changes"
          git push origin HEAD:fix/header-accessibility-consolidated-20260801
