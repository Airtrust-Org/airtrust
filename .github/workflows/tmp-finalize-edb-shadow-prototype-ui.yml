name: Temporary finalize eDB shadow prototype UI

on:
  push:
    branches:
      - feat/edb-shadow-prototype-ui-20260802

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edb-shadow-prototype-ui-20260802
          fetch-depth: 0
      - name: Apply focused repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/react-app/pages/controle-voos/EdbShadowPrototype.tsx')
          source = path.read_text(encoding='utf-8')
          old = "import { FormEvent, useMemo, useState } from 'react';"
          new = "import { type FormEvent, useMemo, useState } from 'react';"
          if source.count(old) != 1:
              raise SystemExit('expected FormEvent import not found exactly once')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git rm src/react-app/pages/controle-voos/__tests__/edb-shadow-format-diagnostic.test.ts
          git rm .github/workflows/tmp-finalize-edb-shadow-prototype-ui.yml
      - name: Commit focused repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react-app/pages/controle-voos/EdbShadowPrototype.tsx
          git commit -m "fix(edb): finalize shadow prototype UI checks"
          git push origin HEAD:feat/edb-shadow-prototype-ui-20260802
