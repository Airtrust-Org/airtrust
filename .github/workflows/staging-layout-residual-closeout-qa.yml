name: Staging Layout Residual Closeout QA

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_STAGING_LAYOUT_RESIDUAL_QA'
        required: true
        type: string
      expected_sha:
        description: 'Exact current main SHA already deployed to staging'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-layout-residual-closeout-qa
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  STAGING_FRONTEND_BASE_URL: https://staging.airtrust.pages.dev
  STAGING_D1_NAME: airtrust-db-staging-baseline-20260701

jobs:
  residual-qa:
    name: N-03 / N-07 / N-09 governed runtime proof
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      E2E_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL || 'qa-examiner-admin@staging.airtrust.invalid' }}
      E2E_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD || secrets.STAGING_SMOKE_PASSWORD }}
      QA_EXAMINER_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL || 'qa-examiner-admin@staging.airtrust.invalid' }}
      QA_EXAMINER_ADMIN_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD || secrets.STAGING_SMOKE_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://staging.airtrust.pages.dev
      QA_RUN_MARKER: ${{ github.run_id }}
      CI: 'true'
    steps:
      - name: Guard exact current main and staging-only scope
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'MAIN_ONLY' >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_STAGING_LAYOUT_RESIDUAL_QA' ]] || { echo 'CONFIRMATION_REJECTED' >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'EXPECTED_SHA_INVALID' >&2; exit 1; }
          [[ "${EXPECTED_SHA,,}" == "${GITHUB_SHA,,}" ]] || { echo 'EXPECTED_SHA_NOT_CURRENT_MAIN' >&2; exit 1; }
          [[ "$STAGING_API_BASE_URL" == *staging* && "$STAGING_FRONTEND_BASE_URL" == *staging* ]] || exit 1
          [[ "$STAGING_D1_NAME" == 'airtrust-db-staging-baseline-20260701' ]] || exit 1
          [[ -n "$E2E_PASSWORD" ]] || { echo 'QA_PASSWORD_MISSING' >&2; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo 'STAGING_D1_CREDENTIALS_MISSING' >&2; exit 1; }

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Require official release gates on exact SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.expected_sha }}
        run: node scripts/ci/verify-release-gates.mjs

      - name: Require exact Worker and Pages staging provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expected = String(process.env.EXPECTED_SHA || '').toLowerCase();
          const versionResponse = await fetch(`${process.env.STAGING_API_BASE_URL}/api/version`, {
            headers: { Accept: 'application/json' },
          });
          if (!versionResponse.ok) throw new Error(`STAGING_VERSION_HTTP_${versionResponse.status}`);
          const version = await versionResponse.json();
          const sourceSha = String(version?.sourceSha ?? version?.data?.sourceSha ?? '').toLowerCase();
          if (sourceSha !== expected) throw new Error(`STAGING_WORKER_SHA_MISMATCH:${sourceSha || 'missing'}`);

          const frontendResponse = await fetch(`${process.env.STAGING_FRONTEND_BASE_URL}/`, {
            headers: { Accept: 'text/html' },
          });
          if (!frontendResponse.ok) throw new Error(`STAGING_FRONTEND_HTTP_${frontendResponse.status}`);
          const html = (await frontendResponse.text()).toLowerCase();
          if (!html.includes(expected.slice(0, 7))) throw new Error('STAGING_FRONTEND_SHA_MISMATCH');
          console.log(`STAGING_LAYOUT_RESIDUAL_PROVENANCE_SHA=${expected}`);
          NODE

      - name: Install dependencies
        run: npm ci && cd worker-airtrust && npm ci

      - name: Reseed exact synthetic QA tenant
        shell: bash
        env:
          CONFIRM_STAGING_QA_SEED: AIRTRUST_STAGING_QA_SEED
        run: node scripts/staging/seed-qa-examiner-training.mjs --apply

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused N-03 / N-07 / N-09 closeout
        run: npx playwright test e2e/staging-layout-residual-closeout.spec.ts --project=chromium

      - name: Cleanup synthetic SGSO record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          MARKER="AIRTRUST-QA-N09-${QA_RUN_MARKER}%"
          npx wrangler d1 execute "$STAGING_D1_NAME" --remote --json --command "
            DELETE FROM sgso_relatos_historico_status
            WHERE empresa_id = (SELECT id FROM empresas WHERE codigo = 'qa_examiner_training' LIMIT 1)
              AND relato_id IN (
                SELECT id FROM sgso_relatos
                WHERE empresa_id = (SELECT id FROM empresas WHERE codigo = 'qa_examiner_training' LIMIT 1)
                  AND descricao LIKE '$MARKER'
              );
            DELETE FROM sgso_relatos
            WHERE empresa_id = (SELECT id FROM empresas WHERE codigo = 'qa_examiner_training' LIMIT 1)
              AND descricao LIKE '$MARKER';
          " > "$RUNNER_TEMP/layout-residual-cleanup.json"

      - name: Verify synthetic SGSO cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/layout-residual-cleanup-verify.json"
          MARKER="AIRTRUST-QA-N09-${QA_RUN_MARKER}%"
          npx wrangler d1 execute "$STAGING_D1_NAME" --remote --json --command "
            SELECT COUNT(*) AS remaining
            FROM sgso_relatos
            WHERE empresa_id = (SELECT id FROM empresas WHERE codigo = 'qa_examiner_training' LIMIT 1)
              AND descricao LIKE '$MARKER';
          " > "$OUT"
          node - "$OUT" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = Array.isArray(payload) ? payload.flatMap((entry) => entry?.results || []) : [];
          const row = rows[0] || {};
          if (Number(row.remaining || 0) !== 0) throw new Error('SYNTHETIC_SGSO_CLEANUP_FAILED');
          console.log('SYNTHETIC_SGSO_CLEANUP=PASS');
          NODE

      - name: Publish sanitized closure summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Layout/UX residual runtime closeout'
            echo ''
            echo '- N-03 Controle de Voos 375px overflow: PASS'
            echo '- N-07 Pasta 360 synthetic PDF upload/listing/non-zero/no-duplicate: PASS'
            echo '- N-07 uploaded document cleanup through canonical API: PASS'
            echo '- N-09 SGSO synthetic listed record -> real detail route: PASS'
            echo '- N-09 synthetic SGSO cleanup: PASS'
            echo '- real-person fixtures used: none'
            echo '- production writes: 0'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-layout-residual-closeout-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
