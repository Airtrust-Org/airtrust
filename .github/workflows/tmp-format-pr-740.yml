name: Temporary Format PR 740

on:
  push:
    branches:
      - fix/a11y-performance-backlog-566-20260802

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a11y-performance-backlog-566-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format changed source files and remove finalizer
        run: |
          npx prettier@3.9.6 --write \
            src/react-app/components/AeronaveMultiSelect.tsx \
            src/react-app/components/UI/ColumnSelector.tsx \
            src/react-app/components/importacao/ModalImportacao.tsx \
            src/react-app/pages/simuladores/tabs/TabSessoesWrapper.tsx \
            src/react-app/pages/simuladores/tabs/tabSessoesDerived.ts \
            src/react-app/pages/simuladores/tabs/__tests__/tabSessoesDerived.test.ts
          git rm .github/workflows/tmp-format-pr-740.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/react-app
          git commit -m "style(frontend): format accessibility and session delta"
          git push origin HEAD:fix/a11y-performance-backlog-566-20260802
