name: PR 808 temporary workflow cleanup

on:
  push:
    branches:
      - fix/migrations-deploy-safety-20260804

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/migrations-deploy-safety-20260804
      - name: Remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr808-refresh-self-protected-pin.yml
          git commit -m 'ci: remove temporary PR 808 pin workflow'
          git push origin HEAD:fix/migrations-deploy-safety-20260804
