name: FRMS Staging Time Travel Bookmark Local Proof (GET Only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type FRMS_QA_BOOKMARK_GET_HMAC_LOCAL_READONLY
        required: true
        type: string
      expected_main_sha:
        description: Exact current main SHA; read-only, no deploy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Pin branch, SHA, and GET-only intent before secrets
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Airtrust-Org/airtrust" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$CONFIRMATION" == "FRMS_QA_BOOKMARK_GET_HMAC_LOCAL_READONLY" ]]
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN" ]]
          [[ "$(gh api repos/Airtrust-Org/airtrust/branches/main --jq .commit.sha)" == "$EXPECTED_MAIN" ]]
  prove:
    needs: guard
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Execute only disposable contract and failure tests
        run: |
          node --test scripts/__tests__/frms-qa-trusted-runner-bookmark-acquisition.test.mjs scripts/__tests__/frms-qa-staging-bookmark-get-local-proof.test.mjs
      - name: Read current D1 Time Travel bookmark by fixed GET and verify local proof only
        env:
          FRMS_QA_BOOKMARK_READONLY_CONFIRM: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          FRMS_QA_CALLER_KEY_HEX: ${{ secrets.FRMS_QA_CALLER_KEY_HEX }}
        run: node ops/frms-qa-repair/staging-bookmark-get-local-proof.mjs
      - name: Record only non-sensitive boundaries
        if: success()
        run: |
          echo 'Time Travel fixed-endpoint GET + ephemeral local HMAC verified. No bookmark, key or token persisted; no deploy/write/approval.' >> "$GITHUB_STEP_SUMMARY"
          echo "Source main SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
