name: N-11 Candidate 128 Readonly Lineage

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA reviewed for this read-only lineage probe
        required: true
        type: string
      confirmation:
        description: Type AIRTRUST_PRODUCTION_READONLY_N11_128_LINEAGE to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: n11-candidate-128-readonly-lineage
  cancel-in-progress: false

jobs:
  d1_lineage:
    name: Read-only D1 lineage for N-11 candidate 128
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate immutable dispatch
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "MAIN_REF_REQUIRED" >&2; exit 1; }
          [[ "$CONFIRMATION" == "AIRTRUST_PRODUCTION_READONLY_N11_128_LINEAGE" ]] || { echo "READONLY_CONFIRMATION_REQUIRED" >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "EXPECTED_SHA_INVALID" >&2; exit 1; }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo "EXPECTED_SHA_MISMATCH" >&2; exit 1; }

      - name: Checkout exact reviewed main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker-airtrust/package-lock.json

      - name: Install Worker dependencies
        run: npm --prefix worker-airtrust ci

      - name: Validate D1 read credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "D1_READ_TOKEN_MISSING" >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "CLOUDFLARE_ACCOUNT_ID_MISSING" >&2; exit 1; }

      - name: Inspect candidate 128 structural lineage
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          N11_128_LINEAGE_CONFIRMATION: AIRTRUST_PRODUCTION_READONLY_N11_128_LINEAGE
          N11_PRODUCTION_DB_NAME: airtrust-db
        run: |
          set -euo pipefail
          node scripts/validation/n11-candidate-128-lineage.mjs > "$RUNNER_TEMP/n11-128-lineage.json"
          node - "$RUNNER_TEMP/n11-128-lineage.json" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('## N-11 candidate 128 structural lineage — read-only');
          console.log('');
          console.log(`- source SHA: \`${data.source_sha}\``);
          console.log(`- candidate ID: \`${data.candidate.id}\``);
          console.log(`- linked users: \`${data.linked_users.map((x) => x.id).join(',') || 'none'}\``);
          console.log(`- LMS matriculas: \`${data.lms_matriculas.length}\``);
          console.log(`- LMS cycles: \`${data.lms_ciclos.length}\``);
          console.log(`- active imported history: \`${data.structural_counts.active_imported_history}\``);
          console.log(`- active qualification history: \`${data.structural_counts.active_qualification_history}\``);
          console.log(`- active documents: \`${data.structural_counts.active_documents}\``);
          console.log(`- active virtual folder rows: \`${data.structural_counts.active_virtual_folder_rows}\``);
          console.log('- writes: none');
          console.log('- names/emails/document numbers/scores/timestamps: not emitted');
          NODE

      - name: Upload sanitized lineage evidence
        uses: actions/upload-artifact@v4
        with:
          name: n11-candidate-128-lineage-${{ github.sha }}
          path: ${{ runner.temp }}/n11-128-lineage.json
          if-no-files-found: error
          retention-days: 7
