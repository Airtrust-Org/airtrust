name: Staging FRMS Maintenance Read-only Acceptance
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AIRTRUST_STAGING_FRMS_MAINTENANCE_READONLY
        required: true
        type: string
      expected_deployed_sha:
        description: Exact Worker and Pages SHA already deployed
        required: true
        type: string
permissions:
  contents: read
  checks: read
  statuses: read
concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false
jobs:
  guard:
    name: Verify protected main, exact staging SHA and only a workflow delta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate immutable deployed application
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirmation }}
          EXPECTED: ${{ inputs.expected_deployed_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == Airtrust-Org/airtrust && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CONFIRM" == AIRTRUST_STAGING_FRMS_MAINTENANCE_READONLY ]]
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(gh api repos/Airtrust-Org/airtrust/branches/main --jq .commit.sha)" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$EXPECTED" "$GITHUB_SHA"
          git diff --name-only "$EXPECTED" "$GITHUB_SHA" > "$RUNNER_TEMP/frms-maintenance-delta"
          if grep -vxF '.github/workflows/staging-frms-maintenance-readonly.yml' "$RUNNER_TEMP/frms-maintenance-delta"; then
            echo FRMS_MAINTENANCE_UNDEPLOYED_RUNTIME_DELTA >&2
            exit 1
          fi
          echo FRMS_MAINTENANCE_WORKFLOW_ONLY_DELTA_PASS
      - name: Verify eight official gates for both tested workflow and deployed application
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$DEPLOYED_SHA" node scripts/ci/verify-release-gates.mjs
          RELEASE_SHA="$GITHUB_SHA" node scripts/ci/verify-release-gates.mjs
      - name: Exact Worker+Pages staging provenance
        env:
          EXPECTED: ${{ inputs.expected_deployed_sha }}
        run: |
          node --input-type=module <<'NODE'
          const s=process.env.EXPECTED;
          const r=await fetch('https://airtrust-api-staging.airtrust.workers.dev/api/version',{headers:{'Cache-Control':'no-cache'}});
          if(!r.ok)throw Error('STAGING_WORKER_UNAVAILABLE');
          const v=await r.json();
          if(v?.data?.sourceSha!==s||v?.data?.environment!=='staging')throw Error('STAGING_WORKER_SHA_MISMATCH');
          const p=await fetch('https://staging.airtrust.pages.dev/',{headers:{'Cache-Control':'no-cache'}});
          if(!p.ok||!(await p.text()).includes(s.slice(0,7)))throw Error('STAGING_PAGES_SHA_MISMATCH');
          console.log('FRMS_MAINTENANCE_PROVENANCE_PASS');
          NODE
  browser:
    name: Authorized tenant admin reads Maintenance without data writes
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      BASE_URL: https://staging.airtrust.pages.dev
      STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      E2E_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      E2E_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Require existing authorized staging identity
        run: |
          [[ -n "$STAGING_SMOKE_EMAIL" && -n "$STAGING_SMOKE_PASSWORD" ]] || {
            echo FRMS_MAINTENANCE_STAGING_CREDENTIAL_MISSING >&2
            exit 1
          }
      - run: npm ci
      - name: Typecheck read-only browser contract
        run: >-
          npx --no-install tsc --noEmit --skipLibCheck
          --target es2022 --module nodenext --moduleResolution nodenext
          --esModuleInterop --types node e2e/staging-frms-maintenance.spec.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser verifies permission and real Maintenance dashboard
        run: >-
          npx playwright test e2e/staging-frms-maintenance.spec.ts
          --project=chromium --no-deps
          --grep "tenant admin sees Operations and Maintenance and opens maintenance dashboard"
      - name: Preserve screenshots, trace and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-frms-maintenance-readonly-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Post-acceptance runtime SHA invariant
        if: always()
        env:
          EXPECTED: ${{ inputs.expected_deployed_sha }}
        run: |
          node --input-type=module <<'NODE'
          const s=process.env.EXPECTED;
          const r=await fetch('https://airtrust-api-staging.airtrust.workers.dev/api/version',{headers:{'Cache-Control':'no-cache'}});
          const j=await r.json();
          if(!r.ok||j?.data?.sourceSha!==s||j?.data?.environment!=='staging')throw Error('POST_WORKER_SHA_MISMATCH');
          const p=await fetch('https://staging.airtrust.pages.dev/',{headers:{'Cache-Control':'no-cache'}});
          if(!p.ok||!(await p.text()).includes(s.slice(0,7)))throw Error('POST_PAGES_SHA_MISMATCH');
          console.log('FRMS_MAINTENANCE_POST_PROVENANCE_PASS');
          NODE
      - name: Record limited authorized Maintenance read-only acceptance
        if: success()
        run: |
          {
            echo 'FRMS Maintenance positive authorized browser QA: PASS, read-only.'
            echo 'Staging admin saw Operations, Manutenção, Fadiga da Manutenção and Equipe de manutenção.'
            echo 'No QA seed, D1/R2 writes, schema migrations, deployments or production operation.'
          } >> "$GITHUB_STEP_SUMMARY"
