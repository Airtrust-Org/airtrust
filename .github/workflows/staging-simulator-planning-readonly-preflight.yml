name: Staging Simulator Planning Read-Only Preflight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_STAGING_SIMULATOR_PLANNING_READONLY to continue'
        required: true
        type: string
      expected_deployed_sha:
        description: 'Exact 40-hex Worker/frontend SHA currently deployed to staging'
        required: true
        type: string

concurrency:
  group: staging-simulator-planning-readonly-preflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  statuses: read
  checks: read

# Read-only by construction: no deploy, seed, migration or D1 write step exists.
env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  STAGING_FRONTEND_BASE_URL: https://staging.airtrust.pages.dev
  STAGING_D1_NAME: airtrust-db-staging-baseline-20260701
  STAGING_D1_ID: bf9963f4-eb12-439b-a830-20bbf577ac22
  PRODUCTION_D1_ID: 7c8a788e-a4c4-4d5d-8208-ff7ff55e84ae

jobs:
  guard:
    name: Read-Only Simulator Planning Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate trusted-main dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == 'refs/heads/main' ]] || { echo 'MAIN_ONLY' >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_STAGING_SIMULATOR_PLANNING_READONLY' ]] || { echo 'CONFIRMATION_REJECTED' >&2; exit 1; }
          [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'EXPECTED_DEPLOYED_SHA_INVALID' >&2; exit 1; }
          [[ "$STAGING_D1_ID" != "$PRODUCTION_D1_ID" ]] || { echo 'PRODUCTION_DB_REJECTED' >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require deployed release to be trusted main ancestry
        shell: bash
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$EXPECTED_DEPLOYED_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_DEPLOYED_SHA" HEAD
          echo "TRUSTED_DEPLOYED_SHA=$EXPECTED_DEPLOYED_SHA"

      - name: Require canonical release gates for deployed SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.expected_deployed_sha }}
        run: node scripts/ci/verify-release-gates.mjs

      - name: Require live Worker and frontend provenance
        shell: bash
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expected = String(process.env.EXPECTED_DEPLOYED_SHA || '').toLowerCase();
          const response = await fetch(`${process.env.STAGING_API_BASE_URL}/api/version`, {
            headers: { Accept: 'application/json' },
          });
          if (!response.ok) throw new Error(`STAGING_VERSION_HTTP_${response.status}`);
          const version = await response.json();
          const sourceSha = String(version?.sourceSha ?? version?.data?.sourceSha ?? '').toLowerCase();
          const environment = String(version?.environment ?? version?.data?.environment ?? '');
          if (sourceSha !== expected) throw new Error(`STAGING_WORKER_SHA_MISMATCH:${sourceSha || 'missing'}`);
          if (environment !== 'staging') throw new Error(`STAGING_ENV_MISMATCH:${environment || 'missing'}`);
          const { assertLiveFrontendShaFromOrigin } = await import('./e2e/lib/live-sha-guard.mjs');
          await assertLiveFrontendShaFromOrigin(process.env.STAGING_FRONTEND_BASE_URL, expected.slice(0, 7));
          console.log(`STAGING_SIMULATOR_READONLY_PROVENANCE_SHA=${expected}`);
          NODE

  audit:
    name: Read-Only Simulator Planning D1 Audit
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Require governed staging read-only credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'STAGING_D1_TOKEN_MISSING' >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING' >&2; exit 1; }

      - name: Install worker dependencies
        run: npm --prefix worker-airtrust ci

      - name: Require simulator-planning fixture schema compatibility (read-only)
        run: node scripts/staging/preflight-simulator-planning-schema.mjs

      - name: Audit tenant isolation and planning-fixture residue read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPORT_PATH: ${{ runner.temp }}/staging-simulator-planning-readonly.json
        run: |
          set -euo pipefail
          node scripts/staging/audit-simulator-matrix-baseline.mjs | tee "$REPORT_PATH"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const raw = readFileSync(process.env.REPORT_PATH, 'utf8');
          const start = raw.indexOf('{');
          const end = raw.lastIndexOf('}');
          if (start < 0 || end <= start) throw new Error('READONLY_REPORT_JSON_MISSING');
          const data = JSON.parse(raw.slice(start, end + 1));
          if (data.mode !== 'READ_ONLY') throw new Error(`AUDIT_MODE_INVALID:${data.mode}`);
          if (data.diagnosis !== 'STAGING_TENANT_IDENTITY_ISOLATED') throw new Error(`TENANT_ISOLATION_INVALID:${data.diagnosis}`);
          if (data.migration_0490_ledgered_in_staging !== false) throw new Error('PRODUCTION_0490_PRESENT_IN_STAGING');
          if (data.qa_fixture_present !== true) throw new Error('QA_BASE_FIXTURE_MISSING');
          const residue = data.qa_planning_residue || {};
          console.log(`QA_PLANNING_HYGIENE_CLEAN=${Boolean(data.qa_planning_hygiene_clean)}`);
          console.log(`QA_PLANNING_RESIDUE=${JSON.stringify(residue)}`);
          console.log(`NEXT_ACTION=${String(data.next_action || '')}`);
          NODE

      - name: Publish sanitized readiness summary
        if: always()
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/staging-simulator-planning-readonly.json
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          {
            echo '## Staging simulator planning read-only preflight'
            echo ''
            echo "- expected deployed SHA: \`$EXPECTED_DEPLOYED_SHA\`"
            echo '- operation: SELECT/PRAGMA only'
            echo '- production target/data used: no'
            echo '- staging mutation performed: no'
            if [[ -f "$REPORT_PATH" ]]; then
              node --input-type=module -e 'import { readFileSync } from "node:fs"; const raw=readFileSync(process.env.REPORT_PATH,"utf8"); const data=JSON.parse(raw.slice(raw.indexOf("{"),raw.lastIndexOf("}")+1)); console.log(`- diagnosis: ${data.diagnosis}`); console.log(`- qa fixture present: ${data.qa_fixture_present}`); console.log(`- planning hygiene clean: ${data.qa_planning_hygiene_clean}`); console.log(`- next action: ${data.next_action}`); console.log(`- residue counts: ${JSON.stringify(data.qa_planning_residue || {})}`);'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-simulator-planning-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-simulator-planning-readonly.json
          if-no-files-found: error
          retention-days: 14
