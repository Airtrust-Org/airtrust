name: PR 808 exact Prettier formatter

on:
  push:
    branches:
      - fix/migrations-deploy-safety-20260804

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/migrations-deploy-safety-20260804
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact Prettier output
        run: |
          npx --yes prettier@3.9.6 --write \
            scripts/__tests__/migration-deploy-safety.test.mjs \
            scripts/check-operational-sql-sources.mjs
      - name: Commit formatter result if needed
        run: |
          if git diff --quiet -- \
            scripts/__tests__/migration-deploy-safety.test.mjs \
            scripts/check-operational-sql-sources.mjs; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/__tests__/migration-deploy-safety.test.mjs \
            scripts/check-operational-sql-sources.mjs
          git commit -m 'style(migrations): apply exact Prettier 3.9.6 output'
          git push origin HEAD:fix/migrations-deploy-safety-20260804
