name: FRMS readiness protocol guard

on:
  push:
    branches:
      - feat/frms-operational-readiness-pvt-20260827
    paths:
      - .github/workflows/frms-readiness-protocol-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frms-operational-readiness-pvt-20260827
          fetch-depth: 0
      - name: Apply protocol guard
        run: python3 .github/scripts/frms_readiness_protocol_guard.py
      - name: Commit guard
        run: |
          git config user.name "airtrust-readiness-integrator"
          git config user.email "actions@users.noreply.github.com"
          git add worker-airtrust/src/lib/frms/readiness.ts worker-airtrust/src/routes/frms-readiness.ts worker-airtrust/src/__tests__/routes/frms-readiness.test.ts
          git commit -m "fix(frms): enforce three-minute vigilance v1 contract"
          git push origin HEAD:feat/frms-operational-readiness-pvt-20260827
