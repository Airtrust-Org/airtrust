name: Temporary Cron Entrypoint Test Fix

on:
  push:
    branches:
      - feat/cron-resilient-jobs-final2-20260802

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cron-resilient-jobs-final2-20260802
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker-airtrust/package-lock.json

      - name: Apply focused test correction
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path('worker-airtrust/src/__tests__/worker-entrypoint.test.ts'),
                  "{ cron: '0 8 * * *', scheduledTime: Date.now(), type: 'scheduled' }",
                  "{ cron: '0 7 * * *', scheduledTime: Date.now(), type: 'scheduled' }",
              ),
              (
                  Path('worker-airtrust/src/__tests__/runtime/job-correlation.test.ts'),
                  "{ cron: '0 8 * * *' }",
                  "{ cron: '0 7 * * *' }",
              ),
          ]

          for path, old, new in replacements:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Install worker dependencies
        working-directory: worker-airtrust
        run: npm ci

      - name: Run reproducing tests
        working-directory: worker-airtrust
        run: npx vitest run src/__tests__/worker-entrypoint.test.ts src/__tests__/runtime/job-correlation.test.ts

      - name: Commit final scoped correction
        run: |
          rm .github/workflows/zz-fix-cron-entrypoint-tests-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            worker-airtrust/src/__tests__/worker-entrypoint.test.ts \
            worker-airtrust/src/__tests__/runtime/job-correlation.test.ts \
            .github/workflows/zz-fix-cron-entrypoint-tests-temp.yml
          git commit -m "test(cron): isolate entrypoint tests from resilient schedules"
          git push origin HEAD:feat/cron-resilient-jobs-final2-20260802
