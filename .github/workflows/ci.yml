# Required fast CI gates. The AirTrust release gate uses eight direct GitHub
# Actions checks: the three fast gates in this workflow plus the five heavy
# gates in heavy-ci.yml. Heavy jobs are independent so they can run in parallel.
name: CI (fast gates)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      VITE_API_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - name: ensure main is available for delta guards
        run: git fetch origin main --quiet
      - name: canonical lint and safety guards
        run: npm run lint
      - name: frontend TypeScript ratchet
        run: npm run typecheck:ratchet

  build-content-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v7
      - name: install ripgrep
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - name: validate release-gate verifier and deploy wiring
        run: |
          node --test scripts/ci/verify-release-gates.test.mjs
          node --test scripts/__tests__/deploy-release-gates-wiring.test.mjs
          node --test scripts/ci/check-github-workflow-contexts.test.mjs
          node --test scripts/ci/check-frontend-entry-chunks.test.mjs
      - name: validate Native Player 3 F5 QA approval gate
        run: node --test scripts/__tests__/player3-native-qa-approval-gate.test.mjs
      - name: validate Player3 independent synthetic learner workflow
        run: node --test scripts/__tests__/player3-qa-learners.test.mjs
      - name: validate SCORM package and duplicate inventory contracts
        run: |
          node --test scripts/__tests__/guard-package-references-scorm-source-maps.test.mjs
          node --test scripts/__tests__/scorm-duplicate-reference-inventory.test.mjs
      - name: validate legacy qualification comparison CLI compatibility
        run: node --test scripts/__tests__/legacy-qualification-comparison-entrypoint.test.mjs
      - name: validate Pilot device gate and Schema V2 0564 contract (read-only)
        run: |
          node --test scripts/__tests__/pilot-real-device-evidence.test.mjs
          node --test scripts/__tests__/pilot-supplier-history-0564.test.mjs
      - name: tenant mutations guard
        run: node scripts/guard-tenant-mutations.mjs
      - name: validate 0438 on disposable real-base SQLite
        run: node --test scripts/__tests__/schema-v2-0438-rdv-coordination-workflow.test.mjs
      - name: validate governed qualification renewals 0487
        run: node --test scripts/__tests__/schema-v2-0487-qualificacoes-renovacoes.test.mjs
      - name: validate Conhecimento Ativo Schema V2 governance 0503
        run: node --test scripts/__tests__/schema-v2-0503-conhecimento-ativo-foundation.test.mjs
      - name: validate schema-contract staleness / provenance guard
        run: |
          node --test scripts/__tests__/schema-contract-staleness.test.mjs
          npm run guard:schema-contract-staleness
      - name: prevent obsolete Player 3 staging schema pins
        run: node --test scripts/__tests__/staging-player3-schema-v2-pins.test.mjs
      - name: validate SCORM 0566 staging schema trusted workflow and physical guards
        run: node --test scripts/__tests__/staging-scorm-handoff-0566-workflow.test.mjs
      - name: validate CI schema bootstrap provenance / staleness
        run: |
          node --test scripts/ci/check-ci-schema-bootstrap.test.mjs
          node scripts/ci/check-ci-schema-bootstrap.mjs
      - name: validate staging simulator planning read-only preflight
        run: |
          node --test scripts/__tests__/staging-simulator-matrix-baseline-audit.test.mjs
          node --test scripts/__tests__/staging-simulator-planning-readonly-preflight.test.mjs

      - name: validate staging FRMS schema doctor (read-only contract)
        run: node --test scripts/__tests__/staging-frms-schema-doctor.test.mjs
      - name: validate staging FRMS 0464 bootstrap repair governance
        run: node --test scripts/__tests__/staging-frms-0464-bootstrap-repair.test.mjs
      - name: validate FRMS staging QA uses the shared mutation mutex
        run: node --test scripts/__tests__/staging-frms-auth-qa.test.mjs
      - name: validate production release read-only preflight contract
        run: node --test scripts/__tests__/production-release-readonly-preflight.test.mjs
      - name: validate production LMS SCORM enrollment review read-only contract
        run: |
          node --test scripts/__tests__/lms-enrollment-readonly-review-helpers.test.mjs
          node --test scripts/__tests__/production-lms-scorm-review-readonly.test.mjs
      - name: validate FRMS production assignment read-only inventory contract
        run: node --test scripts/__tests__/frms-production-assignment-readonly-inventory.test.mjs
      - name: validate LMS production catalog read-only inventory contract
        run: node --test scripts/__tests__/production-lms-catalog-readonly-inventory.test.mjs
      - name: validate sanitized LMS completion outcomes contract
        run: node --test scripts/__tests__/lms-course-completion-outcomes-readonly.test.mjs
      - name: verify FDM13 transfer dry-run contract
        run: node --test scripts/__tests__/lms-fdm13-reassignment-preflight-readonly.test.mjs
      - name: verify SCORM 99 percent production proof is read only
        run: node --test scripts/__tests__/lms-scorm99-proof-readonly.test.mjs
      - name: validate LMS active-course certification across SCORM, PDF, PPTX and H5P
        run: |
          node --test scripts/__tests__/production-lms-active-course-certification-readonly.test.mjs
          node --test scripts/__tests__/lms-format-certification-verdict.test.mjs
          node --test scripts/__tests__/lms-scorm-video-playback-readonly.test.mjs
      - name: require evidence-complete P0 SCORM functional certification verdict
        run: node --test scripts/__tests__/lms-scorm-functional-certification-gate.test.mjs
      - name: verify SCORM M8 runtime assessment answer provenance
        run: node --test scripts/__tests__/lms-scorm-answer-plan.test.mjs
      - name: ensure staging success fixture requires real learner interactions
        run: node --test scripts/__tests__/lms-scorm-m8-fixture.test.mjs
      - name: verify Player3 governed staging no-write grant contract
        run: node --test scripts/__tests__/player3-staging-governance.test.mjs
      - name: validate F0 GitHub-native staging dispatch privileges and exact candidate
        run: node --test scripts/__tests__/f0-player3-staging-issueops.test.mjs
      - name: validate F0 delegated bot release requires original admin issue command
        run: node --test scripts/__tests__/f0-delegated-staging-attestation.test.mjs
      - name: verify frozen Factory SCORM core lock is fail-closed
        run: python3 -m unittest scripts/__tests__/test_scorm_golden_core_lock.py -v
      - name: validate 0438 legacy staging workflow guards
        run: node --test scripts/__tests__/staging-0438-legacy-validation.test.mjs
      - name: validate 0438 legacy staging workflow v2 guards
        run: node --test scripts/__tests__/staging-0438-legacy-validation-v2.test.mjs
      - name: internal docs check (self-test)
        run: chmod +x ./scripts/ci-demo-data-check.sh ./scripts/ci-internal-docs-check.sh ./scripts/production-audit-check.sh && ./scripts/ci-internal-docs-check.sh --test
      - name: internal docs check
        run: ./scripts/ci-internal-docs-check.sh
      - name: build
        run: VITE_API_URL=http://127.0.0.1:8787 npm run build
      - name: prove heavy frontend chunks stay out of initial entry closure
        run: node scripts/ci/check-frontend-entry-chunks.mjs
      - name: check:demo-data
        run: npm run check:demo-data

  worker-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            worker-airtrust/package-lock.json
      - run: npm ci
      - run: npm --prefix worker-airtrust ci
      - name: worker TypeScript check
        working-directory: worker-airtrust
        run: npx tsc --noEmit
