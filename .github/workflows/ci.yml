name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://127.0.0.1:8787
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: GitHub Actions context guard
        run: |
          node scripts/ci/check-github-workflow-contexts.mjs
          node --check scripts/qa/staging-runtime-fichas-lms-qa.mjs

      - name: Install
        run: npm ci

      - name: URL guard
        run: npm run lint:api-base
        env:
          CI: true
          VITE_API_URL: http://127.0.0.1:8787

      - name: Build
        run: npm run build

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: cd worker-airtrust && npm ci

      - name: Worker typecheck
        run: cd worker-airtrust && npx tsc --noEmit

      - name: Worker unit tests
        run: cd worker-airtrust && npx vitest run

  lms-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: cd worker-airtrust && npm ci

      - name: Write local dev vars
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          cat > worker-airtrust/.dev.vars <<EOF
          JWT_SECRET=$JWT_SECRET
          EOF

      - name: Setup local database
        run: npm run setup:lms:local:reset

      - name: Run integrity guardrails
        run: npm run integrity:ci

      - name: Start local worker
        run: |
          npm run dev:worker:local > /tmp/airtrust-worker.log 2>&1 &
          echo $! > /tmp/airtrust-worker.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:8787/api/health >/dev/null; then
              echo "Local worker ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/airtrust-worker.log
          exit 1

      - name: Run LMS smoke
        run: npm run smoke:lms:local

      - name: Worker log on failure
        if: failure()
        run: cat /tmp/airtrust-worker.log || true

      - name: Stop local worker
        if: always()
        run: |
          if [ -f /tmp/airtrust-worker.pid ]; then
            kill "$(cat /tmp/airtrust-worker.pid)" || true
          fi
          rm -f worker-airtrust/.dev.vars

  agent-finalize-audit-hardening:
    name: Apply reviewed audit hardening patch
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/audit-critical-high-hardening-20260731'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: agent/audit-critical-high-hardening-20260731
          fetch-depth: 0

      - name: Apply reviewed patch and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/agent-finalize.trigger
          test -f .github/agent-finalize-supplement.patch

          cat .github/agent-finalize/chunk-*.b64 \
            | base64 --decode \
            | xz --decompress --stdout \
            > "$RUNNER_TEMP/agent-finalize.patch"

          git apply --check "$RUNNER_TEMP/agent-finalize.patch"
          git apply "$RUNNER_TEMP/agent-finalize.patch"
          git apply --check .github/agent-finalize-supplement.patch
          git apply .github/agent-finalize-supplement.patch

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml

          rm -rf \
            .github/agent-finalize \
            .github/agent-finalize.patch \
            .github/agent-finalize.patch.xz.b64 \
            .github/agent-finalize-supplement.patch \
            .github/agent-finalize.trigger \
            .github/workflows/agent-source-export.yml \
            .github/workflows/agent-git-export.yml \
            .github/workflows/agent-finalize-audit-hardening.yml \
            docs/.agent-export-placeholder \
            docs/.agent-git-trigger \
            docs/.agent-pr-placeholder

          git config user.name "airtrustsystem-alt"
          git config user.email "253767712+airtrustsystem-alt@users.noreply.github.com"
          git add -A
          git add -f worker-airtrust/src/lib/lms/security-headers.ts
          git diff --cached --check
          git commit -m "security(ops): harden critical audit findings"
          git push origin HEAD:agent/audit-critical-high-hardening-20260731
