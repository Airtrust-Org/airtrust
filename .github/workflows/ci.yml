name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repair-tenant-fixture:
    if: github.head_ref == 'fix/audit-tenant-schema-guard-20260801'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/audit-tenant-schema-guard-20260801
      - name: Commit exact fixture repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('worker-airtrust/src/__tests__/routes/qualificacoes-historico-rbac-sqlite.test.ts')
          source = path.read_text()
          old = "    mockEnv = {\n      DB: {"
          new = "    mockEnv = {\n      ENVIRONMENT: 'test',\n      DB: {"
          if old not in source:
              raise SystemExit('fixture already repaired or marker missing')
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-airtrust/src/__tests__/routes/qualificacoes-historico-rbac-sqlite.test.ts
          git commit -m "test(security): declare local tenant fixture environment"
          git push origin HEAD:fix/audit-tenant-schema-guard-20260801
