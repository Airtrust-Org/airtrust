# Required fast CI gates. The AirTrust release gate is hybrid:
# GitHub Actions owns the three fast gates below, while Google Cloud Build owns
# the five heavy gates declared in cloudbuild.ci.yaml.
name: CI (fast gates)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  build-content-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - name: internal docs check (self-test)
        run: chmod +x ./scripts/ci-demo-data-check.sh ./scripts/ci-internal-docs-check.sh ./scripts/production-audit-check.sh && ./scripts/ci-internal-docs-check.sh --test
      - name: internal docs check
        run: ./scripts/ci-internal-docs-check.sh
      - name: build
        run: VITE_API_URL=http://127.0.0.1:8787 npm run build
      - name: check:demo-data
        run: npm run check:demo-data

  worker-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            worker-airtrust/package-lock.json
      - run: npm ci
      - run: npm --prefix worker-airtrust ci
      - run: npm --prefix worker-airtrust exec tsc -- --noEmit
