name: Temporary Format PR 601

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/audit-tenant-schema-guard-20260801' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Format exact files
        run: |
          npx --yes prettier@3.9.6 --write -- \
            worker-airtrust/src/__tests__/routes/qualificacoes-historico-rbac-sqlite.test.ts \
            worker-airtrust/src/middleware/tenant.ts

      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            worker-airtrust/src/__tests__/routes/qualificacoes-historico-rbac-sqlite.test.ts \
            worker-airtrust/src/middleware/tenant.ts
          if git diff --cached --quiet; then
            echo "FORMAT_ALREADY_CANONICAL"
            exit 0
          fi
          git commit -m "style(security): apply exact Prettier output"
          git push origin HEAD:${{ github.head_ref }}
