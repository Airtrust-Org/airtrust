name: Production FRMS Check-in Obligation Readonly Validation

# SOMENTE LEITURA. Roda o código real da regra canônica de obrigação de check-in (#2356)
# sobre o D1 de produção por um adaptador que só aceita SELECT/WITH e confronta cada
# tripulante-dia com um oráculo independente (scripts/production/lib/frms-checkin-obligation-validation.mjs).
# Sem escrita, sem migration, sem deploy, sem navegador. O D1 de produção é fixado por id e os de
# staging/dev são bloqueados. A saída tem só contagens de tripulante-dia e referências sha256
# truncadas: nunca nomes, matrículas, e-mails, documentos ou tokens.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_FRMS_CHECKIN_OBLIGATION_READONLY to continue'
        required: true
        type: string
      expected_sha:
        description: 'Exact current main SHA reviewed for this read-only validation'
        required: true
        type: string
      deployed_worker_sha:
        description: 'Exact Worker SHA currently served by production (/api/version sourceSha)'
        required: true
        type: string
      window_from:
        description: 'First operational date (YYYY-MM-DD)'
        required: true
        type: string
      window_to:
        description: 'Last operational date (YYYY-MM-DD, at most 35 days after window_from)'
        required: true
        type: string

concurrency:
  group: frms-production-checkin-obligation-readonly
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PRODUCTION_D1_ID: 7c8a788e-a4c4-4d5d-8208-ff7ff55e84ae
  WORKER_VERSION_ENDPOINT: https://api.airtrust.online/api/version

jobs:
  validate:
    name: Real rule vs independent oracle (production D1, read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    steps:
      - name: Validate immutable dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEPLOYED_SHA: ${{ inputs.deployed_worker_sha }}
          WINDOW_FROM: ${{ inputs.window_from }}
          WINDOW_TO: ${{ inputs.window_to }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == 'refs/heads/main' ]] || { echo 'MAIN_REF_REQUIRED' >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_FRMS_CHECKIN_OBLIGATION_READONLY' ]] || { echo 'CONFIRMATION_REQUIRED' >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'EXPECTED_SHA_INVALID' >&2; exit 1; }
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'DEPLOYED_SHA_INVALID' >&2; exit 1; }
          [[ "$EXPECTED_SHA" == "$EVENT_SHA" ]] || { echo 'EXPECTED_SHA_MISMATCH' >&2; exit 1; }
          [[ "$WINDOW_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$WINDOW_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'WINDOW_INVALID' >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require production D1 read credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'PRODUCTION_D1_READ_TOKEN_MISSING' >&2; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING' >&2; exit 1; }

      - name: Install root dependencies (esbuild only is used)
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove the analysed code is exactly the deployed code
        id: provenance
        shell: bash
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_worker_sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          live="$(curl -fsS --max-time 15 "$WORKER_VERSION_ENDPOINT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(String(j?.data?.sourceSha||""))})')"
          [[ "$live" == "$DEPLOYED_SHA" ]] || { echo "LIVE_WORKER_SHA_MISMATCH" >&2; exit 1; }
          git merge-base --is-ancestor "$DEPLOYED_SHA" "$EXPECTED_SHA" || { echo 'DEPLOYED_NOT_ANCESTOR_OF_MAIN' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/obligation"
          npx esbuild worker-airtrust/src/lib/frms/checkin-obligation.ts --bundle --platform=node --format=esm \
            --outfile="$RUNNER_TEMP/obligation/bundle.mjs" --metafile="$RUNNER_TEMP/obligation/meta.json" --log-level=warning
          mapfile -t inputs < <(node -e 'const m=require(process.argv[1]);for(const f of Object.keys(m.inputs)){if(f.includes("node_modules"))process.exit(3);console.log(f)}' "$RUNNER_TEMP/obligation/meta.json")
          [[ "${#inputs[@]}" -gt 0 ]] || { echo 'BUNDLE_INPUTS_EMPTY' >&2; exit 1; }
          if ! git diff --quiet "$DEPLOYED_SHA" "$EXPECTED_SHA" -- "${inputs[@]}"; then
            echo 'ANALYSED_CODE_DIFFERS_FROM_DEPLOYED' >&2
            git diff --stat "$DEPLOYED_SHA" "$EXPECTED_SHA" -- "${inputs[@]}" >&2
            exit 1
          fi
          echo "bundle_inputs=${#inputs[@]}" >> "$GITHUB_OUTPUT"
          echo 'FRMS_CHECKIN_VALIDATION_PROVENANCE_PASS'

      - name: Run read-only validation against production D1
        id: validation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_D1_ID: ${{ env.PRODUCTION_D1_ID }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEPLOYED_WORKER_SHA: ${{ inputs.deployed_worker_sha }}
          CONFIRM_READONLY: AIRTRUST_FRMS_CHECKIN_OBLIGATION_READONLY
          WINDOW_FROM: ${{ inputs.window_from }}
          WINDOW_TO: ${{ inputs.window_to }}
          OBLIGATION_BUNDLE: ${{ runner.temp }}/obligation/bundle.mjs
          AUDIT_REPORT_PATH: ${{ runner.temp }}/frms-checkin-obligation-validation.json
        run: |
          set +e
          node scripts/production/frms-checkin-obligation-readonly.mjs
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          test -s "$RUNNER_TEMP/frms-checkin-obligation-validation.json"

      - name: Publish sanitized summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/frms-checkin-obligation-validation.json"
          [[ -s "$report" ]] || { echo 'No validation report produced.' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/frms-checkin-obligation-validation.json", "utf8"));
            const p = (k, v) => console.log(`- ${k}: \`${typeof v === "object" ? JSON.stringify(v) : v}\``);
            console.log("## FRMS check-in obligation, production read-only validation");
            console.log("");
            p("window", `${r.window.from}..${r.window.to}`);
            p("days / crew in scope / crew-days", `${r.days} / ${r.crew_in_scope} / ${r.totals.crew_days}`);
            p("obligation status (crew-days)", r.totals.status);
            p("obligation base (crew-days)", r.totals.base);
            p("divergences (crew-days)", r.totals.divergences);
            p("broken-fortnight gap crew-days", r.totals.gap_crew_days);
            p("scheduled absence crew-days by type (allocation or manual event)", r.totals.absence_crew_days);
            p("crew-days with an unambiguous operational allocation", r.totals.allocation_expected_pending);
            p("old rule: pending without check-in", r.totals.legacy_pending_no_checkin);
            p("old-rule pending that are NOT pending now, by status", r.totals.legacy_not_pending_now);
            p("base-fortnight-only crew-days: total / distinct crew", `${r.base_only.crew_days} / ${r.base_only.distinct_crew}`);
            p("base-fortnight-only by per-person FRMS cycle", r.base_only.cycle);
            p("base-fortnight-only by FRMS journey status that day", r.base_only.jornada_status);
            p("base-fortnight-only by nearby allocations", r.base_only.allocation_context);
            p("invariant violations", r.violation_count);
            p("violations by code", r.invariants);
            p("advisories (Controle de Voos flight on a day without obligation)", r.advisories);
            p("violation samples (sha256 refs)", r.samples);
            p("queries / writes", `${r.queries} / ${r.writes}`);
            p("reviewed main sha", r.reviewedSourceSha);
            p("deployed worker sha", r.deployedWorkerSha);
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frms-checkin-obligation-validation-${{ github.sha }}
          path: ${{ runner.temp }}/frms-checkin-obligation-validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail when any invariant is violated
        if: ${{ steps.validation.outputs.exit_code != '0' }}
        shell: bash
        env:
          CODE: ${{ steps.validation.outputs.exit_code }}
        run: |
          echo "Validation exit code ${CODE}: see the sanitized summary." >&2
          exit 1
