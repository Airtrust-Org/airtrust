name: Temporary Format eDB Shadow Assessment

on:
  push:
    branches:
      - feat/edb-shadow-divergence-technical-ui-20260802

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edb-shadow-divergence-technical-ui-20260802
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci

      - name: Format focused files
        run: >-
          npx prettier --write
          src/react-app/pages/controle-voos/EdbShadowPrototypeWithAssessment.tsx
          worker-airtrust/src/services/edb/control-flight-shadow-assessment.ts

      - name: Commit formatted files
        run: |
          rm .github/workflows/zz-format-edb-shadow-assessment-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react-app/pages/controle-voos/EdbShadowPrototypeWithAssessment.tsx
          git add worker-airtrust/src/services/edb/control-flight-shadow-assessment.ts
          git add .github/workflows/zz-format-edb-shadow-assessment-temp.yml
          git commit -m "style(edb): format preliminary shadow assessment"
          git push origin HEAD:feat/edb-shadow-divergence-technical-ui-20260802
