name: Production LMS99 Embedded CMI Evidence Readonly
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        required: true
        type: string
      expected_production_sha:
        required: true
        type: string
      confirmation:
        required: true
        type: string
permissions:
  contents: read
  checks: read
  statuses: read
concurrency:
  group: production-lms99-embedded-cmi-readonly
  cancel-in-progress: false
jobs:
  inspect:
    name: Detect CMI recovery leads without learner data
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enforce pinned main and eight gates
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CONFIRMATION" == 'AIRTRUST_LMS99_EMBEDDED_CMI_READONLY' ]]
          node scripts/ci/verify-release-gates.mjs
          node --test scripts/__tests__/lms99-embedded-cmi-readonly.test.mjs
      - name: Install D1 SELECT-only client
        run: npm --prefix worker-airtrust ci --ignore-scripts
      - name: Aggregate historical CMI signals
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production/lms99-embedded-cmi-readonly.mjs > "$RUNNER_TEMP/lms99-embedded-cmi.json"
          jq -e '.schema_version==1 and .tenant==6 and .mode=="read-only" and .writes==0 and .personal_data==false' "$RUNNER_TEMP/lms99-embedded-cmi.json" >/dev/null
          jq '{source_sha,production_sha,totals,by_course,writes}' "$RUNNER_TEMP/lms99-embedded-cmi.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized summary
        uses: actions/upload-artifact@v7
        with:
          name: production-lms99-embedded-cmi-${{ github.sha }}
          path: ${{ runner.temp }}/lms99-embedded-cmi.json
          retention-days: 14
          if-no-files-found: error
