name: Production LMS FDM13 Reassignment Preflight Readonly

# Read-only production FDM course 13 reassignment preflight for Costa do Sol (empresa_id=6).
# No LMS/D1/R2 writes. The only POSTs are authentication/session tenant selection.
# Output is aggregate cohorts and readiness; no employee identities, enrollment payloads,
# SCORM CMI, certificate data, emails, tokens, R2 keys or other PII/secrets.

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_PRODUCTION_LMS_FDM13_REASSIGNMENT_PREFLIGHT_READONLY to continue'
        required: true
        type: string
      expected_production_sha:
        description: 'Exact Worker SHA currently deployed to production'
        required: true
        type: string

concurrency:
  group: production-lms-fdm13-reassignment-preflight-readonly
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

env:
  NODE_VERSION: '24'
  PROD_API_BASE_URL: https://api.airtrust.online
  TARGET_COMPANY_ID: '6'

jobs:
  guard:
    name: Production LMS FDM13 reassignment guard
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, 'AIRTRUST_PRODUCTION_LMS_FDM13_REASSIGNMENT_PREFLIGHT_READONLY '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      expected_sha: ${{ steps.request.outputs.expected_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve governed read-only request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          GITHUB_ACTOR: ${{ github.actor }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_production_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'issue_comment' ]]; then
            [[ "$COMMENT_ACTOR" == "$GITHUB_ACTOR" && -n "$COMMENT_ACTOR" ]] || { echo COMMENT_ACTOR_MISMATCH >&2; exit 1; }
            [[ "$COMMENT_BODY" != *$'\n'* && "$COMMENT_BODY" != *$'\r'* ]] || { echo COMMENT_COMMAND_MUST_BE_SINGLE_LINE >&2; exit 1; }
            if [[ "$COMMENT_BODY" =~ ^AIRTRUST_PRODUCTION_LMS_FDM13_REASSIGNMENT_PREFLIGHT_READONLY\ ([0-9a-f]{40})$ ]]; then
              expected_sha="${BASH_REMATCH[1]}"
            else
              echo COMMENT_COMMAND_INVALID >&2
              exit 1
            fi
            [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo COMMENT_PR_NUMBER_INVALID >&2; exit 1; }
            echo "pr_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          else
            [[ "$INPUT_CONFIRMATION" == 'AIRTRUST_PRODUCTION_LMS_FDM13_REASSIGNMENT_PREFLIGHT_READONLY' ]] || { echo CONFIRMATION_REJECTED >&2; exit 1; }
            expected_sha="${INPUT_EXPECTED_SHA,,}"
          fi
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo EXPECTED_SHA_INVALID >&2; exit 1; }
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Validate PR actor for comment requests
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
        run: |
          set -euo pipefail
          export GITHUB_TOKEN GITHUB_REPOSITORY GITHUB_ACTOR PR_NUMBER
          node <<'NODE'
          (async () => {
            const headers = {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
            };
            const get = async (path) => {
              const response = await fetch(`https://api.github.com${path}`, { headers });
              if (!response.ok) throw new Error(`${path}:HTTP_${response.status}`);
              return response.json();
            };
            const repo = process.env.GITHUB_REPOSITORY;
            const pr = await get(`/repos/${repo}/pulls/${process.env.PR_NUMBER}`);
            if (pr.base?.ref !== 'main') throw new Error('PR_BASE_NOT_MAIN');
            if (pr.head?.repo?.full_name !== repo || pr.head?.repo?.fork) throw new Error('PR_FROM_FORK_REJECTED');
            const permission = await get(`/repos/${repo}/collaborators/${process.env.GITHUB_ACTOR}/permission`);
            if (!['write', 'push', 'maintain', 'admin'].includes(permission.permission)) {
              throw new Error('ACTOR_PERMISSION_INSUFFICIENT');
            }
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Require reviewed deployed SHA and canonical gates
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
          RELEASE_SHA: ${{ steps.request.outputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo MAIN_ONLY >&2; exit 1; }
          git cat-file -e "$EXPECTED_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_SHA" HEAD
          node scripts/ci/verify-release-gates.mjs
          EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module <<'NODE'
          const expected = String(process.env.EXPECTED_SHA || '').toLowerCase();
          const response = await fetch('https://api.airtrust.online/api/version', {
            headers: { Accept: 'application/json', 'User-Agent': 'airtrust-lms-catalog-readonly/1' },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`PRODUCTION_VERSION_HTTP_${response.status}`);
          const json = await response.json();
          const body = json?.data && typeof json.data === 'object' ? json.data : json;
          const live = String(body?.sourceSha ?? body?.source_sha ?? '').toLowerCase();
          if (live !== expected) throw new Error(`PRODUCTION_SHA_MISMATCH:${live || 'missing'}`);
          console.log(`PRODUCTION_LMS_INVENTORY_PROVENANCE=PASS:${expected}`);
          NODE

  inventory:
    name: Production LMS FDM13 reassignment preflight read-only
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      EXPECTED_PRODUCTION_SHA: ${{ needs.guard.outputs.expected_sha }}
      PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
      PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require production smoke credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PROD_SMOKE_EMAIL" && -n "$PROD_SMOKE_PASSWORD" ]] || { echo PRODUCTION_SMOKE_CREDENTIALS_MISSING >&2; exit 1; }
          [[ "$PROD_SMOKE_EMAIL" != *'staging.airtrust.invalid'* ]] || { echo STAGING_IDENTITY_REJECTED >&2; exit 1; }

      - name: Run tenant-scoped API inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production/lms-fdm13-reassignment-preflight-readonly.mjs > "$RUNNER_TEMP/lms-fdm13-reassignment-preflight.json"
          test -s "$RUNNER_TEMP/lms-fdm13-reassignment-preflight.json"

      - name: Publish sanitized FDM13 readiness
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/lms-fdm13-reassignment-preflight.json', 'utf8'));
          console.log('## FDM13 reassignment preflight (read-only, no PII)');
          console.log('Deployed SHA: ' + r.production_sha);
          console.log('Source course: 13, active visible enrollments: ' + r.source_total);
          console.log('Completed: ' + r.source_completed + ', unfinished at raw >=99%: ' + r.unfinished_99_or_more);
          for (const [group, count] of Object.entries(r.groups)) console.log(group + ': ' + count);
          for (const [reason, count] of Object.entries(r.needs_review)) console.log('Requires review (' + reason + '): ' + count);
          for (const [target, state] of Object.entries(r.targets)) console.log('Destination (' + target + '): ready=' + state.ready + ', candidate_count=' + state.candidate_count);
          console.log('Blocker: ' + (r.blocker || 'none'));
          console.log('Writes: none');
          NODE

      - name: Upload sanitized completion outcome evidence
        uses: actions/upload-artifact@v7
        with:
          name: production-lms-fdm13-reassignment-preflight-readonly-${{ needs.guard.outputs.expected_sha }}
          path: ${{ runner.temp }}/lms-fdm13-reassignment-preflight.json
          if-no-files-found: error
          retention-days: 30
