name: Staging FRMS 0464 Bootstrap Repair

# Dedicated staging-only repair for the incomplete data bootstrap of migration
# 0464. The preflight mode is strictly read-only. Apply mode is separately
# confirmation-gated and may only insert missing LIMITES_DEFAULT keys into the
# fixed LEGACY_GENERAL revision; it never replays migration 0464 or touches its
# ledger row.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Exact confirmation token for the selected mode'
        required: true
        type: string
      mode:
        description: 'Run read-only preflight or the separately-authorized repair'
        required: true
        type: choice
        options:
          - preflight
          - apply
      expected_deployed_sha:
        description: 'Exact 40-hex SHA currently deployed to the staging Worker'
        required: true
        type: string

concurrency:
  group: staging-frms-0464-bootstrap-repair
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  ALLOWED_STAGING_DB_NAME: airtrust-db-staging-baseline-20260701
  ALLOWED_STAGING_DB_ID: bf9963f4-eb12-439b-a830-20bbf577ac22
  BLOCKED_PRODUCTION_DB_ID: 7c8a788e-a4c4-4d5d-8208-ff7ff55e84ae

jobs:
  guard:
    name: FRMS 0464 bootstrap repair guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate main-only staging dispatch and mode confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == 'refs/heads/main' ]] || { echo 'MAIN_ONLY' >&2; exit 1; }
          [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'EXPECTED_DEPLOYED_SHA_INVALID' >&2; exit 1; }

          case "$MODE" in
            preflight)
              [[ "$CONFIRMATION" == 'AIRTRUST_STAGING_FRMS_0464_BOOTSTRAP_PREFLIGHT' ]] || {
                echo 'PREFLIGHT_CONFIRMATION_REJECTED' >&2
                exit 1
              }
              ;;
            apply)
              [[ "$CONFIRMATION" == 'AIRTRUST_STAGING_FRMS_0464_BOOTSTRAP_APPLY' ]] || {
                echo 'APPLY_CONFIRMATION_REJECTED' >&2
                exit 1
              }
              ;;
            *)
              echo 'MODE_REJECTED' >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require staging Worker to serve expected deployed SHA
        shell: bash
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expected = String(process.env.EXPECTED_DEPLOYED_SHA || '').toLowerCase();
          const response = await fetch(`${process.env.STAGING_API_BASE_URL}/api/version`, {
            headers: { Accept: 'application/json' },
          });
          if (!response.ok) throw new Error(`STAGING_VERSION_HTTP_${response.status}`);
          const payload = await response.json();
          const sourceSha = String(payload?.sourceSha ?? payload?.data?.sourceSha ?? '').toLowerCase();
          const environment = String(payload?.environment ?? payload?.data?.environment ?? '');
          if (sourceSha !== expected) throw new Error(`STAGING_WORKER_SHA_MISMATCH:${sourceSha || 'missing'}`);
          if (environment !== 'staging') throw new Error(`STAGING_ENV_MISMATCH:${environment || 'missing'}`);
          console.log(`STAGING_PROVENANCE_OK sourceSha=${sourceSha} environment=staging`);
          NODE

  repair:
    name: FRMS 0464 bootstrap preflight/apply
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Run governed staging bootstrap operation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_NAME: ${{ env.ALLOWED_STAGING_DB_NAME }}
          STAGING_D1_ID: ${{ env.ALLOWED_STAGING_DB_ID }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'STAGING_D1_TOKEN_MISSING' >&2; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING' >&2; exit 1; }

          node scripts/staging/frms-0464-bootstrap-repair.mjs --mode="$MODE" |
            tee "$RUNNER_TEMP/frms-0464-bootstrap-report.json"

      - name: Record sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/frms-0464-bootstrap-report.json"
          if [[ ! -s "$report" ]]; then
            echo 'No machine-readable report was produced.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/frms-0464-bootstrap-report.json', 'utf8');
          const start = raw.indexOf('{');
          const end = raw.lastIndexOf('}');
          if (start < 0 || end < start) {
            console.log('No parseable JSON report was produced.');
            process.exit(0);
          }
          const r = JSON.parse(raw.slice(start, end + 1));
          console.log('## FRMS 0464 bootstrap repair');
          console.log('');
          console.log(`- mode: ${r.mode}`);
          console.log(`- deployed staging SHA: ${r.deployedStagingSha}`);
          console.log(`- legacy source required: ${r.legacySource.requiredCount}`);
          console.log(`- legacy source present: ${r.legacySource.presentCount}`);
          console.log(`- legacy source missing: ${r.legacySource.missingKeys.length}`);
          console.log(`- legacy source duplicates: ${r.legacySource.duplicateKeys.length}`);
          console.log(`- legacy source invalid values: ${r.legacySource.invalidValueKeys.length}`);
          console.log(`- legacy source invalid units: ${r.legacySource.invalidUnitKeys.length}`);
          console.log(`- canonical snapshot ready: ${r.canonicalSource.ready ? 'YES' : 'NO'}`);
          console.log(`- canonical snapshot matched: ${r.canonicalSource.matchedCount}/${r.canonicalSource.requiredCount}`);
          console.log(`- source mode: ${r.sourceDecision.mode || 'NONE'}`);
          console.log(`- target active revision count: ${r.targetBefore.revisionCount}`);
          console.log(`- target total parameters: ${r.targetBefore.totalParameterCount}`);
          console.log(`- target required present: ${r.targetBefore.requiredPresentCount}`);
          console.log(`- target required missing: ${r.targetBefore.requiredMissingCount}`);
          console.log(`- apply ready: ${r.preparedApply.applyReady ? 'YES' : 'NO'}`);
          console.log(`- apply executed: ${r.applyExecuted ? 'YES' : 'NO'}`);
          if (r.targetAfter) {
            console.log(`- postcondition required present: ${r.targetAfter.requiredPresentCount}`);
            console.log(`- postcondition required missing: ${r.targetAfter.requiredMissingCount}`);
          }
          NODE

      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-frms-0464-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/frms-0464-bootstrap-report.json
          if-no-files-found: ignore
          retention-days: 7
