name: Production LMS Course9 Formative Direct Replacement

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [preflight, apply]
        default: preflight
      expected_main_sha:
        required: true
        type: string
      expected_worker_sha:
        required: true
        type: string
      expected_active_zip_sha:
        required: true
        type: string
      incoming_zip_sha:
        required: true
        type: string
      confirmation:
        required: true
        type: string

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: production-lms-course9-formative-direct-replacement
  cancel-in-progress: false

jobs:
  governed:
    name: Validate exact edition and replace via Worker admin API
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      EXPECTED_WORKER_SHA: ${{ inputs.expected_worker_sha }}
      PREVIOUS_ZIP_SHA: ${{ inputs.expected_active_zip_sha }}
      ZIP_SHA: ${{ inputs.incoming_zip_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      REPLACEMENT_MODE: ${{ inputs.mode }}
      PRIVATE_ZIP_FILE: /tmp/airtrust-course9-private-r32.zip
      PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
      PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify pinned main, exact scope, and user confirmation
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" && "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRMATION" == AIRTRUST_TENANT6_COURSE9_R32_DIRECT ]]
          [[ "$EXPECTED_WORKER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ZIP_SHA" =~ ^[0-9a-f]{64}$ && "$PREVIOUS_ZIP_SHA" =~ ^[0-9a-f]{64}$ ]]
          node --check scripts/production/lms-terrenos-r32-direct-release.mjs
      - name: Require eight canonical gates for protected main SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-release-gates.mjs
      - name: Read-only preflight of production Worker, tenant and active edition
        env:
          REPLACEMENT_MODE: preflight
        run: node scripts/production/lms-terrenos-r32-direct-release.mjs
      - name: Verify D1 Time Travel recovery before administrative edition mutation
        if: inputs.mode == 'apply'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]
          npm --prefix worker-airtrust ci --ignore-scripts >/dev/null
          cd worker-airtrust
          npx wrangler d1 time-travel info airtrust-db --env production --timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$RUNNER_TEMP/d1-recovery-check.txt"
          test -s "$RUNNER_TEMP/d1-recovery-check.txt"
          rm -f "$RUNNER_TEMP/d1-recovery-check.txt"
      - name: Fetch private R32 from isolated R2 handoff
        if: inputs.mode == 'apply'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]
          npm --prefix worker-airtrust ci --ignore-scripts >/dev/null
          cd worker-airtrust
          npx wrangler r2 object get 'airtrust-storage/__internal__/course9-formative-r32-77106beb-20261113.zip' --remote --file "$PRIVATE_ZIP_FILE"
          echo "$ZIP_SHA  $PRIVATE_ZIP_FILE" | sha256sum --check --status
      - name: Apply exact SHA via administrator-only Worker Quality Gate
        if: inputs.mode == 'apply'
        env:
          REPLACEMENT_MODE: apply
        run: node scripts/production/lms-terrenos-r32-direct-release.mjs
      - name: Remove private ZIP from runner
        if: always()
        shell: bash
        run: rm -f "$PRIVATE_ZIP_FILE"
