name: FRMS readiness test integration patch

on:
  push:
    branches:
      - feat/frms-operational-readiness-pvt-20260827
    paths:
      - .github/workflows/frms-readiness-test-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frms-operational-readiness-pvt-20260827
          fetch-depth: 0
      - name: Patch check-in readiness tests
        run: python3 .github/scripts/frms_readiness_test_patch.py
      - name: Commit patch
        run: |
          git config user.name "airtrust-readiness-integrator"
          git config user.email "actions@users.noreply.github.com"
          git add src/react-app/pages/frms/__tests__/FrmsCheckinFadiga.test.tsx
          git commit -m "test(frms): integrate readiness with daily check-in suite"
          git push origin HEAD:feat/frms-operational-readiness-pvt-20260827
