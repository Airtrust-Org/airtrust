name: Temporary Format PR 740 Test

on:
  push:
    branches:
      - fix/a11y-performance-backlog-566-20260802

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a11y-performance-backlog-566-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format test and remove finalizer
        run: |
          npx prettier@3.9.6 --write src/react-app/pages/simuladores/tabs/__tests__/tabSessoesDerived.test.ts
          git rm .github/workflows/tmp-format-pr-740-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/react-app/pages/simuladores/tabs/__tests__/tabSessoesDerived.test.ts
          git commit -m "style(simuladores): format same-day ordering test"
          git push origin HEAD:fix/a11y-performance-backlog-566-20260802
