name: Production Platform Access Schema Readonly Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_worker_sha:
        description: Exact Worker SHA deployed to production
        required: true
        type: string
      confirmation:
        description: Type AIRTRUST_PRODUCTION_PLATFORM_ACCESS_READONLY
        required: true
        type: string

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: production-platform-access-schema-readonly
  cancel-in-progress: false

jobs:
  guard:
    name: Platform Access Production Readonly Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Guard source, CI, production provenance and exact target
        shell: bash
        env:
          EXPECTED_WORKER_SHA: ${{ inputs.expected_worker_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo MAIN_ONLY >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_PRODUCTION_PLATFORM_ACCESS_READONLY' ]] || { echo CONFIRMATION_REJECTED >&2; exit 1; }
          [[ "$EXPECTED_WORKER_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo EXPECTED_WORKER_SHA_INVALID >&2; exit 1; }
          git cat-file -e "$EXPECTED_WORKER_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_WORKER_SHA" HEAD
          RELEASE_SHA="$GITHUB_SHA" node scripts/ci/verify-release-gates.mjs
          RELEASE_SHA="$EXPECTED_WORKER_SHA" node scripts/ci/verify-release-gates.mjs
          EXPECTED_WORKER_SHA="$EXPECTED_WORKER_SHA" node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_WORKER_SHA.toLowerCase();
          const response = await fetch('https://api.airtrust.online/api/version', {
            headers: { Accept: 'application/json', 'User-Agent': 'airtrust-platform-schema-readonly/1' },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error('PRODUCTION_VERSION_HTTP_FAILED');
          const j = await response.json();
          const body = j?.data && typeof j.data === 'object' ? j.data : j;
          if (String(body?.sourceSha ?? body?.source_sha ?? '').toLowerCase() !== expected) {
            throw new Error('PRODUCTION_WORKER_SHA_MISMATCH');
          }
          console.log('PRODUCTION_PLATFORM_ACCESS_PROVENANCE=PASS');
          NODE

  inspect:
    name: Inspect Production D1 Platform Access SQL (read-only)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix worker-airtrust ci --ignore-scripts --no-audit --no-fund
      - name: Execute fixed SELECT/PRAGMA probes with sanitized result only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production/platform-access-schema-readonly.mjs
