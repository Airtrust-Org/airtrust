name: Deploy AirTrust

on:
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: 'Deploy production Worker'
        required: true
        type: boolean
        default: false
      deploy_pages:
        description: 'Deploy production Pages'
        required: true
        type: boolean
        default: false
      run_migrations:
        description: 'Legacy input retained only to hard-block historical production migrations'
        required: true
        type: boolean
        default: false
      expected_sha:
        description: 'Optional commit SHA expected for this release'
        required: false
        type: string
      reason:
        description: 'Why this production deploy is needed'
        required: true
        type: string
      confirm_production:
        description: 'Type AIRTRUST_PRODUCTION to continue'
        required: true
        type: string
      migration_confirmation:
        description: 'Legacy input ignored because historical production migrations are disabled'
        required: false
        type: string

concurrency:
  group: deploy-airtrust-production
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PRODUCTION_CONFIRMATION: AIRTRUST_PRODUCTION
  PAGES_PROJECT_NAME: airtrust
  PAGES_BRANCH: production
  WORKER_VERSION_ENDPOINT: https://api.airtrust.online/api/version
  WORKER_HEALTH_ENDPOINT: https://api.airtrust.online/api/health
  LMS_PROTECTED_ENDPOINT: https://api.airtrust.online/api/lms/cursos
  PAGES_LOGIN_URL: https://airtrust.online/login
  PAGES_SW_URL: https://airtrust.online/sw.js

jobs:
  guard:
    name: Release Guard
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      build_time: ${{ steps.version.outputs.build_time }}
      release_utc: ${{ steps.version.outputs.build_time }}
    steps:
      - name: Validate production dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          reason="${{ inputs.reason }}"

          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Deploy AirTrust only runs from refs/heads/main. Current ref: ${{ github.ref }}" >&2
            exit 1
          fi

          if [[ "${{ inputs.deploy_worker }}" != "true" && "${{ inputs.deploy_pages }}" != "true" ]]; then
            echo "Select at least one target: deploy_worker=true or deploy_pages=true." >&2
            exit 1
          fi

          if [[ "${{ inputs.confirm_production }}" != "${PRODUCTION_CONFIRMATION}" ]]; then
            echo "confirm_production must be ${PRODUCTION_CONFIRMATION}." >&2
            exit 1
          fi

          if [[ -z "${{ inputs.reason }}" ]]; then
            echo "reason is required." >&2
            exit 1
          fi

          if [[ -n "${{ inputs.expected_sha }}" && "${{ inputs.expected_sha }}" != "${{ github.sha }}" ]]; then
            echo "expected_sha does not match github.sha." >&2
            echo "expected_sha: ${{ inputs.expected_sha }}" >&2
            echo "github.sha:   ${{ github.sha }}" >&2
            exit 1
          fi

          if [[ "${{ inputs.run_migrations }}" == "true" && "${{ inputs.deploy_worker }}" != "true" ]]; then
            echo "run_migrations=true requires deploy_worker=true." >&2
            exit 1
          fi

          if [[ "${{ inputs.run_migrations }}" == "true" ]]; then
            echo "LEGACY_MIGRATION_RUNNER_DISABLED_USE_SCHEMA_V2" >&2
            exit 1
          fi

      - name: Compute release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          build_time="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          app_version="${build_time}-${GITHUB_SHA::7}"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare Release Artifacts
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: npm --prefix worker-airtrust ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.guard.outputs.app_version }}
          APP_VERSION: ${{ needs.guard.outputs.app_version }}
          APP_BUILD_TIME: ${{ needs.guard.outputs.build_time }}

      - name: Stamp build version
        run: bash scripts/stamp-build-version.sh dist/client/index.html
        env:
          APP_VERSION: ${{ needs.guard.outputs.app_version }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airtrust-release-dist
          path: dist/client
          retention-days: 1

  deploy-worker:
    name: Deploy Worker
    needs: [guard, prepare]
    if: ${{ inputs.deploy_worker }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      worker_version_id: ${{ steps.deploy.outputs.worker_version_id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: npm --prefix worker-airtrust ci

      - name: Prepare worker config
        shell: bash
        # Section-aware stamp of the [env.production.vars] APP_VERSION/APP_BUILD_TIME.
        # The previous inline node used a first-match /m regex over the whole
        # wrangler.toml, which stamped the *staging* APP_VERSION line (it appears
        # before production) and left production as "managed-by-script" ->
        # "unversioned-remote" at runtime. patch-wrangler-env-vars.mjs is
        # section-scoped and unit-tested (scripts/__tests__/patch-wrangler-env-vars.test.mjs),
        # the same helper the staging deploy uses.
        run: |
          set -euo pipefail
          node scripts/lib/patch-wrangler-env-vars.mjs \
            worker-airtrust/wrangler.toml \
            worker-airtrust/wrangler.production.toml \
            production \
            "${{ needs.guard.outputs.app_version }}" \
            "${{ needs.guard.outputs.build_time }}"

      - name: Compute and stamp bundle/manifest provenance
        id: provenance
        shell: bash
        working-directory: worker-airtrust
        # Provenance parity with staging: stamps the source SHA/tree, the Worker
        # bundle SHA-256, and the release manifest SHA-256 into
        # [env.production.vars] so /api/health and /api/version can surface them
        # and the hardened post-deploy smoke can require them. Without this the
        # provenance chain stays "managed-by-script" (== null at runtime) and the
        # hardened smoke would (correctly) refuse to certify the deploy.
        #
        # The pre-deploy release manifest is finalized HERE (workerVersionId=null)
        # and uploaded before the real deploy so evidence survives a later
        # deploy/smoke failure.
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Unique, never-reused output dir — a fixed/reusable bundle path is
          # exactly what let a stale tracked bundle answer requests in the
          # 2026-07-18 incident. Always created fresh and removed by the trap.
          bundle_dir="$(mktemp -d ./.tmp-worker-bundle-XXXXXX)"
          trap 'rm -rf "$bundle_dir"' EXIT

          npx --no-install wrangler deploy --env production --config wrangler.production.toml --dry-run --outdir "$bundle_dir"

          bundle_file="$(find "$bundle_dir" -maxdepth 1 -name '*.js' | sort | head -n1)"
          if [[ -z "$bundle_file" ]]; then
            echo "No bundled Worker module found in $bundle_dir" >&2
            exit 1
          fi
          bundle_sha256="$(shasum -a 256 "$bundle_file" | awk '{print $1}')"
          source_sha="$SOURCE_SHA"
          # Tree SHA is a distinct git object from the commit SHA. Never substitute
          # github.sha here — that historical bug made sourceTree == sourceSha.
          source_tree="$(git -C .. rev-parse 'HEAD^{tree}')"
          if [[ "$source_tree" == "$source_sha" ]]; then
            echo "source_tree unexpectedly equals source_sha; refusing ambiguous provenance" >&2
            exit 1
          fi

          # First pass: stamp source SHA/tree + bundle hash. Config hash is
          # computed over the result of this pass, then stamped in a second,
          # minimal pass — the manifest never has to include its own hash.
          node ../scripts/lib/patch-wrangler-env-vars.mjs \
            wrangler.production.toml wrangler.production.toml production \
            "${{ needs.guard.outputs.app_version }}" "${{ needs.guard.outputs.build_time }}" \
            "$(node -e 'console.log(JSON.stringify({AIRTRUST_SOURCE_SHA: process.argv[1], AIRTRUST_SOURCE_TREE: process.argv[2], AIRTRUST_WORKER_BUNDLE_SHA256: process.argv[3]}))' "$source_sha" "$source_tree" "$bundle_sha256")"

          config_pre_manifest_sha256="$(shasum -a 256 wrangler.production.toml | awk '{print $1}')"

          manifest_file="../airtrust-production-release-manifest.json"
          trap 'rm -rf "$bundle_dir"' EXIT
          FIELDS="$(node -e 'console.log(JSON.stringify({
            repository: "airtrustsystem-alt/airtrust",
            environment: "production",
            appVersion: process.argv[1],
            sourceSha: process.argv[2],
            sourceTree: process.argv[3],
            workerBundleSha256: process.argv[4],
            wranglerConfigPreManifestSha256: process.argv[5],
            nodeVersion: process.argv[6],
            npmVersion: process.argv[7],
            wranglerVersion: process.argv[8],
            buildTimeUtc: process.argv[9],
            workerVersionId: null,
            dirty: false
          }))' "${{ needs.guard.outputs.app_version }}" "$source_sha" "$source_tree" "$bundle_sha256" "$config_pre_manifest_sha256" "$(node --version)" "$(npm --version)" "$(npx --no-install wrangler --version 2>/dev/null | tail -1)" "${{ needs.guard.outputs.build_time }}")"
          manifest_sha256="$(node ../scripts/lib/build-release-manifest.mjs "$FIELDS" "$manifest_file" | sed -n 's/^RELEASE_MANIFEST_SHA256=//p')"

          node ../scripts/lib/patch-wrangler-env-vars.mjs \
            wrangler.production.toml wrangler.production.toml production \
            "${{ needs.guard.outputs.app_version }}" "${{ needs.guard.outputs.build_time }}" \
            "$(node -e 'console.log(JSON.stringify({AIRTRUST_RELEASE_MANIFEST_SHA256: process.argv[1]}))' "$manifest_sha256")"

          config_final_sha256="$(shasum -a 256 wrangler.production.toml | awk '{print $1}')"
          if [[ "$config_final_sha256" == "$config_pre_manifest_sha256" ]]; then
            echo "final config hash unexpectedly equals pre-manifest hash" >&2
            exit 1
          fi

          echo "worker_bundle_sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"
          echo "release_manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "config_pre_manifest_sha256=$config_pre_manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "config_final_sha256=$config_final_sha256" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          {
            echo "## Release provenance"
            echo "- source SHA: \`$source_sha\`"
            echo "- source tree: \`$source_tree\`"
            echo "- worker bundle SHA-256: \`$bundle_sha256\`"
            echo "- wrangler config pre-manifest SHA-256: \`$config_pre_manifest_sha256\`"
            echo "- release manifest SHA-256: \`$manifest_sha256\`"
            echo "- wrangler config final SHA-256: \`$config_final_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Evidence must exist before the real deploy so a later failure cannot
      # erase the pre-deploy manifest. Job failure is preserved by later steps
      # using if: always() without force-success.
      - name: Upload release manifest (pre-deploy)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: airtrust-production-release-manifest
          path: airtrust-production-release-manifest.json
          retention-days: 30

      - name: Deploy Worker
        id: deploy
        shell: bash
        working-directory: worker-airtrust
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          real_bundle_dir="$(mktemp -d ./.tmp-worker-bundle-XXXXXX)"
          echo "real_bundle_dir=$real_bundle_dir" >> "$GITHUB_OUTPUT"
          npx --no-install wrangler deploy --env production --config wrangler.production.toml --outdir "$real_bundle_dir" 2>&1 | tee "$RUNNER_TEMP/worker-deploy.log"
          version_id="$(sed -n 's/.*Worker Version ID: //p' "$RUNNER_TEMP/worker-deploy.log" | tail -n1)"
          # Empty string (not a placeholder) when the log line is missing — the
          # attestation maps empty to null. Never emit "unavailable".
          echo "worker_version_id=${version_id}" >> "$GITHUB_OUTPUT"

      - name: Compare real deploy bundle hash
        id: bundle_compare
        if: ${{ steps.deploy.outcome == 'success' }}
        shell: bash
        working-directory: worker-airtrust
        env:
          EXPECTED_BUNDLE_SHA256: ${{ steps.provenance.outputs.worker_bundle_sha256 }}
          REAL_BUNDLE_DIR: ${{ steps.deploy.outputs.real_bundle_dir }}
        run: |
          set -euo pipefail
          trap 'rm -rf "$REAL_BUNDLE_DIR"' EXIT
          # Detection, not prevention: the vars (including the published bundle
          # hash) are already uploaded by the time this runs. A mismatch means
          # this deploy's published hash is unverified/wrong and the run must be
          # treated as suspect (redeploy or roll back), not that the bad value
          # never shipped.
          real_bundle_file="$(find "$REAL_BUNDLE_DIR" -maxdepth 1 -name '*.js' | sort | head -n1)"
          if [[ -z "$real_bundle_file" ]]; then
            echo "No bundled Worker module captured from the real deploy." >&2
            exit 1
          fi
          real_bundle_sha256="$(shasum -a 256 "$real_bundle_file" | awk '{print $1}')"
          if [[ "$real_bundle_sha256" != "$EXPECTED_BUNDLE_SHA256" ]]; then
            echo "Bundle hash mismatch: published ($EXPECTED_BUNDLE_SHA256) != real deploy ($real_bundle_sha256)" >&2
            exit 1
          fi

      - name: Smoke Worker (hardened post-deploy)
        id: smoke
        if: ${{ steps.bundle_compare.outcome == 'success' }}
        shell: bash
        # Fails the deploy (exit != 0) unless EVERY provenance/identity/security
        # invariant holds: /api/health 200, environment=production, APP_VERSION
        # == expected release (never a placeholder), non-empty workerVersionId,
        # X-AirTrust-Worker-Version / X-AirTrust-Source-SHA headers present and
        # matching, bundle + manifest hashes present, protected route -> 401,
        # maintenance route -> 404 (not 403), and no localhost debug-route leak.
        # Logic and negative-path proofs live in
        # scripts/smoke-production-postdeploy.mjs (unit-tested in
        # scripts/__tests__/smoke-production-postdeploy.test.mjs).
        env:
          PROD_API_BASE_URL: https://api.airtrust.online
          EXPECTED_APP_VERSION: ${{ needs.guard.outputs.app_version }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          SMOKE_MAX_RETRIES: '6'
          SMOKE_RETRY_DELAY_MS: '10000'
        run: |
          set -euo pipefail
          node scripts/smoke-production-postdeploy.mjs

      - name: Write worker summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Worker deploy"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- APP_VERSION: \`${{ needs.guard.outputs.app_version }}\`"
            echo "- Worker Version ID: \`${{ steps.deploy.outputs.worker_version_id || 'null' }}\`"
            echo "- deploy outcome: \`${{ steps.deploy.outcome }}\`"
            echo "- bundle compare outcome: \`${{ steps.bundle_compare.outcome }}\`"
            echo "- smoke outcome: \`${{ steps.smoke.outcome }}\`"
            echo "- UTC: \`${{ needs.guard.outputs.release_utc }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Attestation must survive deploy/smoke failure. Booleans come from real
      # step outcomes — never hardcoded true. A failed prior step still fails
      # the job; this step does not mask that.
      - name: Create release attestation
        id: attestation
        if: ${{ always() && steps.provenance.outcome == 'success' }}
        shell: bash
        env:
          MANIFEST_SHA256: ${{ steps.provenance.outputs.release_manifest_sha256 }}
          FINAL_CONFIG_SHA256: ${{ steps.provenance.outputs.config_final_sha256 }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_TREE: ${{ steps.provenance.outputs.source_tree }}
          BUNDLE_SHA256: ${{ steps.provenance.outputs.worker_bundle_sha256 }}
          APP_VERSION: ${{ needs.guard.outputs.app_version }}
          WORKER_VERSION_ID: ${{ steps.deploy.outputs.worker_version_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          BUNDLE_COMPARE_OUTCOME: ${{ steps.bundle_compare.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          # Recompute tree SHA in this step and refuse any env wiring that
          # substituted the commit SHA (the bug that set SOURCE_TREE=github.sha).
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          if [[ -z "${SOURCE_TREE}" || "${SOURCE_TREE}" != "${tree_sha}" ]]; then
            echo "SOURCE_TREE env ('${SOURCE_TREE}') != git rev-parse 'HEAD^{tree}' ('${tree_sha}')" >&2
            exit 1
          fi
          if [[ "${SOURCE_TREE}" == "${SOURCE_SHA}" ]]; then
            echo "SOURCE_TREE must not equal SOURCE_SHA (commit vs tree object)" >&2
            exit 1
          fi

          FIELDS="$(node --input-type=module -e '
            import { outcomeFlags } from "./scripts/lib/build-release-attestation.mjs";
            const deploy = outcomeFlags(process.env.DEPLOY_OUTCOME);
            const bundle = outcomeFlags(process.env.BUNDLE_COMPARE_OUTCOME);
            const smoke = outcomeFlags(process.env.SMOKE_OUTCOME);
            const workerVersionId = process.env.WORKER_VERSION_ID && process.env.WORKER_VERSION_ID.length > 0
              ? process.env.WORKER_VERSION_ID
              : null;
            console.log(JSON.stringify({
              repository: "airtrustsystem-alt/airtrust",
              environment: "production",
              appVersion: process.env.APP_VERSION,
              sourceSha: process.env.SOURCE_SHA,
              sourceTree: process.env.SOURCE_TREE,
              workerBundleSha256: process.env.BUNDLE_SHA256,
              wranglerConfigFinalSha256: process.env.FINAL_CONFIG_SHA256,
              releaseManifestSha256: process.env.MANIFEST_SHA256,
              workerVersionId,
              deployAttempted: deploy.executed,
              deploySucceeded: deploy.passed,
              bundleComparisonExecuted: bundle.executed,
              bundleComparisonPassed: bundle.passed,
              smokeExecuted: smoke.executed,
              smokePassed: smoke.passed,
              timestampUtc: new Date().toISOString(),
            }));
          ')"
          node scripts/lib/build-release-attestation.mjs "$FIELDS" airtrust-production-release-attestation.json

      - name: Upload release attestation
        if: ${{ always() && steps.attestation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: airtrust-production-release-attestation
          path: airtrust-production-release-attestation.json
          retention-days: 30

      - name: Cleanup real deploy bundle dir
        if: ${{ always() && steps.deploy.outputs.real_bundle_dir != '' }}
        shell: bash
        working-directory: worker-airtrust
        env:
          REAL_BUNDLE_DIR: ${{ steps.deploy.outputs.real_bundle_dir }}
        run: rm -rf "$REAL_BUNDLE_DIR"

  deploy-pages:
    name: Deploy Pages
    needs: [guard, prepare]
    if: ${{ inputs.deploy_pages }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      pages_url: ${{ steps.capture.outputs.pages_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: airtrust-release-dist
          path: dist/client

      - name: Validate Pages secret mapping
        shell: bash
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_PAGES_API_TOKEN}" ]]; then
            echo "CLOUDFLARE_PAGES_API_TOKEN missing in GitHub environment production" >&2
            exit 1
          fi

      - name: Deploy Pages
        id: pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist/client
            --project-name=${{ env.PAGES_PROJECT_NAME }}
            --branch=${{ env.PAGES_BRANCH }}
            --commit-hash=${{ github.sha }}

      - name: Capture pages release metadata
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          pages_url="$(printf '%s\n' "${{ steps.pages.outputs.command-output }}" | grep -Eo 'https://[^ ]+' | tail -n1 || true)"
          echo "pages_url=${pages_url:-https://airtrust.online/login}" >> "$GITHUB_OUTPUT"

      - name: Smoke Pages
        shell: bash
        run: |
          set -euo pipefail
          login_body="$(mktemp)"
          sw_body="$(mktemp)"

          login_status="$(curl -sS -L -o "$login_body" -w '%{http_code}' "$PAGES_LOGIN_URL")"
          if [[ "$login_status" != "200" ]]; then
            echo "Pages login returned $login_status." >&2
            cat "$login_body" >&2
            exit 1
          fi

          if grep -q 'build-version' "$login_body"; then
            grep -Eo 'build-version[^>]*content="[^"]+"' "$login_body" | head -n1
          else
            echo "build-version meta tag not found in $PAGES_LOGIN_URL." >&2
            exit 1
          fi

          sw_status="$(curl -sS -o "$sw_body" -w '%{http_code}' "$PAGES_SW_URL" || true)"
          if [[ "$sw_status" == "200" ]]; then
            grep -q "url.pathname === '/sw.js'" "$sw_body"
          else
            echo "sw.js not served from custom domain; skipping kill-switch content check."
          fi

      - name: Write pages summary
        shell: bash
        run: |
          {
            echo "## Pages deploy"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- APP_VERSION: \`${{ needs.guard.outputs.app_version }}\`"
            echo "- Pages URL: \`${{ steps.capture.outputs.pages_url }}\`"
            echo "- UTC: \`${{ needs.guard.outputs.release_utc }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
