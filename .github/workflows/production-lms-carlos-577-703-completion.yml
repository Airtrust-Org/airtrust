name: Production LMS Carlos 577-703 Governed Completion
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [dry-run, apply]
        default: dry-run
      expected_main_sha:
        required: true
        type: string
      expected_production_sha:
        required: true
        type: string
      confirmation:
        required: true
        type: string
      reviewed_dry_run_id:
        required: false
        type: string
permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
concurrency:
  group: production-lms-carlos-577-703-governed-completion
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CARLOS_COMPLETION_MODE: ${{ inputs.mode }}
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
      CARLOS_COMPLETION_CONFIRMATION: ${{ inputs.confirmation }}
      PROD_API_BASE_URL: https://api.airtrust.online
      PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
      PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate immutable scope and eight required release gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_PRODUCTION_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$CARLOS_COMPLETION_MODE" == 'dry-run' ]]; then
            [[ "$CARLOS_COMPLETION_CONFIRMATION" == AIRTRUST_CARLOS_577_703_DRY_RUN ]]
          else
            [[ "$CARLOS_COMPLETION_MODE" == 'apply' && "$CARLOS_COMPLETION_CONFIRMATION" == AIRTRUST_CARLOS_577_703_APPLY ]]
          fi
          node scripts/ci/verify-release-gates.mjs
          node --test scripts/__tests__/lms-carlos-closure-governed.test.mjs
      - name: Verify identical-SHA successful reviewed dry-run
        if: ${{ inputs.mode == 'apply' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN_ID: ${{ inputs.reviewed_dry_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DRY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DRY_RUN_ID")"
          [[ "$(jq -r .name <<< "$run")" == 'Production LMS Carlos 577-703 Governed Completion' ]]
          [[ "$(jq -r .head_sha <<< "$run")" == "$GITHUB_SHA" ]]
          [[ "$(jq -r .conclusion <<< "$run")" == success ]]
          mkdir -p "$RUNNER_TEMP/reviewed"
          gh run download "$DRY_RUN_ID" -R "$GITHUB_REPOSITORY" --name "carlos-577-703-dry-run-$GITHUB_SHA" --dir "$RUNNER_TEMP/reviewed"
          jq -e --arg main "$EXPECTED_MAIN_SHA" --arg prod "$EXPECTED_PRODUCTION_SHA" '
            .schema_version==1 and .mode=="dry-run" and .tenant==6 and
            .main_sha==$main and .production_sha==$prod and
            .enrolled==2 and .writes==0 and .personal_data==false and
            .target_courses==[23,55] and
            ([.rows[]|.course]|sort)==[23,55] and
            (.evidence_hash|test("^[a-f0-9]{64}$"))
          ' "$RUNNER_TEMP/reviewed/result.json" >/dev/null
          echo "REVIEWED_EVIDENCE_HASH=$(jq -r .evidence_hash "$RUNNER_TEMP/reviewed/result.json")" >> "$GITHUB_ENV"
      - name: Check D1 time-travel recovery point before mutation
        if: ${{ inputs.mode == 'apply' }}
        working-directory: worker-airtrust
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm ci --ignore-scripts >/dev/null
          npx wrangler d1 time-travel info airtrust-db --env production --timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$RUNNER_TEMP/d1-recovery.txt"
          test -s "$RUNNER_TEMP/d1-recovery.txt"
          rm -f "$RUNNER_TEMP/d1-recovery.txt"
      - name: Execute pinned canonical completion or dry-run
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production/lms-carlos-closure-governed.mjs > "$RUNNER_TEMP/result.json"
          test -s "$RUNNER_TEMP/result.json"
          jq -e --arg mode "$CARLOS_COMPLETION_MODE" '.mode==$mode and .enrolled==2 and .tenant==6 and .personal_data==false' "$RUNNER_TEMP/result.json" >/dev/null
          jq '{mode,main_sha,production_sha,rows,evidence_hash,writes,final_readback,scorm_changed,historical_dates_fabricated}' "$RUNNER_TEMP/result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: carlos-577-703-${{ inputs.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/result.json
          retention-days: 30
          if-no-files-found: warn
