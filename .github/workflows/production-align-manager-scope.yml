name: Production Align Manager Scope

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes (false = dry-run)'
        required: true
        type: boolean
        default: false
      confirmation:
        description: 'Type ALIGN_MANAGER_SCOPE when apply=true'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  align:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard apply confirmation
        if: ${{ inputs.apply }}
        run: test "${{ inputs.confirmation }}" = "ALIGN_MANAGER_SCOPE"
      - name: Align manager scope
        env:
          PROD_API_BASE_URL: https://api.airtrust.online
          PROD_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}
          PROD_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}
          # These are the unique canonical names persisted in production. The
          # corresponding display names requested are Ingrid, Emily, Laila and Mirela.
          REFERENCE_NAME: Yngrid
          TARGET_NAMES: Giancarlo,Emyle,Layla,Mirela dos Santos Silva
          APPLY: ${{ inputs.apply }}
        run: node scripts/production/align-manager-scope.mjs
