name: Production Align Manager Scope

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact current main SHA reviewed for this role and scope alignment'
        required: true
        type: string
      reference_name:
        description: 'Unique active manager whose sector scope will be mirrored'
        required: true
        default: Yngrid
        type: string
      target_names:
        description: 'Comma-separated unique active users to promote and align'
        required: true
        type: string
      mode:
        description: 'dry-run is read-only; apply promotes only the reviewed targets and mirrors the reviewed sectors'
        required: true
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirmation:
        description: 'Exact confirmation required by the selected mode'
        required: true
        type: string
      reviewed_dry_run_run_id:
        description: 'Required for apply; successful dry-run run on this same SHA and candidate set'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: production-align-manager-scope
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Validate immutable dispatch
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo MAIN_REF_REQUIRED >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo EXPECTED_SHA_INVALID >&2; exit 1; }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo EXPECTED_SHA_MISMATCH >&2; exit 1; }
          if [[ "$MODE" == dry-run ]]; then
            [[ "$CONFIRMATION" == AIRTRUST_PRODUCTION_DRYRUN_ALIGN_MANAGER_SCOPE ]] || { echo DRYRUN_CONFIRMATION_REQUIRED >&2; exit 1; }
          elif [[ "$MODE" == apply ]]; then
            [[ "$CONFIRMATION" == AIRTRUST_PRODUCTION_APPLY_ALIGN_MANAGER_SCOPE ]] || { echo APPLY_CONFIRMATION_REQUIRED >&2; exit 1; }
          else
            echo INVALID_MODE >&2; exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify official release gates on exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-release-gates.mjs
      - name: Verify reviewed dry-run predecessor
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN: ${{ inputs.reviewed_dry_run_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_RUN" =~ ^[1-9][0-9]*$ ]] || { echo REVIEWED_DRY_RUN_RUN_ID_REQUIRED >&2; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN")"
          [[ "$(jq -r .name <<<"$run_json")" == 'Production Align Manager Scope' ]] || { echo REVIEWED_WORKFLOW_MISMATCH >&2; exit 1; }
          [[ "$(jq -r .conclusion <<<"$run_json")" == success ]] || { echo REVIEWED_DRY_RUN_NOT_SUCCESSFUL >&2; exit 1; }
          [[ "$(jq -r .head_sha <<<"$run_json")" == "$EXPECTED_SHA" ]] || { echo REVIEWED_DRY_RUN_SHA_MISMATCH >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/reviewed"
          gh run download "$REVIEWED_RUN" --repo "$GITHUB_REPOSITORY" --name "production-align-manager-scope-dry-run-$EXPECTED_SHA" --dir "$RUNNER_TEMP/reviewed"
          candidate_hash="$(jq -r .candidate_hash "$RUNNER_TEMP/reviewed/result.json")"
          [[ "$candidate_hash" =~ ^[0-9a-f]{64}$ ]] || { echo REVIEWED_CANDIDATE_HASH_INVALID >&2; exit 1; }
          echo "ALIGN_MANAGER_EXPECTED_CANDIDATE_HASH=$candidate_hash" >> "$GITHUB_ENV"
      - name: Align manager scope
        env:
          PROD_API_BASE_URL: https://api.airtrust.online
          PROD_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}
          PROD_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}
          REFERENCE_NAME: ${{ inputs.reference_name }}
          TARGET_NAMES: ${{ inputs.target_names }}
          APPLY: ${{ inputs.mode == 'apply' }}
          ALIGN_MANAGER_RESULT_FILE: ${{ runner.temp }}/result.json
        run: |
          set -euo pipefail
          node scripts/production/align-manager-scope.mjs
          test -s "$RUNNER_TEMP/result.json"
      - name: Publish sanitized summary
        run: |
          jq '{mode,source_sha,empresa_id,candidate_count,candidate_hash,reference_profile_verified,reference_sector_count,mutation_executed,postconditions_verified,pii_emitted}' "$RUNNER_TEMP/result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v7
        with:
          name: production-align-manager-scope-${{ inputs.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error
          retention-days: 30
