name: Backfill Certificado Validacao Hash (Governed)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact main SHA authorized for this backfill run'
        required: true
        type: string
      target:
        description: 'D1 target'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      apply:
        description: 'Actually write hashes (default: dry-run only)'
        required: true
        type: boolean
        default: false
      confirm:
        description: 'Target-specific confirmation string, required only when apply=true'
        required: false
        type: string
      empresa_id:
        description: 'Optional: scope the backfill to a single empresa_id'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: certificate-validation-hash-backfill-${{ inputs.target }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.guard.outputs.release_sha }}
    steps:
      - id: guard
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          TARGET: ${{ inputs.target }}
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == "refs/heads/main" ]] || { echo "ERROR: main only." >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: release_sha inválido." >&2; exit 1; }
          [[ "$RELEASE_SHA" == "$EVENT_SHA" ]] || { echo "ERROR: release_sha não corresponde ao github.sha." >&2; exit 1; }
          [[ "$TARGET" == "staging" || "$TARGET" == "production" ]] || { echo "ERROR: target inválido." >&2; exit 1; }
          if [[ "$APPLY" == "true" ]]; then
            [[ -n "$CONFIRM" ]] || { echo "ERROR: apply=true requer confirm explícito." >&2; exit 1; }
            if [[ "$TARGET" == "staging" ]]; then
              [[ "$CONFIRM" == "CONFIRM_STAGING_BACKFILL_VALIDACAO_HASH" ]] || { echo "ERROR: confirmação staging inválida." >&2; exit 1; }
            else
              [[ "$CONFIRM" == "CONFIRM_PRODUCTION_BACKFILL_VALIDACAO_HASH" ]] || { echo "ERROR: confirmação production inválida." >&2; exit 1; }
            fi
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  staging-backfill-d1:
    name: Staging Backfill (dry-run by default)
    needs: guard
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run governed staging backfill
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ needs.guard.outputs.release_sha }}
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
          EMPRESA_ID: ${{ inputs.empresa_id }}
        run: |
          set -euo pipefail
          npm --prefix worker-airtrust ci
          args=(--release-sha="$RELEASE_SHA")
          [[ -n "$EMPRESA_ID" ]] && args+=(--empresa-id="$EMPRESA_ID")
          if [[ "$APPLY" == "true" ]]; then
            args+=(--apply --confirm="$CONFIRM")
          fi
          bash scripts/staging/backfill-validacao-hash-with-recovery-point.sh "${args[@]}"

  production-backfill:
    name: Production D1 Backfill (dry-run by default)
    needs: guard
    if: ${{ inputs.target == 'production' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install worker dependencies
        run: npm --prefix worker-airtrust ci
      - name: Verify production 0470 schema postconditions before backfill
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/schema-v2/validate-0470-production-postconditions.sh
      - name: Run governed production backfill
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ needs.guard.outputs.release_sha }}
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
          EMPRESA_ID: ${{ inputs.empresa_id }}
        run: |
          set -euo pipefail
          args=(--release-sha="$RELEASE_SHA")
          [[ -n "$EMPRESA_ID" ]] && args+=(--empresa-id="$EMPRESA_ID")
          if [[ "$APPLY" == "true" ]]; then
            args+=(--apply --confirm="$CONFIRM")
          fi
          bash scripts/production/backfill-validacao-hash-with-recovery-point.sh "${args[@]}"
