name: tmp-pr808-prettier-artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/migrations-deploy-safety-20260804'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Format exact PR 808 files
        run: |
          npx --yes prettier@3.9.6 --write -- \
            worker-airtrust/src/__tests__/migrations/controlled-execution-gate.test.ts \
            worker-airtrust/src/__tests__/migrations/setores-gestores-gestor-id-optional.test.ts
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            worker-airtrust/src/__tests__/migrations/controlled-execution-gate.test.ts \
            worker-airtrust/src/__tests__/migrations/setores-gestores-gestor-id-optional.test.ts
          if git diff --cached --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git commit -m "style: apply Prettier 3.9.6 to migration tests"
          git push origin HEAD:${{ github.head_ref }}
