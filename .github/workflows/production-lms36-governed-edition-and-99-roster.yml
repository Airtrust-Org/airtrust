name: Production LMS36 Governed Edition and Encrypted 99 Roster
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [preflight, apply]
        default: preflight
      expected_main_sha:
        required: true
        type: string
      expected_production_sha:
        required: true
        type: string
      confirmation:
        required: true
        type: string
      reviewed_preflight_run_id:
        required: false
        type: string
      roster_public_key_der_b64:
        required: false
        type: string
permissions:
  contents: read
  checks: read
  statuses: read
  actions: read
concurrency:
  group: production-lms-edition36-admin-write
  cancel-in-progress: false
jobs:
  govern:
    name: Audit new edition for enrollment 36 or apply one admin API action
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
      LMS36_MODE: ${{ inputs.mode }}
      LMS36_CONFIRMATION: ${{ inputs.confirmation }}
      LMS99_PUBLIC_KEY_DER_B64: ${{ inputs.roster_public_key_der_b64 }}
      PROD_API_BASE_URL: https://api.airtrust.online
      PROD_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}
      PROD_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify current main and precise user-approved scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_PRODUCTION_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$LMS36_MODE" == preflight ]]; then
            [[ "$LMS36_CONFIRMATION" == AIRTRUST_LMS36_PREFLIGHT && -n "$LMS99_PUBLIC_KEY_DER_B64" ]]
          else
            [[ "$LMS36_MODE" == apply && "$LMS36_CONFIRMATION" == AIRTRUST_LMS36_APPLY ]]
          fi
      - name: Require all eight canonical release gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-release-gates.mjs
      - name: Verify executor syntax and contract
        run: |
          node --check scripts/production/lms-tenant6-edition36-and-99.mjs
          node --test scripts/__tests__/lms-tenant6-edition36-and-99.test.mjs
      - name: Verify reviewed same-SHA preflight for admin write
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN_ID: ${{ inputs.reviewed_preflight_run_id }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN_ID")"
          [[ "$(jq -r .name <<< "$run")" == "Production LMS36 Governed Edition and Encrypted 99 Roster" ]]
          [[ "$(jq -r .head_sha <<< "$run")" == "$GITHUB_SHA" ]]
          [[ "$(jq -r .conclusion <<< "$run")" == success ]]
          mkdir -p "$RUNNER_TEMP/reviewed"
          gh run download "$REVIEWED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "lms36-preflight-$GITHUB_SHA" --dir "$RUNNER_TEMP/reviewed"
          jq -e --arg sha "$GITHUB_SHA" --arg prod "$EXPECTED_PRODUCTION_SHA" '
            .mode=="preflight" and .tenant==6 and .matricula_id==36 and .curso_id==3 and
            .old_total==84 and .new_total==70 and .main_sha==$sha and .production_sha==$prod and
            .writes==0 and .personal_data==false and
            (.fingerprint|test("^[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/reviewed/lms36-plan.json" >/dev/null
          echo "REVIEWED_LMS36_FINGERPRINT=$(jq -r .fingerprint "$RUNNER_TEMP/reviewed/lms36-plan.json")" >> "$GITHUB_ENV"
      - name: Check D1 recovery window before single administrative API write
        if: ${{ inputs.mode == 'apply' }}
        working-directory: worker-airtrust
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]
          npm ci --ignore-scripts >/dev/null
          npx wrangler d1 time-travel info airtrust-db --env production --timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$RUNNER_TEMP/d1-recovery.txt"
          test -s "$RUNNER_TEMP/d1-recovery.txt"
          rm -f "$RUNNER_TEMP/d1-recovery.txt"
      - name: Execute canonical admin API preflight or edition rotation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production/lms-tenant6-edition36-and-99.mjs > "$RUNNER_TEMP/result.json"
          jq -e --arg mode "$LMS36_MODE" '.mode==$mode and .tenant==6 and .personal_data==false' "$RUNNER_TEMP/result.json" >/dev/null
          jq '{mode,tenant,matricula_id,curso_id,old_total,new_total,roster,progress_new,status,writes}' "$RUNNER_TEMP/result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fingerprint-only reviewed preflight
        if: ${{ inputs.mode == 'preflight' }}
        uses: actions/upload-artifact@v7
        with:
          name: lms36-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/lms36-plan.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload private-key-only readable 99 percent list
        if: ${{ inputs.mode == 'preflight' }}
        uses: actions/upload-artifact@v7
        with:
          name: lms99-roster-encrypted-${{ github.sha }}
          path: ${{ runner.temp }}/lms99-encrypted.json
          retention-days: 7
          if-no-files-found: error
