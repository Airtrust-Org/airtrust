name: EAD Category Reconciliation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options: [dry-run, apply]
      expected_sha:
        description: 'Expected main HEAD SHA (production only)'
        required: false
        type: string
      confirmation:
        description: 'Confirmation phrase'
        required: true
        type: string

jobs:
  d1-reconciliation:
    name: D1 EAD Reconciliation
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      # Wrangler's runtime variable is intentionally mapped from the
      # canonical, environment-scoped D1 migration credential that already
      # backs the repository's successful controlled D1 workflows.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate inputs and prerequisites
        run: |
          EXPECTED_CONFIRM="EAD_${{ inputs.environment }}_${{ inputs.mode }}"
          EXPECTED_UPPER=$(echo "$EXPECTED_CONFIRM" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
          if [[ "${{ inputs.confirmation }}" != "$EXPECTED_UPPER" ]]; then
            echo "Expected confirmation: $EXPECTED_UPPER" >&2
            exit 1
          fi
          if [[ "${{ inputs.environment }}" != "staging" && "${{ inputs.environment }}" != "production" ]]; then
            echo "Unsupported environment" >&2
            exit 1
          fi
          if [[ "${{ inputs.mode }}" != "dry-run" && "${{ inputs.mode }}" != "apply" ]]; then
            echo "Unsupported mode" >&2
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID_MISSING" >&2
            exit 1
          fi
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Production must run from refs/heads/main" >&2
              exit 1
            fi
            if [[ -z "${{ inputs.expected_sha }}" || "$(git rev-parse HEAD)" != "${{ inputs.expected_sha }}" ]]; then
              echo "Production expected_sha mismatch" >&2
              exit 1
            fi
          fi

      - name: Check canonical D1 migration token presence
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "CLOUDFLARE_D1_MIGRATION_API_TOKEN_MISSING_${{ inputs.environment }}" | tr '[:lower:]' '[:upper:]' >&2
            exit 1
          fi

      - name: Resolve allowlisted D1 target
        run: |
          if [[ "${{ inputs.environment }}" == "staging" ]]; then DB_NAME="airtrust-db-staging-baseline-20260701"; else DB_NAME="airtrust-db"; fi
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"

      - name: Verify read-only D1 access (${{ inputs.environment }})
        run: npx wrangler d1 execute "$DB_NAME" --remote --command "SELECT 1 AS d1_read_only_access"

      - name: Export D1 Backup (${{ inputs.environment }})
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP_FILE="airtrust-db-${{ inputs.environment }}-${TIMESTAMP}.sql"
          npx wrangler d1 export "$DB_NAME" --remote --output "$BACKUP_FILE"
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "BACKUP_SHA=$(shasum -a 256 "$BACKUP_FILE" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Record backup checksum
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('backup-${{ inputs.environment }}.json', JSON.stringify({environment:'${{ inputs.environment }}', database:'$DB_NAME', backup_file:'$BACKUP_FILE', sha256:'$BACKUP_SHA'}, null, 2) + '\\n')"

      - name: Create temp SQLite from backup
        run: |
          TEMP_DB="ead-temp-$TIMESTAMP.sqlite"
          sqlite3 "$TEMP_DB" < "$BACKUP_FILE"
          echo "TEMP_DB=$TEMP_DB" >> "$GITHUB_ENV"

      - name: Run reconciliation dry-run (local SQLite)
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/ead-reconcile.mjs --db-file "$TEMP_DB" --dry-run --manifest "manifest-${{ inputs.environment }}.json" --apply-sql-output "apply-${{ inputs.environment }}.sql" --rollback-output "rollback-${{ inputs.environment }}.sql"

      - name: Validate manifest (tenant scope, allowlist)
        run: |
          TOTAL_OPERATIONS=$(node -e "const data=require('./manifest-${{ inputs.environment }}.json'); if (!Number.isInteger(data.total_operations) || data.total_operations < 0) process.exit(1); process.stdout.write(String(data.total_operations))")
          echo "TOTAL_OPERATIONS=$TOTAL_OPERATIONS" >> "$GITHUB_ENV"
          if [[ "$TOTAL_OPERATIONS" == "0" ]]; then echo "NO_CHANGES=true" >> "$GITHUB_ENV"; exit 0; fi
          echo "NO_CHANGES=false" >> "$GITHUB_ENV"
          if grep -qiE '(^|[^A-Z_])(DELETE|DROP|ALTER|INSERT)([^A-Z_]|$)' "apply-${{ inputs.environment }}.sql"; then echo "Disallowed SQL operation" >&2; exit 1; fi
          if grep -qE '^UPDATE (qualificacoes_categorias|qualificacoes_tipos|qualificacoes_historico) ' "apply-${{ inputs.environment }}.sql"; then true; else echo "No allowlisted UPDATE found" >&2; exit 1; fi
          if grep -qvE '^(--|UPDATE (qualificacoes_categorias|qualificacoes_tipos|qualificacoes_historico) .*empresa_id = 6.*deleted_at IS NULL.*;)$' "apply-${{ inputs.environment }}.sql"; then echo "SQL escaped the allowlist or tenant predicate" >&2; exit 1; fi

      - name: Apply Reconciliation to remote D1 (${{ inputs.environment }})
        if: ${{ inputs.mode == 'apply' && env.NO_CHANGES != 'true' }}
        run: npx wrangler d1 execute "$DB_NAME" --remote --file "apply-${{ inputs.environment }}.sql"

      - name: Post-apply re-export and idempotency verification
        if: ${{ inputs.mode == 'apply' && env.NO_CHANGES != 'true' }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          VERIFY_FILE="airtrust-db-${{ inputs.environment }}-verify-${TIMESTAMP}.sql"
          npx wrangler d1 export "$DB_NAME" --remote --output "$VERIFY_FILE"
          VERIFY_DB="ead-verify-$TIMESTAMP.sqlite"
          sqlite3 "$VERIFY_DB" < "$VERIFY_FILE"
          node scripts/ead-reconcile.mjs --db-file "$VERIFY_DB" --dry-run --manifest "manifest-verify-${{ inputs.environment }}.json" --apply-sql-output "apply-verify-${{ inputs.environment }}.sql"
          node -e "const data=require('./manifest-verify-${{ inputs.environment }}.json'); if (data.total_operations !== 0) process.exit(1)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ead-reconciliation-${{ inputs.environment }}-${{ inputs.mode }}-${{ env.TIMESTAMP }}
          path: |
            manifest-*.json
            apply-*.sql
            rollback-*.sql
            backup-*.json
          retention-days: 7
