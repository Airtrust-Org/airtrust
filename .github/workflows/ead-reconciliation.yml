name: EAD Category Reconciliation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: 'Type RECONCILE to continue'
        required: true
        type: string

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate inputs
        run: |
          if [[ "${{ inputs.confirmation }}" != "RECONCILE" ]]; then
            echo "Confirmation must be exactly RECONCILE" >&2
            exit 1
          fi
          if [[ "${{ inputs.environment }}" == "production" && "${{ inputs.mode }}" == "apply" ]]; then
            echo "⚠️  PRODUCTION APPLY requested — this will modify live data" >&2
          fi

      - name: Export D1 Backup (${{ inputs.environment }})
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP_FILE="airtrust-db-${{ inputs.environment }}-${TIMESTAMP}.sql"
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV

          if [[ "${{ inputs.environment }}" == "staging" ]]; then
            npx wrangler d1 export airtrust-db-staging --remote --output "$BACKUP_FILE"
          else
            npx wrangler d1 export airtrust-db --env production --remote --output "$BACKUP_FILE"
          fi

          echo "Backup size: $(wc -c < "$BACKUP_FILE") bytes"
          echo "Backup SHA-256: $(shasum -a 256 "$BACKUP_FILE" | cut -d' ' -f1)"

      - name: Run Reconciliation (${{ inputs.mode }})
        run: |
          MODE_FLAG="${{ inputs.mode == 'apply' && '--apply' || '--dry-run' }}"
          node scripts/ead-reconcile.mjs \
            --db-file "$BACKUP_FILE" \
            $MODE_FLAG \
            --manifest "manifest-${{ inputs.environment }}-${{ inputs.mode }}.json" \
            --rollback-output "rollback-${{ inputs.environment }}.sql"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ead-reconciliation-${{ inputs.environment }}-${{ inputs.mode }}
          path: |
            manifest-*.json
            rollback-*.sql
          retention-days: 7
