name: Temporary eDB Shadow Test Diagnostic

on:
  push:
    branches:
      - feat/edb-shadow-prototype-ui-20260802

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edb-shadow-prototype-ui-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Capture frontend test failure
        shell: bash
        run: |
          set +e
          npm run test:run > .edb-shadow-test-diagnostic.log 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> .edb-shadow-test-diagnostic.log
          exit 0
      - name: Commit diagnostic and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-edb-shadow-test-diagnostic.yml
          git add .edb-shadow-test-diagnostic.log
          git commit -m "chore(test): capture eDB shadow test failure"
          git push origin HEAD:feat/edb-shadow-prototype-ui-20260802
