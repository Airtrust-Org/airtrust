name: 🚀 Deploy AirTrust

on:
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: 'Deploy production Worker'
        required: true
        type: boolean
        default: false
      deploy_pages:
        description: 'Deploy production Pages'
        required: true
        type: boolean
        default: false
      apply_production_migrations:
        description: 'Apply production D1 migrations before Worker deploy'
        required: true
        type: boolean
        default: false
      production_confirmation:
        description: 'Type: I understand this touches AirTrust production'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Testes e Build
  test-and-build:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 📚 Install worker dependencies
        run: cd worker-airtrust && npm ci

      - name: 🗄️ Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: 🔐 Write local dev vars
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          cat > worker-airtrust/.dev.vars <<EOF
          JWT_SECRET=$JWT_SECRET
          EOF

      - name: 🧱 Setup local database
        run: npm run setup:lms:local:reset

      - name: 🏃 Start local worker
        run: |
          npm run dev:worker:local > /tmp/airtrust-worker.log 2>&1 &
          echo $! > /tmp/airtrust-worker.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:8787/api/health >/dev/null; then
              echo "Local worker ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/airtrust-worker.log
          exit 1

      - name: 🧪 Run LMS local smoke
        run: npm run smoke:lms:local

      - name: 🔍 Lint code
        run: npm run lint || echo "⚠️ Lint não configurado ainda"
        continue-on-error: true

      - name: 🧪 Run tests
        run: npm test || echo "⚠️ Testes não configurados ainda"
        continue-on-error: true

      - name: 🏗️ Build project
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 1

      - name: 🪵 Worker log on failure
        if: failure()
        run: cat /tmp/airtrust-worker.log || true

      - name: 🧹 Stop local worker
        if: always()
        run: |
          if [ -f /tmp/airtrust-worker.pid ]; then
            kill "$(cat /tmp/airtrust-worker.pid)" || true
          fi
          rm -f worker-airtrust/.dev.vars

  # Job 2: Deploy Worker (Backend)
  deploy-worker:
    name: 🔧 Deploy Worker
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_worker
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🧯 Validate production approval gate
        run: |
          expected="I understand this touches AirTrust production"
          if [ "${{ inputs.production_confirmation }}" != "$expected" ]; then
            echo "Production confirmation did not match the required text."
            exit 1
          fi

      - name: 🗄️ Run D1 migrations (production, manual gated)
        if: inputs.apply_production_migrations
        working-directory: worker-airtrust
        run: |
          expected="I understand this touches AirTrust production"
          if [ "${{ inputs.production_confirmation }}" != "$expected" ]; then
            echo "Production migration confirmation did not match the required text."
            exit 1
          fi
          npx wrangler d1 migrations apply airtrust-db --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-airtrust
          command: deploy --env production
          vars: |
            APP_VERSION=${{ github.sha }}

      - name: ✅ Worker deployed
        run: echo "✅ Worker deployed — commit ${{ github.sha }}"

  # Job 3: Deploy Pages (frontend)
  deploy-pages:
    name: 🌐 Deploy Pages
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_pages
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: 🔎 Validate FRMS production artifact
        run: |
          test -f dist/client/index.html
          grep -R -q "Acúmulo de fadiga da quinzena" dist/client/assets
          grep -R -q "Acúmulo operacional da quinzena" dist/client/assets
          grep -R -q "Tripulantes que exigem atenção na quinzena" dist/client/assets
          grep -R -q "Ver evolução diária" dist/client/assets

      - name: 🚀 Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/client --project-name=airtrust --branch=production --commit-hash=${{ github.sha }}

  # Job 4: Validação Pós-Deploy
  validate:
    name: ✅ Validate Deployment
    needs: [deploy-worker, deploy-pages]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.deploy_worker || inputs.deploy_pages)

    steps:
      - name: 🔍 Health check API (custom domain)
        run: |
          echo "🔍 Testando API..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.airtrust.online/api/health || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Health check retornou HTTP $STATUS (não crítico)"
          else
            echo "✅ API OK (HTTP 200)"
          fi
        continue-on-error: true

      - name: 🔍 Health check Pages
        run: |
          echo "🔍 Testando Pages..."
          curl -f https://main.airtrust.pages.dev/ || echo "⚠️ Pages check skipped"
        continue-on-error: true

      - name: 🔍 Health check custom domain frontend
        run: |
          echo "🔍 Testando frontend em produção..."
          curl -f https://airtrust.online/ >/tmp/airtrust-online.html
          grep -q "build-version" /tmp/airtrust-online.html
        continue-on-error: true

      - name: 🎉 Deployment successful
        run: |
          echo "🎉 ================================"
          echo "🎉 DEPLOY COMPLETO E VALIDADO!"
          echo "🎉 ================================"
          echo "🌐 Worker: https://api.airtrust.online"
          echo "🌐 Pages: https://main.airtrust.pages.dev"
          echo "🌐 Custom domain: https://airtrust.online"
          echo "📊 Version: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
