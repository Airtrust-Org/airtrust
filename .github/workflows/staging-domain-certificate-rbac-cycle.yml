name: Staging Domain Certificate RBAC Cycle

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/staging-domain-certificate-rbac-cycle.yml'
      - 'scripts/staging/run-domain-certificate-smoke-with-rbac-cycle.mjs'
      - 'scripts/staging/qa-sector-domain-plan.mjs'
      - 'scripts/staging/seed-qa-admin-operational-grant.mjs'
      - 'scripts/staging/seed-qa-certificate-domain-candidate.mjs'
      - 'worker-airtrust/src/routes/admin-operational-domain-rbac.ts'
      - 'scripts/__tests__/staging-domain-rbac-cycle.test.mjs'
      - 'scripts/__tests__/staging-qa-admin-operational-grant.test.mjs'
      - 'scripts/__tests__/staging-qa-certificate-domain-candidate.test.mjs'

concurrency:
  group: staging-domain-certificate-rbac-cycle
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  ALLOWED_STAGING_HOST: airtrust-api-staging.airtrust.workers.dev
  ALLOWED_STAGING_DB_NAME: airtrust-db-staging-baseline-20260701
  ALLOWED_STAGING_DB_ID: bf9963f4-eb12-439b-a830-20bbf577ac22
  BLOCKED_PRODUCTION_DB_ID: 7c8a788e-a4c4-4d5d-8208-ff7ff55e84ae

jobs:
  staging-rbac-cycle-d1-postconditions:
    name: Synthetic QA RBAC Cycle + Certificate D1 Postconditions
    runs-on: ubuntu-latest
    environment: staging
    env:
      QA_EXAMINER_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL }}
      QA_EXAMINER_ADMIN_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert staging-only targets and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "MAIN_ONLY" >&2; exit 1; }
          [[ -n "$QA_EXAMINER_ADMIN_EMAIL" && -n "$QA_EXAMINER_ADMIN_PASSWORD" ]] || { echo "QA_CREDENTIALS_MISSING" >&2; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "D1_CREDENTIALS_MISSING" >&2; exit 1; }
          node - <<'NODE'
          const url = new URL(process.env.STAGING_API_BASE_URL);
          if (url.hostname !== process.env.ALLOWED_STAGING_HOST) throw new Error('STAGING_HOST_REJECTED');
          if (url.hostname === 'api.airtrust.online' || url.hostname.includes('production')) throw new Error('PRODUCTION_HOST_REJECTED');
          if (process.env.ALLOWED_STAGING_DB_ID === process.env.BLOCKED_PRODUCTION_DB_ID) throw new Error('PRODUCTION_DB_REJECTED');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Test synthetic QA bootstrap allowlists
        run: |
          node --test scripts/__tests__/staging-domain-rbac-cycle.test.mjs
          node --test scripts/__tests__/staging-qa-admin-operational-grant.test.mjs
          node --test scripts/__tests__/staging-qa-certificate-domain-candidate.test.mjs

      - name: Provision exact synthetic QA admin-sector grant
        env:
          STAGING_D1_NAME: ${{ env.ALLOWED_STAGING_DB_NAME }}
          STAGING_D1_ID: ${{ env.ALLOWED_STAGING_DB_ID }}
          CONFIRM_STAGING_QA_GRANT: AIRTRUST_STAGING_QA_GRANT
          QA_GRANT_REPORT_PATH: ${{ runner.temp }}/staging-qa-admin-operational-grant.json
        run: node scripts/staging/seed-qa-admin-operational-grant.mjs --apply

      - name: Provision synthetic unclassified certificate candidate
        env:
          STAGING_D1_NAME: ${{ env.ALLOWED_STAGING_DB_NAME }}
          STAGING_D1_ID: ${{ env.ALLOWED_STAGING_DB_ID }}
          CONFIRM_STAGING_QA_CERT_CANDIDATE: AIRTRUST_STAGING_QA_CERT_CANDIDATE
          QA_CERT_CANDIDATE_REPORT_PATH: ${{ runner.temp }}/staging-qa-certificate-domain-candidate.json
        run: node scripts/staging/seed-qa-certificate-domain-candidate.mjs --apply

      - name: Run temporary RBAC cycle and certificate smoke
        id: smoke
        continue-on-error: true
        env:
          SMOKE_REPORT_PATH: ${{ runner.temp }}/staging-domain-certificate-rbac-cycle-report.json
        run: node scripts/staging/run-domain-certificate-smoke-with-rbac-cycle.mjs

      - name: Verify restored state and persisted certificate evidence read-only
        if: always()
        env:
          SMOKE_REPORT_PATH: ${{ runner.temp }}/staging-domain-certificate-rbac-cycle-report.json
          QA_GRANT_REPORT_PATH: ${{ runner.temp }}/staging-qa-admin-operational-grant.json
          QA_CERT_CANDIDATE_REPORT_PATH: ${{ runner.temp }}/staging-qa-certificate-domain-candidate.json
          D1_RESULT_PATH: ${{ runner.temp }}/staging-domain-certificate-rbac-cycle-d1.json
          SMOKE_STEP_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          for (const path of [process.env.SMOKE_REPORT_PATH, process.env.QA_GRANT_REPORT_PATH, process.env.QA_CERT_CANDIDATE_REPORT_PATH]) {
            if (!path || !fs.existsSync(path)) throw new Error(`POSTCONDITION_INPUT_MISSING:${path || 'unset'}`);
          }
          const report = JSON.parse(fs.readFileSync(process.env.SMOKE_REPORT_PATH, 'utf8'));
          const grant = JSON.parse(fs.readFileSync(process.env.QA_GRANT_REPORT_PATH, 'utf8'));
          const candidateFixture = JSON.parse(fs.readFileSync(process.env.QA_CERT_CANDIDATE_REPORT_PATH, 'utf8'));
          const typeId = Number(report?.candidate?.typeId);
          const historyId = Number(report?.candidate?.historyId);
          const documentId = Number(report?.certificate?.documentId || 0);
          if (grant?.success !== true || grant?.retained !== true) throw new Error('QA_ADMIN_GRANT_NOT_RETAINED');
          if (Number(grant?.after?.active_relation_count) !== 1) throw new Error('QA_ADMIN_GRANT_POSTCONDITION_FAILED');
          if (candidateFixture?.success !== true) throw new Error('QA_CERT_CANDIDATE_NOT_PROVISIONED');
          if (Number(candidateFixture?.after?.type_count) !== 1 || Number(candidateFixture?.after?.history_count) !== 1) {
            throw new Error('QA_CERT_CANDIDATE_POSTCONDITION_FAILED');
          }
          if (report?.rbacActivation?.restored !== true) throw new Error('RBAC_STATE_NOT_RESTORED_IN_REPORT');
          if (!Array.isArray(report?.auth?.domains) || !report.auth.domains.includes('OPERACOES')) {
            throw new Error('QA_ADMIN_OPERATIONS_ACCESS_MISSING');
          }
          if (Number(report?.auth?.managedSetorCount) < 1) throw new Error('QA_ADMIN_MANAGED_SECTOR_MISSING');
          if (report?.qaSectorBootstrap?.retained !== true) throw new Error('QA_SECTOR_BOOTSTRAP_RETENTION_UNCONFIRMED');
          if (report?.qaSectorBootstrap?.attempted === true) {
            if (!Array.isArray(report.qaSectorBootstrap.classifications) || report.qaSectorBootstrap.classifications.length === 0) {
              throw new Error('QA_SECTOR_BOOTSTRAP_EMPTY');
            }
            if (report?.qaSectorBootstrap?.readinessAfter?.ready !== true) {
              throw new Error('QA_SECTOR_BOOTSTRAP_NOT_READY');
            }
          }
          for (const [name, value] of Object.entries({ typeId, historyId })) {
            if (!Number.isInteger(value) || value <= 0) throw new Error(`${name.toUpperCase()}_INVALID`);
          }
          if (!Number.isInteger(documentId) || documentId < 0) throw new Error('DOCUMENTID_INVALID');
          fs.writeFileSync(
            process.env.RUNNER_TEMP + '/postcondition-values.json',
            JSON.stringify({
              typeId,
              historyId,
              documentId,
              smokeSuccess: report?.success === true,
              smokeError: String(report?.error || ''),
              smokeStepOutcome: String(process.env.SMOKE_STEP_OUTCOME || ''),
            }),
            { mode: 0o600 },
          );
          NODE

          TYPE_ID=$(node -p "require(process.env.RUNNER_TEMP + '/postcondition-values.json').typeId")
          HISTORY_ID=$(node -p "require(process.env.RUNNER_TEMP + '/postcondition-values.json').historyId")
          DOCUMENT_ID=$(node -p "require(process.env.RUNNER_TEMP + '/postcondition-values.json').documentId")
          SQL="SELECT
            (SELECT dominio_codigo FROM qualificacoes_tipos WHERE id = $TYPE_ID AND deleted_at IS NULL) AS current_domain,
            (SELECT updated_at FROM qualificacoes_tipos WHERE id = $TYPE_ID AND deleted_at IS NULL) AS current_type_updated_at,
            (SELECT certificado_arquivo_id FROM qualificacoes_historico WHERE id = $HISTORY_ID AND deleted_at IS NULL) AS linked_document_id,
            (SELECT COUNT(*) FROM documentos WHERE id = $DOCUMENT_ID AND deleted_at IS NULL) AS document_count,
            (SELECT COUNT(*) FROM auditoria
              WHERE tabela_afetada = 'qualificacoes_tipos'
                AND registro_id = CAST($TYPE_ID AS TEXT)
                AND created_at >= datetime('now', '-30 minutes')) AS recent_type_audit_count,
            (SELECT operational_domain_rbac_enabled FROM empresas
              WHERE codigo = 'qa_examiner_training' AND deleted_at IS NULL) AS rbac_enabled,
            (SELECT COUNT(*) FROM setores s
              INNER JOIN empresas emp ON emp.id = s.empresa_id
              WHERE emp.codigo = 'qa_examiner_training'
                AND emp.deleted_at IS NULL
                AND ((s.codigo = 'QA-SETOR-EXA' AND s.dominio_codigo = 'OPERACOES')
                  OR (s.codigo LIKE 'AIRTRUST-QA-FINAL-%-OPS' AND s.dominio_codigo = 'OPERACOES')
                  OR (s.codigo LIKE 'AIRTRUST-QA-FINAL-%-MNT' AND s.dominio_codigo = 'MANUTENCAO'))
                AND s.deleted_at IS NULL) AS classified_sector_count,
            (SELECT COUNT(*)
               FROM setores_gestores sg
               INNER JOIN usuarios u ON u.id = sg.usuario_id
               INNER JOIN empresas emp ON emp.id = sg.empresa_id
               INNER JOIN setores s ON s.id = sg.setor_id AND s.empresa_id = emp.id
              WHERE LOWER(TRIM(u.email)) = 'qa-examiner-admin@staging.airtrust.invalid'
                AND emp.codigo = 'qa_examiner_training'
                AND s.codigo = 'QA-SETOR-EXA'
                AND s.dominio_codigo = 'OPERACOES'
                AND sg.ativo = 1
                AND sg.deleted_at IS NULL) AS qa_admin_grant_count;"
          npx wrangler d1 execute "$ALLOWED_STAGING_DB_NAME" --remote --command "$SQL" --json > "$D1_RESULT_PATH"

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { parseWranglerJson } from './scripts/staging/seed-qa-admin-operational-grant.mjs';
          const report = JSON.parse(fs.readFileSync(process.env.SMOKE_REPORT_PATH, 'utf8'));
          const values = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/postcondition-values.json', 'utf8'));
          const raw = parseWranglerJson(fs.readFileSync(process.env.D1_RESULT_PATH, 'utf8'));
          const row = Array.isArray(raw) ? raw[0]?.results?.[0] : raw?.results?.[0];
          if (!row) throw new Error('D1_POSTCONDITION_ROW_MISSING');

          const diagnostic = {
            success: report?.success === true,
            smokeStepOutcome: values.smokeStepOutcome,
            smokeError: values.smokeError || null,
            typeClassification: row.current_domain,
            recentTypeAuditCount: Number(row.recent_type_audit_count || 0),
            certificateDocumentId: Number(report?.certificate?.documentId || 0),
            linkedDocumentId: Number(row.linked_document_id || 0),
            documentCount: Number(row.document_count || 0),
            rbacEnabled: Number(row.rbac_enabled),
            classifiedSectorCount: Number(row.classified_sector_count),
            qaAdminGrantCount: Number(row.qa_admin_grant_count),
          };
          console.log(JSON.stringify(diagnostic));

          const errors = [];
          if (row.current_domain !== null) errors.push(`CLASSIFICATION_ROLLBACK_FAILED:${row.current_domain}`);
          if (Number(row.rbac_enabled) !== 0) errors.push(`RBAC_RESTORE_FAILED:${row.rbac_enabled}`);
          if (Number(row.classified_sector_count) !== 3) errors.push(`QA_SECTOR_BASELINE_INVALID:${row.classified_sector_count}`);
          if (Number(row.qa_admin_grant_count) !== 1) errors.push('QA_ADMIN_GRANT_D1_MISMATCH');

          if (report?.success === true) {
            if (report?.rollback?.success !== true) errors.push('CLASSIFICATION_NOT_ROLLED_BACK');
            if (!Number.isInteger(values.documentId) || values.documentId <= 0) errors.push('DOCUMENT_ID_INVALID');
            if (Number(row.linked_document_id) !== values.documentId) errors.push('HISTORY_DOCUMENT_LINK_MISMATCH');
            if (Number(row.document_count) !== 1) errors.push('DOCUMENT_ROW_MISSING');
          } else {
            errors.push(`SMOKE_REPORT_NOT_SUCCESSFUL:${values.smokeError || 'unknown'}`);
          }

          if (errors.length > 0) throw new Error(errors.join(';'));
          console.log(JSON.stringify({ success: true, rbacRestored: true, typeClassificationRolledBack: true, qaSectorClassificationsRetained: true, qaAdminOperationalGrantRetained: true, certificateLinked: true }));
          NODE

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-domain-certificate-rbac-cycle-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/staging-qa-admin-operational-grant.json
            ${{ runner.temp }}/staging-qa-certificate-domain-candidate.json
            ${{ runner.temp }}/staging-domain-certificate-rbac-cycle-report.json
            ${{ runner.temp }}/staging-domain-certificate-rbac-cycle-d1.json
          if-no-files-found: warn
          retention-days: 14

  record-incident-result:
    name: Record RBAC Cycle Result
    needs: staging-rbac-cycle-d1-postconditions
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Comment incident
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.staging-rbac-cycle-d1-postconditions.result }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/body.md" <<EOF
          ## Staging synthetic QA grant + candidate + RBAC cycle + certificate smoke

          - run: https://github.com/$REPOSITORY/actions/runs/$RUN_ID
          - source SHA: \`$SOURCE_SHA\`
          - result: **$RESULT**
          - QA sector classification: audited API, exact synthetic allowlist, retained as seed readiness
          - QA admin operational grant: exact synthetic fixture relation, idempotent and retained
          - certificate candidate: exact synthetic type/history, deliberately unclassified between runs
          - temporary RBAC and qualification-type override restoration: enforced by workflow and D1 postconditions, including failure paths
          - target: staging synthetic QA only
          - production action: none
          EOF
          gh issue comment 568 --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/body.md"