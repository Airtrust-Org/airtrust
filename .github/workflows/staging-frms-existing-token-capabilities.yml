name: FRMS Existing Staging Token Capabilities (GET Only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type FRMS_EXISTING_STAGING_READONLY
        required: true
        type: string
      expected_main_sha:
        description: Exact reviewed main SHA for read-only Cloudflare token probes
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Reject incorrect environment or confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = FRMS_EXISTING_STAGING_READONLY
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api repos/Airtrust-Org/airtrust/branches/main --jq .commit.sha)" = "$EXPECTED_SHA"
  worker_probe:
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Test sanitized token-policy GET contracts (offline fixtures)
        run: node --test scripts/__tests__/frms-existing-token-policy.test.mjs
      - name: Probe preexisting staging tokens via read-only Cloudflare GET
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FRMS_PROBE_KIND: worker
          FRMS_PROBE_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
        run: node ops/frms-qa-repair/probe-existing-staging-tokens.mjs
      - name: Assert existing Queue metadata probe fail-closed (synthetic only)
        run: node --test scripts/__tests__/frms-existing-queue-access.test.mjs
      - name: Examine Queue names with existing Worker token (GET-only, sanitized)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FRMS_PROBE_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
        run: node ops/frms-qa-repair/run-existing-queue-readonly.mjs

  pages_probe:
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Probe the existing Pages token via read-only Cloudflare GET
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FRMS_PROBE_KIND: pages
          FRMS_PROBE_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: node ops/frms-qa-repair/probe-existing-staging-tokens.mjs

  d1_backup_probe:
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Probe the existing D1 backup token via read-only Cloudflare GET
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FRMS_PROBE_KIND: d1_backup
          FRMS_PROBE_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_API_TOKEN }}
        run: node ops/frms-qa-repair/probe-existing-staging-tokens.mjs

  d1_migration_probe:
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Probe the existing D1 migration token via read-only Cloudflare GET
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FRMS_PROBE_KIND: d1_migration
          FRMS_PROBE_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
        run: node ops/frms-qa-repair/probe-existing-staging-tokens.mjs
