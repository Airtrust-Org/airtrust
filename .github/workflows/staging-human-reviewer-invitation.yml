name: Staging Human Reviewer Invitation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_STAGING_REVIEWER_INVITE'
        type: string
        required: true
      expected_staging_source_sha:
        description: 'Exact SHA of the already deployed staging Worker'
        type: string
        required: true
      apply:
        description: 'Send exactly one invitation; false performs a read-only preflight'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: airtrust-staging-human-reviewer-invite
  cancel-in-progress: false

jobs:
  staging-reviewer:
    name: Staging Human Reviewer (isolated smoke tenant)
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
      STAGING_NATIVE_REVIEWER_EMAIL: ${{ secrets.STAGING_NATIVE_REVIEWER_EMAIL }}
      STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      EXPECTED_STAGING_SOURCE_SHA: ${{ inputs.expected_staging_source_sha }}
      STAGING_REVIEWER_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Ref, confirmation and secret safeguards
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'REVIEWER_MAIN_ONLY'; exit 1; }
          [[ "$STAGING_REVIEWER_CONFIRMATION" == AIRTRUST_STAGING_REVIEWER_INVITE ]] || { echo 'REVIEWER_CONFIRMATION_INVALID'; exit 1; }
          [[ "$EXPECTED_STAGING_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'REVIEWER_SHA_INVALID'; exit 1; }
          [[ -n "$STAGING_NATIVE_REVIEWER_EMAIL" && -n "$STAGING_SMOKE_PASSWORD" ]] || { echo 'REVIEWER_ENV_SECRET_MISSING'; exit 1; }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require audited staging invitation target at deployed SHA
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${EXPECTED_STAGING_SOURCE_SHA}^{commit}" || { echo 'REVIEWER_SHA_NOT_IN_CHECKOUT'; exit 1; }
          git show "${EXPECTED_STAGING_SOURCE_SHA}:worker-airtrust/wrangler.toml" |
            grep -Fx 'FRONTEND_URL = "https://staging.airtrust.pages.dev"' >/dev/null ||
            { echo 'REVIEWER_INVITE_STAGING_ORIGIN_NOT_DEPLOYED'; exit 1; }
      - name: Authenticated staging-only preflight
        run: node scripts/staging/invite-native-human-reviewer.mjs
      - name: Issue single-use invitation without exposing user information
        if: inputs.apply == true
        run: node scripts/staging/invite-native-human-reviewer.mjs --apply
