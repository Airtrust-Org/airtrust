name: Staging Training Compliance Lifecycle QA

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_STAGING_TRAINING_COMPLIANCE_LIFECYCLE_QA to continue'
        required: true
        type: string
      expected_deployed_sha:
        description: 'Exact Worker/frontend SHA currently deployed to staging'
        required: true
        type: string
      pr_number:
        description: 'Open reviewed same-repository staging release PR (required if SHA not in main)'
        required: false
        type: string

concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  STAGING_FRONTEND_BASE_URL: https://staging.airtrust.pages.dev
  STAGING_D1_NAME: airtrust-db-staging-baseline-20260701
  QA_LIFECYCLE_CODE: QA-COMP-LIFE-${{ github.run_id }}
  QA_LIFECYCLE_MARKER: QA_ONLY_TRAINING_COMPLIANCE_LIFECYCLE_${{ github.run_id }}

jobs:
  guard:
    name: Compliance Lifecycle QA Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate trusted staging provenance
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.expected_deployed_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo MAIN_ONLY >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_STAGING_TRAINING_COMPLIANCE_LIFECYCLE_QA' ]] || { echo CONFIRMATION_REJECTED >&2; exit 1; }
          [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo EXPECTED_SHA_INVALID >&2; exit 1; }
          if git cat-file -e "$EXPECTED_DEPLOYED_SHA^{commit}" 2>/dev/null &&
             git merge-base --is-ancestor "$EXPECTED_DEPLOYED_SHA" HEAD; then
            echo "TRUSTED_RELEASE_ANCESTRY_OK=$EXPECTED_DEPLOYED_SHA"
          else
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo OPEN_REVIEWED_PR_REQUIRED >&2; exit 1; }
            node --input-type=module <<'PR_GUARD'
          const expected = process.env.EXPECTED_DEPLOYED_SHA.toLowerCase();
          const repo = process.env.GITHUB_REPOSITORY;
          const number = process.env.PR_NUMBER;
          const response = await fetch(`https://api.github.com/repos/${repo}/pulls/${number}`, {
            headers: {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
            },
          });
          if (!response.ok) throw new Error(`RELEASE_PR_LOOKUP_HTTP_${response.status}`);
          const pr = await response.json();
          if (pr.state !== 'open' || pr.draft ||
              pr.base?.ref !== 'main' ||
              pr.head?.repo?.full_name !== repo ||
              pr.head?.repo?.fork === true ||
              pr.head?.sha?.toLowerCase() !== expected) {
            throw new Error('OPEN_REVIEWED_PR_SHA_OR_SCOPE_MISMATCH');
          }
          console.log('TRUSTED_OPEN_RELEASE_PR_HEAD_OK');
          PR_GUARD
          fi
          node scripts/ci/verify-release-gates.mjs
          node --input-type=module <<'NODE'
          const expected=String(process.env.EXPECTED_DEPLOYED_SHA).toLowerCase();
          const r=await fetch(`${process.env.STAGING_API_BASE_URL}/api/version`); if(!r.ok) throw new Error(`VERSION_HTTP_${r.status}`);
          const j=await r.json(); const sha=String(j?.data?.sourceSha||j?.sourceSha||'').toLowerCase();
          if(sha!==expected) throw new Error(`STAGING_WORKER_SHA_MISMATCH:${sha||'missing'}`);
          const {assertLiveFrontendShaFromOrigin}=await import('./e2e/lib/live-sha-guard.mjs');
          await assertLiveFrontendShaFromOrigin(process.env.STAGING_FRONTEND_BASE_URL,expected.slice(0,7));
          console.log(`TRAINING_COMPLIANCE_LIFECYCLE_PROVENANCE_OK=${expected}`);
          NODE

  d1_fixture:
    name: Seed Isolated Compliance Lifecycle Fixture
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm --prefix worker-airtrust ci
      - name: Require dedicated staging QA R2 cleanup credentials before seeding
        env:
          QA_LIFECYCLE_R2_ACCESS_KEY_ID: ${{ secrets.QA_LIFECYCLE_R2_ACCESS_KEY_ID }}
          QA_LIFECYCLE_R2_SECRET_ACCESS_KEY: ${{ secrets.QA_LIFECYCLE_R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$QA_LIFECYCLE_R2_ACCESS_KEY_ID"
          test -n "$QA_LIFECYCLE_R2_SECRET_ACCESS_KEY"
      - name: Validate schemas and seed lifecycle fixture
        env:
          QA_EXAMINER_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL || 'qa-examiner-admin@staging.airtrust.invalid' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_STAGING_COMPLIANCE_LIFECYCLE_QA: AIRTRUST_STAGING_TRAINING_COMPLIANCE_LIFECYCLE_QA
        run: |
          set -euo pipefail
          bash scripts/staging/validate-0491-postconditions.sh --target="$STAGING_D1_NAME"
          bash scripts/staging/validate-0492-postconditions.sh --target="$STAGING_D1_NAME"
          bash scripts/staging/validate-0494-postconditions.sh --target="$STAGING_D1_NAME"
          node scripts/staging/seed-qa-training-compliance-lifecycle.mjs --code="$QA_LIFECYCLE_CODE" --marker="$QA_LIFECYCLE_MARKER"
          node scripts/staging/seed-qa-training-compliance-lifecycle.mjs --apply --code="$QA_LIFECYCLE_CODE" --marker="$QA_LIFECYCLE_MARKER"

  browser:
    name: Authenticated Compliance Lifecycle E2E
    needs: [guard, d1_fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      RELEASE_SHA: ${{ inputs.expected_deployed_sha }}
      AUDIT_PROFILE: training-compliance-lifecycle
      E2E_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      E2E_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run write-capable staging lifecycle simulation
        run: npx playwright test --config=e2e/frontend-pr-ui-qa.config.ts --grep 'full training compliance lifecycle'
      - name: Upload sanitized lifecycle result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-training-compliance-lifecycle-${{ github.run_id }}
          path: test-results/frontend-pr-ui-qa/results.json
          if-no-files-found: warn
          retention-days: 14

  renewal_fixture:
    name: Expire only the completed synthetic qualification
    needs: [d1_fixture, browser]
    if: needs.browser.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
      STAGING_D1_NAME: airtrust-db-staging-baseline-20260701
      QA_LIFECYCLE_CODE: QA-COMP-LIFE-${{ github.run_id }}
      QA_LIFECYCLE_MARKER: QA_ONLY_TRAINING_COMPLIANCE_LIFECYCLE_${{ github.run_id }}
      CONFIRM_STAGING_COMPLIANCE_LIFECYCLE_QA: AIRTRUST_STAGING_TRAINING_COMPLIANCE_LIFECYCLE_QA
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm --prefix worker-airtrust ci
      - name: Preview the exact run-owned expiry candidate
        run: node scripts/staging/qa-training-compliance-cycle-evidence.mjs --expire
      - name: Set a due date on this run's completed synthetic evidence
        run: node scripts/staging/qa-training-compliance-cycle-evidence.mjs --expire --apply

  renewal_browser:
    name: Authenticated renewal and certificate PDF E2E
    needs: [guard, renewal_fixture]
    if: needs.renewal_fixture.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      RELEASE_SHA: ${{ inputs.expected_deployed_sha }}
      AUDIT_PROFILE: training-compliance-lifecycle
      E2E_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      E2E_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix worker-airtrust ci
      - run: npx playwright install --with-deps chromium
      - name: Renew the expired synthetic cycle and generate/read its real PDF
        run: npx playwright test --config=e2e/frontend-pr-ui-qa.config.ts --grep 'expired synthetic evidence renews cycle two and issues an authorized PDF'
      - name: Verify cycle, archived xAPI, qualification and certificate linkage in staging D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          STAGING_D1_NAME: airtrust-db-staging-baseline-20260701
          QA_LIFECYCLE_CODE: QA-COMP-LIFE-${{ github.run_id }}
          QA_LIFECYCLE_MARKER: QA_ONLY_TRAINING_COMPLIANCE_LIFECYCLE_${{ github.run_id }}
        run: node scripts/staging/qa-training-compliance-cycle-evidence.mjs --verify
      - name: Upload sanitized renewal result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-training-compliance-renewal-${{ github.run_id }}
          path: test-results/frontend-pr-ui-qa/results.json
          if-no-files-found: warn
          retention-days: 14

  d1_cleanup:
    name: Cleanup Isolated Compliance Lifecycle Fixture
    needs: [d1_fixture, browser, renewal_fixture, renewal_browser]
    if: always() && needs.d1_fixture.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The run-owned R2 cleanup uses the root @aws-sdk/client-s3 dependency;
      # Wrangler D1 comes from the Worker installation.
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm --prefix worker-airtrust ci
      - name: Delete only verified run-owned certificate PDF keys
        id: r2_cleanup
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QA_LIFECYCLE_R2_ACCESS_KEY_ID: ${{ secrets.QA_LIFECYCLE_R2_ACCESS_KEY_ID }}
          QA_LIFECYCLE_R2_SECRET_ACCESS_KEY: ${{ secrets.QA_LIFECYCLE_R2_SECRET_ACCESS_KEY }}
          CONFIRM_STAGING_COMPLIANCE_LIFECYCLE_QA: AIRTRUST_STAGING_TRAINING_COMPLIANCE_LIFECYCLE_QA
        run: node scripts/staging/cleanup-qa-training-compliance-r2.mjs --apply --code="$QA_LIFECYCLE_CODE" --marker="$QA_LIFECYCLE_MARKER"
      - name: Soft-delete only this run's synthetic D1 artifacts
        if: always()
        env:
          QA_EXAMINER_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL || 'qa-examiner-admin@staging.airtrust.invalid' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_STAGING_COMPLIANCE_LIFECYCLE_QA: AIRTRUST_STAGING_TRAINING_COMPLIANCE_LIFECYCLE_QA
        run: node scripts/staging/seed-qa-training-compliance-lifecycle.mjs --rollback --apply --code="$QA_LIFECYCLE_CODE" --marker="$QA_LIFECYCLE_MARKER"
      - name: Enforce R2 deletion verification
        if: always()
        env:
          R2_CLEANUP_OUTCOME: ${{ steps.r2_cleanup.outcome }}
        run: test "$R2_CLEANUP_OUTCOME" = success

  summary:
    name: Compliance Lifecycle QA Summary
    needs: [guard, d1_fixture, browser, renewal_fixture, renewal_browser, d1_cleanup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish result
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          GUARD_RESULT: ${{ needs.guard.result }}
          FIXTURE_RESULT: ${{ needs.d1_fixture.result }}
          LIFECYCLE_RESULT: ${{ needs.browser.result }}
          RENEWAL_FIXTURE_RESULT: ${{ needs.renewal_fixture.result }}
          RENEWAL_BROWSER_RESULT: ${{ needs.renewal_browser.result }}
          CLEANUP_RESULT: ${{ needs.d1_cleanup.result }}
        run: |
          {
            echo '## Training Compliance lifecycle audit'
            echo ''
            echo "- staging SHA: \`$EXPECTED_DEPLOYED_SHA\`"
            echo "- schema + fixture seed: \`$FIXTURE_RESULT\`"
            echo "- lifecycle E2E: \`$LIFECYCLE_RESULT\`"
            echo "- renewal fixture: \`$RENEWAL_FIXTURE_RESULT\`"
            echo "- renewal cycle 2 + certificate PDF: \`$RENEWAL_BROWSER_RESULT\`"
            echo "- fixture cleanup: \`$CLEANUP_RESULT\`"
            echo "- production writes: \`none\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$GUARD_RESULT" == success && "$FIXTURE_RESULT" == success && "$LIFECYCLE_RESULT" == success && "$RENEWAL_FIXTURE_RESULT" == success && "$RENEWAL_BROWSER_RESULT" == success && "$CLEANUP_RESULT" == success ]]
