name: Staging Training Compliance Lifecycle QA

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_STAGING_TRAINING_COMPLIANCE_LIFECYCLE_QA to continue'
        required: true
        type: string
      expected_deployed_sha:
        description: 'Exact Worker/frontend SHA currently deployed to staging'
        required: true
        type: string

concurrency:
  group: staging-training-compliance-lifecycle-qa
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read

env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  STAGING_FRONTEND_BASE_URL: https://staging.airtrust.pages.dev
  STAGING_D1_NAME: airtrust-db-staging-baseline-20260701
  QA_LIFECYCLE_CODE: QA-COMP-LIFE-${{ github.run_id }}
  QA_LIFECYCLE_MARKER: QA_ONLY_TRAINING_COMPLIANCE_LIFECYCLE_${{ github.run_id }}

jobs:
  guard:
    name: Compliance Lifecycle QA Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate trusted staging provenance
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo MAIN_ONLY >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_STAGING_TRAINING_COMPLIANCE_LIFECYCLE_QA' ]] || { echo CONFIRMATION_REJECTED >&2; exit 1; }
          [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo EXPECTED_SHA_INVALID >&2; exit 1; }
          git cat-file -e "$EXPECTED_DEPLOYED_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_DEPLOYED_SHA" HEAD
          node scripts/ci/verify-release-gates.mjs
          node --input-type=module <<'NODE'
          const expected=String(process.env.EXPECTED_DEPLOYED_SHA).toLowerCase();
          const r=await fetch(`${process.env.STAGING_API_BASE_URL}/api/version`); if(!r.ok) throw new Error(`VERSION_HTTP_${r.status}`);
          const j=await r.json(); const sha=String(j?.data?.sourceSha||j?.sourceSha||'').toLowerCase();
          if(sha!==expected) throw new Error(`STAGING_WORKER_SHA_MISMATCH:${sha||'missing'}`);
          const {assertLiveFrontendShaFromOrigin}=await import('./e2e/lib/live-sha-guard.mjs');
          await assertLiveFrontendShaFromOrigin(process.env.STAGING_FRONTEND_BASE_URL,expected.slice(0,7));
          console.log(`TRAINING_COMPLIANCE_LIFECYCLE_PROVENANCE_OK=${expected}`);
          NODE

  d1_fixture:
    name: Seed Isolated Compliance Lifecycle Fixture
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm --prefix worker-airtrust ci
      - name: Validate schemas and seed lifecycle fixture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_STAGING_COMPLIANCE_LIFECYCLE_QA: AIRTRUST_STAGING_TRAINING_COMPLIANCE_LIFECYCLE_QA
        run: |
          set -euo pipefail
          bash scripts/staging/validate-0491-postconditions.sh --target="$STAGING_D1_NAME"
          bash scripts/staging/validate-0492-postconditions.sh --target="$STAGING_D1_NAME"
          bash scripts/staging/validate-0494-postconditions.sh --target="$STAGING_D1_NAME"
          node scripts/staging/seed-qa-training-compliance-lifecycle.mjs --code="$QA_LIFECYCLE_CODE" --marker="$QA_LIFECYCLE_MARKER"
          node scripts/staging/seed-qa-training-compliance-lifecycle.mjs --apply --code="$QA_LIFECYCLE_CODE" --marker="$QA_LIFECYCLE_MARKER"

  browser:
    name: Authenticated Compliance Lifecycle E2E
    needs: [guard, d1_fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      RELEASE_SHA: ${{ inputs.expected_deployed_sha }}
      AUDIT_PROFILE: training-compliance-lifecycle
      E2E_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      E2E_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run write-capable staging lifecycle simulation
        run: npx playwright test --config=e2e/frontend-pr-ui-qa.config.ts
      - name: Upload sanitized lifecycle result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-training-compliance-lifecycle-${{ github.run_id }}
          path: test-results/frontend-pr-ui-qa/results.json
          if-no-files-found: warn
          retention-days: 14

  d1_cleanup:
    name: Cleanup Isolated Compliance Lifecycle Fixture
    needs: [d1_fixture, browser]
    if: always() && needs.d1_fixture.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm --prefix worker-airtrust ci
      - name: Soft-delete only this run's synthetic artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_STAGING_COMPLIANCE_LIFECYCLE_QA: AIRTRUST_STAGING_TRAINING_COMPLIANCE_LIFECYCLE_QA
        run: node scripts/staging/seed-qa-training-compliance-lifecycle.mjs --rollback --apply --code="$QA_LIFECYCLE_CODE" --marker="$QA_LIFECYCLE_MARKER"

  summary:
    name: Compliance Lifecycle QA Summary
    needs: [guard, d1_fixture, browser, d1_cleanup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish result
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          {
            echo '## Training Compliance lifecycle audit'
            echo ''
            echo "- staging SHA: \`$EXPECTED_DEPLOYED_SHA\`"
            echo '- schema + fixture seed: `${{ needs.d1_fixture.result }}`'
            echo '- lifecycle E2E: `${{ needs.browser.result }}`'
            echo '- fixture cleanup: `${{ needs.d1_cleanup.result }}`'
            echo '- production writes: `none`'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ '${{ needs.guard.result }}' == success && '${{ needs.d1_fixture.result }}' == success && '${{ needs.browser.result }}' == success && '${{ needs.d1_cleanup.result }}' == success ]]
