name: Staging FRMS Schema Doctor (Read Only)

# Proves — read-only — that FRMS migrations 0463 (IOGP) and 0464 (parameter
# governance) are structurally present in the staging D1, so that
# resolveFrmsOperationalContext can run. No migration is applied, no SQL is
# mutated, no Worker/Pages deploy happens, production is never a target.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_STAGING_FRMS_SCHEMA_DOCTOR to continue'
        required: true
        type: string
      expected_deployed_sha:
        description: 'Exact 40-hex commit SHA currently deployed to the staging Worker (NOT necessarily current main)'
        required: true
        type: string

concurrency:
  group: staging-frms-schema-doctor
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  ALLOWED_STAGING_DB_NAME: airtrust-db-staging-baseline-20260701
  ALLOWED_STAGING_DB_ID: bf9963f4-eb12-439b-a830-20bbf577ac22
  BLOCKED_PRODUCTION_DB_ID: 7c8a788e-a4c4-4d5d-8208-ff7ff55e84ae

jobs:
  guard:
    name: Read-only doctor guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate staging-only dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == 'refs/heads/main' ]] || { echo 'MAIN_ONLY' >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_STAGING_FRMS_SCHEMA_DOCTOR' ]] || { echo 'CONFIRMATION_REJECTED' >&2; exit 1; }
          [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'EXPECTED_DEPLOYED_SHA_INVALID' >&2; exit 1; }
          # Intentionally NOT asserting EXPECTED_DEPLOYED_SHA == github.sha: after
          # this doctor's own PR merges, github.sha moves forward while staging
          # still serves the older release. The live staging provenance check
          # below is the real gate.
          echo "WORKFLOW_MAIN_SHA=$WORKFLOW_MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "DEPLOYED_STAGING_SHA=$EXPECTED_DEPLOYED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require staging Worker to serve the expected deployed SHA
        shell: bash
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expected = String(process.env.EXPECTED_DEPLOYED_SHA || '').toLowerCase();
          const base = process.env.STAGING_API_BASE_URL;
          const response = await fetch(`${base}/api/version`, { headers: { Accept: 'application/json' } });
          if (!response.ok) throw new Error(`STAGING_VERSION_HTTP_${response.status}`);
          const version = await response.json();
          const sourceSha = String(version?.sourceSha ?? version?.data?.sourceSha ?? '').toLowerCase();
          const environment = String(version?.environment ?? version?.data?.environment ?? '');
          if (sourceSha !== expected) throw new Error(`STAGING_WORKER_SHA_MISMATCH:${sourceSha || 'missing'}`);
          if (environment !== 'staging') throw new Error(`STAGING_ENV_MISMATCH:${environment || 'missing'}`);
          console.log(`STAGING_PROVENANCE_OK sourceSha=${sourceSha} environment=staging`);
          NODE

  doctor:
    name: Read-only FRMS schema doctor (staging D1)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install worker dependencies
        run: npm --prefix worker-airtrust ci

      - name: Run read-only FRMS schema doctor against staging D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          STAGING_D1_NAME: ${{ env.ALLOWED_STAGING_DB_NAME }}
          STAGING_D1_ID: ${{ env.ALLOWED_STAGING_DB_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'STAGING_D1_TOKEN_MISSING' >&2; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING' >&2; exit 1; }
          node scripts/staging/frms-schema-doctor-readonly.mjs | tee "$RUNNER_TEMP/frms-schema-doctor.json"
          {
            echo '## FRMS schema doctor (staging, read-only)'
            echo ''
            node -e '
              const fs = require("node:fs");
              const raw = fs.readFileSync(process.env.RUNNER_TEMP + "/frms-schema-doctor.json", "utf8");
              const start = raw.indexOf("{");
              const end = raw.lastIndexOf("}");
              const data = JSON.parse(raw.slice(start, end + 1));
              const v = data.verdict;
              for (const k of ["schema0463","schema0464","runtimeQueryAssignment","runtimeQueryRevision","runtimeQueryParameters","bootstrapReady","stagingSchemaParity"]) {
                console.log(`- ${k}: ${v[k]}`);
              }
              console.log(`- 0463_LEDGER: ${data.ledger.m0463}`);
              console.log(`- 0464_LEDGER: ${data.ledger.m0464}`);
              console.log(`- LEGACY_ACTIVE_REVISION_COUNT: ${data.bootstrap.legacyActiveRevisionCount}`);
              console.log(`- LEGACY_PARAMETER_COUNT: ${data.bootstrap.legacyParameterCount}`);
              console.log(`- required keys present: ${data.bootstrap.requiredKeysPresent}/${data.bootstrap.requiredParameterKeyCount}`);
              if (v.missingObjects.length) console.log(`- MISSING_OBJECTS: ${v.missingObjects.join(", ")}`);
              if (v.missingColumns.length) console.log(`- MISSING_COLUMNS: ${v.missingColumns.join(", ")}`);
              if (v.missingIndexes.length) console.log(`- MISSING_INDEXES: ${v.missingIndexes.join(", ")}`);
              if (v.bootstrapMissing.length) console.log(`- BOOTSTRAP_MISSING: ${v.bootstrapMissing.join(", ")}`);
              if (v.missingMigrationsCandidates.length) console.log(`- MISSING_MIGRATIONS_CANDIDATES: ${v.missingMigrationsCandidates.join(", ")}`);
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frms-schema-doctor-${{ github.run_id }}
          path: ${{ runner.temp }}/frms-schema-doctor.json
          if-no-files-found: warn
          retention-days: 14
