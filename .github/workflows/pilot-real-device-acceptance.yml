name: Pilot Physical Device Acceptance (source and evidence lineage)
# Read-only: physical evidence is committed AFTER staging the exact code SHA.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'docs/pilot/PILOT_REAL_DEVICE_ACCEPTANCE_EVIDENCE.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  pilot-physical-acceptance:
    name: Pilot Physical Device Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact evidence PR HEAD without saved credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Prove HEAD and same-repository open PR
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$PR_HEAD" ]] || { echo 'PILOT_PR_CHECKOUT_SHA_MISMATCH' >&2; exit 1; }
          node --input-type=module <<'NODE'
          const response=await fetch(
            'https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/pulls/'+process.env.PR_NUMBER,
            {headers:{authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json'}}
          );
          if(!response.ok)throw Error('PILOT_REVIEWED_PR_LOOKUP_FAILED');
          const pr=await response.json();
          if(pr.state!=='open'||pr.base?.ref!=='main'||
             pr.head?.repo?.full_name!==process.env.GITHUB_REPOSITORY||
             pr.head?.repo?.fork||pr.head?.sha!==process.env.PR_HEAD)
            throw Error('PILOT_ACCEPTANCE_PR_HEAD_MISMATCH');
          console.log('PILOT_ACCEPTANCE_REVIEWED_PR_HEAD=PASS');
          NODE
      - name: Validate staged ancestor, evidence-only delta and 90 physical cases
        shell: bash
        id: candidate
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          evidence='docs/pilot/PILOT_REAL_DEVICE_ACCEPTANCE_EVIDENCE.json'
          test -f "$evidence"
          RELEASE_SHA="$(node -p "require('./$evidence').staging_release_sha")"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'PILOT_STAGE_SHA_INVALID' >&2; exit 1; }
          git cat-file -e "$RELEASE_SHA^{commit}" 2>/dev/null || git fetch --quiet --no-tags origin "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "$PR_HEAD" ||
            { echo 'PILOT_STAGED_SHA_NOT_ANCESTOR' >&2; exit 1; }
          changed="$(git diff --name-only "$RELEASE_SHA" "$PR_HEAD")"
          [[ "$changed" == "$evidence" ]] ||
            { echo 'PILOT_RUNTIME_DELTA_AFTER_STAGING_DENIED' >&2; exit 1; }
          node scripts/ci/pilot-real-device-evidence.mjs --release-sha "$RELEASE_SHA"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo 'PILOT_EVIDENCE_ONLY_DELTA=PASS'
      - name: Verify live staging Worker SHA and Pages asset provenance
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.release_sha }}
          STAGING_WORKER_VERSION_URL: https://airtrust-api-staging.airtrust.workers.dev/api/version
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const sha=process.env.RELEASE_SHA;
          const evidence=JSON.parse(readFileSync('docs/pilot/PILOT_REAL_DEVICE_ACCEPTANCE_EVIDENCE.json','utf8'));
          const pages=new URL(evidence.staging_pages_url);
          if (!/^[0-9a-f]{40}$/.test(sha) || pages.protocol!=='https:' ||
              !/^(?:[a-z0-9-]+\.)?airtrust\.pages\.dev$/.test(pages.hostname) ||
              pages.username || pages.password || pages.search || pages.hash ||
              pages.pathname !== '/') throw Error('PILOT_STAGING_TARGET_INVALID');
          const v=await fetch(process.env.STAGING_WORKER_VERSION_URL,{signal:AbortSignal.timeout(12000)});
          if (!v.ok || !(await v.text()).includes(sha)) throw Error('PILOT_STAGING_WORKER_SHA_MISMATCH');
          // The Pages asset must be byte-identical to the exact candidate.
          execFileSync('git',['fetch','--quiet','origin',sha],{timeout:30000});
          const paths=execFileSync('git',['ls-tree','-r','--name-only',sha,'public/pilot']).toString().trim().split('\n');
          if(paths.length<10 || paths.length>60) throw Error('PILOT_STAGING_SOURCE_ASSET_SET_INVALID');
          const blob=content=>createHash('sha1')
            .update(Buffer.from('blob '+content.length)).update(Buffer.from([0]))
            .update(content).digest('hex');
          for (const path of paths) {
            if(!path.startsWith('public/pilot/'))throw Error('PILOT_ASSET_PATH_INVALID');
            const source=execFileSync('git',['show',sha+':'+path],{maxBuffer:20*1024*1024});
            const url=new URL('/'+path.slice('public/'.length),pages);
            const response=await fetch(url,{signal:AbortSignal.timeout(12000)});
            if(!response.ok)throw Error('PILOT_STAGING_PAGES_ASSET_UNAVAILABLE:'+path);
            const live=Buffer.from(await response.arrayBuffer());
            if(blob(source)!==blob(live))throw Error('PILOT_STAGING_PAGES_SOURCE_SHA_MISMATCH:'+path);
          }
          console.log('PILOT_STAGING_WORKER_AND_PAGES_PROVENANCE_PASS '+sha+' assets='+paths.length);
          NODE
