name: Production Document Integrity Recovery 20260929

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA reviewed for this repair
        required: true
        type: string
      mode:
        description: dry-run is read-only; apply performs only the reviewed restore/soft-delete set
        required: true
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirmation:
        description: Exact confirmation required by the selected mode
        required: true
        type: string
      reviewed_dry_run_run_id:
        description: Required for apply; successful dry-run run on this same SHA
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: production-document-integrity-recovery-20260929
  cancel-in-progress: false

jobs:
  repair:
    name: Governed Production Document Integrity Recovery
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Validate immutable dispatch
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo MAIN_REF_REQUIRED >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo EXPECTED_SHA_INVALID >&2; exit 1; }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo EXPECTED_SHA_MISMATCH >&2; exit 1; }
          if [[ "$MODE" == dry-run ]]; then
            [[ "$CONFIRMATION" == AIRTRUST_PRODUCTION_DRYRUN_DOCUMENT_INTEGRITY_RECOVERY_20260929 ]] || { echo DRYRUN_CONFIRMATION_REQUIRED >&2; exit 1; }
          elif [[ "$MODE" == apply ]]; then
            [[ "$CONFIRMATION" == AIRTRUST_PRODUCTION_APPLY_DOCUMENT_INTEGRITY_RECOVERY_20260929 ]] || { echo APPLY_CONFIRMATION_REQUIRED >&2; exit 1; }
          else
            echo INVALID_MODE >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker-airtrust/package-lock.json
      - run: npm --prefix worker-airtrust ci

      - name: Verify official release gates on exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-release-gates.mjs

      - name: Require production D1 credential
        env:
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$D1_TOKEN" ]] || { echo PRODUCTION_D1_TOKEN_MISSING >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo CLOUDFLARE_ACCOUNT_ID_MISSING >&2; exit 1; }

      - name: Verify reviewed dry-run predecessor and load exact candidate set
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN: ${{ inputs.reviewed_dry_run_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_RUN" =~ ^[1-9][0-9]*$ ]] || { echo REVIEWED_DRY_RUN_RUN_ID_REQUIRED >&2; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN")"
          [[ "$(jq -r .name <<<"$run_json")" == 'Production Document Integrity Recovery 20260929' ]] || { echo REVIEWED_WORKFLOW_MISMATCH >&2; exit 1; }
          [[ "$(jq -r .conclusion <<<"$run_json")" == success ]] || { echo REVIEWED_DRY_RUN_NOT_SUCCESSFUL >&2; exit 1; }
          [[ "$(jq -r .head_sha <<<"$run_json")" == "$EXPECTED_SHA" ]] || { echo REVIEWED_DRY_RUN_SHA_MISMATCH >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/reviewed"
          gh run download "$REVIEWED_RUN" --repo "$GITHUB_REPOSITORY" --name "production-document-integrity-recovery-dry-run-$EXPECTED_SHA" --dir "$RUNNER_TEMP/reviewed"
          evidence="$RUNNER_TEMP/reviewed/result.json"
          test -s "$evidence"
          count="$(jq -r .candidate_count "$evidence")"
          hash="$(jq -r .candidate_hash "$evidence")"
          [[ "$count" =~ ^[1-9][0-9]*$ ]] || { echo REVIEWED_COUNT_INVALID >&2; exit 1; }
          [[ "$hash" =~ ^[0-9a-f]{64}$ ]] || { echo REVIEWED_HASH_INVALID >&2; exit 1; }
          echo "DOCUMENT_INTEGRITY_EXPECTED_COUNT=$count" >> "$GITHUB_ENV"
          echo "DOCUMENT_INTEGRITY_EXPECTED_HASH=$hash" >> "$GITHUB_ENV"
          echo "REVIEWED_DRY_RUN_VERIFIED=$REVIEWED_RUN count=$count hash=${hash:0:12}..." >> "$GITHUB_STEP_SUMMARY"

      - name: Capture D1 Time Travel recovery point
        if: ${{ inputs.mode == 'apply' }}
        working-directory: worker-airtrust
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          npx wrangler d1 time-travel info airtrust-db --env production --timestamp="$ts" > "$RUNNER_TEMP/recovery.txt"
          test -s "$RUNNER_TEMP/recovery.txt"
          echo "DOCUMENT_INTEGRITY_RECOVERY_TIMESTAMP_UTC=$ts" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/recovery.txt"

      - name: Execute reviewed document-integrity repair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCUMENT_INTEGRITY_RECOVERY_MODE: ${{ inputs.mode }}
          DOCUMENT_INTEGRITY_RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
          DOCUMENT_INTEGRITY_PRODUCTION_DB_NAME: airtrust-db
        run: |
          set -euo pipefail
          node scripts/production/recover-document-integrity-20260929.mjs "${{ inputs.mode }}" > "$RUNNER_TEMP/result.json"
          test -s "$RUNNER_TEMP/result.json"

      - name: Publish sanitized summary
        run: |
          set -euo pipefail
          jq '{mode,source_sha,empresa_id,restore_documents,known_missing_r2_documents,extra_auto_documents,stale_or_extra_auto_folder_rows,protected_manual_or_legacy_folder_rows,broken_current_certificate_links,candidate_count,candidate_hash,mutation_executed,postconditions_verified,post_restored_documents,post_extra_auto_documents,post_stale_or_extra_auto_folder_rows,post_broken_current_certificate_links,pii_emitted}' "$RUNNER_TEMP/result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v7
        with:
          name: production-document-integrity-recovery-${{ inputs.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error
          retention-days: 30
