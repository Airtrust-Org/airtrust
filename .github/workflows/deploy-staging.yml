name: Deploy Staging (Official)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_STAGING to continue'
        required: true
        type: string
      pr_number:
        description: 'Open, same-repository PR whose exact head SHA will be released'
        required: true
        type: string
      release_sha:
        description: 'Exact 40-character commit SHA from the reviewed PR head'
        required: true
        type: string
      deploy_worker:
        description: 'Deploy staging Worker'
        required: true
        type: boolean
        default: false
      deploy_frontend:
        description: 'Deploy staging frontend (Pages preview, staging branch)'
        required: true
        type: boolean
        default: false
      apply_migrations:
        description: 'Apply approved_migrations to staging D1 (one at a time, allowlisted)'
        required: true
        type: boolean
        default: false
      approved_migrations:
        description: 'Explicit migration filename(s) to apply, e.g. 0424_examiner_universal_training_fichas.sql'
        required: false
        type: string
      run_smoke:
        description: 'Run authenticated staging smoke after deploy/migration'
        required: true
        type: boolean
        default: false
      run_full_smoke:
        description: 'When run_smoke=true, run the full smoke chain (doctor + auth + examiner-training) instead of RDV CAS only'
        required: true
        type: boolean
        default: false
      release_reason:
        description: 'Why this staging release is needed'
        required: true
        type: string

concurrency:
  group: deploy-airtrust-staging
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

env:
  NODE_VERSION: '24'
  STAGING_CONFIRMATION: AIRTRUST_STAGING
  ALLOWED_STAGING_WORKER_NAME: airtrust-api-staging
  ALLOWED_STAGING_DB_NAME: airtrust-db-staging-baseline-20260701
  ALLOWED_STAGING_DB_ID: bf9963f4-eb12-439b-a830-20bbf577ac22
  BLOCKED_PRODUCTION_DB_ID: 7c8a788e-a4c4-4d5d-8208-ff7ff55e84ae
  BLOCKED_PRODUCTION_HOST: api.airtrust.online
  PAGES_PROJECT_NAME: airtrust
  PAGES_STAGING_BRANCH: staging
  WORKER_VERSION_ENDPOINT: https://airtrust-api-staging.airtrust.workers.dev/api/version

jobs:
  guard:
    name: Staging Release Guard
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_short_sha: ${{ steps.release.outputs.release_short_sha }}
      app_version: ${{ steps.release.outputs.app_version }}
      build_time: ${{ steps.release.outputs.build_time }}
    steps:
      - name: Validate staging dispatch inputs
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_REASON: ${{ inputs.release_reason }}
          DEPLOY_WORKER: ${{ inputs.deploy_worker }}
          DEPLOY_FRONTEND: ${{ inputs.deploy_frontend }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          APPROVED_MIGRATIONS: ${{ inputs.approved_migrations }}
          RUN_SMOKE: ${{ inputs.run_smoke }}
        run: |
          set -euo pipefail

          # Every input above is passed via `env:` and referenced as a shell
          # variable ($VAR), never spliced with workflow expressions into this
          # script body — GitHub Actions renders expressions into the
          # YAML-generated
          # script BEFORE bash parses it, so interpolating a free-text
          # workflow_dispatch input (release_reason, approved_migrations,
          # confirmation) directly here would be a script-injection hole.

          if [[ "$GIT_REF" != "refs/heads/main" ]]; then
            echo "Deploy Staging only runs from refs/heads/main. Current ref: $GIT_REF" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be exactly 40 hexadecimal characters." >&2
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pr_number must be a positive integer." >&2
            exit 1
          fi

          if [[ "$CONFIRMATION" != "${STAGING_CONFIRMATION}" ]]; then
            echo "confirmation must be exactly ${STAGING_CONFIRMATION} (not AIRTRUST_PRODUCTION — production confirmation is never valid here)." >&2
            exit 1
          fi

          if [[ -z "$RELEASE_REASON" ]]; then
            echo "release_reason is required." >&2
            exit 1
          fi

          if [[ "$DEPLOY_WORKER" != "true" && "$DEPLOY_FRONTEND" != "true" && "$APPLY_MIGRATIONS" != "true" && "$RUN_SMOKE" != "true" ]]; then
            echo "Select at least one action: deploy_worker, deploy_frontend, apply_migrations, or run_smoke." >&2
            exit 1
          fi

          if [[ "$APPLY_MIGRATIONS" == "true" && -z "$APPROVED_MIGRATIONS" ]]; then
            echo "apply_migrations=true requires approved_migrations to name the exact migration file(s)." >&2
            exit 1
          fi
          if [[ " $APPROVED_MIGRATIONS " == *' 0462_qualificacoes_tipos_codigo_tenant_active_unique.sql '* ]] && [[ " $APPROVED_MIGRATIONS " != *' 0461_refresh_tokens_empresa_id.sql 0462_qualificacoes_tipos_codigo_tenant_active_unique.sql '* ]]; then
            echo "0462 must follow 0461 immediately in this governed release." >&2
            exit 1
          fi

          export RELEASE_SHA="${RELEASE_SHA,,}"
          export PR_NUMBER
          export GITHUB_REPOSITORY
          export GITHUB_ACTOR
          node <<'NODE'
          (async () => {
          const api = 'https://api.github.com';
          const repo = process.env.GITHUB_REPOSITORY;
          const prNumber = process.env.PR_NUMBER;
          const releaseSha = process.env.RELEASE_SHA;
          const actor = process.env.GITHUB_ACTOR;
          const headers = {
            authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2022-11-28',
          };
          async function get(path) {
            const response = await fetch(`${api}${path}`, { headers });
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            return response.json();
          }
          const pr = await get(`/repos/${repo}/pulls/${prNumber}`);
          if (pr.base?.ref !== 'main') throw new Error('PR base must be main.');
          if (pr.head?.repo?.full_name !== repo || pr.head?.repo?.fork) throw new Error('PR_FROM_FORK_REJECTED');

          if (pr.state === 'open') {
            if (pr.head?.sha?.toLowerCase() !== releaseSha) throw new Error('OPEN_PR_HEAD_MISMATCH');
          } else if (pr.merged === true) {
            if (pr.merge_commit_sha?.toLowerCase() !== releaseSha) throw new Error('MERGED_PR_SHA_MISMATCH');
            const mainRef = await get(`/repos/${repo}/git/refs/heads/main`);
            if (mainRef.object?.sha?.toLowerCase() !== releaseSha) throw new Error('RELEASE_SHA_NOT_CURRENT_MAIN');
          } else {
            throw new Error('PR_NOT_OPEN_OR_MERGED');
          }
          const commit = await get(`/repos/${repo}/git/commits/${releaseSha}`);
          if (!commit?.sha) throw new Error('release_sha does not exist in this repository.');
          const permission = await get(`/repos/${repo}/collaborators/${actor}/permission`);
          if (!['write', 'push', 'maintain', 'admin'].includes(permission.permission)) {
            throw new Error('Workflow actor must have write, maintain, or admin permission.');
          }
          })().catch((error) => {
            console.error(`Reviewed PR release guard failed: ${error.message}`);
            process.exit(1);
          });
          NODE

      - name: Checkout trusted pipeline
        uses: actions/checkout@v4

      - name: Verify official release gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          export RELEASE_SHA="${RELEASE_SHA,,}"
          node scripts/ci/verify-release-gates.mjs

      - name: Compute trusted release metadata
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          build_time="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          release_sha="${RELEASE_SHA,,}"
          release_short_sha="${release_sha:0:7}"
          app_version="staging-${build_time}-${release_short_sha}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_short_sha=$release_short_sha" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"

      - name: Record release metadata
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_BUILD_TIME: ${{ steps.release.outputs.build_time }}
          RELEASE_REASON: ${{ inputs.release_reason }}
          DEPLOY_WORKER: ${{ inputs.deploy_worker }}
          DEPLOY_FRONTEND: ${{ inputs.deploy_frontend }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          APPROVED_MIGRATIONS: ${{ inputs.approved_migrations }}
          RUN_SMOKE: ${{ inputs.run_smoke }}
          RUN_FULL_SMOKE: ${{ inputs.run_full_smoke }}
        run: |
          set -euo pipefail
          {
            echo "## Staging release request"
            echo ""
            echo "- workflow_sha: \`$WORKFLOW_SHA\`"
            echo "- release_sha: \`$RELEASE_SHA\`"
            echo "- run_id: \`$RELEASE_RUN_ID\`"
            echo "- actor: \`$RELEASE_ACTOR\`"
            echo "- timestamp_utc: \`$RELEASE_BUILD_TIME\`"
            echo "- reason: $RELEASE_REASON"
            echo "- deploy_worker: $DEPLOY_WORKER"
            echo "- deploy_frontend: $DEPLOY_FRONTEND"
            echo "- apply_migrations: $APPLY_MIGRATIONS ($APPROVED_MIGRATIONS)"
            echo "- run_smoke: $RUN_SMOKE (full_smoke=$RUN_FULL_SMOKE)"
          } >> "$GITHUB_STEP_SUMMARY"

  production-target-guard:
    name: Block Any Production Target
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted pipeline (main)
        uses: actions/checkout@v4
      - name: Checkout release code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_sha }}
          fetch-depth: 0
          path: release
      - name: Assert no production identifiers anywhere in this workflow run
        shell: bash
        run: |
          set -euo pipefail
          # Defense in depth: this workflow file itself must never reference
          # production hosts/DB IDs outside of comments/guard checks.
          hits="$(grep -n "${BLOCKED_PRODUCTION_DB_ID}\|${BLOCKED_PRODUCTION_HOST}" .github/workflows/deploy-staging.yml | grep -v 'BLOCKED_PRODUCTION\|Block Any Production' || true)"
          if [[ -n "$hits" ]]; then
            echo "Production identifiers found where they should not be:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "No stray production identifiers in deploy-staging.yml."

  check-d1-backup-token:
    name: Check Backup Token
    needs: [guard]
    if: ${{ inputs.apply_migrations }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify token presence
        run: |
          if [[ -z "${{ secrets.CLOUDFLARE_D1_BACKUP_API_TOKEN }}" ]]; then
            exit 1
          fi

  check-d1-migration-token:
    name: Check Migration Token
    needs: [guard]
    if: ${{ inputs.apply_migrations }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify token presence
        run: |
          if [[ -z "${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}" ]]; then
            exit 1
          fi

  check-worker-token:
    name: Check Worker Token
    needs: [guard]
    if: ${{ inputs.deploy_worker }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify token presence
        run: |
          if [[ -z "${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}" ]]; then
            exit 1
          fi

  check-pages-token:
    name: Check Pages Token
    needs: [guard]
    if: ${{ inputs.deploy_frontend }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify token presence
        run: |
          if [[ -z "${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}" ]]; then
            exit 1
          fi

  check-smoke-secrets:
    name: Check Authenticated Smoke Secrets
    needs: [guard]
    if: ${{ inputs.run_smoke }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify canonical staging smoke credentials
        shell: bash
        env:
          STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in STAGING_SMOKE_EMAIL STAGING_SMOKE_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "Missing required staging smoke secret name(s): ${missing[*]}" >&2
            exit 1
          fi

  cloudflare-secret-readiness-gate:
    name: Cloudflare Secret Readiness Gate
    needs:
      [
        check-d1-backup-token,
        check-d1-migration-token,
        check-worker-token,
        check-pages-token,
        check-smoke-secrets,
      ]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      secret_gate_ok: ${{ steps.gate.outputs.secret_gate_ok }}
    steps:
      - id: gate
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          DEPLOY_WORKER: ${{ inputs.deploy_worker }}
          DEPLOY_FRONTEND: ${{ inputs.deploy_frontend }}
          BACKUP_TOKEN_RESULT: ${{ needs.check-d1-backup-token.result }}
          MIGRATION_TOKEN_RESULT: ${{ needs.check-d1-migration-token.result }}
          WORKER_TOKEN_RESULT: ${{ needs.check-worker-token.result }}
          PAGES_TOKEN_RESULT: ${{ needs.check-pages-token.result }}
          RUN_SMOKE: ${{ inputs.run_smoke }}
          SMOKE_SECRETS_RESULT: ${{ needs.check-smoke-secrets.result }}
        run: |
          ok="true"
          if [[ "$APPLY_MIGRATIONS" == "true" ]]; then
            if [[ "$BACKUP_TOKEN_RESULT" != "success" || "$MIGRATION_TOKEN_RESULT" != "success" ]]; then ok="false"; fi
          fi
          if [[ "$DEPLOY_WORKER" == "true" && "$WORKER_TOKEN_RESULT" != "success" ]]; then ok="false"; fi
          if [[ "$DEPLOY_FRONTEND" == "true" && "$PAGES_TOKEN_RESULT" != "success" ]]; then ok="false"; fi
          if [[ "$RUN_SMOKE" == "true" && "$SMOKE_SECRETS_RESULT" != "success" ]]; then ok="false"; fi
          echo "secret_gate_ok=$ok" >> "$GITHUB_OUTPUT"

  backup:
    name: Backup Staging D1 (verified, required before any migration)
    needs: [guard, production-target-guard, cloudflare-secret-readiness-gate]
    # Every upstream result is checked explicitly with always(), rather than
    # relying on the implicit success() GitHub Actions ANDs onto a job's `if`
    # by default — that implicit check treats a *skipped* direct need the
    # same as a failed one and silently skips this job too, even when every
    # condition that actually matters (apply_migrations=true, secret gate
    # green) is satisfied. See 2026-08-25 staging run 32891294444.
    if: >-
      ${{
        always() &&
        inputs.apply_migrations &&
        needs.guard.result == 'success' &&
        needs.production-target-guard.result == 'success' &&
        needs.cloudflare-secret-readiness-gate.result == 'success' &&
        needs.cloudflare-secret-readiness-gate.outputs.secret_gate_ok == 'true'
      }}
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      backup_ok: ${{ steps.backup.outputs.backup_ok }}
    steps:
      - name: Checkout trusted pipeline (main)
        uses: actions/checkout@v4
      - name: Checkout release code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_sha }}
          fetch-depth: 0
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run staging backup
        id: backup
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_STAGING_BACKUP: AIRTRUST_STAGING_BACKUP
        run: |
          set -euo pipefail
          npm --prefix worker-airtrust ci
          bash scripts/staging/backup-d1-staging.sh --apply --out-dir="$RUNNER_TEMP/staging-backups"
          echo "backup_ok=true" >> "$GITHUB_OUTPUT"

  preflight:
    name: Ledger Preflight (read-only, required before any migration)
    needs: [guard, production-target-guard, backup]
    if: >-
      ${{
        always() &&
        inputs.apply_migrations &&
        needs.guard.result == 'success' &&
        needs.production-target-guard.result == 'success' &&
        needs.backup.result == 'success' &&
        needs.backup.outputs.backup_ok == 'true'
      }}
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      preflight_ok: ${{ steps.preflight.outputs.preflight_ok }}
    steps:
      - name: Checkout trusted pipeline (main)
        uses: actions/checkout@v4
      - name: Checkout release code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_sha }}
          fetch-depth: 0
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run migration ledger preflight
        id: preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm --prefix worker-airtrust ci
          # Limit the read-only ledger decision to the migrations explicitly
          # requested for this release. Historical ledger drift outside this
          # scope must not block an otherwise governed release.
          node scripts/staging/migration-ledger-preflight.mjs --scope=0467,0468,0469,0470,0472,0475,0476,0477,0478,0479,0480
          echo "preflight_ok=true" >> "$GITHUB_OUTPUT"

  apply-migrations:
    name: Apply Approved Migrations (one at a time, allowlisted)
    needs: [guard, production-target-guard, backup, preflight]
    if: >-
      ${{
        always() &&
        inputs.apply_migrations &&
        needs.guard.result == 'success' &&
        needs.production-target-guard.result == 'success' &&
        needs.backup.result == 'success' &&
        needs.backup.outputs.backup_ok == 'true' &&
        needs.preflight.result == 'success' &&
        needs.preflight.outputs.preflight_ok == 'true'
      }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout trusted pipeline (main)
        uses: actions/checkout@v4
      - name: Checkout release code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_sha }}
          fetch-depth: 0
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Apply allowlisted migration(s)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_STAGING_BACKUP: AIRTRUST_STAGING_BACKUP
          CONFIRM_STAGING_MIGRATION: AIRTRUST_STAGING_MIGRATION_APPLY
          CONFIRM_STAGING_SCHEMA_CHANGE: AIRTRUST_STAGING_SCHEMA_CHANGE
          APPROVED_MIGRATIONS: ${{ inputs.approved_migrations }}
        run: |
          set -euo pipefail
          npm --prefix worker-airtrust ci
          # $APPROVED_MIGRATIONS is passed via env: above, never spliced with
          # workflow expressions into this script — word-splitting a trusted env var is
          # safe; interpolating a free-text workflow_dispatch input directly
          # into a `run:` body is a script-injection hole (fixed here).
          for migration in $APPROVED_MIGRATIONS; do
            bash scripts/staging/backup-d1-staging.sh --apply --out-dir="$RUNNER_TEMP/staging-backups"
            latest_backup="$(ls -t "$RUNNER_TEMP"/staging-backups/*.sql | head -n1)"
            if [[ "$migration" == 0461_* || "$migration" == 0462_* ]]; then
              bash scripts/staging/apply-approved-migration-with-recovery-point.sh --migration="release/worker-airtrust/migrations/$migration" --apply
            else
              bash scripts/staging/apply-approved-migrations.sh --migration="release/worker-airtrust/migrations/$migration" --backup-file="$latest_backup" --apply
            fi
          done

  postconditions:
    name: Validate Migration Postconditions
    needs: [guard, production-target-guard, apply-migrations]
    if: >-
      ${{
        always() &&
        inputs.apply_migrations &&
        needs.guard.result == 'success' &&
        needs.production-target-guard.result == 'success' &&
        needs.apply-migrations.result == 'success'
      }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout trusted pipeline (main)
        uses: actions/checkout@v4
      - name: Checkout release code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_sha }}
          fetch-depth: 0
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run postconditions validator
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPROVED_MIGRATIONS: ${{ inputs.approved_migrations }}
        run: |
          set -euo pipefail
          npm --prefix worker-airtrust ci
          for migration in $APPROVED_MIGRATIONS; do
            prefix=$(echo "$migration" | cut -d'_' -f1)
            validator="scripts/staging/validate-${prefix}-postconditions.sh"
            if [[ -f "$validator" ]]; then
              echo "Running specific validator for $migration: $validator"
              bash "$validator" --target="${ALLOWED_STAGING_DB_NAME}"
            else
              echo "No specific validator for $migration. Relying on applied ledger state."
            fi
          done

  release-write-gate:
    name: Release Write Gate
    needs: [cloudflare-secret-readiness-gate, backup, preflight, apply-migrations, postconditions]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      write_gate_ok: ${{ steps.gate.outputs.write_gate_ok }}
    steps:
      - id: gate
        env:
          SECRET_GATE_OK: ${{ needs.cloudflare-secret-readiness-gate.outputs.secret_gate_ok }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          BACKUP_RESULT: ${{ needs.backup.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          MIGRATION_RESULT: ${{ needs.apply-migrations.result }}
          POSTCONDITIONS_RESULT: ${{ needs.postconditions.result }}
        run: |
          if [[ "$SECRET_GATE_OK" != "true" ]]; then
            echo "write_gate_ok=false" >> "$GITHUB_OUTPUT"
          elif [[ "$APPLY_MIGRATIONS" == "false" || ("$BACKUP_RESULT" == "success" && "$PREFLIGHT_RESULT" == "success" && "$MIGRATION_RESULT" == "success" && "$POSTCONDITIONS_RESULT" == "success") ]]; then
            echo "write_gate_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "write_gate_ok=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-worker:
    name: Deploy Staging Worker
    needs: [guard, production-target-guard, release-write-gate]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        inputs.deploy_worker &&
        needs.release-write-gate.outputs.write_gate_ok == 'true'
      }}
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      worker_version_id: ${{ steps.capture.outputs.worker_version_id }}
      worker_bundle_sha256: ${{ steps.provenance.outputs.worker_bundle_sha256 }}
      release_manifest_sha256: ${{ steps.provenance.outputs.release_manifest_sha256 }}
    steps:
      - name: Checkout trusted pipeline (main)
        uses: actions/checkout@v4
      - name: Checkout release code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_sha }}
          fetch-depth: 0
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install root dependencies (worker source imports shared/root modules, e.g. zod)
        run: npm ci
        working-directory: release
      - name: Install worker dependencies
        run: npm ci
        working-directory: release/worker-airtrust

      - name: Prepare staging worker config with provenance
        shell: bash
        run: |
          set -euo pipefail
          node - "$PWD/release/worker-airtrust/wrangler.toml" "$PWD/release/worker-airtrust/wrangler.staging.toml" "${{ needs.guard.outputs.app_version }}" "${{ needs.guard.outputs.build_time }}" <<'NODE'
          const fs = require('fs');
          const [sourcePath, outputPath, version, buildTime] = process.argv.slice(2);
          const source = fs.readFileSync(sourcePath, 'utf8');
          const stagingStart = source.indexOf('[env.staging]');
          const productionStart = source.indexOf('\n[env.production]', stagingStart);
          const before = source.slice(0, stagingStart);
          const stagingBlock = source.slice(stagingStart, productionStart);
          const after = source.slice(productionStart);

          let patchedBlock = stagingBlock;
          if (/^APP_VERSION = ".*"$/m.test(patchedBlock)) {
            patchedBlock = patchedBlock.replace(/^APP_VERSION = ".*"$/m, `APP_VERSION = "${version}"`);
          } else {
            patchedBlock = patchedBlock.replace(
              /^ENVIRONMENT = "staging"$/m,
              `ENVIRONMENT = "staging"\nAPP_VERSION = "${version}"\nAPP_BUILD_TIME = "${buildTime}"`,
            );
          }
          if (/^APP_BUILD_TIME = ".*"$/m.test(patchedBlock)) {
            patchedBlock = patchedBlock.replace(/^APP_BUILD_TIME = ".*"$/m, `APP_BUILD_TIME = "${buildTime}"`);
          }

          fs.writeFileSync(outputPath, before + patchedBlock + after);
          NODE

      - name: Compute and stamp bundle/manifest provenance
        id: provenance
        shell: bash
        working-directory: release/worker-airtrust
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.release_sha }}
        run: |
          set -euo pipefail
          # Unique, never-reused output dir — a fixed/reusable bundle path is
          # exactly what let a stale tracked bundle answer requests in the
          # 2026-07-18 incident. Always created fresh and removed by the trap.
          bundle_dir="$(mktemp -d ./.tmp-worker-bundle-XXXXXX)"
          trap 'rm -rf "$bundle_dir"' EXIT

          npx wrangler deploy --env staging --config wrangler.toml --dry-run --outdir "$bundle_dir"

          bundle_file="$(find "$bundle_dir" -maxdepth 1 -name '*.js' | sort | head -n1)"
          if [[ -z "$bundle_file" ]]; then
            echo "No bundled Worker module found in $bundle_dir" >&2
            exit 1
          fi
          bundle_sha256="$(shasum -a 256 "$bundle_file" | awk '{print $1}')"
          source_sha="$SOURCE_SHA"
          source_tree="$(git rev-parse HEAD^{tree})"

          # First pass: stamp source SHA/tree + bundle hash. Config hash is
          # computed over the result of this pass, then stamped in a second,
          # minimal pass — the manifest never has to include its own hash.
          node ../../scripts/lib/patch-wrangler-env-vars.mjs \
            wrangler.staging.toml wrangler.staging.toml staging \
            "${{ needs.guard.outputs.app_version }}" "${{ needs.guard.outputs.build_time }}" \
            "$(node -e 'console.log(JSON.stringify({AIRTRUST_SOURCE_SHA: process.argv[1], AIRTRUST_SOURCE_TREE: process.argv[2], AIRTRUST_WORKER_BUNDLE_SHA256: process.argv[3]}))' "$source_sha" "$source_tree" "$bundle_sha256")"

          config_sha256="$(shasum -a 256 wrangler.staging.toml | awk '{print $1}')"

          manifest_file="$(mktemp)"
          trap 'rm -rf "$bundle_dir" "$manifest_file"' EXIT
          cat > "$manifest_file" <<JSON
          {
            "repository": "Airtrust-Org/airtrust",
            "sourceSha": "$source_sha",
            "sourceTree": "$source_tree",
            "environment": "staging",
            "workerBundleSha256": "$bundle_sha256",
            "wranglerConfigSha256": "$config_sha256",
            "nodeVersion": "$(node --version)",
            "npmVersion": "$(npm --version)",
            "wranglerVersion": "$(npx wrangler --version 2>/dev/null | tail -1)",
            "buildTimeUtc": "${{ needs.guard.outputs.build_time }}",
            "dirty": false
          }
          JSON
          manifest_sha256="$(shasum -a 256 "$manifest_file" | awk '{print $1}')"

          node ../../scripts/lib/patch-wrangler-env-vars.mjs \
            wrangler.staging.toml wrangler.staging.toml staging \
            "${{ needs.guard.outputs.app_version }}" "${{ needs.guard.outputs.build_time }}" \
            "$(node -e 'console.log(JSON.stringify({AIRTRUST_RELEASE_MANIFEST_SHA256: process.argv[1]}))' "$manifest_sha256")"

          echo "worker_bundle_sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"
          echo "release_manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "## Release provenance"
            echo "- source SHA: \`$source_sha\`"
            echo "- source tree: \`$source_tree\`"
            echo "- worker bundle SHA-256: \`$bundle_sha256\`"
            echo "- release manifest SHA-256: \`$manifest_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert staging config targets staging resources only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staging/assert-staging-worker-targets.py \
            --config release/worker-airtrust/wrangler.staging.toml \
            --allowed-worker-name "${ALLOWED_STAGING_WORKER_NAME}" \
            --blocked-production-worker-name "airtrust-api-production" \
            --allowed-db-name "${ALLOWED_STAGING_DB_NAME}" \
            --allowed-db-id "${ALLOWED_STAGING_DB_ID}" \
            --blocked-production-db-id "${BLOCKED_PRODUCTION_DB_ID}" \
            --allowed-bucket-name "airtrust-storage-staging" \
            --blocked-production-bucket-name "airtrust-storage" \
            --blocked-production-host "${BLOCKED_PRODUCTION_HOST}"

      - name: Deploy Worker (staging)
        shell: bash
        working-directory: release/worker-airtrust
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_BUNDLE_SHA256: ${{ steps.provenance.outputs.worker_bundle_sha256 }}
        run: |
          set -euo pipefail
          real_bundle_dir="$(mktemp -d ./.tmp-worker-bundle-XXXXXX)"
          trap 'rm -rf "$real_bundle_dir"' EXIT
          npx wrangler deploy --env staging --config wrangler.staging.toml --outdir "$real_bundle_dir" 2>&1 | tee "$RUNNER_TEMP/worker-deploy-staging.log"

          # Detection, not prevention: the vars (including the published
          # bundle hash) are already uploaded by the time this runs. A
          # mismatch means this deploy's published hash is unverified/wrong
          # and the run must be treated as suspect (redeploy or roll back),
          # not that the bad value never shipped.
          real_bundle_file="$(find "$real_bundle_dir" -maxdepth 1 -name '*.js' | sort | head -n1)"
          if [[ -z "$real_bundle_file" ]]; then
            echo "No bundled Worker module captured from the real deploy." >&2
            exit 1
          fi
          real_bundle_sha256="$(shasum -a 256 "$real_bundle_file" | awk '{print $1}')"
          if [[ "$real_bundle_sha256" != "$EXPECTED_BUNDLE_SHA256" ]]; then
            echo "Bundle hash mismatch: published ($EXPECTED_BUNDLE_SHA256) != real deploy ($real_bundle_sha256)" >&2
            exit 1
          fi
          echo "Real deploy bundle hash matches published hash: $real_bundle_sha256"

      - name: Capture worker release metadata
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          version_id="$(node scripts/parse-worker-version-id.mjs "$RUNNER_TEMP/worker-deploy-staging.log")"
          echo "worker_version_id=${version_id:-unavailable}" >> "$GITHUB_OUTPUT"

      - name: Smoke provenance (version endpoint must match SHA, never dev-local/latest/empty)
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.release_sha }}
          EXPECTED_BUNDLE_SHA256: ${{ steps.provenance.outputs.worker_bundle_sha256 }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          for i in $(seq 1 6); do
            curl -fsS -o "$body" "$WORKER_VERSION_ENDPOINT" || true
            if grep -q "${{ needs.guard.outputs.app_version }}" "$body"; then
              break
            fi
            sleep 10
          done
          cat "$body"
          grep -q "${{ needs.guard.outputs.app_version }}" "$body" || { echo "Provenance mismatch after deploy." >&2; exit 1; }
          grep -qE '"environment":"staging"' "$body" || { echo "Version endpoint did not report environment=staging." >&2; exit 1; }
          grep -qE '"version":"(dev-local|latest|main|)"' "$body" && { echo "Rejected placeholder version value." >&2; exit 1; } || true
          grep -q "\"sourceSha\":\"$SOURCE_SHA\"" "$body" || { echo "Source SHA mismatch after deploy." >&2; exit 1; }
          grep -q "\"workerBundleSha256\":\"$EXPECTED_BUNDLE_SHA256\"" "$body" || { echo "Worker bundle hash mismatch after deploy." >&2; exit 1; }

  deploy-frontend:
    name: Deploy Staging Frontend (Pages preview, staging branch)
    needs: [guard, production-target-guard, release-write-gate]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        inputs.deploy_frontend &&
        needs.release-write-gate.outputs.write_gate_ok == 'true'
      }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout trusted pipeline (main)
        uses: actions/checkout@v4
      - name: Checkout release code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_sha }}
          fetch-depth: 0
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: release
      - name: Build frontend against staging API
        run: npm run build
        working-directory: release
        env:
          VITE_APP_VERSION: ${{ needs.guard.outputs.app_version }}
          VITE_API_URL: https://airtrust-api-staging.airtrust.workers.dev/api
          APP_VERSION: ${{ needs.guard.outputs.app_version }}
          APP_BUILD_TIME: ${{ needs.guard.outputs.build_time }}
          VITE_DEV_PROXY_TARGET: https://airtrust-api-staging.airtrust.workers.dev
      - name: Stamp build version
        run: bash ../scripts/stamp-build-version.sh dist/client/index.html
        working-directory: release
        env:
          APP_VERSION: ${{ needs.guard.outputs.app_version }}
      - name: Assert never deploying to the production Pages branch
        shell: bash
        run: |
          if [[ "${PAGES_STAGING_BRANCH}" == "production" ]]; then
            echo "PAGES_STAGING_BRANCH must never be 'production'." >&2
            exit 1
          fi
      - name: Deploy Pages (staging preview branch)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy release/dist/client
            --project-name=${{ env.PAGES_PROJECT_NAME }}
            --branch=${{ env.PAGES_STAGING_BRANCH }}
            --commit-hash=${{ needs.guard.outputs.release_sha }}

  reseed-qa-examiner-fixture:
    name: Reseed Synthetic QA Examiner Fixture (staging D1)
    needs: [guard, production-target-guard, release-write-gate]
    if: >-
      ${{
        inputs.run_smoke &&
        inputs.run_full_smoke &&
        !failure() &&
        !cancelled() &&
        needs.release-write-gate.outputs.write_gate_ok == 'true'
      }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout trusted pipeline (main)
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Reseed only the synthetic qa_examiner_training fixture
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_STAGING_QA_SEED: AIRTRUST_STAGING_QA_SEED
          QA_EXAMINER_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL || 'qa-examiner-admin@staging.airtrust.invalid' }}
          QA_EXAMINER_ADMIN_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD || secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci
          npm --prefix worker-airtrust ci
          node scripts/staging/seed-qa-examiner-training.mjs --apply

  smoke:
    name: Authenticated Staging Smoke
    needs: [guard, production-target-guard, release-write-gate, deploy-worker, deploy-frontend, reseed-qa-examiner-fixture]
    if: >-
      ${{
        inputs.run_smoke &&
        !failure() &&
        !cancelled() &&
        needs.release-write-gate.outputs.write_gate_ok == 'true' &&
        (inputs.deploy_worker == false || needs.deploy-worker.result == 'success') &&
        (inputs.deploy_frontend == false || needs.deploy-frontend.result == 'success') &&
        (inputs.run_full_smoke == false || needs.reseed-qa-examiner-fixture.result == 'success')
      }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
      STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      QA_EXAMINER_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL || 'qa-examiner-admin@staging.airtrust.invalid' }}
      QA_EXAMINER_ADMIN_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD || secrets.STAGING_SMOKE_PASSWORD }}
    steps:
      - name: Checkout trusted pipeline (main)
        uses: actions/checkout@v4
      - name: Checkout release code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_sha }}
          fetch-depth: 0
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: RDV CAS smoke (targeted, single login)
        if: ${{ !inputs.run_full_smoke }}
        run: node scripts/staging/smoke-rdv-cas.mjs
      - name: Staging doctor + auth smoke
        if: ${{ inputs.run_full_smoke }}
        run: |
          npm run staging:doctor
          npm run smoke:staging:auth
      - name: Examiner-training smoke
        if: ${{ inputs.run_full_smoke }}
        run: node scripts/staging/smoke-examiner-training.mjs

  summary:
    name: Record Release Summary
    needs:
      [
        guard,
        check-d1-backup-token,
        check-d1-migration-token,
        check-worker-token,
        check-pages-token,
        cloudflare-secret-readiness-gate,
        backup,
        preflight,
        apply-migrations,
        postconditions,
        release-write-gate,
        deploy-worker,
        deploy-frontend,
        reseed-qa-examiner-fixture,
        smoke,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ needs.guard.outputs.release_sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_ACTOR: ${{ github.actor }}
          APPROVED_MIGRATIONS: ${{ inputs.approved_migrations }}
        run: |
          set -euo pipefail
          {
            echo "## Staging release outcome"
            echo ""
            echo "- workflow_sha: \`$WORKFLOW_SHA\`"
            echo "- release_sha: \`$RELEASE_SHA\`"
            echo "- run_id: \`$RELEASE_RUN_ID\`"
            echo "- actor: \`$RELEASE_ACTOR\`"
            echo "- Worker deployment ID: \`${{ needs.deploy-worker.outputs.worker_version_id || 'not-deployed' }}\`"
            echo "- Worker bundle SHA-256: \`${{ needs.deploy-worker.outputs.worker_bundle_sha256 || 'not-deployed' }}\`"
            echo "- Release manifest SHA-256: \`${{ needs.deploy-worker.outputs.release_manifest_sha256 || 'not-deployed' }}\`"
            echo "- Database: \`${{ env.ALLOWED_STAGING_DB_NAME }}\` / \`${{ env.ALLOWED_STAGING_DB_ID }}\`"
            echo "- Migrations requested: \`$APPROVED_MIGRATIONS\`"
            echo "- backup-token-check: ${{ needs.check-d1-backup-token.result }}"
            echo "- migration-token-check: ${{ needs.check-d1-migration-token.result }}"
            echo "- worker-token-check: ${{ needs.check-worker-token.result }}"
            echo "- pages-token-check: ${{ needs.check-pages-token.result }}"
            echo "- secret-readiness-gate: ${{ needs.cloudflare-secret-readiness-gate.outputs.secret_gate_ok }}"
            echo "- backup: ${{ needs.backup.result }}"
            echo "- preflight: ${{ needs.preflight.result }}"
            echo "- migration: ${{ needs.apply-migrations.result }}"
            echo "- postconditions: ${{ needs.postconditions.result }}"
            echo "- release-write-gate: ${{ needs.release-write-gate.outputs.write_gate_ok }}"
            echo "- Worker: ${{ needs.deploy-worker.result }}"
            echo "- Pages: ${{ needs.deploy-frontend.result }}"
            echo "- smoke: ${{ needs.smoke.result }}"
            echo "- rollback target (worker): previous staging deployment, see \`wrangler deployments list --name ${{ env.ALLOWED_STAGING_WORKER_NAME }}\`"
            echo ""
            if [[ "${{ needs.cloudflare-secret-readiness-gate.outputs.secret_gate_ok }}" != "true" || "${{ needs.release-write-gate.outputs.write_gate_ok }}" != "true" ]]; then
              echo "No production action was taken by this workflow run. **Release blocked by gates.**"
            else
              echo "No production action was taken by this workflow run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
