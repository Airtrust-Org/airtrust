name: Temporary Format PR 741

on:
  push:
    branches:
      - fix/audit-security-tenant-rbac-20260802

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-security-tenant-rbac-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format test and remove finalizer
        run: |
          npx prettier@3.9.6 --write worker-airtrust/src/__tests__/routes/simuladores-catalogo-rbac.test.ts
          git rm .github/workflows/tmp-format-pr-741.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker-airtrust/src/__tests__/routes/simuladores-catalogo-rbac.test.ts
          git commit -m "style(security): format simulator catalog RBAC test"
          git push origin HEAD:fix/audit-security-tenant-rbac-20260802
