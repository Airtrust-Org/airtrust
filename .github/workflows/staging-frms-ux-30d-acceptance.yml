name: Staging FRMS UX 30d Authenticated Acceptance

# Read-only browser acceptance for the already-provisioned 999013 synthetic
# tenant. Never creates users, inserts D1 rows, applies schema or deploys.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AIRTRUST_STAGING_FRMS_30D_ACCEPT
        required: true
        type: string
      expected_deployed_sha:
        description: Exact gated SHA being served by both staging Worker and Pages
        required: true
        type: string
      pr_number:
        description: Required only for an open same-repository PR SHA not yet merged into main
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: staging-frms-30d-readonly-acceptance
  cancel-in-progress: false

jobs:
  guard:
    name: Verify gated staging provenance and no writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require approved staging release ancestor and matching Worker/Pages
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SHA: ${{ inputs.expected_deployed_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$CONFIRMATION" == AIRTRUST_STAGING_FRMS_30D_ACCEPT ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" "$GITHUB_SHA"; then
            # Permit only a live reviewed PR from this repository, never arbitrary
            # or fork-supplied SHAs. The eight official checks are still mandatory.
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'REVIEWED_PR_REQUIRED'; exit 1; }
            node --input-type=module <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY;
          const number=process.env.PR_NUMBER;
          const expected=process.env.EXPECTED_SHA;
          const r=await fetch('https://api.github.com/repos/'+repo+'/pulls/'+number,{
            headers:{
              authorization:'Bearer '+process.env.GITHUB_TOKEN,
              accept:'application/vnd.github+json',
              'x-github-api-version':'2022-11-28',
            },
          });
          if(!r.ok) throw Error('REVIEWED_FRMS_PR_UNAVAILABLE');
          const pr=await r.json();
          if(pr.state!=='open'||pr.base?.ref!=='main'||
             pr.head?.repo?.full_name!==repo||pr.head?.repo?.fork||
             pr.head?.sha?.toLowerCase()!==expected) {
            throw Error('REVIEWED_FRMS_PR_SHA_ORIGIN_MISMATCH');
          }
          console.log('REVIEWED_FRMS_PR_SHA_ORIGIN=PASS');
          NODE
          fi
          node scripts/ci/verify-release-gates.mjs
          node --input-type=module <<'NODE'
          const sha=process.env.EXPECTED_SHA;
          const api=await fetch('https://airtrust-api-staging.airtrust.workers.dev/api/version',{headers:{'Cache-Control':'no-cache'}});
          if(!api.ok) throw Error('STAGING_WORKER_VERSION_UNAVAILABLE');
          const data=await api.json();
          if(data?.data?.sourceSha!==sha || data?.data?.environment!=='staging') throw Error('STAGING_WORKER_SHA_MISMATCH');
          const page=await fetch('https://staging.airtrust.pages.dev/',{headers:{'Cache-Control':'no-cache'}});
          if(!page.ok || !(await page.text()).includes(sha.slice(0,7))) throw Error('STAGING_PAGES_SHA_MISMATCH');
          console.log('FRMS_STAGING_30D_PROVENANCE_PASS');
          NODE

  browser:
    name: Authenticated synthetic FRMS operational UX
    needs: guard
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://staging.airtrust.pages.dev
      STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Require staging-only credential pair
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$STAGING_SMOKE_EMAIL" && -n "$STAGING_SMOKE_PASSWORD" ]] || { echo STAGING_QA_CREDENTIAL_PAIR_MISSING; exit 1; }
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspect Operação, Casos, Manutenção and Relatórios, read-only
        run: npx playwright test e2e/staging-frms-ux-30d-acceptance.spec.ts --project=chromium --no-deps
      - name: Preserve synthetic-only main-panel screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-frms-ux-30d-acceptance-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore
