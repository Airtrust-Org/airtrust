name: Frontend coverage diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-coverage-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  VITE_API_URL: http://127.0.0.1:8787

jobs:
  coverage-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main --quiet
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker-airtrust/package-lock.json
      - run: npm ci
      - run: npm --prefix worker-airtrust ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3
      - id: coverage
        name: Run exact frontend coverage and capture output
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee frontend-coverage-output.log
      - name: Upload frontend coverage output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-output-${{ github.event.pull_request.head.sha || github.sha }}
          path: frontend-coverage-output.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve coverage gate result
        if: steps.coverage.outcome != 'success'
        run: exit 1
