name: Temporary PR880 focused test formatting
on:
  push:
    branches: [feat/ead-auto-enrollment-email-mel-manutencao]
    paths: [.github/workflows/pr880-format-tests-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: |
          npx --yes prettier@3.9.6 --write \
            worker-airtrust/src/__tests__/lms-mel-manutencao.test.ts \
            worker-airtrust/src/__tests__/cron/scheduled-handler-renovacao-lms.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-airtrust/src/__tests__/lms-mel-manutencao.test.ts worker-airtrust/src/__tests__/cron/scheduled-handler-renovacao-lms.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(test): format PR880 focused regressions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
