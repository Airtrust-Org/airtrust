name: 🔍 PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: 🧪 Check PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Validate workflow guard tests
        run: node --test scripts/ci/check-github-workflow-contexts.test.mjs

      - name: Validate workflow contracts
        run: node scripts/ci/check-github-workflow-contexts.mjs

      - name: Validate staging QA script syntax
        run: node --check scripts/qa/staging-runtime-fichas-lms-qa.mjs

      - name: Validate frontend PR UI QA guard scripts and tests
        run: |
          for f in \
            scripts/ci/verify-frontend-pr-qa-provenance.mjs \
            scripts/ci/frontend-pr-qa-summarize.mjs \
            scripts/ci/assert-live-frontend-sha.mjs \
            e2e/lib/read-only-network-guard.mjs \
            e2e/lib/live-sha-guard.mjs \
            e2e/lib/credential-pair.mjs; do
            node --check "$f"
          done
          node --test \
            scripts/ci/verify-frontend-pr-qa-provenance.test.mjs \
            scripts/ci/frontend-pr-qa-summarize.test.mjs \
            e2e/lib/read-only-network-guard.test.mjs \
            e2e/lib/live-sha-guard.test.mjs \
            e2e/lib/credential-pair.test.mjs

      - name: ✅ PR checks are structurally valid
        run: |
          echo "PR: ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.actor }}"
          echo "URL: ${{ github.event.pull_request.html_url }}"
