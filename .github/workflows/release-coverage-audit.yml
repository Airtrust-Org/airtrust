name: Release Coverage Audit (Read-only)

on:
  workflow_dispatch:
    inputs:
      fail_on_unpublished:
        description: 'Fail if any recent merged PR is not proved deployed'
        type: boolean
        required: false
        default: false
      scope:
        description: 'recent = fast daily window; historical = bounded one-year inventory'
        type: choice
        required: false
        default: recent
        options:
          - recent
          - historical
          - historical-batch
      anchor_utc:
        description: 'Immutable UTC merge cutoff for historical-batch (YYYY-MM-DDTHH:MM:SSZ)'
        type: string
        required: false
      batch_offset:
        description: 'Historical-batch offset in merge-time descending candidate list (0, 80, 160...)'
        type: string
        required: false
  schedule:
    - cron: '15 11 * * *'
  workflow_run:
    workflows: ['Deploy AirTrust']
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-coverage-audit
  cancel-in-progress: true

jobs:
  release-coverage:
    # Release checks run immediately after a successful official production deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Contract tests (no network)
        run: node --test scripts/__tests__/release-coverage-audit.test.mjs
      - name: Compare public runtime and recent merged PR histories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAIL_ON_UNPUBLISHED: ${{ inputs.fail_on_unpublished || 'false' }}
          RELEASE_AUDIT_SCOPE: ${{ inputs.scope || 'recent' }}
          RELEASE_AUDIT_ANCHOR_UTC: ${{ inputs.anchor_utc || '' }}
          RELEASE_AUDIT_BATCH_OFFSET: ${{ inputs.batch_offset || '' }}
          RELEASE_AUDIT_ARTIFACT: ${{ runner.temp }}/release-coverage-batch.json
        run: node scripts/ops/release-coverage-audit.mjs
      - name: Preserve sanitized historical-batch evidence
        if: ${{ inputs.scope == 'historical-batch' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-coverage-batch-${{ github.run_id }}
          path: ${{ runner.temp }}/release-coverage-batch.json
          retention-days: 30
          if-no-files-found: error
