name: Staging Audit 201 UI QA

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_STAGING_AUDIT_201_QA to continue'
        required: true
        type: string
      expected_sha:
        description: 'Exact current main SHA already deployed to staging'
        required: true
        type: string

concurrency:
  group: staging-audit-201-ui-qa
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  STAGING_FRONTEND_BASE_URL: https://staging.airtrust.pages.dev

jobs:
  guard:
    name: Staging Audit 201 UI Guard
    runs-on: ubuntu-latest
    steps:
      - name: Validate staging-only dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == 'refs/heads/main' ]] || { echo 'MAIN_ONLY' >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_STAGING_AUDIT_201_QA' ]] || { echo 'CONFIRMATION_REJECTED' >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'EXPECTED_SHA_INVALID' >&2; exit 1; }
          [[ "${EXPECTED_SHA,,}" == "${EVENT_SHA,,}" ]] || { echo 'EXPECTED_SHA_NOT_CURRENT_MAIN' >&2; exit 1; }
          [[ "$STAGING_API_BASE_URL" == 'https://airtrust-api-staging.airtrust.workers.dev' ]] || exit 1
          [[ "$STAGING_FRONTEND_BASE_URL" == 'https://staging.airtrust.pages.dev' ]] || exit 1

      - uses: actions/checkout@v4

      - name: Require Worker and frontend provenance to match expected SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expected = String(process.env.EXPECTED_SHA || '').toLowerCase();

          const versionResponse = await fetch(`${process.env.STAGING_API_BASE_URL}/api/version`, {
            headers: { Accept: 'application/json' },
          });
          if (!versionResponse.ok) throw new Error(`STAGING_VERSION_HTTP_${versionResponse.status}`);
          const version = await versionResponse.json();
          const sourceSha = String(version?.sourceSha ?? version?.data?.sourceSha ?? '').toLowerCase();
          if (sourceSha !== expected) {
            throw new Error(`STAGING_WORKER_SHA_MISMATCH:${sourceSha || 'missing'}`);
          }

          const frontendResponse = await fetch(`${process.env.STAGING_FRONTEND_BASE_URL}/`, {
            headers: { Accept: 'text/html' },
          });
          if (!frontendResponse.ok) throw new Error(`STAGING_FRONTEND_HTTP_${frontendResponse.status}`);
          const html = await frontendResponse.text();
          if (!html.toLowerCase().includes(expected.slice(0, 7))) {
            throw new Error('STAGING_FRONTEND_SHA_MISMATCH');
          }

          console.log(`STAGING_AUDIT_201_PROVENANCE_SHA=${expected}`);
          NODE

  ui-audit:
    name: Authenticated Cross-Module Browser Audit
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      BASE_URL: https://staging.airtrust.pages.dev
      E2E_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      E2E_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Require canonical staging browser credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$E2E_EMAIL" ]] || { echo 'STAGING_SMOKE_EMAIL_MISSING' >&2; exit 1; }
          [[ -n "$E2E_PASSWORD" ]] || { echo 'STAGING_SMOKE_PASSWORD_MISSING' >&2; exit 1; }

      - run: npm ci

      - name: Install Chromium for sanctioned staging browser QA
        run: npx playwright install --with-deps chromium

      - name: Traverse audit surface exhaustively read-only
        run: npx playwright test e2e/staging-audit-201.spec.ts --project=chromium

      - name: Publish sanitized audit summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Audit #201 staging browser regression'
            echo ''
            echo '- exact staging provenance guard: PASS'
            echo '- authenticated canonical-route traversal in light/dark: PASS'
            echo '- recursive accessible link/subroute discovery with no silent truncation: PASS'
            echo '- tabs, search/empty-state, filters, pagination and date navigation: PASS'
            echo '- read-only details/modal inspection and disabled-state inspection: PASS'
            echo '- representative 375px horizontal-overflow checks: PASS'
            echo '- visible raw internal enum/ID and SQL/D1/stack/runtime leakage guard: PASS'
            echo '- staging API 5xx guard during audited routes/interactions: PASS'
            echo '- product mutation actions executed by browser audit: none'
            echo '- credentials emitted: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-audit-201-ui-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  qa-result:
    name: Staging Audit 201 UI QA Passed
    needs: [guard, ui-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require sanctioned UI audit jobs
        shell: bash
        env:
          GUARD: ${{ needs.guard.result }}
          UI_AUDIT: ${{ needs.ui-audit.result }}
        run: |
          set -euo pipefail
          echo "guard=$GUARD ui_audit=$UI_AUDIT"
          [[ "$GUARD" == 'success' ]]
          [[ "$UI_AUDIT" == 'success' ]]
          echo 'STAGING_AUDIT_201_UI_QA_PASS'
