name: Production LMS SCORM Review Readonly
on:
  workflow_dispatch:
    inputs:
      expected_production_sha: {description: 'Exact production Worker SHA', required: true, type: string}
      matricula_id: {description: 'Enrollment ID', required: true, type: string}
      expected_candidate_id: {description: 'Expected active SCORM candidate UUID', required: true, type: string}
      confirmation: {description: 'Type AIRTRUST_PRODUCTION_SCORM_REVIEW_READONLY', required: true, type: string}
permissions: {contents: read, checks: read, statuses: read}
concurrency: {group: production-lms-scorm-review-readonly, cancel-in-progress: false}
env: {NODE_VERSION: '24', PROD_API_BASE_URL: 'https://api.airtrust.online'}
jobs:
  review:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - name: Guard target
        env: {EXPECTED: '${{ inputs.expected_production_sha }}', CONFIRM: '${{ inputs.confirmation }}'}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CONFIRM" == AIRTRUST_PRODUCTION_SCORM_REVIEW_READONLY ]]
          live="$(curl -fsS https://api.airtrust.online/api/version | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).data.sourceSha))")"
          [[ "$live" == "$EXPECTED" ]]
      - name: Authenticated read-only SCORM review probe
        env:
          E2E_EMAIL: '${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}'
          E2E_PASSWORD: '${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}'
          MATRICULA_ID: '${{ inputs.matricula_id }}'
          EXPECTED_CANDIDATE_ID: '${{ inputs.expected_candidate_id }}'
        run: node scripts/validation/production-lms-scorm-review-readonly.mjs
