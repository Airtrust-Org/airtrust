name: Production LMS SCORM Review Readonly
on:
  workflow_dispatch:
    inputs:
      expected_production_sha: {description: 'Exact production Worker SHA', required: true, type: string}
      matricula_id: {description: 'Enrollment ID', required: true, type: string}
      expected_candidate_id: {description: 'Expected active SCORM candidate UUID, or auto to resolve the enrollment-pinned candidate', required: false, default: 'auto', type: string}
      expected_cycle_number: {description: 'Expected current training cycle (0 disables the expectation)', required: false, default: '0', type: string}
      expected_progress_pct: {description: 'Expected stored progress percentage', required: false, default: '0', type: string}
      confirmation: {description: 'Type AIRTRUST_PRODUCTION_SCORM_REVIEW_READONLY', required: true, type: string}
permissions: {contents: read, checks: read, statuses: read}
concurrency: {group: production-lms-scorm-review-readonly, cancel-in-progress: false}
env: {NODE_VERSION: '24', PROD_API_BASE_URL: 'https://api.airtrust.online'}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - run: npm ci
      - name: Install Chromium system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps chromium
      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Guard target
        env:
          EXPECTED: '${{ inputs.expected_production_sha }}'
          CONFIRM: '${{ inputs.confirmation }}'
          RELEASE_SHA: '${{ inputs.expected_production_sha }}'
          GITHUB_TOKEN: '${{ github.token }}'
          GITHUB_REPOSITORY: '${{ github.repository }}'
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CONFIRM" == AIRTRUST_PRODUCTION_SCORM_REVIEW_READONLY ]]
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$EXPECTED^{commit}"
          git merge-base --is-ancestor "$EXPECTED" HEAD
          node scripts/ci/verify-release-gates.mjs
          live="$(curl -fsS https://api.airtrust.online/api/version | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).data.sourceSha))")"
          [[ "$live" == "$EXPECTED" ]]
      - name: Authenticated read-only SCORM review probe
        env:
          E2E_EMAIL: '${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}'
          E2E_PASSWORD: '${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}'
          MATRICULA_ID: '${{ inputs.matricula_id }}'
          EXPECTED_CANDIDATE_ID: "${{ inputs.expected_candidate_id || 'auto' }}"
          EXPECTED_CYCLE_NUMBER: "${{ inputs.expected_cycle_number || '0' }}"
          EXPECTED_PROGRESS_PCT: "${{ inputs.expected_progress_pct || '0' }}"
          EXPECTED_TENANT_ID: '6'
          REPORT_PATH: qa-state/production-lms-scorm-review-readonly.json
        run: node scripts/validation/production-lms-scorm-review-readonly.mjs

      - name: Publish sanitized read-only enrollment summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=qa-state/production-lms-scorm-review-readonly.json
          if [[ ! -s "$report" ]]; then
            echo '## Production LMS SCORM enrollment review' >> "$GITHUB_STEP_SUMMARY"
            echo '- No sanitized report was produced; inspect the failing guard or request step.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - "$report" <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('## Production LMS SCORM enrollment review (read-only)');
          console.log('');
          console.log(`- result: **${report.result}**`);
          console.log('- enrollment: `' + report.enrollment.matricula_id + '`');
          console.log('- course: `' + report.enrollment.curso_id + '` | type: `' + report.enrollment.content_type + '`');
          console.log('- state: `' + report.enrollment.enrollment_status + '` | progress: `' + report.enrollment.progress_pct + '%`');
          console.log('- launched cycle: `' + report.launch.numero_ciclo + '` | id present: `' + report.launch.cycle_id_present + '`');
          console.log('- active package matches enrollment: `' + report.package.candidate_matches_enrollment + '`');
          console.log('- launch SCORM location present: `' + report.launch.initial_lesson_location_present + '`');
          console.log('- Chromium player frame loaded: `' + report.player.frame_loaded + '`');
          console.log('- blocked browser write attempts: `' + report.player.blocked_write_attempt_count + '`');
          console.log('- writes: `' + report.writes + '`');
          NODE

      - name: Upload sanitized read-only enrollment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-lms-scorm-review-${{ inputs.matricula_id }}-${{ inputs.expected_production_sha }}
          path: qa-state/production-lms-scorm-review-readonly.json
          if-no-files-found: ignore
          retention-days: 7
