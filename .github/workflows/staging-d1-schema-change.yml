name: Staging D1 Schema Change (Safe Recovery Point)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_STAGING_SCHEMA_CHANGE'
        required: true
        type: string
      pr_number:
        description: 'Reviewed same-repository PR anchoring the release SHA'
        required: true
        type: string
      release_sha:
        description: 'Exact 40-character reviewed release SHA'
        required: true
        type: string
      approved_migration:
        description: 'Exactly one allowlisted migration filename'
        required: true
        type: choice
        options:
          - 0453_ead_category_reconciliation_executor.sql
          - 0454_qualificacoes_tipos_dominio_override.sql
          - 0475_usuarios_empresas_perfis_reconciliation.sql
          - 0476_frms_pvtb_v2_operational_load.sql
      release_reason:
        description: 'Reason for this staging schema change'
        required: true
        type: string

concurrency:
  group: airtrust-staging-d1-schema-change
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read

env:
  NODE_VERSION: '24'
  ALLOWED_STAGING_DB_NAME: airtrust-db-staging-baseline-20260701
  ALLOWED_STAGING_DB_ID: bf9963f4-eb12-439b-a830-20bbf577ac22
  BLOCKED_PRODUCTION_DB_ID: 7c8a788e-a4c4-4d5d-8208-ff7ff55e84ae

jobs:
  guard:
    name: Reviewed Release Guard
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Validate dispatch and reviewed SHA
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_REASON: ${{ inputs.release_reason }}
          APPROVED_MIGRATION: ${{ inputs.approved_migration }}
        run: |
          set -euo pipefail
          [[ "$GIT_REF" == "refs/heads/main" ]] || { echo "Workflow must run from main." >&2; exit 1; }
          [[ "$CONFIRMATION" == "AIRTRUST_STAGING_SCHEMA_CHANGE" ]] || { echo "Invalid confirmation." >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "release_sha must be a full SHA." >&2; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "pr_number must be positive." >&2; exit 1; }
          [[ -n "$RELEASE_REASON" ]] || { echo "release_reason is required." >&2; exit 1; }
          case "$APPROVED_MIGRATION" in
            0453_ead_category_reconciliation_executor.sql|0454_qualificacoes_tipos_dominio_override.sql|0475_usuarios_empresas_perfis_reconciliation.sql|0476_frms_pvtb_v2_operational_load.sql) ;;
            *) echo "Migration outside the incident allowlist." >&2; exit 1 ;;
          esac

          export RELEASE_SHA="${RELEASE_SHA,,}"
          export PR_NUMBER GITHUB_REPOSITORY GITHUB_ACTOR
          node <<'NODE'
          (async () => {
            const api = 'https://api.github.com';
            const repo = process.env.GITHUB_REPOSITORY;
            const prNumber = process.env.PR_NUMBER;
            const releaseSha = process.env.RELEASE_SHA;
            const actor = process.env.GITHUB_ACTOR;
            const headers = {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
            };
            async function get(path) {
              const response = await fetch(`${api}${path}`, { headers });
              if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
              return response.json();
            }

            const pr = await get(`/repos/${repo}/pulls/${prNumber}`);
            if (pr.base?.ref !== 'main') throw new Error('PR_BASE_NOT_MAIN');
            if (pr.head?.repo?.full_name !== repo || pr.head?.repo?.fork) throw new Error('PR_FROM_FORK_REJECTED');

            if (pr.state === 'open') {
              if (pr.head?.sha?.toLowerCase() !== releaseSha) throw new Error('OPEN_PR_HEAD_MISMATCH');
            } else if (pr.merged === true) {
              if (pr.merge_commit_sha?.toLowerCase() !== releaseSha) throw new Error('MERGED_PR_SHA_MISMATCH');
              const mainRef = await get(`/repos/${repo}/git/refs/heads/main`);
              if (mainRef.object?.sha?.toLowerCase() !== releaseSha) throw new Error('RELEASE_SHA_NOT_CURRENT_MAIN');
            } else {
              throw new Error('PR_NOT_OPEN_OR_MERGED');
            }

            const permission = await get(`/repos/${repo}/collaborators/${actor}/permission`);
            if (!['write', 'push', 'maintain', 'admin'].includes(permission.permission)) {
              throw new Error('ACTOR_PERMISSION_INSUFFICIENT');
            }

            const checks = await get(`/repos/${repo}/commits/${releaseSha}/check-runs?per_page=100`);
            const ignored = new Set([
              'Staging D1 Schema Change (Safe Recovery Point)',
              'Reviewed Release Guard',
              'Apply One Staging Schema Change',
              'Record Schema Change Summary',
            ]);
            const relevant = (checks.check_runs || []).filter((check) => !ignored.has(check.name));
            if (relevant.length === 0) throw new Error('RELEASE_CHECKS_NOT_GREEN');
            const bad = relevant.find((check) => check.status !== 'completed' || check.conclusion !== 'success');
            if (bad) throw new Error(`RELEASE_CHECKS_NOT_GREEN:${bad.name}`);
          })().catch((error) => {
            console.error(`Schema release guard failed: ${error.message}`);
            process.exit(1);
          });
          NODE

      - name: Publish trusted release SHA
        id: release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: echo "release_sha=${RELEASE_SHA,,}" >> "$GITHUB_OUTPUT"

  schema-change:
    name: Apply One Staging Schema Change
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      recovery_timestamp: ${{ steps.apply.outputs.recovery_timestamp }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@v7

      - name: Checkout reviewed release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.release_sha }}
          fetch-depth: 0
          path: release

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify staging target and credential presence
        shell: bash
        env:
          MIGRATION_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$MIGRATION_TOKEN" ]] || { echo "CLOUDFLARE_D1_MIGRATION_API_TOKEN is missing." >&2; exit 1; }
          [[ -n "$ACCOUNT_ID" ]] || { echo "CLOUDFLARE_ACCOUNT_ID is missing." >&2; exit 1; }
          [[ "$ALLOWED_STAGING_DB_ID" != "$BLOCKED_PRODUCTION_DB_ID" ]] || { echo "Production target rejected." >&2; exit 1; }

      - name: Install Worker dependencies
        run: npm --prefix worker-airtrust ci

      - name: Capture recovery point, apply and validate
        id: apply
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_NAME: ${{ env.ALLOWED_STAGING_DB_NAME }}
          STAGING_D1_ID: ${{ env.ALLOWED_STAGING_DB_ID }}
          CONFIRM_STAGING_SCHEMA_CHANGE: AIRTRUST_STAGING_SCHEMA_CHANGE
          APPROVED_MIGRATION: ${{ inputs.approved_migration }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/staging-schema-change.log"
          bash scripts/staging/apply-approved-migration-with-recovery-point.sh \
            --migration="release/worker-airtrust/migrations/$APPROVED_MIGRATION" \
            --apply | tee "$output"
          recovery_timestamp="$(grep '^RECOVERY_TIMESTAMP_UTC=' "$output" | tail -1 | cut -d= -f2-)"
          [[ -n "$recovery_timestamp" ]] || { echo "Recovery timestamp was not recorded." >&2; exit 1; }
          echo "recovery_timestamp=$recovery_timestamp" >> "$GITHUB_OUTPUT"

  summary:
    name: Record Schema Change Summary
    needs: [guard, schema-change]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write outcome
        env:
          RELEASE_SHA: ${{ needs.guard.outputs.release_sha }}
          MIGRATION: ${{ inputs.approved_migration }}
          REASON: ${{ inputs.release_reason }}
          RESULT: ${{ needs.schema-change.result }}
          RECOVERY_TIMESTAMP: ${{ needs.schema-change.outputs.recovery_timestamp }}
        run: |
          {
            echo "## Staging D1 schema change"
            echo "- release_sha: \`$RELEASE_SHA\`"
            echo "- migration: \`$MIGRATION\`"
            echo "- reason: $REASON"
            echo "- result: $RESULT"
            echo "- recovery_timestamp_utc: \`${RECOVERY_TIMESTAMP:-not-captured}\`"
            echo "- production touched: no"
            echo "- automatic restore executed: no"
          } >> "$GITHUB_STEP_SUMMARY"
