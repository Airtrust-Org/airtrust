name: PR 764 Finalize Formatting

on:
  push:
    branches:
      - fix/domain-events-reliability-audit-20260803
    paths:
      - .github/workflows/pr764-finalize-formatting.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/domain-events-reliability-audit-20260803
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply canonical Prettier 3.9.6 formatting
        working-directory: worker-airtrust
        run: >-
          npx --yes prettier@3.9.6 --write
          src/middleware/domainEventProcessor.ts
          src/routes/admin-domain-events.ts
          src/shared/eventProcessor.ts
          src/utils/auditoria.ts

      - name: Remove temporary capture helper
        run: rm -f worker-airtrust/src/__tests__/prettier-output-helper.test.ts

      - name: Commit formatting result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            worker-airtrust/src/middleware/domainEventProcessor.ts \
            worker-airtrust/src/routes/admin-domain-events.ts \
            worker-airtrust/src/shared/eventProcessor.ts \
            worker-airtrust/src/utils/auditoria.ts \
            worker-airtrust/src/__tests__/prettier-output-helper.test.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes were necessary.'
            exit 0
          fi
          git commit -m 'style: apply canonical prettier formatting'
          git push origin HEAD:fix/domain-events-reliability-audit-20260803
