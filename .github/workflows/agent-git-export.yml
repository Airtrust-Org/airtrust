name: Agent Git Export

on:
  push:
    branches:
      - agent/audit-critical-high-hardening-20260731

permissions:
  contents: read

jobs:
  export-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive Git metadata
        run: tar -czf "$RUNNER_TEMP/airtrust-git-metadata.tar.gz" .git
      - uses: actions/upload-artifact@v4
        with:
          name: agent-git-${{ github.sha }}
          path: ${{ runner.temp }}/airtrust-git-metadata.tar.gz
          retention-days: 1
