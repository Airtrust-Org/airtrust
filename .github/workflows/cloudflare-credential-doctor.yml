name: Cloudflare Credential Doctor

# Manual, read-only diagnostic for the canonical Cloudflare/AirTrust credential
# contract (see docs/ops/CLOUDFLARE_CREDENTIAL_CONTRACT.md).
#
# This workflow NEVER creates, rotates, or revokes a token, NEVER deploys
# anything, and NEVER prints a token/password/email value, its length, or a
# full Account ID. It validates exactly one credential for exactly one
# environment per run and reports one of a fixed set of result codes:
#   SECRET_PRESENT_AND_VALID
#   SECRET_MISSING
#   TOKEN_INVALID_OR_REVOKED
#   TOKEN_PERMISSION_INSUFFICIENT
#   ACCOUNT_ID_MISSING
#   SMOKE_CREDENTIALS_MISSING
#   SMOKE_CREDENTIALS_PRESENT_NOT_TESTED

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'GitHub environment to read secrets from'
        required: true
        type: choice
        options:
          - staging
          - production
      credential:
        description: 'Which credential to diagnose (never more than one per run)'
        required: true
        type: choice
        options:
          - worker
          - pages
          - d1_backup
          - smoke

permissions:
  contents: read

jobs:
  guard:
    name: Validate Input Combination
    runs-on: ubuntu-latest
    steps:
      - name: Reject invalid environment/credential combinations
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          CREDENTIAL: ${{ inputs.credential }}
        run: |
          set -euo pipefail
          if [[ "$CREDENTIAL" == "smoke" && "$TARGET_ENVIRONMENT" != "staging" ]]; then
            echo "STAGING_SMOKE_EMAIL/STAGING_SMOKE_PASSWORD are staging-only AirTrust login credentials, not a Cloudflare token. credential=smoke only applies to target_environment=staging." >&2
            exit 1
          fi
          echo "Diagnosing credential=${CREDENTIAL} for target_environment=${TARGET_ENVIRONMENT}."

  diagnose-worker:
    name: Diagnose Worker Token
    needs: guard
    if: ${{ inputs.credential == 'worker' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Diagnose CLOUDFLARE_WORKER_API_TOKEN (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          WORKER_SERVICE_NAME: ${{ inputs.target_environment == 'staging' && 'airtrust-api-staging' || 'airtrust-api-production' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          environment = os.environ.get("TARGET_ENVIRONMENT", "")
          worker_name = os.environ.get("WORKER_SERVICE_NAME", "")

          def call(path):
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      return resp.getcode(), json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  try:
                      data = json.loads(body) if body else {}
                  except Exception:
                      data = {}
                  return exc.code, data
              except Exception as exc:
                  return 0, {"success": False, "errors": [{"code": exc.__class__.__name__}]}

          print(f"SECRET_NAME=CLOUDFLARE_WORKER_API_TOKEN")
          print(f"ENVIRONMENT={environment}")
          print(f"TIMESTAMP_UTC={datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")

          if not token:
              print("RESULT=SECRET_MISSING")
              raise SystemExit(1)

          if not account_id:
              print("RESULT=ACCOUNT_ID_MISSING")
              raise SystemExit(1)

          print(f"TOKEN_FINGERPRINT={hashlib.sha256(token.encode()).hexdigest()[:12]}")

          user_http, user_data = call("/user/tokens/verify")
          user_ok = user_http == 200 and bool(user_data.get("success"))
          
          account_http, account_data = call(f"/accounts/{account_id}/tokens/verify")
          account_ok = account_http == 200 and bool(account_data.get("success"))

          if user_ok:
              print("TOKEN_OWNER_TYPE=user")
              result = user_data.get("result") or {}
              print(f"TOKEN_STATUS={result.get('status', 'unknown')}")
              print(f"VERIFY_HTTP_STATUS={user_http}")
          elif account_ok:
              print("TOKEN_OWNER_TYPE=account")
              result = account_data.get("result") or {}
              print(f"TOKEN_STATUS={result.get('status', 'unknown')}")
              print(f"VERIFY_HTTP_STATUS={account_http}")
          else:
              print(f"VERIFY_USER_HTTP_STATUS={user_http}")
              print(f"VERIFY_ACCOUNT_HTTP_STATUS={account_http}")
              print("RESULT=TOKEN_INVALID_OR_REVOKED")
              raise SystemExit(1)

          resource_path = f"/accounts/{account_id}/workers/scripts/{worker_name}/settings"
          resource_http, resource_data = call(resource_path)
          resource_ok = resource_http == 200 and bool(resource_data.get("success"))
          print(f"RESOURCE_CHECKED=GET /accounts/<account_id>/workers/scripts/{worker_name}/settings")
          print(f"RESOURCE_CHECK_HTTP_STATUS={resource_http}")

          if resource_ok:
              print("RESULT=SECRET_PRESENT_AND_VALID")
              raise SystemExit(0)

          print("RESULT=TOKEN_PERMISSION_INSUFFICIENT")
          raise SystemExit(1)
          PY


  diagnose-d1-backup:
    name: Diagnose D1 Backup Token
    needs: guard
    if: ${{ inputs.credential == 'd1_backup' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Diagnose CLOUDFLARE_D1_BACKUP_API_TOKEN (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          environment = os.environ.get("TARGET_ENVIRONMENT", "")

          def call(path):
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      return resp.getcode(), json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  try:
                      data = json.loads(body) if body else {}
                  except Exception:
                      data = {}
                  return exc.code, data
              except Exception as exc:
                  return 0, {"success": False, "errors": [{"code": exc.__class__.__name__}]}

          print("SECRET_NAME=CLOUDFLARE_D1_BACKUP_API_TOKEN")
          print(f"ENVIRONMENT={environment}")
          print(f"TIMESTAMP_UTC={datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")

          if not token:
              print("RESULT=SECRET_MISSING")
              raise SystemExit(1)
          if not account_id:
              print("RESULT=ACCOUNT_ID_MISSING")
              raise SystemExit(1)

          print(f"TOKEN_FINGERPRINT={hashlib.sha256(token.encode()).hexdigest()[:12]}")

          user_http, user_data = call("/user/tokens/verify")
          account_http, account_data = call(f"/accounts/{account_id}/tokens/verify")
          if not (
              (user_http == 200 and bool(user_data.get("success")))
              or (account_http == 200 and bool(account_data.get("success")))
          ):
              print(f"VERIFY_USER_HTTP_STATUS={user_http}")
              print(f"VERIFY_ACCOUNT_HTTP_STATUS={account_http}")
              print("RESULT=TOKEN_INVALID_OR_REVOKED")
              raise SystemExit(1)

          d1_http, d1_data = call(f"/accounts/{account_id}/d1/database?per_page=1")
          print("RESOURCE_CHECKED=GET /accounts/<account_id>/d1/database?per_page=1")
          print(f"RESOURCE_CHECK_HTTP_STATUS={d1_http}")
          if d1_http == 200 and bool(d1_data.get("success")):
              print("RESULT=SECRET_PRESENT_AND_VALID")
              raise SystemExit(0)

          print("RESULT=TOKEN_PERMISSION_INSUFFICIENT")
          raise SystemExit(1)
          PY

  diagnose-pages:
    name: Diagnose Pages Token
    needs: guard
    if: ${{ inputs.credential == 'pages' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Diagnose CLOUDFLARE_PAGES_API_TOKEN (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PAGES_PROJECT_NAME: airtrust
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          environment = os.environ.get("TARGET_ENVIRONMENT", "")
          project_name = os.environ.get("PAGES_PROJECT_NAME", "")

          def call(path):
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      return resp.getcode(), json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  try:
                      data = json.loads(body) if body else {}
                  except Exception:
                      data = {}
                  return exc.code, data
              except Exception as exc:
                  return 0, {"success": False, "errors": [{"code": exc.__class__.__name__}]}

          print(f"SECRET_NAME=CLOUDFLARE_PAGES_API_TOKEN")
          print(f"ENVIRONMENT={environment}")
          print(f"TIMESTAMP_UTC={datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")

          if not token:
              print("RESULT=SECRET_MISSING")
              raise SystemExit(1)

          if not account_id:
              print("RESULT=ACCOUNT_ID_MISSING")
              raise SystemExit(1)

          print(f"TOKEN_FINGERPRINT={hashlib.sha256(token.encode()).hexdigest()[:12]}")

          user_http, user_data = call("/user/tokens/verify")
          user_ok = user_http == 200 and bool(user_data.get("success"))
          
          account_http, account_data = call(f"/accounts/{account_id}/tokens/verify")
          account_ok = account_http == 200 and bool(account_data.get("success"))

          if user_ok:
              print("TOKEN_OWNER_TYPE=user")
              result = user_data.get("result") or {}
              print(f"TOKEN_STATUS={result.get('status', 'unknown')}")
              print(f"VERIFY_HTTP_STATUS={user_http}")
          elif account_ok:
              print("TOKEN_OWNER_TYPE=account")
              result = account_data.get("result") or {}
              print(f"TOKEN_STATUS={result.get('status', 'unknown')}")
              print(f"VERIFY_HTTP_STATUS={account_http}")
          else:
              print(f"VERIFY_USER_HTTP_STATUS={user_http}")
              print(f"VERIFY_ACCOUNT_HTTP_STATUS={account_http}")
              print("RESULT=TOKEN_INVALID_OR_REVOKED")
              raise SystemExit(1)

          project_http, project_data = call(f"/accounts/{account_id}/pages/projects/{project_name}")
          project_ok = project_http == 200 and bool(project_data.get("success"))
          print(f"RESOURCE_CHECKED_1=GET /accounts/<account_id>/pages/projects/{project_name}")
          print(f"RESOURCE_CHECK_1_HTTP_STATUS={project_http}")

          deployments_http, deployments_data = call(f"/accounts/{account_id}/pages/projects/{project_name}/deployments")
          deployments_ok = deployments_http == 200 and bool(deployments_data.get("success"))
          print(f"RESOURCE_CHECKED_2=GET /accounts/<account_id>/pages/projects/{project_name}/deployments")
          print(f"RESOURCE_CHECK_2_HTTP_STATUS={deployments_http}")

          if project_ok and deployments_ok:
              print("RESULT=SECRET_PRESENT_AND_VALID")
              raise SystemExit(0)

          print("RESULT=TOKEN_PERMISSION_INSUFFICIENT")
          raise SystemExit(1)
          PY

  diagnose-smoke:
    name: Diagnose Staging Smoke Credentials
    needs: guard
    if: ${{ inputs.credential == 'smoke' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check presence only (never attempts login)
        env:
          STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "SECRET_NAME=STAGING_SMOKE_EMAIL,STAGING_SMOKE_PASSWORD"
          echo "ENVIRONMENT=staging"
          echo "TIMESTAMP_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "NOTE=STAGING_SMOKE_EMAIL and STAGING_SMOKE_PASSWORD are AirTrust application login credentials for the staging smoke user, not Cloudflare tokens."

          if [[ -z "${STAGING_SMOKE_EMAIL:-}" || -z "${STAGING_SMOKE_PASSWORD:-}" ]]; then
            echo "RESULT=SMOKE_CREDENTIALS_MISSING"
            exit 1
          fi

          echo "RESULT=SMOKE_CREDENTIALS_PRESENT_NOT_TESTED"
