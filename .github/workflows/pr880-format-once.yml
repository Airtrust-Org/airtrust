name: Temporary PR880 Prettier formatter

on:
  push:
    branches:
      - feat/ead-auto-enrollment-email-mel-manutencao
    paths:
      - .github/workflows/pr880-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Format exact PR880 delta
        run: |
          npx --yes prettier@3.9.6 --write \
            worker-airtrust/src/cron/scheduled-handler.ts \
            worker-airtrust/src/routes/lms-matriculas-mel-manutencao.ts
          rm -f worker-airtrust/src/__tests__/format-pr880-export.test.ts
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            worker-airtrust/src/cron/scheduled-handler.ts \
            worker-airtrust/src/routes/lms-matriculas-mel-manutencao.ts \
            worker-airtrust/src/__tests__/format-pr880-export.test.ts
          if git diff --cached --quiet; then
            echo "No formatting delta"
          else
            git commit -m "style(ead): apply Prettier 3.9.6 to PR880 delta"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
