name: eDB Staging Read-Only Smoke

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_EDB_STAGING_READONLY to continue'
        required: true
        type: string
      expected_release_sha:
        description: 'Exact deployed eDB staging release SHA to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: edb-staging-readonly-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: eDB staging non-operational read-only smoke
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Guard staging-only inputs
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$GIT_REF" == "refs/heads/main" ]] || { echo "Workflow must be dispatched from main." >&2; exit 1; }
          [[ "$CONFIRMATION" == "AIRTRUST_EDB_STAGING_READONLY" ]] || { echo "Invalid staging confirmation." >&2; exit 1; }
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "expected_release_sha must be a 40-character hexadecimal SHA." >&2; exit 1; }

      - name: Checkout trusted main
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify eDB staging provenance and fail-closed tenant gate
        env:
          STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
          STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          EXPECTED_EDB_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: node scripts/staging/smoke-edb-shadow-readonly.mjs

      - name: Record safety scope
        if: always()
        shell: bash
        run: |
          {
            echo "## eDB staging read-only smoke"
            echo ""
            echo "- environment: staging only"
            echo "- expected release SHA: \`${{ inputs.expected_release_sha }}\`"
            echo "- eDB operational mutations: none"
            echo "- authenticated positive tenant-6 flow: intentionally not exercised without a dedicated synthetic tenant-6 identity"
            echo "- production action: none"
            echo "- ANAC transmission: none"
          } >> "$GITHUB_STEP_SUMMARY"
