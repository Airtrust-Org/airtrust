name: Temporary Worker Vitest Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  worker-vitest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: cd worker-airtrust && npm ci

      - name: Run Worker unit tests with captured output
        shell: bash
        run: |
          set -o pipefail
          cd worker-airtrust
          npx vitest run 2>&1 | tee ../worker-vitest-diagnostic.log

      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-vitest-diagnostic
          path: worker-vitest-diagnostic.log
          if-no-files-found: error
          retention-days: 1
