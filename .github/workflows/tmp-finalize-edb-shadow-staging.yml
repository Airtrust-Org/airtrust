name: Temporary finalize eDB shadow staging gate

on:
  push:
    branches:
      - chore/edb-shadow-costa-do-sol-staging-20260802
    paths:
      - .github/workflows/tmp-finalize-edb-shadow-staging.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/edb-shadow-costa-do-sol-staging-20260802
          fetch-depth: 0

      - name: Apply focused staging gate patches
        run: |
          python <<'PY'
          from pathlib import Path

          route_path = Path('worker-airtrust/src/routes/edb-shadow-preview.ts')
          route = route_path.read_text()
          route = route.replace(
              "import type { Env, Variables } from '../types';\n",
              "import type { Env, Variables } from '../types';\nimport { isEdbShadowPilotEnabledForTenant } from '../lib/edb/edb-shadow-pilot-flag';\n",
              1,
          )
          route = route.replace(
              """    if (!checkPermission(c, 'manager')) {
      throw new ApiError('Permissao insuficiente', 403, 'EDB_SHADOW_PREVIEW_RBAC_FORBIDDEN');
    }
    await next();
""",
              """    if (!checkPermission(c, 'manager')) {
      throw new ApiError('Permissao insuficiente', 403, 'EDB_SHADOW_PREVIEW_RBAC_FORBIDDEN');
    }

    const tenantId = getEmpresaId(c);
    if (!isEdbShadowPilotEnabledForTenant(c.env, tenantId)) {
      throw new ApiError('Recurso indisponivel', 404, 'EDB_SHADOW_PILOT_NOT_ENABLED');
    }

    await next();
""",
              1,
          )
          capability = """edbShadowPreview.get('/capability', auth(), async (c) => {
  const tenantId = getEmpresaId(c);
  const enabled =
    checkPermission(c, 'manager') && isEdbShadowPilotEnabledForTenant(c.env, tenantId);

  return c.json({
    success: true,
    data: {
      enabled,
      classification: 'NON_OFFICIAL_SHADOW_PILOT_CAPABILITY',
      officialLogbook: false,
      replacesPaper: false,
    },
  });
});

"""
          marker = "edbShadowPreview.get(\n  '/shadow-preview/:flightId',"
          if capability not in route:
              route = route.replace(marker, capability + marker, 1)
          route_path.write_text(route)

          dashboard_path = Path('src/react-app/pages/controle-voos/ControleVoosDashboard.tsx')
          dashboard = dashboard_path.read_text()
          dashboard = dashboard.replace(
              "import { Link, useSearchParams } from 'react-router-dom';",
              "import { useEffect, useState } from 'react';\nimport { Link, Navigate, useSearchParams } from 'react-router-dom';",
              1,
          )
          dashboard = dashboard.replace(
              "import EdbShadowPrototypeWithAssessment from './EdbShadowPrototypeWithAssessment';",
              "import EdbShadowPrototypeWithAssessment from './EdbShadowPrototypeWithAssessment';\nimport { isEdbShadowPilotEnabled } from '@/react-app/config/edbShadowPilot';",
              1,
          )
          dashboard = dashboard.replace(
              'function ControleVoosDashboardContent() {',
              'function ControleVoosDashboardContent({ edbShadowEnabled }: { edbShadowEnabled: boolean }) {',
              1,
          )
          dashboard = dashboard.replace(
              """                  {
                    to: '/controle-voos?edb-shadow=1',
                    icon: <BookOpenCheck className=\"h-5 w-5 text-red-600\" />,
                    label: 'Protótipo eDB Shadow',
                    preview: true,
                  },
""",
              """                  ...(edbShadowEnabled
                    ? [
                        {
                          to: '/controle-voos?edb-shadow=1',
                          icon: <BookOpenCheck className=\"h-5 w-5 text-red-600\" />,
                          label: 'Protótipo eDB Shadow',
                          preview: true,
                        },
                      ]
                    : []),
""",
              1,
          )
          dashboard = dashboard.replace(
              """export default function ControleVoosDashboard() {
  const [searchParams] = useSearchParams();
  if (searchParams.get('edb-shadow') === '1') {
    return <EdbShadowPrototypeWithAssessment />;
  }
  return <ControleVoosDashboardContent />;
}
""",
              """export default function ControleVoosDashboard() {
  const [searchParams] = useSearchParams();
  const [edbShadowEnabled, setEdbShadowEnabled] = useState(false);
  const [capabilityResolved, setCapabilityResolved] = useState(false);

  useEffect(() => {
    let active = true;
    void isEdbShadowPilotEnabled(true).then((enabled) => {
      if (!active) return;
      setEdbShadowEnabled(enabled);
      setCapabilityResolved(true);
    });
    return () => {
      active = false;
    };
  }, []);

  if (searchParams.get('edb-shadow') === '1') {
    if (!capabilityResolved) return null;
    if (!edbShadowEnabled) return <Navigate to=\"/controle-voos\" replace />;
    return <EdbShadowPrototypeWithAssessment />;
  }
  return <ControleVoosDashboardContent edbShadowEnabled={edbShadowEnabled} />;
}
""",
              1,
          )
          dashboard_path.write_text(dashboard)

          wrangler_path = Path('worker-airtrust/wrangler.toml')
          wrangler = wrangler_path.read_text()
          staging_marker = 'CONTROLE_VOOS_SIGVOOS_SHADOW_COMPARE_ENABLED = "true"\n'
          staging_flag = """CONTROLE_VOOS_SIGVOOS_SHADOW_COMPARE_ENABLED = "true"
# Protótipo eDB shadow: somente staging, allowlist explícita e sem suporte a `all`.
# Costa do Sol é o tenant canônico empresa_id=6. Remover/limpar esta variável
# desativa imediatamente todas as rotas e a capability no próximo deploy de configuração.
EDB_SHADOW_PILOT_TENANTS = "6"
"""
          wrangler = wrangler.replace(staging_marker, staging_flag, 1)
          wrangler_path.write_text(wrangler)

          test_paths = [
              Path('worker-airtrust/src/__tests__/routes/edb-shadow-preview.test.ts'),
              Path('worker-airtrust/src/__tests__/routes/edb-shadow-assessment.test.ts'),
              Path('worker-airtrust/src/__tests__/routes/edb-shadow-review-evidence.test.ts'),
          ]
          helper = """
function enabledEnv(): Env {
  return {
    DB: {} as D1Database,
    ENVIRONMENT: 'staging',
    EDB_SHADOW_PILOT_TENANTS: '7',
  } as Env;
}

"""
          for path in test_paths:
              source = path.read_text()
              source = source.replace('{ DB: {} as D1Database } as Env', 'enabledEnv()')
              source = source.replace('{} as Env', 'enabledEnv()')
              if 'function enabledEnv()' not in source:
                  source = source.replace('beforeEach(() => {', helper + 'beforeEach(() => {', 1)
              path.write_text(source)
          PY

      - name: Format focused delta
        run: |
          npx --yes prettier@3.9.6 --write -- \
            src/react-app/config/edbShadowPilot.ts \
            src/react-app/config/__tests__/edbShadowPilot.test.ts \
            src/react-app/pages/controle-voos/ControleVoosDashboard.tsx \
            worker-airtrust/src/lib/edb/edb-shadow-pilot-flag.ts \
            worker-airtrust/src/__tests__/lib/edb-shadow-pilot-flag.test.ts \
            worker-airtrust/src/__tests__/routes/edb-shadow-pilot-gate.test.ts \
            worker-airtrust/src/__tests__/routes/edb-shadow-preview.test.ts \
            worker-airtrust/src/__tests__/routes/edb-shadow-assessment.test.ts \
            worker-airtrust/src/__tests__/routes/edb-shadow-review-evidence.test.ts \
            worker-airtrust/src/routes/edb-shadow-preview.ts

      - name: Commit final delta and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-finalize-edb-shadow-staging.yml
          git add \
            src/react-app/config/edbShadowPilot.ts \
            src/react-app/config/__tests__/edbShadowPilot.test.ts \
            src/react-app/pages/controle-voos/ControleVoosDashboard.tsx \
            worker-airtrust/wrangler.toml \
            worker-airtrust/src/lib/edb/edb-shadow-pilot-flag.ts \
            worker-airtrust/src/__tests__/lib/edb-shadow-pilot-flag.test.ts \
            worker-airtrust/src/__tests__/routes/edb-shadow-pilot-gate.test.ts \
            worker-airtrust/src/__tests__/routes/edb-shadow-preview.test.ts \
            worker-airtrust/src/__tests__/routes/edb-shadow-assessment.test.ts \
            worker-airtrust/src/__tests__/routes/edb-shadow-review-evidence.test.ts \
            worker-airtrust/src/routes/edb-shadow-preview.ts
          git commit -m "feat(edb): gate Costa do Sol shadow pilot in staging"
          git push origin HEAD:chore/edb-shadow-costa-do-sol-staging-20260802
