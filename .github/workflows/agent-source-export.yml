name: Agent Source Export

on:
  push:
    branches:
      - agent/audit-critical-high-hardening-20260731

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git metadata archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/airtrust-git-metadata.tar.gz" .git

      - name: Upload Git metadata archive
        uses: actions/upload-artifact@v4
        with:
          name: agent-git-${{ github.sha }}
          path: ${{ runner.temp }}/airtrust-git-metadata.tar.gz
          if-no-files-found: error
          retention-days: 1
