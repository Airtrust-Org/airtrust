name: Agent Source Export

on:
  push:
    branches:
      - agent/audit-critical-high-hardening-20260731
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'agent/audit-critical-high-hardening-20260731' || github.ref_name == 'agent/audit-critical-high-hardening-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=airtrust-source.tar.gz -czf airtrust-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: agent-source-${{ github.sha }}
          path: airtrust-source.tar.gz
          if-no-files-found: error
          retention-days: 1
