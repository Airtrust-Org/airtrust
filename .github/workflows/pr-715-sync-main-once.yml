name: PR 715 sync main once

on:
  push:
    branches:
      - feat/edb-technical-status-shadow-contracts-20260802

permissions:
  contents: write

jobs:
  sync-main-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/edb-technical-status-shadow-contracts-20260802
          fetch-depth: 0

      - name: Merge current main and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/pr-715-sync-main-once.yml
          git add --all
          git commit -m "chore(edb): remove one-shot main sync helper"
          git push origin HEAD:feat/edb-technical-status-shadow-contracts-20260802
