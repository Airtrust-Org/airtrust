name: FRMS readiness hardening

on:
  push:
    branches:
      - feat/frms-operational-readiness-pvt-20260827
    paths:
      - .github/workflows/frms-readiness-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frms-operational-readiness-pvt-20260827
          fetch-depth: 0
      - name: Apply readiness hardening
        run: python3 .github/scripts/frms_readiness_hardening.py
      - name: Commit hardening
        run: |
          git config user.name "airtrust-readiness-integrator"
          git config user.email "actions@users.noreply.github.com"
          git add worker-airtrust/src/lib/frms/readiness-persistence.ts worker-airtrust/src/routes/frms-readiness.ts src/react-app/pages/frms/OperationalVigilanceTest.tsx src/react-app/pages/frms/FrmsCheckinFadiga.tsx worker-airtrust/schema-v2/plans/frms-operational-readiness-0471.md
          git commit -m "fix(frms): harden cognitive readiness lifecycle"
          git push origin HEAD:feat/frms-operational-readiness-pvt-20260827
