name: Demo Data Prevention Check

on:
  push:
    branches: [main, master, production, staging]
  pull_request:
    branches: [main, master, production, staging]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-demo-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Make scripts executable
        run: |
          chmod +x ./scripts/ci-demo-data-check.sh
          chmod +x ./scripts/ci-internal-docs-check.sh
          chmod +x ./scripts/production-audit-check.sh

      - name: Test internal documents guard
        run: ./scripts/ci-internal-docs-check.sh --test

      - name: Block sensitive internal documents
        run: ./scripts/ci-internal-docs-check.sh

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8787

      - name: Run demo data and production audit checks
        run: npm run check:demo-data

      - name: Comment PR if a protected-content check fails
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **MERGE BLOQUEADO** — O gate de conteúdo protegido falhou.\n\nVerifique documentos internos sensíveis, dados de demonstração, fixtures, seeds, bypasses de autenticação e artefatos de build antes de atualizar o PR.'
            })
