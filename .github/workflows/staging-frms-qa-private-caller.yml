name: Staging FRMS QA Private Caller Provision (F0 Grant Required)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AIRTRUST_FRMS_QA_CALLER_WORKER_STAGING_DEPLOY
        required: true
        type: string
      expected_main_sha:
        description: Exact current main SHA with all 8 official gates
        required: true
        type: string
      grant_id:
        description: Unedited fresh exact F0 admin grant comment ID in issue 776
        required: true
        type: string
      credential_mode:
        description: Existing credential exception needs a fresh phase-specific admin grant
        required: true
        default: dedicated
        type: choice
        options:
          - dedicated
          - existing_staging_worker_deploy_only

permissions:
  contents: read
  checks: read
  statuses: read
  issues: read

concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false

env:
  FRMS_QA_CALLER_CONFIRM: ${{ inputs.confirmation }}
  FRMS_QA_CALLER_EXPECTED_SHA: ${{ inputs.expected_main_sha }}
  FRMS_QA_CALLER_GRANT_ID: ${{ inputs.grant_id }}
  FRMS_QA_CREDENTIAL_MODE: ${{ inputs.credential_mode }}

jobs:
  guard:
    name: F0 caller grant exact SHA and 8 gate preflight (no remote writes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Unit test caller provision contract and grant parsing locally
        run: node --test scripts/__tests__/frms-qa-private-caller-provision.test.mjs

  provision-private-caller:
    name: Provision scoped FRMS private Caller Worker and Queue consumer
    needs: guard
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify prerequisites and dry-run caller deployment before remote mutation
        run: |
          set -euo pipefail
          node --test scripts/__tests__/frms-qa-private-caller-provision.test.mjs
          npx wrangler deploy --dry-run --config ops/frms-qa-repair/wrangler.caller.staging.toml --outdir "$RUNNER_TEMP/frms-qa-caller-build"
      - name: Deploy private Caller Worker with SQLite DO and Queue bindings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.credential_mode == 'existing_staging_worker_deploy_only' && secrets.CLOUDFLARE_WORKER_API_TOKEN || secrets.CLOUDFLARE_FRMS_QA_WORKER_DEPLOY_API_TOKEN }}
          FRMS_QA_CALLER_KEY_HEX: ${{ secrets.FRMS_QA_CALLER_KEY_HEX }}
          FRMS_QA_APPROVAL_PUBLIC_KEY_PEM: ${{ secrets.FRMS_QA_APPROVAL_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config ops/frms-qa-repair/wrangler.caller.staging.toml
      - name: Report private caller deployment
        if: success()
        run: |
          echo 'FRMS private Caller Worker + Queue consumer provision completed under specific F0 grant; workers.dev disabled, no public HTTP route' >> "$GITHUB_STEP_SUMMARY"
          echo "Main SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Physical case repair and 4/4 readiness: NOT ATTESTED BY DEPLOY (prepare/apply transactions required)' >> "$GITHUB_STEP_SUMMARY"
