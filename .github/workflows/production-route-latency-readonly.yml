name: Production Route Latency Readonly (#2227)

# Leitura somente: agrega latencia/desconexao por rota (path normalizado) do Worker de producao
# via Workers Observability. Nao escreve em D1/Worker/Pages, nao imprime tokens, headers,
# query strings nem corpo; nenhuma PII (apenas metodo + rota normalizada + contagens/percentis).

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Janela em horas (1-48)'
        required: true
        default: '6'

permissions:
  contents: read

concurrency:
  group: production-route-latency-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_SERVICE: airtrust-api-production
      HOURS: ${{ inputs.hours || '6' }}
    steps:
      - name: Main only
        run: '[[ "$GITHUB_REF" == refs/heads/main ]] || { echo MAIN_ONLY >&2; exit 1; }'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Query route latency (read-only)
        shell: bash
        run: set -o pipefail; node scripts/ops/route-latency-readonly.mjs | tee "$GITHUB_STEP_SUMMARY"
