name: Apply Reviewed Schema V2 (Staging)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AIRTRUST_STAGING_SCHEMA_V2
        required: true
        type: string
      pr_number:
        description: Same-repository reviewed PR; merged HFA 0529 must match current protected main
        required: true
        type: string
      release_sha:
        description: Exact reviewed PR HEAD SHA, or current main merge SHA for HFA 0529
        required: true
        type: string
      change_id:
        description: Explicitly reviewed Schema V2 change
        required: true
        type: choice
        options:
          - hfa-integration-bridge-0529
          - frms-sleep-opportunity-0552
          - simulator-individual-check-evidence-0554
          - simulator-individual-check-delete-guard-0560
          - controle-voos-pilot-fueling-identity-0563
          - controle-voos-pilot-supplier-history-0564
          - lms-scorm-edition-handoff-0566
          - lms-scorm-qa-evidence-bindings-0568
          - lms-scorm-edition-policy-approvals-0569
      release_reason:
        description: Reason and authorization for the staging schema change
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

# Share the existing staging mutation lock: no overlapping schema, deploy or SCORM QA.
concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false

jobs:
  apply:
    name: Verify and apply one reviewed staging Schema V2 change
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      NODE_VERSION: '24'
      STAGING_DB_NAME: airtrust-db-staging-baseline-20260701
      STAGING_DB_ID: bf9963f4-eb12-439b-a830-20bbf577ac22
      PRODUCTION_DB_ID: 7c8a788e-a4c4-4d5d-8208-ff7ff55e84ae
      REVIEWED_CHANGE_ID: ${{ inputs.change_id }}
      BASELINE_ID: production-d1-baseline-v2-20260714
      REVIEWED_SQL_HASH: ${{ inputs.change_id == 'lms-scorm-edition-policy-approvals-0569' && '171edad097fa72aa12ebb2ae20a629cfe67264c074d9deef60d3a3305dda38ad' || inputs.change_id == 'hfa-integration-bridge-0529' && '09d17ed2551b6d63ccd01677eb47cd7bb758c295784df4f1afaead06e1dc62f4' || inputs.change_id == 'lms-scorm-qa-evidence-bindings-0568' && '6f85d5e3d141e140c54ea5b62c2dc3143447187960b8d89d7b6ed6dc4f3eb197' || inputs.change_id == 'lms-scorm-edition-handoff-0566' && 'ebfcb95de6f2a6fee7e07e155697d67157ed96821f23c1cc36b15c5caf352fba' || inputs.change_id == 'controle-voos-pilot-supplier-history-0564' && '0474f9d87e419b85e6a851766a34a8a3c8a2a3728976bf52a4644a191d63c4b8' || inputs.change_id == 'controle-voos-pilot-fueling-identity-0563' && 'f920e8b75faab568c7abeaace086606d19904bc1a4b16fc010238d63fd572456' || inputs.change_id == 'simulator-individual-check-delete-guard-0560' && '5fe67c81dda03681d9a73eec4cc51989bd92270e4eca6b41b1eb1028b58b9e56' || inputs.change_id == 'simulator-individual-check-evidence-0554' && 'bcbdcf8bd78c3a3d6393624e62ae70e691190e3ae2d35c0951c0bc56470b4bf5' || 'c29e5b38d6e1da17b55312b3a1ff470266ebcf3cd7e178eecd4d0664cec7dd31' }}
      REVIEWED_PLAN_HASH: ${{ inputs.change_id == 'lms-scorm-edition-policy-approvals-0569' && 'b1b93390616df33ad4e88aa5e3c3c6f269dae1d11fafd09f9e0991b227ecdab8' || inputs.change_id == 'hfa-integration-bridge-0529' && '2d71bcd602959a320fc3dc223ba127c07f53b3394608f235b4cdf2e0fd9222dd' || inputs.change_id == 'lms-scorm-qa-evidence-bindings-0568' && 'ff0e971ac739846159651689d3604c3a3bbea8add204fda1c49bbcdcb9261696' || inputs.change_id == 'lms-scorm-edition-handoff-0566' && '2dba1565554ae6c1a1bd8bfac803a227affa01332d46ede08408af9fb1308f2b' || inputs.change_id == 'controle-voos-pilot-supplier-history-0564' && '6e0b2968655fbb423d36f3413065120daa8f4c828e0e82cbeba2e01c32c97d81' || inputs.change_id == 'controle-voos-pilot-fueling-identity-0563' && '1be9c128e3f56e03f72a35702cd239735476460ba24209801d32bf10e44296ae' || inputs.change_id == 'simulator-individual-check-delete-guard-0560' && 'b00948f0821692fb322cd18dc795769d8f03b057db7af9c9b729747d9d2b1463' || inputs.change_id == 'simulator-individual-check-evidence-0554' && '47b79c542348749d865425a5487f72689444f30553187778f51366b89bbcd0b6' || '8e4eefde2853f3a1adaa9ffac08fba364e277f99728c911a9ea9939cd0fb1b45' }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CHANGE_ID: ${{ inputs.change_id }}
    steps:
      - name: Validate manual dispatch on trusted main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RELEASE_REASON: ${{ inputs.release_reason }}
          SCORM_F0_SCHEMA_0568_APPROVED_SHA: ${{ secrets.SCORM_F0_SCHEMA_0568_APPROVED_SHA }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'TRUSTED_MAIN_REQUIRED' >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_STAGING_SCHEMA_V2' ]] || { echo 'INVALID_CONFIRMATION' >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'INVALID_RELEASE_SHA' >&2; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'INVALID_PR_NUMBER' >&2; exit 1; }
          [[ "$CHANGE_ID" == 'hfa-integration-bridge-0529' ||
             "$CHANGE_ID" == 'frms-sleep-opportunity-0552' ||
             "$CHANGE_ID" == 'simulator-individual-check-evidence-0554' ||
             "$CHANGE_ID" == 'simulator-individual-check-delete-guard-0560' ||
             "$CHANGE_ID" == 'controle-voos-pilot-fueling-identity-0563' ||
             "$CHANGE_ID" == 'controle-voos-pilot-supplier-history-0564' ||
             "$CHANGE_ID" == 'lms-scorm-edition-handoff-0566' ||
             "$CHANGE_ID" == 'lms-scorm-qa-evidence-bindings-0568' ||
             "$CHANGE_ID" == 'lms-scorm-edition-policy-approvals-0569' ]] || { echo 'UNAPPROVED_CHANGE_ID' >&2; exit 1; }
          [[ -n "$RELEASE_REASON" ]] || { echo 'REASON_REQUIRED' >&2; exit 1; }
          [[ "$STAGING_DB_ID" != "$PRODUCTION_DB_ID" ]] || { echo 'PRODUCTION_TARGET_REJECTED' >&2; exit 1; }
          node --input-type=module <<'NODE'
          const token = process.env.GITHUB_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;
          const number = process.env.PR_NUMBER;
          const sha = process.env.RELEASE_SHA;
          const actor = process.env.GITHUB_ACTOR;
          async function github(path) {
            const response = await fetch('https://api.github.com/repos/' + repo + path, {
              headers: {
                authorization: 'Bearer ' + token,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
              },
            });
            if (!response.ok) throw new Error('GITHUB_GUARD_HTTP_' + response.status);
            return response.json();
          }
          const pr = await github('/pulls/' + number);
          // A merged HFA 0529 release must be pinned to the CURRENT protected main;
          // only this additive change may use the merged-PR staging path.
          const sameRepo = pr.base?.ref === 'main' &&
            pr.head?.repo?.full_name === repo && !pr.head?.repo?.fork;
          const reviewedOpenHead = pr.state === 'open' &&
            pr.head?.sha?.toLowerCase() === sha;
          let reviewedMergedHfa = false;
          if (sameRepo && process.env.CHANGE_ID === 'hfa-integration-bridge-0529' &&
              pr.merged === true && pr.merge_commit_sha?.toLowerCase() === sha) {
            const mainRef = await github('/git/refs/heads/main');
            reviewedMergedHfa = mainRef.object?.sha?.toLowerCase() === sha;
          }
          if (!sameRepo || !(reviewedOpenHead || reviewedMergedHfa)) {
            throw new Error('REVIEWED_PR_HEAD_OR_ORIGIN_MISMATCH');
          }
          if (process.env.CHANGE_ID === 'lms-scorm-qa-evidence-bindings-0568') {
            if (process.env.SCORM_F0_SCHEMA_0568_APPROVED_SHA !== sha) {
              throw new Error('SCORM_F0_0568_EXACT_SHA_GRANT_REQUIRED');
            }
            // The SHA-bound staging environment grant is the explicit approval.
            // Review count remains governed by the repository branch protection;
            // do not introduce an ad hoc second-account requirement for 0568.
          }
          const permissions = await github('/collaborators/' + encodeURIComponent(actor) + '/permission');
          if (!['write', 'push', 'maintain', 'admin'].includes(permissions.permission)) {
            throw new Error('WORKFLOW_ACTOR_NOT_AUTHORIZED');
          }
          console.log('REVIEWED_PR_ORIGIN_HEAD_AND_ACTOR=PASS');
          NODE

      - name: Checkout trusted release gates
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify eight required GitHub release gates for exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify-release-gates.mjs

      - name: Checkout exact reviewed candidate separately
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          path: release
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify candidate, manifest, and pinned staging database configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C release rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'RELEASE_SHA_DRIFT' >&2; exit 1; }
          test -f "release/worker-airtrust/schema-v2/$CHANGE_ID.json"
          test ! -L "release/worker-airtrust/schema-v2/$CHANGE_ID.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = readFileSync('release/worker-airtrust/wrangler.toml', 'utf8');
          const section = config.split('[[env.staging.d1_databases]]')[1]?.split(/^\[/m)[0];
          const name = process.env.STAGING_DB_NAME;
          const id = process.env.STAGING_DB_ID;
          if (!section || !section.includes('database_name = "' + name + '"') ||
              !section.includes('database_id = "' + id + '"') ||
              section.includes(process.env.PRODUCTION_DB_ID)) {
            throw new Error('STAGING_D1_PIN_MISMATCH');
          }
          const manifest = JSON.parse(readFileSync('release/worker-airtrust/schema-v2/' +
            process.env.CHANGE_ID + '.json', 'utf8'));
          const expectedPath = process.env.CHANGE_ID === 'lms-scorm-edition-policy-approvals-0569'
            ? 'worker-airtrust/schema-v2/changes/0569_lms_scorm_edition_policy_approvals.sql'
            : process.env.CHANGE_ID === 'hfa-integration-bridge-0529'
            ? 'worker-airtrust/schema-v2/changes/0529_hfa_integration_bridge.sql'
            : process.env.CHANGE_ID === 'lms-scorm-qa-evidence-bindings-0568'
            ? 'worker-airtrust/schema-v2/changes/0568_lms_scorm_qa_evidence_bindings.sql'
            : process.env.CHANGE_ID === 'lms-scorm-edition-handoff-0566'
            ? 'worker-airtrust/schema-v2/changes/0566_lms_scorm_edition_handoffs.sql'
            : process.env.CHANGE_ID === 'simulator-individual-check-evidence-0554'
            ? 'worker-airtrust/schema-v2/changes/0554_simulator_individual_check_evidence.sql'
            : process.env.CHANGE_ID === 'simulator-individual-check-delete-guard-0560'
              ? 'worker-airtrust/schema-v2/changes/0560_simulator_individual_check_delete_guard.sql'
              : process.env.CHANGE_ID === 'controle-voos-pilot-supplier-history-0564'
                ? 'worker-airtrust/schema-v2/changes/0564_controle_voos_pilot_supplier_history.sql'
              : process.env.CHANGE_ID === 'controle-voos-pilot-fueling-identity-0563'
                ? 'worker-airtrust/schema-v2/changes/0563_controle_voos_pilot_fueling_identity.sql'
                : 'worker-airtrust/schema-v2/changes/0552_frms_sleep_opportunity.sql';
          if (manifest.changeId !== process.env.REVIEWED_CHANGE_ID ||
              manifest.baselineId !== process.env.BASELINE_ID ||
              manifest.fileHash !== process.env.REVIEWED_SQL_HASH ||
              manifest.planHash !== process.env.REVIEWED_PLAN_HASH ||
              manifest.filePath !== expectedPath) {
            throw new Error('REVIEWED_MANIFEST_SCOPE_MISMATCH');
          }
          console.log('STAGING_TARGET_AND_MANIFEST_SCOPE=PASS');
          NODE

      - name: Install trusted main Worker CLI without executing PR dependencies
        run: npm --prefix worker-airtrust ci

      - name: Build verified SQL and Schema V2 ledger bundle
        id: bundle
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          output="$RUNNER_TEMP/staging-reviewed-schema-v2.sql"
          node ../scripts/schema-v2/build-reviewed-schema-apply.mjs \
            "worker-airtrust/schema-v2/$CHANGE_ID.json" "$output" "$CHANGE_ID" "$RELEASE_SHA"
          test -s "$output"
          echo "combined_sql=$output" >> "$GITHUB_OUTPUT"

      - name: Verify staging credentials and physical preconditions read-only
        id: preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] ||
            { echo 'STAGING_MIGRATION_CREDENTIALS_MISSING' >&2; exit 1; }
          query_count() {
            (cd release/worker-airtrust && ../../worker-airtrust/node_modules/.bin/wrangler d1 execute "$STAGING_DB_NAME" \
              --env staging --remote --json --command="$1") |
              node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{
                const rows=JSON.parse(s);const entry=Array.isArray(rows)?rows[0]:rows;
                const count=entry?.results?.[0]?.total;
                if(entry?.success!==true || !Number.isInteger(count) || count<0)process.exit(1);
                console.log(count);
              });'
          }
          [[ "$(query_count "SELECT COUNT(*) AS total FROM airtrust_schema_baselines_v2 WHERE baseline_id = '$BASELINE_ID' AND status = 'ACTIVE'")" == '1' ]] ||
            { echo 'STAGING_SCHEMA_V2_BASELINE_NOT_ACTIVE' >&2; exit 1; }
          [[ "$(query_count "SELECT COUNT(*) AS total FROM airtrust_schema_changes_v2 WHERE change_id = '$CHANGE_ID'")" == '0' ]] ||
            { echo 'CHANGE_ALREADY_APPLIED_OR_LEDGER_DRIFT' >&2; exit 1; }
          if [[ "$CHANGE_ID" == 'hfa-integration-bridge-0529' ]]; then
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='table' AND name IN ('empresas','sgso_relatos')")" == '2' ]] || { echo 'HFA_0529_SOURCE_TABLES_MISSING' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM pragma_table_info('sgso_relatos') WHERE name IN ('id','empresa_id','deleted_at')")" == '3' ]] || { echo 'HFA_0529_SGSO_TENANT_COLUMNS_MISSING' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='table' AND name IN ('integracoes_hfa_config','integracoes_hfa_eventos')")" == '0' ]] || { echo 'HFA_0529_TABLES_ALREADY_PRESENT_WITHOUT_LEDGER' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='index' AND name IN ('idx_integracoes_hfa_eventos_empresa_status','idx_integracoes_hfa_eventos_relato','idx_integracoes_hfa_eventos_hfa_event')")" == '0' ]] || { echo 'HFA_0529_INDEXES_ALREADY_PRESENT_WITHOUT_LEDGER' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='trigger' AND name IN ('trg_integracoes_hfa_eventos_tenant_insert','trg_integracoes_hfa_eventos_tenant_update')")" == '0' ]] || { echo 'HFA_0529_TRIGGERS_ALREADY_PRESENT_WITHOUT_LEDGER' >&2; exit 1; }
            echo "sgso_relato_count=$(query_count "SELECT COUNT(*) AS total FROM sgso_relatos")" >> "$GITHUB_OUTPUT"
          elif [[ "$CHANGE_ID" == 'lms-scorm-edition-policy-approvals-0569' ]]; then
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='table' AND name IN ('lms_cursos','lms_matriculas','lms_matricula_ciclos','lms_scorm_package_versions','lms_progresso_scorm','qualificacoes_historico')")" == '6' ]] || { echo 'SCORM_0569_SOURCE_TABLES_MISSING' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM pragma_table_info('lms_scorm_package_versions') WHERE name IN ('assessment_policy','certification_profile')")" == '0' ]] || { echo 'SCORM_0569_VERSION_COLUMNS_ALREADY_PRESENT_WITHOUT_LEDGER' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM pragma_table_info('lms_matricula_ciclos') WHERE name='assessment_policy'")" == '0' ]] || { echo 'SCORM_0569_CYCLE_COLUMN_ALREADY_PRESENT_WITHOUT_LEDGER' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='table' AND name='lms_scorm_package_approvals'")" == '0' ]] || { echo 'SCORM_0569_APPROVALS_TABLE_ALREADY_PRESENT_WITHOUT_LEDGER' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='index' AND name='idx_lms_scorm_approvals_scope'")" == '0' ]] || { echo 'SCORM_0569_INDEX_ALREADY_PRESENT_WITHOUT_LEDGER' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='trigger' AND name IN ('trg_lms_scorm_edition_profile_consistent','trg_lms_scorm_edition_policy_immutable','trg_lms_ciclo_policy_immutable','trg_lms_scorm_approval_scope','trg_lms_scorm_approval_no_update','trg_lms_scorm_approval_no_delete')")" == '0' ]] || { echo 'SCORM_0569_TRIGGERS_ALREADY_PRESENT_WITHOUT_LEDGER' >&2; exit 1; }
            for table in lms_cursos lms_scorm_package_versions lms_matriculas lms_matricula_ciclos lms_progresso_scorm qualificacoes_historico; do
              printf '%s=%s\n' "count_$table" "$(query_count "SELECT COUNT(*) AS total FROM $table")" >> "$GITHUB_OUTPUT"
            done
          elif [[ "$CHANGE_ID" == 'lms-scorm-qa-evidence-bindings-0568' ]]; then
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='table' AND name IN ('lms_matriculas','lms_matricula_ciclos','lms_cursos','lms_scorm_package_versions','lms_progresso_scorm','lms_completion_diagnostics_snapshots','qualificacoes_historico')")" == '7' ]] || { echo 'SCORM_0568_SOURCE_TABLES_MISSING'; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM pragma_table_info('lms_scorm_package_versions') WHERE name IN ('id','package_sha256','empresa_id','curso_id','status','r2_prefix')")" == '6' ]] || { echo 'SCORM_0568_SOURCE_COLUMNS_MISSING_LMS_SCORM_PACKAGE_VERSIONS'; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM pragma_table_info('lms_cursos') WHERE name IN ('id','empresa_id','deleted_at','scorm_package_r2_prefix')")" == '4' ]] || { echo 'SCORM_0568_SOURCE_COLUMNS_MISSING_LMS_CURSOS'; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM pragma_table_info('lms_matriculas') WHERE name IN ('id','empresa_id','curso_id','deleted_at')")" == '4' ]] || { echo 'SCORM_0568_SOURCE_COLUMNS_MISSING_LMS_MATRICULAS'; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM pragma_table_info('lms_matricula_ciclos') WHERE name IN ('id','matricula_id','empresa_id','curso_id','ciclo_atual','deleted_at')")" == '6' ]] || { echo 'SCORM_0568_SOURCE_COLUMNS_MISSING_LMS_MATRICULA_CICLOS'; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='table' AND name='lms_scorm_qa_evidence_bindings'")" == '0' ]] || { echo 'SCORM_0568_TABLE_ALREADY_PRESENT'; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='index' AND name IN ('uq_lms_scorm_qa_active_enrollment','idx_lms_scorm_qa_scope')")" == '0' ]] || { echo 'SCORM_0568_INDEX_ALREADY_PRESENT'; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='trigger' AND name IN ('trg_lms_scorm_qa_binding_insert_scope','trg_lms_scorm_qa_binding_update_integrity','trg_lms_scorm_qa_binding_no_delete')")" == '0' ]] || { echo 'SCORM_0568_TRIGGER_ALREADY_PRESENT'; exit 1; }
            for table in lms_cursos lms_scorm_package_versions lms_matriculas lms_matricula_ciclos lms_progresso_scorm lms_completion_diagnostics_snapshots qualificacoes_historico; do
              printf '%s=%s\n' "count_$table" "$(query_count "SELECT COUNT(*) AS total FROM $table")" >> "$GITHUB_OUTPUT"
            done
          elif [[ "$CHANGE_ID" == 'simulator-individual-check-delete-guard-0560' ]]; then
            [[ "$(query_count "SELECT COUNT(*) AS total FROM airtrust_schema_changes_v2 WHERE change_id='simulator-individual-check-evidence-0554' AND baseline_id='$BASELINE_ID' AND file_hash='bcbdcf8bd78c3a3d6393624e62ae70e691190e3ae2d35c0951c0bc56470b4bf5' AND plan_hash='47b79c542348749d865425a5487f72689444f30553187778f51366b89bbcd0b6'")" == '1' ]] || { echo 'SIMULATOR_0554_DEPENDENCY_LEDGER_MISMATCH' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='table' AND name='sessoes_checks_resultados_individuais'")" == '1' ]] || { echo 'SIMULATOR_INDIVIDUAL_TABLE_MISSING' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='index' AND tbl_name='sessoes_checks_resultados_individuais' AND name LIKE 'idx_checks_individuais_%'")" == '3' ]] || { echo 'SIMULATOR_0554_INDEXES_MISMATCH' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='trigger' AND tbl_name='sessoes_checks_resultados_individuais' AND name IN ('trg_checks_individuais_scope_insert','trg_checks_individuais_immutable_scope','trg_checks_individuais_confirm_insert','trg_checks_individuais_confirm_update','trg_checks_individuais_annulled_immutable','trg_checks_individuais_confirmed_immutable')")" == '6' ]] || { echo 'SIMULATOR_0554_TRIGGERS_MISMATCH' >&2; exit 1; }
            [[ "$(query_count "SELECT COUNT(*) AS total FROM sqlite_master WHERE type='trigger' AND name='trg_checks_individuais_delete_guard'")" == '0' ]] || { echo 'SIMULATOR_0560_DELETE_TRIGGER_ALREADY_PRESENT' >&2; exit 1; }
