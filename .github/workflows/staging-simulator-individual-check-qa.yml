name: Staging Simulator Individual Check QA

# Frente 7 / issue #1548 — homologação operacional A (aprovado) / B (reprovado) / C (pendente) em STAGING.
# Contrato: só roda a partir da main, depois de (1) Schema V2 0554 → 0560 aplicados fisicamente, em ordem, pelo
# workflow governado de Schema V2 e (2) Worker + frontend de staging implantados com o SHA exato.
# Este workflow NUNCA aplica migration, NUNCA toca produção e usa somente o tenant sintético qa_examiner_training.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_STAGING_SIMULATOR_INDIVIDUAL_CHECK_QA to continue'
        required: true
        type: string
      expected_deployed_sha:
        description: 'Exact Worker/frontend SHA currently deployed to staging'
        required: true
        type: string
      pr_number:
        description: 'Open reviewed same-repository staging release PR (required if SHA not in main)'
        required: false
        type: string

concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  STAGING_FRONTEND_BASE_URL: https://staging.airtrust.pages.dev
  STAGING_D1_NAME: airtrust-db-staging-baseline-20260701
  QA_SIM_IND_CODE: QA-SIM-IND-${{ github.run_id }}
  QA_SIM_IND_MARKER: QA_ONLY_SIMULATOR_INDIVIDUAL_CHECK_${{ github.run_id }}

jobs:
  guard:
    name: Simulator Individual Check QA Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate trusted staging provenance
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.expected_deployed_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo MAIN_ONLY >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_STAGING_SIMULATOR_INDIVIDUAL_CHECK_QA' ]] || { echo CONFIRMATION_REJECTED >&2; exit 1; }
          [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo EXPECTED_SHA_INVALID >&2; exit 1; }
          if git cat-file -e "$EXPECTED_DEPLOYED_SHA^{commit}" 2>/dev/null &&
             git merge-base --is-ancestor "$EXPECTED_DEPLOYED_SHA" HEAD; then
            echo "TRUSTED_RELEASE_ANCESTRY_OK=$EXPECTED_DEPLOYED_SHA"
          else
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo OPEN_REVIEWED_PR_REQUIRED >&2; exit 1; }
            node --input-type=module <<'PR_GUARD'
          const expected = process.env.EXPECTED_DEPLOYED_SHA.toLowerCase();
          const repo = process.env.GITHUB_REPOSITORY;
          const number = process.env.PR_NUMBER;
          const response = await fetch(`https://api.github.com/repos/${repo}/pulls/${number}`, {
            headers: {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
            },
          });
          if (!response.ok) throw new Error(`RELEASE_PR_LOOKUP_HTTP_${response.status}`);
          const pr = await response.json();
          if (pr.state !== 'open' ||
              pr.base?.ref !== 'main' ||
              pr.head?.repo?.full_name !== repo ||
              pr.head?.repo?.fork === true ||
              pr.head?.sha?.toLowerCase() !== expected) {
            throw new Error('OPEN_REVIEWED_PR_SHA_OR_SCOPE_MISMATCH');
          }
          console.log('TRUSTED_OPEN_RELEASE_PR_HEAD_OK');
          PR_GUARD
          fi
          node scripts/ci/verify-release-gates.mjs
          node --input-type=module <<'NODE'
          const expected=String(process.env.EXPECTED_DEPLOYED_SHA).toLowerCase();
          const r=await fetch(`${process.env.STAGING_API_BASE_URL}/api/version`); if(!r.ok) throw new Error(`VERSION_HTTP_${r.status}`);
          const j=await r.json(); const sha=String(j?.data?.sourceSha||j?.sourceSha||'').toLowerCase();
          if(sha!==expected) throw new Error(`STAGING_WORKER_SHA_MISMATCH:${sha||'missing'}`);
          const {assertLiveFrontendShaFromOrigin}=await import('./e2e/lib/live-sha-guard.mjs');
          await assertLiveFrontendShaFromOrigin(process.env.STAGING_FRONTEND_BASE_URL,expected.slice(0,7));
          console.log(`SIMULATOR_INDIVIDUAL_CHECK_PROVENANCE_OK=${expected}`);
          NODE

  d1_fixture:
    name: Seed Isolated Simulator Individual Check Fixture
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm --prefix worker-airtrust ci
      - name: Seed fixture (refuses unless Schema V2 0554 and 0560 are in the physical ledger)
        env:
          QA_EXAMINER_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL || 'qa-examiner-admin@staging.airtrust.invalid' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_STAGING_SIMULATOR_INDIVIDUAL_CHECK_QA: AIRTRUST_STAGING_SIMULATOR_INDIVIDUAL_CHECK_QA
        run: |
          set -euo pipefail
          node scripts/staging/seed-qa-simulator-individual-check.mjs --code="$QA_SIM_IND_CODE" --marker="$QA_SIM_IND_MARKER"
          node scripts/staging/seed-qa-simulator-individual-check.mjs --apply --code="$QA_SIM_IND_CODE" --marker="$QA_SIM_IND_MARKER"
          node scripts/staging/seed-qa-simulator-individual-check.mjs --manifest --code="$QA_SIM_IND_CODE" --marker="$QA_SIM_IND_MARKER" > sim-qa-manifest.json
          node --input-type=module -e "const m=JSON.parse(await (await import('node:fs/promises')).readFile('sim-qa-manifest.json','utf8')); if(m.fichas.length!==4) throw new Error('MANIFEST_INCOMPLETE'); console.log('MANIFEST_FICHAS=4')"
      - name: Upload numeric-only manifest (no PII)
        uses: actions/upload-artifact@v7
        with:
          name: simulator-individual-check-manifest-${{ github.run_id }}
          path: sim-qa-manifest.json
          retention-days: 3

  browser:
    name: Authenticated Simulator Individual Check E2E (A/B/C)
    needs: [guard, d1_fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      QA_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD }}
      E2E_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      E2E_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      SIM_QA_MANIFEST_FILE: ${{ github.workspace }}/sim-qa-manifest.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          name: simulator-individual-check-manifest-${{ github.run_id }}
          path: .
      - name: Run write-capable staging homologation (synthetic tenant only)
        run: npx playwright test --config=e2e/simuladores-individual-check.config.ts
      - name: Upload sanitized result (no traces, screenshots or credentials)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-individual-check-result-${{ github.run_id }}
          path: test-results/simulator-individual-check/results.json
          if-no-files-found: warn
          retention-days: 14

  d1_cleanup:
    name: Cleanup Isolated Simulator Individual Check Fixture
    needs: [d1_fixture, browser]
    if: always() && needs.d1_fixture.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm --prefix worker-airtrust ci
      - name: Soft-delete only this run's synthetic artifacts (confirmed evidence stays immutable by design)
        env:
          QA_EXAMINER_ADMIN_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL || 'qa-examiner-admin@staging.airtrust.invalid' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_STAGING_SIMULATOR_INDIVIDUAL_CHECK_QA: AIRTRUST_STAGING_SIMULATOR_INDIVIDUAL_CHECK_QA
        run: node scripts/staging/seed-qa-simulator-individual-check.mjs --rollback --apply --code="$QA_SIM_IND_CODE" --marker="$QA_SIM_IND_MARKER"

  summary:
    name: Simulator Individual Check QA Summary
    needs: [guard, d1_fixture, browser, d1_cleanup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish result
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          {
            echo '## Simulator individual check homologation (staging)'
            echo ''
            echo "- staging SHA: \`$EXPECTED_DEPLOYED_SHA\`"
            echo '- schema 0554/0560 precondition + fixture seed: `${{ needs.d1_fixture.result }}`'
            echo '- A/B/C authenticated E2E: `${{ needs.browser.result }}`'
            echo '- fixture cleanup: `${{ needs.d1_cleanup.result }}`'
            echo '- production writes: `none`'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ '${{ needs.guard.result }}' == success && '${{ needs.d1_fixture.result }}' == success && '${{ needs.browser.result }}' == success && '${{ needs.d1_cleanup.result }}' == success ]]
