name: Production Update Coordenacao Control Access

on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: 'Exact SHA currently deployed to production'
        required: true
        type: string
      confirmation:
        description: 'Type AIRTRUST_PRODUCTION_COORDENACAO_CONTROL_ACCESS'
        required: true
        type: string

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: production-update-coordenacao-control-access
  cancel-in-progress: false

jobs:
  guard:
    name: Coordination Control Access Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Validate immutable dispatch
        shell: bash
        env:
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo MAIN_ONLY >&2; exit 1; }
          [[ "$EXPECTED_PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo EXPECTED_PRODUCTION_SHA_INVALID >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_PRODUCTION_COORDENACAO_CONTROL_ACCESS' ]] || { echo CONFIRMATION_REQUIRED >&2; exit 1; }
      - name: Verify workflow-source release gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-release-gates.mjs
      - name: Verify exact deployed production SHA
        env:
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
        run: |
          node --input-type=module <<'NODE'
          const expected = String(process.env.EXPECTED_PRODUCTION_SHA || '').toLowerCase();
          const response = await fetch('https://api.airtrust.online/api/version', { headers: { 'Cache-Control': 'no-cache' } });
          if (!response.ok) throw new Error(`VERSION_HTTP_${response.status}`);
          const body = await response.json();
          const actual = String(body?.data?.sourceSha || body?.data?.source_sha || '').toLowerCase();
          if (actual !== expected) throw new Error(`PRODUCTION_SHA_MISMATCH:${actual || 'missing'}`);
          console.log('PRODUCTION_SHA_MATCH=PASS');
          NODE

  update:
    name: Update Coordination Control Access
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
      PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}
      PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}
      COORDENACAO_USER_EMAIL: ${{ secrets.COORDENACAO_USER_EMAIL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require governed credentials
        shell: bash
        run: |
          set -euo pipefail
          for value in "$PROD_SMOKE_EMAIL" "$PROD_SMOKE_PASSWORD" "$COORDENACAO_USER_EMAIL"; do
            [[ -n "$value" ]] || { echo REQUIRED_PRODUCTION_CREDENTIAL_MISSING >&2; exit 1; }
          done
          [[ "$PROD_SMOKE_EMAIL" != *'staging.airtrust.invalid'* ]] || { echo STAGING_QA_IDENTITY_REJECTED >&2; exit 1; }
          echo "::add-mask::$COORDENACAO_USER_EMAIL"
      - name: Read-only preflight
        run: node scripts/production/update-coordenacao-control-access.mjs
      - name: Apply exact authorized access delta
        env:
          CONFIRM_PRODUCTION_COORDENACAO_CONTROL_ACCESS: AIRTRUST_PRODUCTION_COORDENACAO_CONTROL_ACCESS
        run: node scripts/production/update-coordenacao-control-access.mjs --apply
      - name: Publish sanitized summary
        if: success()
        run: |
          {
            echo '## Coordination Control Access'
            echo ''
            echo '- tenant: `6`'
            echo '- Controle de Voos: total configured'
            echo '- Treinamentos: denied'
            echo '- unrelated overrides: preserved'
            echo '- credentials/PII emitted: no'
          } >> "$GITHUB_STEP_SUMMARY"
