name: Production FRMS SIGVOOS Chain Readonly Validation

# SOMENTE LEITURA. Verifica a cadeia SIGVOOS -> Controle de Voos -> FRMS em produção: frescor da
# ingestão, rechecagem retroativa D-3..D-1, ledger de cobertura por dia, duplicação, órfãos, isolamento
# entre empresas e reconciliação diária. Só consultas SELECT/WITH por um adaptador que recusa qualquer
# outra instrução (scripts/production/lib/frms-checkin-obligation-validation.mjs). D1 de produção fixado
# por id; staging e dev bloqueados. A saída tem só contagens agregadas, sem nomes ou identificadores.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_FRMS_SIGVOOS_CHAIN_READONLY to continue'
        required: true
        type: string
      expected_sha:
        description: 'Exact current main SHA reviewed for this read-only validation'
        required: true
        type: string
      window_from:
        description: 'First operational day (YYYY-MM-DD)'
        required: true
        type: string
      window_to:
        description: 'Last operational day (YYYY-MM-DD, at most 62 days after window_from)'
        required: true
        type: string

concurrency:
  group: frms-production-sigvoos-chain-readonly
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PRODUCTION_D1_ID: 7c8a788e-a4c4-4d5d-8208-ff7ff55e84ae

jobs:
  validate:
    name: SIGVOOS to Controle de Voos to FRMS chain (production D1, read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Validate immutable dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WINDOW_FROM: ${{ inputs.window_from }}
          WINDOW_TO: ${{ inputs.window_to }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == 'refs/heads/main' ]] || { echo 'MAIN_REF_REQUIRED' >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_FRMS_SIGVOOS_CHAIN_READONLY' ]] || { echo 'CONFIRMATION_REQUIRED' >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'EXPECTED_SHA_INVALID' >&2; exit 1; }
          [[ "$EXPECTED_SHA" == "$EVENT_SHA" ]] || { echo 'EXPECTED_SHA_MISMATCH' >&2; exit 1; }
          [[ "$WINDOW_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$WINDOW_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'WINDOW_INVALID' >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require production D1 read credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'PRODUCTION_D1_READ_TOKEN_MISSING' >&2; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING' >&2; exit 1; }

      - name: Run read-only chain validation against production D1
        id: validation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_D1_ID: ${{ env.PRODUCTION_D1_ID }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM_READONLY: AIRTRUST_FRMS_SIGVOOS_CHAIN_READONLY
          WINDOW_FROM: ${{ inputs.window_from }}
          WINDOW_TO: ${{ inputs.window_to }}
          AUDIT_REPORT_PATH: ${{ runner.temp }}/frms-sigvoos-chain.json
        run: |
          set +e
          export TODAY_SAO_PAULO="$(TZ=America/Sao_Paulo date +%F)"
          node scripts/production/frms-sigvoos-chain-readonly.mjs
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          test -s "$RUNNER_TEMP/frms-sigvoos-chain.json"

      - name: Publish sanitized summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/frms-sigvoos-chain.json"
          [[ -s "$report" ]] || { echo 'No chain report produced.' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/frms-sigvoos-chain.json", "utf8"));
            console.log("## FRMS SIGVOOS to Controle de Voos to FRMS chain, production read-only");
            console.log("");
            console.log(`- window: \`${r.window.from}..${r.window.to}\` (today in Sao Paulo: \`${r.today_sao_paulo}\`)`);
            console.log(`- violations: \`${r.violations}\`; advisories: \`${r.advisories}\`; queries: \`${r.queries}\`; writes: \`${r.writes}\``);
            for (const f of r.findings) {
              const { severity, code, ...rest } = f;
              console.log(`- [${severity}] \`${code}\` ${Object.keys(rest).length ? "`" + JSON.stringify(rest) + "`" : ""}`);
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frms-sigvoos-chain-${{ github.sha }}
          path: ${{ runner.temp }}/frms-sigvoos-chain.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail when any chain invariant is violated
        if: ${{ steps.validation.outputs.exit_code != '0' }}
        shell: bash
        env:
          CODE: ${{ steps.validation.outputs.exit_code }}
        run: |
          echo "Chain validation exit code ${CODE}: see the sanitized summary." >&2
          exit 1
