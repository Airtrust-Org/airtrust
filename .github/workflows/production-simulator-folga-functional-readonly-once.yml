name: Production Simulator FOLGA Functional Readonly Proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA reviewed for the production simulator read-only proof
        required: true
        type: string
      confirmation:
        description: Type AIRTRUST_PRODUCTION_SIMULATOR_FOLGA_READONLY
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - scripts/validation/production-simulator-folga-functional-readonly-20260906.marker

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: production-simulator-folga-functional-readonly
  cancel-in-progress: false

env:
  PROD_API_BASE_URL: https://api.airtrust.online

jobs:
  proof:
    name: Tenant 6 FOLGA functional read-only proof
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate immutable manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "MAIN_REF_REQUIRED" >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "EXPECTED_SHA_INVALID" >&2; exit 1; }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo "EXPECTED_SHA_MISMATCH" >&2; exit 1; }
          [[ "$CONFIRMATION" == "AIRTRUST_PRODUCTION_SIMULATOR_FOLGA_READONLY" ]] || { echo "READONLY_CONFIRMATION_REQUIRED" >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Wait for the eight release gates on this exact main SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if node scripts/ci/verify-release-gates.mjs; then
              echo "RELEASE_GATES_GREEN"
              exit 0
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo "RELEASE_GATES_TIMEOUT_OR_FAILURE" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Require production QA credentials
        shell: bash
        env:
          AIRTRUST_LOGIN: ${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}
          AIRTRUST_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$AIRTRUST_LOGIN" && -n "$AIRTRUST_PASSWORD" ]] || { echo "PRODUCTION_SMOKE_CREDENTIALS_MISSING" >&2; exit 1; }
          [[ "$AIRTRUST_LOGIN" != *"staging.airtrust.invalid"* ]] || { echo "STAGING_QA_IDENTITY_REJECTED" >&2; exit 1; }

      - name: Run production functional proof without writes
        shell: bash
        env:
          AIRTRUST_LOGIN: ${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}
          AIRTRUST_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/validation/production-simulator-folga-readonly.mjs > "$RUNNER_TEMP/folga-functional-readonly.json"
          node - "$RUNNER_TEMP/folga-functional-readonly.json" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const fail = (message) => { throw new Error(message); };
          if (data.ok !== true) fail('FUNCTIONAL_PROOF_NOT_OK');
          if (Number(data.tenant_id) !== 6) fail('TENANT_6_REQUIRED');
          if (data.roster_policy !== 'FOLGA') fail('FOLGA_POLICY_NOT_READ_BACK');
          if (data.proposal_mode !== 'PREVIEW_ONLY') fail('PROPOSAL_NOT_PREVIEW_ONLY');
          if (Number(data.proposal_summary?.session_requirements || 0) < 1) fail('PROPOSAL_HAS_NO_SESSION_REQUIREMENTS');
          if (data.fixed_scale_diagnostic?.source !== 'FUNCIONARIO_ESCALA_1_2') fail('FIXED_SCALE_SOURCE_NOT_PROVEN');
          if (Number(data.fixed_scale_diagnostic?.employees_with_fixed_fortnight || 0) < 1) fail('NO_FIXED_SCALE_EMPLOYEE');
          if (Number(data.fixed_scale_diagnostic?.eligible_date_count || 0) < 1) fail('NO_DERIVED_FOLGA_DATE');
          if (data.monthly_published_roster_required !== false) fail('MONTHLY_ROSTER_DEPENDENCY_NOT_REMOVED');
          if (data.proof_mode === 'FULL_FIXED_SCALE_FOLGA') {
            if (Number(data.selected_block_sessions || 0) < 2) fail('NO_SELECTED_REAL_PAIR');
            if (data.folga_validation?.schedule_status !== 'SCHEDULED') fail('FOLGA_NOT_SCHEDULED');
            if (data.folga_validation?.common_date_resolved !== true) fail('COMMON_FOLGA_DATE_NOT_RESOLVED');
            if (!Array.isArray(data.folga_validation?.roster_states) || data.folga_validation.roster_states.length < 1 || !data.folga_validation.roster_states.every((state) => state === 'FOLGA')) {
              fail('FOLGA_FIXED_SCALE_EVIDENCE_INVALID');
            }
          } else if (data.proof_mode === 'FIXED_SCALE_PROPOSAL_NO_PAIR_AVAILABLE') {
            if (Number(data.fixed_scale_diagnostic?.paired_candidate_blocks || 0) !== 0) fail('PAIR_PROOF_SHOULD_HAVE_RUN');
            if (Number(data.selected_block_sessions || 0) !== 0) fail('LIMITED_PROOF_SELECTED_BLOCK_UNEXPECTED');
          } else {
            fail('UNKNOWN_PROOF_MODE');
          }
          if (Number(data.writes) !== 0) fail('READONLY_CONTRACT_BROKEN');
          if (data.pii_emitted !== false) fail('PII_EMISSION_CONTRACT_BROKEN');
          NODE

      - name: Publish sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/folga-functional-readonly.json" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('## Production simulator FOLGA functional proof');
          console.log('');
          console.log(`- workflow source SHA: \`${process.env.GITHUB_SHA}\``);
          console.log(`- tenant: \`${data.tenant_id}\``);
          console.log(`- roster policy: \`${data.roster_policy}\``);
          console.log(`- proposal mode: \`${data.proposal_mode}\``);
          console.log(`- proof mode: \`${data.proof_mode}\``);
          console.log(`- proposal session requirements: \`${data.proposal_summary?.session_requirements ?? 'n/a'}\``);
          console.log(`- paired/unmatched blocks: \`${data.proposal_summary?.paired_blocks ?? 'n/a'}/${data.proposal_summary?.unmatched_blocks ?? 'n/a'}\``);
          console.log(`- availability source: \`${data.fixed_scale_diagnostic?.source ?? 'n/a'}\``);
          console.log(`- employees with fixed Escala 1/2: \`${data.fixed_scale_diagnostic?.employees_with_fixed_fortnight ?? 'n/a'}\``);
          console.log(`- employees with derived eligible dates: \`${data.fixed_scale_diagnostic?.employees_with_eligible_dates ?? 'n/a'}\``);
          console.log(`- derived eligible dates: \`${data.fixed_scale_diagnostic?.eligible_date_count ?? 'n/a'}\``);
          console.log(`- paired candidate blocks: \`${data.fixed_scale_diagnostic?.paired_candidate_blocks ?? 'n/a'}\``);
          console.log(`- selected real block sessions: \`${data.selected_block_sessions ?? 'n/a'}\``);
          console.log(`- FOLGA candidate: \`${data.folga_validation?.schedule_status ?? 'not-exercised'}\``);
          console.log('- monthly published roster required: no');
          console.log('- writes: 0');
          console.log('- PII emitted: no');
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: production-simulator-folga-functional-readonly-${{ github.sha }}
          path: ${{ runner.temp }}/folga-functional-readonly.json
          if-no-files-found: error
          retention-days: 14
