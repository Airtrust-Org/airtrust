name: Temporary wire eDB shadow review panel

on:
  push:
    branches:
      - feat/edb-shadow-pic-review-evidence-20260802
    paths:
      - .github/workflows/tmp-wire-edb-shadow-review.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edb-shadow-pic-review-evidence-20260802
          fetch-depth: 0
      - name: Wire review panel and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/react-app/pages/controle-voos/EdbShadowPrototypeWithAssessment.tsx')
          source = path.read_text(encoding='utf-8')
          import_old = "import EdbShadowPrototype from './EdbShadowPrototype';"
          import_new = import_old + "\nimport EdbShadowReviewEvidencePanel from './EdbShadowReviewEvidencePanel';"
          render_old = '      <AssessmentPanel flightId={flightId} />'
          render_new = render_old + "\n      <EdbShadowReviewEvidencePanel flightId={flightId} />"
          if source.count(import_old) != 1 or source.count(render_old) != 1:
              raise SystemExit('expected wrapper anchors not found exactly once')
          source = source.replace(import_old, import_new).replace(render_old, render_new)
          path.write_text(source, encoding='utf-8')
          PY
          git rm .github/workflows/tmp-wire-edb-shadow-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react-app/pages/controle-voos/EdbShadowPrototypeWithAssessment.tsx
          git commit -m "feat(edb): wire shadow review evidence panel"
          git push origin HEAD:feat/edb-shadow-pic-review-evidence-20260802
