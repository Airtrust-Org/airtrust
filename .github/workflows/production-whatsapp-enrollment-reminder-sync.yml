name: Production WhatsApp Enrollment Reminder Sync

on:
  workflow_dispatch:
    inputs:
      expected_worker_sha:
        description: 'Exact production Worker SHA already deployed and authorized'
        required: true
        type: string
      confirmation:
        description: 'Type AIRTRUST_PRODUCTION_WHATSAPP_TEMPLATE_SYNC'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-whatsapp-enrollment-reminder-sync
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PROD_API_BASE_URL: https://api.airtrust.online

jobs:
  sync:
    name: Sync enrollment reminder template
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPECTED_WORKER_SHA: ${{ inputs.expected_worker_sha }}
      AIRTRUST_PRODUCTION_WHATSAPP_TEMPLATE_SYNC_CONFIRMATION: ${{ inputs.confirmation }}
      PROD_EMAIL: ${{ secrets.QA_EXAMINER_ADMIN_EMAIL || secrets.PROD_SMOKE_EMAIL }}
      PROD_PASSWORD: ${{ secrets.QA_EXAMINER_ADMIN_PASSWORD || secrets.PROD_SMOKE_PASSWORD }}
    steps:
      - name: Checkout reviewed executor
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify exact deployed Worker and sync one approved template definition
        run: node scripts/production/sync-whatsapp-enrollment-reminder.mjs
