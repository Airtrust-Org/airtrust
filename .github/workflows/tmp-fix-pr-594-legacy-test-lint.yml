name: Temporary fix PR 594 legacy test lint

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/audit-p0-admin-identities-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-p0-admin-identities-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Scope legacy mock lint exception
        shell: bash
        run: |
          set -euo pipefail
          file='worker-airtrust/src/__tests__/routes/admin-usuarios-tenant.test.ts'
          if ! head -n 1 "$file" | grep -q 'eslint-disable @typescript-eslint/no-explicit-any'; then
            tmp="$(mktemp)"
            printf '/* eslint-disable @typescript-eslint/no-explicit-any */\n' > "$tmp"
            cat "$file" >> "$tmp"
            mv "$tmp" "$file"
          fi
          npx --yes prettier@3.9.6 --write "$file"
          npx eslint --max-warnings=0 -- "$file"
      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-fix-pr-594-legacy-test-lint.yml
          git add -A
          git commit -m 'test(security): scope legacy admin mock lint exception'
          git push origin HEAD:fix/audit-p0-admin-identities-20260801
