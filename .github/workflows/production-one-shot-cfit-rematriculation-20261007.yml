name: Production One-Shot CFIT Rematriculation 20261007

on:
  workflow_run:
    workflows: ['CI (heavy gates)']
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: production-one-shot-cfit-rematriculation-20261007
  cancel-in-progress: false

env:
  PROD_API_BASE_URL: https://api.airtrust.online
  EXPECTED_TENANT_ID: '6'
  ONE_SHOT_TOKEN: ONE_SHOT_CFIT_DIEGO_WILSON_20261007

jobs:
  rematriculate:
    name: One-shot CFIT rematriculation
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, 'ONE_SHOT_CFIT_DIEGO_WILSON_20261007')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      E2E_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}
      E2E_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}
      AIRTRUST_TARGET_EMPLOYEE_QUERIES: '["Diego","Wilson Nery"]'
      AIRTRUST_COURSE_QUERY: CFIT
      AIRTRUST_SEND_EMAIL: 'false'
      AIRTRUST_PRODUCTION_REMATRICULATION_CONFIRMATION: AIRTRUST_PRODUCTION_TARGETED_LMS_REMATRICULATION

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate one-shot source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current_main" = "$SOURCE_SHA" || { echo CURRENT_MAIN_SHA_MISMATCH >&2; exit 1; }
          git log -1 --format=%B | grep -Fq "$ONE_SHOT_TOKEN" || { echo ONE_SHOT_TOKEN_MISSING >&2; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker-airtrust/package-lock.json

      - run: npm --prefix worker-airtrust ci

      - name: Validate targeted operator
        run: |
          set -euo pipefail
          node --check scripts/production/lms-targeted-rematriculation.mjs
          node --test scripts/__tests__/production-lms-targeted-rematriculation.test.mjs

      - name: Verify official release gates on exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/verify-release-gates.mjs

      - name: Require production admin credentials
        run: |
          set -euo pipefail
          [[ -n "$E2E_EMAIL" && -n "$E2E_PASSWORD" ]] || { echo PRODUCTION_ADMIN_CREDENTIALS_MISSING >&2; exit 1; }
          [[ "$E2E_EMAIL" != *'staging.airtrust.invalid'* ]] || { echo STAGING_QA_IDENTITY_REJECTED >&2; exit 1; }

      - name: Execute exact rematriculation through audited API
        run: node scripts/production/lms-targeted-rematriculation.mjs
