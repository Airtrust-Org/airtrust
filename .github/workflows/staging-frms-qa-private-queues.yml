name: FRMS F0 Private Queue Provision (Existing Staging Token, Exact Grant)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact FRMS F0 QUEUES-only confirmation
        required: true
        type: string
      expected_main_sha:
        description: Exact main SHA with all eight official gates completed
        required: true
        type: string
      grant_id:
        description: Fresh unedited admin #776 Queue provisioning grant ID
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  issues: read

concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false

jobs:
  queue-staging-only:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Test exact Queue grant and bounded two-name contract locally
        run: node --test scripts/__tests__/frms-qa-private-queue-provision.test.mjs
      - name: Create only the two fixed FRMS private Queues under new exact F0 grant
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRMS_QA_QUEUE_CONFIRM: ${{ inputs.confirmation }}
          FRMS_QA_QUEUE_EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          FRMS_QA_QUEUE_GRANT_ID: ${{ inputs.grant_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
        run: node ops/frms-qa-repair/run-private-queue-provision.mjs
      - name: Report Queue provisioning without claiming Worker deployment or FRMS acceptance
        if: success()
        run: |
          echo 'FRMS_PRIVATE_QUEUES_ONLY_GRANT_APPLIED' >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewed main SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'The two Queues and results HTTP pull metadata were provisioned and read back under this exact grant.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No caller or repair Worker deploy, signer, D1/R2 writes, prepare/apply, 4/4 acceptance, or production.' >> "$GITHUB_STEP_SUMMARY"
