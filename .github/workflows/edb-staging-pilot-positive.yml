name: eDB Staging Pilot Positive

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_EDB_STAGING_PILOT_POSITIVE'
        required: true
        type: string
      expected_release_sha:
        description: 'Exact eDB application release SHA already deployed to staging'
        required: true
        type: string

concurrency:
  group: airtrust-edb-staging-pilot-positive
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  STAGING_D1_NAME: airtrust-db-staging-baseline-20260701
  QA_EDB_PILOT_EMAIL: qa-edb-pilot@staging.airtrust.invalid

jobs:
  guard:
    name: eDB staging pilot guard
    runs-on: ubuntu-latest
    steps:
      - name: Guard staging-only dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_EDB_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo 'MAIN_ONLY' >&2; exit 1; }
          [[ "$CONFIRMATION" == "AIRTRUST_EDB_STAGING_PILOT_POSITIVE" ]] || { echo 'CONFIRMATION_REJECTED' >&2; exit 1; }
          [[ "$EXPECTED_EDB_RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'EXPECTED_RELEASE_SHA_INVALID' >&2; exit 1; }
          [[ "$STAGING_API_BASE_URL" == "https://airtrust-api-staging.airtrust.workers.dev" ]] || { echo 'STAGING_API_REJECTED' >&2; exit 1; }
          [[ "$STAGING_D1_NAME" == "airtrust-db-staging-baseline-20260701" ]] || { echo 'STAGING_D1_REJECTED' >&2; exit 1; }
          echo 'EDB_STAGING_PILOT_GUARD_PASS'

  d1-provision-edb-pilot-identity:
    name: Staging D1 Provision eDB Pilot Identity
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    env:
      QA_EDB_PILOT_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRM_STAGING_EDB_PILOT_IDENTITY: AIRTRUST_STAGING_EDB_PILOT_IDENTITY
    steps:
      - name: Require governed staging D1 credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$QA_EDB_PILOT_PASSWORD" ]] || { echo 'STAGING_SMOKE_PASSWORD_MISSING' >&2; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'STAGING_D1_TOKEN_MISSING' >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING' >&2; exit 1; }

      - name: Checkout trusted main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install fixture dependencies
        run: npm ci && npm --prefix worker-airtrust ci

      - name: Validate tenant-6 synthetic identity seed
        run: node scripts/staging/seed-qa-edb-pilot.mjs

      - name: Provision tenant-6 synthetic identity
        run: node scripts/staging/seed-qa-edb-pilot.mjs --apply

  edb-staging-pilot-positive:
    name: eDB tenant-6 synthetic positive smoke
    needs: [guard, d1-provision-edb-pilot-identity]
    runs-on: ubuntu-latest
    environment: staging
    env:
      QA_EDB_PILOT_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      EXPECTED_EDB_RELEASE_SHA: ${{ inputs.expected_release_sha }}
    steps:
      - name: Require synthetic staging credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$QA_EDB_PILOT_PASSWORD" ]] || { echo 'STAGING_SMOKE_PASSWORD_MISSING' >&2; exit 1; }

      - name: Checkout trusted main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install smoke dependencies
        run: npm ci

      - name: Verify positive tenant-6 eDB gate without operational mutation
        run: node scripts/staging/smoke-edb-pilot-positive.mjs

      - name: Record safety scope
        if: always()
        shell: bash
        run: |
          {
            echo '## eDB staging tenant-6 positive smoke'
            echo ''
            echo '- environment: staging only'
            echo '- synthetic login: `qa-edb-pilot@staging.airtrust.invalid`'
            echo '- tenant: `6` (pilot allowlist)'
            echo "- expected deployed eDB release: \`$EXPECTED_EDB_RELEASE_SHA\`"
            echo '- password source: GitHub Environment `staging` / `STAGING_SMOKE_PASSWORD`'
            echo '- fixture writes: synthetic tenant only if id 6 is absent, plus synthetic employee/user/membership'
            echo '- non-synthetic tenant id 6: never reactivated or overwritten'
            echo '- flight/aircraft/eDB operational writes: none'
            echo '- synthetic fixture cleanup: enforced in final D1 job'
            echo '- production action: none'
            echo '- ANAC transmission: none'
            echo '- cleartext credential output: none'
          } >> "$GITHUB_STEP_SUMMARY"

  d1-cleanup-edb-pilot-fixture:
    name: Staging D1 Cleanup eDB Pilot Fixture
    needs: [guard, d1-provision-edb-pilot-identity, edb-staging-pilot-positive]
    if: ${{ always() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRM_STAGING_EDB_PILOT_IDENTITY: AIRTRUST_STAGING_EDB_PILOT_IDENTITY
    steps:
      - name: Require governed staging D1 credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'STAGING_D1_TOKEN_MISSING' >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING' >&2; exit 1; }

      - name: Checkout trusted main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install cleanup dependencies
        run: npm ci && npm --prefix worker-airtrust ci

      - name: Deactivate exact eDB pilot synthetic fixtures
        run: node scripts/staging/seed-qa-edb-pilot.mjs --apply --rollback
