name: Staging FRMS and Auth QA

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AIRTRUST_STAGING_FRMS_AUTH_QA to continue'
        required: true
        type: string
      expected_sha:
        description: 'Exact current main SHA already deployed to staging'
        required: true
        type: string

concurrency:
  group: staging-frms-auth-qa
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  STAGING_API_BASE_URL: https://airtrust-api-staging.airtrust.workers.dev
  STAGING_FRONTEND_BASE_URL: https://staging.airtrust.pages.dev
  STAGING_D1_NAME: airtrust-db-staging-baseline-20260701
  QA_MAINTENANCE_EMAIL: qa-maintenance@staging.airtrust.invalid

jobs:
  guard:
    name: Staging QA Guard
    runs-on: ubuntu-latest
    steps:
      - name: Validate staging-only dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == 'refs/heads/main' ]] || { echo 'MAIN_ONLY' >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_STAGING_FRMS_AUTH_QA' ]] || { echo 'CONFIRMATION_REJECTED' >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'EXPECTED_SHA_INVALID' >&2; exit 1; }
          [[ "${EXPECTED_SHA,,}" == "${EVENT_SHA,,}" ]] || { echo 'EXPECTED_SHA_NOT_CURRENT_MAIN' >&2; exit 1; }
          [[ "$STAGING_API_BASE_URL" == 'https://airtrust-api-staging.airtrust.workers.dev' ]] || exit 1
          [[ "$STAGING_FRONTEND_BASE_URL" == 'https://staging.airtrust.pages.dev' ]] || exit 1
          [[ "$STAGING_D1_NAME" == 'airtrust-db-staging-baseline-20260701' ]] || exit 1

      - uses: actions/checkout@v4

      - name: Require staging provenance to match expected SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expected = String(process.env.EXPECTED_SHA || '').toLowerCase();
          const versionResponse = await fetch(`${process.env.STAGING_API_BASE_URL}/api/version`, {
            headers: { Accept: 'application/json' },
          });
          if (!versionResponse.ok) throw new Error(`STAGING_VERSION_HTTP_${versionResponse.status}`);
          const version = await versionResponse.json();
          const sourceSha = String(version?.sourceSha ?? version?.data?.sourceSha ?? '').toLowerCase();
          if (sourceSha !== expected) throw new Error(`STAGING_WORKER_SHA_MISMATCH:${sourceSha || 'missing'}`);

          const frontendResponse = await fetch(`${process.env.STAGING_FRONTEND_BASE_URL}/`, {
            headers: { Accept: 'text/html' },
          });
          if (!frontendResponse.ok) throw new Error(`STAGING_FRONTEND_HTTP_${frontendResponse.status}`);
          const html = await frontendResponse.text();
          if (!html.toLowerCase().includes(expected.slice(0, 7))) {
            throw new Error('STAGING_FRONTEND_SHA_MISMATCH');
          }
          console.log(`STAGING_PROVENANCE_SHA=${expected}`);
          NODE

  d1-provision-maintenance-fixture:
    name: Staging D1 Provision Synthetic Maintenance Identity
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    env:
      QA_MAINTENANCE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRM_STAGING_FRMS_QA: AIRTRUST_STAGING_FRMS_QA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Require governed staging credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$QA_MAINTENANCE_PASSWORD" ]] || { echo 'STAGING_SMOKE_PASSWORD_MISSING' >&2; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'STAGING_D1_TOKEN_MISSING' >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING' >&2; exit 1; }

      - name: Install fixture dependencies
        run: npm ci && cd worker-airtrust && npm ci

      - name: Validate synthetic fixture in dry-run mode
        run: node scripts/staging/seed-qa-frms-maintenance.mjs

      - name: Provision synthetic maintenance fixture
        run: node scripts/staging/seed-qa-frms-maintenance.mjs --apply

  login-latency:
    name: Real Login Latency QA
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      LOGIN_ATTEMPTS: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Measure real login latency under the frontend timeout contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/staging/qa-login-latency.mjs | tee "$RUNNER_TEMP/login-latency.txt"
          {
            echo '## Login latency QA'
            echo ''
            grep -E '^(LOGIN_ATTEMPTS|LOGIN_SUCCESS|LOGIN_TIMEOUTS|MIN_LOGIN_LATENCY_MS|MAX_LOGIN_LATENCY_MS|P50_LOGIN_LATENCY_MS|P95_LOGIN_LATENCY_MS)=' "$RUNNER_TEMP/login-latency.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  frms-ui:
    name: Real Mechanic Home and FRMS Maintenance QA
    needs: [guard, d1-provision-maintenance-fixture]
    runs-on: ubuntu-latest
    environment: staging
    env:
      BASE_URL: https://staging.airtrust.pages.dev
      E2E_EMAIL: qa-maintenance@staging.airtrust.invalid
      E2E_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Install Chromium for sanctioned staging browser QA
        run: npx playwright install --with-deps chromium

      - name: Validate mechanic home and maintenance management UI
        run: npx playwright test e2e/staging-frms-maintenance.spec.ts --project=chromium

      - name: Publish sanitized QA summary
        if: success()
        shell: bash
        run: |
          {
            echo '## FRMS maintenance staging QA'
            echo ''
            echo '- synthetic mechanic identity: PASS'
            echo '- mechanic home reduced card set: PASS'
            echo '- maintenance fatigue check-in route: PASS'
            echo '- tenant admin Operations/Manutenção navigation: PASS'
            echo '- maintenance management dashboard: PASS'
            echo '- cleartext credentials emitted: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-frms-maintenance-qa-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  qa-result:
    name: Staging FRMS and Auth QA Passed
    needs: [guard, d1-provision-maintenance-fixture, login-latency, frms-ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every sanctioned QA job
        shell: bash
        env:
          GUARD: ${{ needs.guard.result }}
          FIXTURE: ${{ needs.d1-provision-maintenance-fixture.result }}
          LATENCY: ${{ needs.login-latency.result }}
          FRMS_UI: ${{ needs.frms-ui.result }}
        run: |
          set -euo pipefail
          echo "guard=$GUARD fixture=$FIXTURE latency=$LATENCY frms_ui=$FRMS_UI"
          [[ "$GUARD" == 'success' ]]
          [[ "$FIXTURE" == 'success' ]]
          [[ "$LATENCY" == 'success' ]]
          [[ "$FRMS_UI" == 'success' ]]
          echo 'STAGING_FRMS_AUTH_QA_PASS'
