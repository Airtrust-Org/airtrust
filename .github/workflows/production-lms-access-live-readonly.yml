name: Production LMS Access Live Readonly
on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: 'Exact deployed Worker source SHA'
        required: true
        type: string
      confirmation:
        description: 'Type AIRTRUST_LMS_ACCESS_READONLY'
        required: true
        type: string
permissions:
  contents: read
  checks: read
  statuses: read
concurrency:
  group: production-lms-access-live-readonly
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    env:
      EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
      PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}
      PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}
      QA_LEARNER_PASSWORD: ${{ secrets.QA_LEARNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Guard and official gates
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] && [[ "$CONFIRMATION" == AIRTRUST_LMS_ACCESS_READONLY ]]
          [[ "$EXPECTED_PRODUCTION_SHA" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$EXPECTED_PRODUCTION_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_PRODUCTION_SHA" HEAD
          node scripts/ci/verify-release-gates.mjs
      - name: Read-only LMS roles and endpoint timing (sanitized)
        run: node scripts/production/lms-access-live-readonly.mjs
