name: FRMS F0 Staging Private Transaction (Single Mutex, Independent Signer)
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA passing all eight gates
        required: true
        type: string
      prepare_grant_id:
        description: Fresh administrator prepare-phase comment ID from issue 776
        required: true
        type: string
      confirmation:
        description: Exact prepare-phase F0 approval (does not grant apply)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  id-token: write

# A workflow-level mutex remains held across the entire single job, including
# the independent external approval, Queue transfer and physical D1 readback.
# NEVER split prepare and apply into separately dispatched workflow runs.
concurrency:
  group: airtrust-staging-mutations-and-scorm-qa
  cancel-in-progress: false

jobs:
  frms-single-mutex-staging-transaction:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Validate transaction signature, grants and readback contract (synthetic)
        run: |
          node --test \
            scripts/__tests__/frms-qa-private-transaction-controller.test.mjs \
            scripts/__tests__/frms-qa-private-transaction-runner.test.mjs \
            scripts/__tests__/frms-qa-private-transaction-readback.test.mjs \
            scripts/__tests__/frms-qa-external-approval-signer.test.mjs
      - name: Abort on missing independent signer or grants before any private D1 or R2 write
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRMS_QA_PREPARE_EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          FRMS_QA_PREPARE_GRANT_ID: ${{ inputs.prepare_grant_id }}
          FRMS_QA_PREPARE_CONFIRM: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_D1_MIGRATION_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_API_TOKEN }}
          FRMS_QA_CALLER_KEY_HEX: ${{ secrets.FRMS_QA_CALLER_KEY_HEX }}
          FRMS_QA_APPROVAL_PUBLIC_KEY_PEM: ${{ secrets.FRMS_QA_APPROVAL_PUBLIC_KEY_PEM }}
          FRMS_QA_APPROVAL_PUBLIC_KEY_SHA256: ${{ vars.FRMS_QA_APPROVAL_PUBLIC_KEY_SHA256 }}
          FRMS_QA_SIGNER_ORIGIN: ${{ vars.FRMS_QA_SIGNER_ORIGIN }}
          FRMS_QA_SIGNER_ORIGIN_SHA256: ${{ vars.FRMS_QA_SIGNER_ORIGIN_SHA256 }}
        run: node ops/frms-qa-repair/run-protected-private-transaction.mjs
      - name: Preserve outcome boundary
        if: always()
        run: |
          echo 'FRMS single mutex scope completed or failed closed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job never creates signer keys, issues grants or deploys production.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A failure after prepare/apply can be indeterminate: do NOT redispatch without independent recovery.' >> "$GITHUB_STEP_SUMMARY"
