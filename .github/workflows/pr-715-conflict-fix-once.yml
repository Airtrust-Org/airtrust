name: PR 715 conflict fix once

on:
  push:
    branches:
      - feat/edb-technical-status-shadow-contracts-20260802

permissions:
  contents: write

jobs:
  patch-test-format-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/edb-technical-status-shadow-contracts-20260802
          fetch-depth: 0

      - name: Apply scoped conflict fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('worker-airtrust/src/services/edb/technical-status-shadow-contracts.ts')
          source = source_path.read_text()
          old_condition = """  if (\n    importedStatuses.size > 0 &&\n    declaredStatuses.size > 0 &&\n    [...importedStatuses].some((value) => !declaredStatuses.has(value))\n  ) {\n"""
          new_condition = """  if (\n    importedStatuses.size > 0 &&\n    declaredStatuses.size > 0 &&\n    (importedStatuses.size !== declaredStatuses.size ||\n      [...importedStatuses].some((value) => !declaredStatuses.has(value)))\n  ) {\n"""
          if source.count(old_condition) != 1:
              raise SystemExit('expected source condition not found exactly once')
          source_path.write_text(source.replace(old_condition, new_condition))

          test_path = Path('worker-airtrust/src/__tests__/services/edb-technical-status-shadow-contracts.test.ts')
          test = test_path.read_text()
          old_assertions = """    input.statusAssertions = [\n      ...((input.statusAssertions as Record<string, unknown>[]) ?? []),\n      {\n        assertionId: '00000000-0000-4000-8000-000000000103',\n        informationState: 'DECLARED',\n        status: 'UNSERVICEABLE',\n        source: { kind: 'UNKNOWN' },\n        evidenceReferences: [],\n      },\n    ];\n"""
          new_assertions = """    input.statusAssertions = [\n      ...((input.statusAssertions as Record<string, unknown>[]) ?? []),\n      {\n        assertionId: '00000000-0000-4000-8000-000000000103',\n        informationState: 'DECLARED',\n        status: 'SERVICEABLE',\n        source: {\n          kind: 'AIRTRUST_MANUAL',\n          reference: 'source:synthetic-declared-status',\n          observedAt: '2026-08-02T09:05:00-03:00',\n        },\n        evidenceReferences: ['evidence:synthetic-declared-status'],\n      },\n      {\n        assertionId: '00000000-0000-4000-8000-000000000104',\n        informationState: 'DECLARED',\n        status: 'UNSERVICEABLE',\n        source: { kind: 'UNKNOWN' },\n        evidenceReferences: [],\n      },\n    ];\n"""
          if test.count(old_assertions) != 1:
              raise SystemExit('expected test assertion block not found exactly once')
          test_path.write_text(test.replace(old_assertions, new_assertions))
          PY
          npx --yes prettier@3.9.6 --write \
            worker-airtrust/src/services/edb/technical-status-shadow-contracts.ts \
            worker-airtrust/src/__tests__/services/edb-technical-status-shadow-contracts.test.ts
          rm -f .github/workflows/pr-715-conflict-fix-once.yml
          git diff --check

      - name: Commit scoped fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(edb): detect supersets in status conflicts"
          git push origin HEAD:feat/edb-technical-status-shadow-contracts-20260802
