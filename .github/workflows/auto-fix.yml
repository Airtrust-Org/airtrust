name: Auto-fix ESLint & Prettier on PR

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  autofix:
    if: github.head_ref == 'agent/audit-critical-high-hardening-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/audit-critical-high-hardening-20260731
          fetch-depth: 0

      - name: Merge canonical main
        shell: bash
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch already contains canonical main"
            exit 0
          fi
          git config user.name "airtrust-agent"
          git config user.email "airtrust-agent@users.noreply.github.com"
          git merge --no-ff --no-edit origin/main
          git push origin HEAD:agent/audit-critical-high-hardening-20260731
