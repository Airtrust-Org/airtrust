name: Auto-fix ESLint & Prettier on PR

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - synchronize
  push:
    branches:
      - agent/audit-critical-high-hardening-20260731
    paths:
      - .github/workflows/auto-fix.yml

permissions:
  contents: write

jobs:
  autofix:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/audit-critical-high-hardening-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: agent/audit-critical-high-hardening-20260731
          fetch-depth: 0

      - name: Apply reviewed LMS fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          preview = Path('src/react-app/pages/lms/LmsPreviewPlayer.tsx')
          text = preview.read_text()
          old = "  ensureValidAccessToken,\n  getAccessToken,\n"
          new = "  ensureValidAccessToken,\n  fetchWithAuth,\n  getAccessToken,\n"
          if old not in text:
              raise SystemExit('preview import anchor not found')
          preview.write_text(text.replace(old, new, 1))

          player = Path('src/react-app/pages/lms/LmsPlayer.tsx')
          text = player.read_text()
          old = "    if (!playerToken || !matricula || matricula.tipo_conteudo === 'h5p') {\n      setAssetSessionReady(false);\n      return;\n    }\n\n    let cancelled = false;"
          new = "    if (!matricula || matricula.tipo_conteudo === 'h5p') {\n      setAssetSessionReady(false);\n      return;\n    }\n\n    // A transient access-token refresh must not tear down an already\n    // established asset session. The short-lived HttpOnly asset cookie\n    // remains valid, while a real logout is handled by the auth guard below.\n    if (!playerToken) {\n      return;\n    }\n\n    let cancelled = false;"
          if old not in text:
              raise SystemExit('player asset-session anchor not found')
          player.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git add src/react-app/pages/lms/LmsPlayer.tsx src/react-app/pages/lms/LmsPreviewPlayer.tsx
          git diff --cached --check
          git config user.name "airtrust-agent"
          git config user.email "airtrust-agent@users.noreply.github.com"
          git commit -m "fix(lms): preserve scoped asset session during token refresh"
          git push origin HEAD:agent/audit-critical-high-hardening-20260731
