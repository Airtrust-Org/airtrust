name: Auto-fix ESLint & Prettier on PR

on:
  workflow_dispatch:
  push:
    branches:
      - fix/qualificacoes-atomicidade-confiabilidade-20260804

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Reuse the calculated renewal observation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('worker-airtrust/src/routes/qualificacoes/historico-write.ts')
          source = path.read_text()
          old = "          `Renovação de #${id}${observacao ? '. ' + observacao : ''}`,"
          new = '          novaObservacao,'
          if old not in source:
              if new in source:
                  raise SystemExit(0)
              raise SystemExit('renewal observation binding not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Format and lint scoped file
        run: |
          npx prettier --write worker-airtrust/src/routes/qualificacoes/historico-write.ts
          npx eslint --max-warnings=0 -- worker-airtrust/src/routes/qualificacoes/historico-write.ts

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- worker-airtrust/src/routes/qualificacoes/historico-write.ts
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(qualificacoes): reuse renewal observation [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
