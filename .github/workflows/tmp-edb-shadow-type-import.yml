name: Temporary eDB shadow type import fix

on:
  push:
    branches:
      - feat/edb-shadow-prototype-ui-20260802

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edb-shadow-prototype-ui-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Repair, format and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/react-app/pages/controle-voos/EdbShadowPrototype.tsx')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "import { FormEvent, useMemo, useState } from 'react';",
              "import { type FormEvent, useMemo, useState } from 'react';",
              1,
          )
          if not source.startswith("import { type FormEvent, useMemo, useState } from 'react';"):
              raise SystemExit('type-only FormEvent import was not applied')
          path.write_text(source, encoding='utf-8')
          PY
          npx prettier --write src/react-app/pages/controle-voos/EdbShadowPrototype.tsx
          git rm .github/workflows/tmp-edb-shadow-type-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react-app/pages/controle-voos/EdbShadowPrototype.tsx
          git commit -m "fix(edb): use type-only FormEvent import"
          git push origin HEAD:feat/edb-shadow-prototype-ui-20260802
