name: PR808 Prettier Diagnostic

on:
  push:
    branches:
      - fix/migrations-deploy-safety-20260804

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Produce exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.6 --write -- \
            worker-airtrust/src/__tests__/migrations/controlled-execution-gate.test.ts \
            worker-airtrust/src/__tests__/migrations/setores-gestores-gestor-id-optional.test.ts
          git diff --exit-code -- \
            worker-airtrust/src/__tests__/migrations/controlled-execution-gate.test.ts \
            worker-airtrust/src/__tests__/migrations/setores-gestores-gestor-id-optional.test.ts || true
