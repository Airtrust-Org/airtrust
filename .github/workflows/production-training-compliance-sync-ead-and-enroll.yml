name: Production Training Compliance EAD Sync + Silent Enrollment

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA authorized for EAD-only course sync and silent enrollment
        required: true
        type: string
      confirmation:
        description: Type AIRTRUST_PRODUCTION_TRAINING_COMPLIANCE_SYNC_EAD_NO_EMAIL
        required: true
        type: string

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: production-training-compliance-ead-sync
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PROD_API_BASE_URL: https://api.airtrust.online

jobs:
  guard:
    name: Production EAD-only Sync Guard
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, 'AIRTRUST_PRODUCTION_TRAINING_COMPLIANCE_SYNC_EAD_NO_EMAIL '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      expected_main_sha: ${{ steps.request.outputs.expected_main_sha }}
      live_worker_sha: ${{ steps.provenance.outputs.live_worker_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve authorized request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'issue_comment' ]]; then
            if [[ ! "$COMMENT_BODY" =~ ^AIRTRUST_PRODUCTION_TRAINING_COMPLIANCE_SYNC_EAD_NO_EMAIL\ ([0-9a-f]{40})$ ]]; then
              echo REQUEST_FORMAT_INVALID >&2
              exit 1
            fi
            EXPECTED_MAIN_SHA="${BASH_REMATCH[1]}"
            CONFIRMATION='AIRTRUST_PRODUCTION_TRAINING_COMPLIANCE_SYNC_EAD_NO_EMAIL'
            PR_NUMBER="$ISSUE_NUMBER"
          else
            EXPECTED_MAIN_SHA="$INPUT_EXPECTED_MAIN_SHA"
            CONFIRMATION="$INPUT_CONFIRMATION"
            PR_NUMBER=''
          fi
          {
            echo "expected_main_sha=$EXPECTED_MAIN_SHA"
            echo "confirmation=$CONFIRMATION"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Validate authorization, main and release gates
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          EXPECTED_MAIN_SHA: ${{ steps.request.outputs.expected_main_sha }}
          CONFIRMATION: ${{ steps.request.outputs.confirmation }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo MAIN_ONLY >&2; exit 1; }
          [[ "$CONFIRMATION" == 'AIRTRUST_PRODUCTION_TRAINING_COMPLIANCE_SYNC_EAD_NO_EMAIL' ]] || { echo CONFIRMATION_REJECTED >&2; exit 1; }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo EXPECTED_MAIN_SHA_INVALID >&2; exit 1; }
          git fetch origin main --quiet
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          [[ "$CURRENT_MAIN_SHA" == "$EXPECTED_MAIN_SHA" ]] || { echo "MAIN_SHA_MOVED:$CURRENT_MAIN_SHA" >&2; exit 1; }
          git cat-file -e "$EXPECTED_MAIN_SHA^{commit}"

          if [[ "$EVENT_NAME" == 'issue_comment' ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo COMMENT_PR_NUMBER_INVALID >&2; exit 1; }
            export PR_NUMBER GITHUB_REPOSITORY GITHUB_ACTOR EXPECTED_MAIN_SHA
            node <<'NODE'
          (async () => {
            const repo = process.env.GITHUB_REPOSITORY;
            const prNumber = process.env.PR_NUMBER;
            const actor = process.env.GITHUB_ACTOR;
            const expected = process.env.EXPECTED_MAIN_SHA;
            const headers = {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
            };
            async function get(path) {
              const response = await fetch(`https://api.github.com${path}`, { headers });
              if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
              return response.json();
            }
            const pr = await get(`/repos/${repo}/pulls/${prNumber}`);
            if (pr.base?.ref !== 'main') throw new Error('PR_BASE_NOT_MAIN');
            if (pr.head?.repo?.full_name !== repo || pr.head?.repo?.fork) throw new Error('PR_FROM_FORK_REJECTED');
            if (!pr.merged_at) throw new Error('PR_NOT_MERGED');
            if (String(pr.merge_commit_sha || '').toLowerCase() !== expected.toLowerCase()) throw new Error('AUTHORIZED_SHA_NOT_PR_MERGE_SHA');
            const permission = await get(`/repos/${repo}/collaborators/${actor}/permission`);
            if (!['write', 'push', 'maintain', 'admin'].includes(permission.permission)) throw new Error('ACTOR_PERMISSION_INSUFFICIENT');
          })().catch((error) => {
            console.error(`Production EAD sync authorization failed: ${error.message}`);
            process.exit(1);
          });
          NODE
          fi

          RELEASE_SHA="$EXPECTED_MAIN_SHA" node scripts/ci/verify-release-gates.mjs

      - name: Validate live Worker provenance
        id: provenance
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ steps.request.outputs.expected_main_sha }}
        run: |
          set -euo pipefail
          LIVE_WORKER_SHA="$(node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.PROD_API_BASE_URL}/api/version`, {
            headers: { Accept: 'application/json', 'User-Agent': 'airtrust-production-compliance-ead-sync/1' },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`PRODUCTION_VERSION_HTTP_${response.status}`);
          const json = await response.json();
          const body = json?.data && typeof json.data === 'object' ? json.data : json;
          const sha = String(body?.sourceSha ?? body?.source_sha ?? '').trim().toLowerCase();
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('PRODUCTION_WORKER_SHA_MISSING');
          process.stdout.write(sha);
          NODE
          )"
          git cat-file -e "$LIVE_WORKER_SHA^{commit}"
          git merge-base --is-ancestor "$LIVE_WORKER_SHA" "$EXPECTED_MAIN_SHA" || { echo LIVE_WORKER_NOT_ANCESTOR_OF_MAIN >&2; exit 1; }
          RELEASE_SHA="$LIVE_WORKER_SHA" node scripts/ci/verify-release-gates.mjs
          echo "live_worker_sha=$LIVE_WORKER_SHA" >> "$GITHUB_OUTPUT"

      - name: Assert EAD-only classifier and no e-mail path
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "return isEadCategoria(tipo.categoria);" worker-airtrust/src/services/lms-ead-ssot.ts
          grep -Fq "normalized === 'EAD' || normalized === 'TREINAMENTO EAD'" worker-airtrust/src/services/lms-ead-ssot.ts
          grep -Fq "if (!isEadFormato(tipo))" worker-airtrust/src/services/lms-ead-ssot.ts
          grep -Fq "/api/lms/cursos/sync-ead" scripts/production/training-compliance-sync-ead-courses-no-email.mjs
          grep -Fq 'enviar_convite_email: false' scripts/production/training-compliance-enroll-no-email.mjs
          ! grep -Fq '/api/lms/matriculas/convites' scripts/production/training-compliance-sync-ead-courses-no-email.mjs
          ! grep -Fq '/api/lms/matriculas/convites' scripts/production/training-compliance-enroll-no-email.mjs
          ! grep -Fq 'enviar_convite_email: true' scripts/production/training-compliance-enroll-no-email.mjs

  apply:
    name: Sync EAD Courses and Enroll Silently
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      E2E_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL || secrets.QA_EXAMINER_ADMIN_EMAIL }}
      E2E_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD || secrets.QA_EXAMINER_ADMIN_PASSWORD }}
      AIRTRUST_PRODUCTION_SYNC_EAD_CONFIRMATION: AIRTRUST_PRODUCTION_TRAINING_COMPLIANCE_SYNC_EAD_NO_EMAIL
      AIRTRUST_PRODUCTION_ENROLL_CONFIRMATION: AIRTRUST_PRODUCTION_TRAINING_COMPLIANCE_ENROLL_NO_EMAIL
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.expected_main_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Require production administrator credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$E2E_EMAIL" && -n "$E2E_PASSWORD" ]] || { echo PRODUCTION_SMOKE_CREDENTIALS_MISSING >&2; exit 1; }
          [[ "$E2E_EMAIL" != *'staging.airtrust.invalid'* ]] || { echo STAGING_QA_IDENTITY_REJECTED >&2; exit 1; }
      - name: Create or synchronize EAD-only course placeholders
        id: sync
        run: node scripts/production/training-compliance-sync-ead-courses-no-email.mjs
      - name: Enroll remaining actionable Compliance gaps without e-mail
        id: enroll
        run: node scripts/production/training-compliance-enroll-no-email.mjs
      - name: Publish sanitized result
        if: always()
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ needs.guard.outputs.expected_main_sha }}
          LIVE_WORKER_SHA: ${{ needs.guard.outputs.live_worker_sha }}
          EAD_TYPES: ${{ steps.sync.outputs.ead_qualification_types }}
          COURSES_CREATED: ${{ steps.sync.outputs.courses_created }}
          COURSES_UPDATED: ${{ steps.sync.outputs.courses_updated }}
          NON_EAD_SKIPPED: ${{ steps.sync.outputs.non_ead_skipped }}
          ENROLL_CREATED: ${{ steps.enroll.outputs.created }}
          ENROLL_IGNORED: ${{ steps.enroll.outputs.ignored_existing }}
          REMAINING_GROUPS: ${{ steps.enroll.outputs.remaining_without_ead_groups }}
          REMAINING_PEOPLE: ${{ steps.enroll.outputs.remaining_without_ead_people }}
        run: |
          {
            echo '## Production Training Compliance — EAD-only sync + silent enrollment'
            echo ''
            echo "- authorized main SHA: \`$EXPECTED_MAIN_SHA\`"
            echo "- live Worker SHA: \`$LIVE_WORKER_SHA\`"
            echo "- EAD qualification types processed: \`${EAD_TYPES:-unknown}\`"
            echo "- EAD courses created: \`${COURSES_CREATED:-unknown}\`"
            echo "- EAD courses updated by canonical mirror sync: \`${COURSES_UPDATED:-unknown}\`"
            echo "- non-EAD qualification types skipped by canonical classifier: \`${NON_EAD_SKIPPED:-unknown}\`"
            echo "- new silent enrollments: \`${ENROLL_CREATED:-unknown}\`"
            echo "- already enrolled: \`${ENROLL_IGNORED:-unknown}\`"
            echo "- remaining requirement groups without an EAD course: \`${REMAINING_GROUPS:-unknown}\`"
            echo "- remaining people in non-actionable/no-EAD groups: \`${REMAINING_PEOPLE:-unknown}\`"
            echo '- enrollment e-mail: `disabled`'
            echo '- invitation endpoint: `not called`'
            echo '- Worker/Pages deployment: `none`'
          } >> "$GITHUB_STEP_SUMMARY"
