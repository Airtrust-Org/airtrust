<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, max-age=0, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="build-version" content="__BUILD_VERSION__" />
    <title>AirTrust</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/airtrust-apple-touch-icon-20260830.png" />
    <link rel="manifest" href="/app.webmanifest" />
    <meta name="theme-color" content="#12356A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AirTrust" />
    <!-- Preconnects for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined via Google Fonts (fallback confiável) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
    </style>
    <script>
      (() => {
        const ENTRY_ROUTE_PATTERNS = [/^\/$/, /^\/login$/, /^\/instalar$/, /^\/frms(?:\/|$)/];
        const RECOVERY_KEY = 'airtrust-login-cache-recovery-v4';
        const RECOVERY_PARAM = 'airtrust_login_recovered';
        const SW_RESET_PARAM = 'airtrust_sw_reset';

        if (!ENTRY_ROUTE_PATTERNS.some((pattern) => pattern.test(window.location.pathname))) {
          return;
        }

        const currentUrl = new URL(window.location.href);
        const recoveredByQuery =
          currentUrl.searchParams.has(RECOVERY_PARAM) || currentUrl.searchParams.has(SW_RESET_PARAM);

        if (currentUrl.searchParams.has(RECOVERY_PARAM)) {
          currentUrl.searchParams.delete(RECOVERY_PARAM);
        }

        if (currentUrl.searchParams.has(SW_RESET_PARAM)) {
          currentUrl.searchParams.delete(SW_RESET_PARAM);
        }

        if (recoveredByQuery) {
          window.history.replaceState(window.history.state, document.title, currentUrl.toString());
        }

        const recoverLogin = async () => {
          const cacheNames =
            'caches' in window && typeof caches.keys === 'function' ? await caches.keys() : [];
          const airTrustCacheNames = cacheNames.filter((name) => name.startsWith('airtrust-'));
          const existingRegistrations =
            'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistrations() : [];
          const hasController =
            'serviceWorker' in navigator && navigator.serviceWorker.controller !== null;
          const shouldReloadOnce =
            hasController || airTrustCacheNames.length > 0 || existingRegistrations.length > 0;

          await Promise.all(airTrustCacheNames.map((name) => caches.delete(name)));
          await Promise.all(existingRegistrations.map((registration) => registration.unregister?.()));

          if (recoveredByQuery) {
            sessionStorage.removeItem(RECOVERY_KEY);
            return;
          }

          if (!shouldReloadOnce) {
            sessionStorage.removeItem(RECOVERY_KEY);
            return;
          }

          if (sessionStorage.getItem(RECOVERY_KEY) === '1') return;

          sessionStorage.setItem(RECOVERY_KEY, '1');
          currentUrl.searchParams.set(RECOVERY_PARAM, '1');
          window.location.replace(currentUrl.toString());
        };

        void recoverLogin().catch(() => {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
