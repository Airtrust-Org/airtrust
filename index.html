<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, max-age=0, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="build-version" content="__BUILD_VERSION__" />
    <title>AirTrust</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/airtrust-brand-icon-20260915-180.png" />
    <link rel="manifest" href="/app.webmanifest" />
    <meta name="theme-color" content="#12356A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AirTrust" />
    <!-- Preconnects for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined via Google Fonts (fallback confiável) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
    </style>
    <script>
      (() => {
        const ENTRY_ROUTE_PATTERNS = [/^\/$/, /^\/login$/, /^\/instalar$/, /^\/frms(?:\/|$)/, /^\/simuladores(?:\/|$)/];
        const RECOVERY_KEY = 'airtrust-login-cache-recovery-v5';
        const RECOVERY_PARAM = 'airtrust_login_recovered';
        const SW_RESET_PARAM = 'airtrust_sw_reset';

        if (!ENTRY_ROUTE_PATTERNS.some((pattern) => pattern.test(window.location.pathname))) {
          return;
        }

        const currentUrl = new URL(window.location.href);
        const recoveredByQuery =
          currentUrl.searchParams.has(RECOVERY_PARAM) || currentUrl.searchParams.has(SW_RESET_PARAM);

        if (currentUrl.searchParams.has(RECOVERY_PARAM)) {
          currentUrl.searchParams.delete(RECOVERY_PARAM);
        }

        if (currentUrl.searchParams.has(SW_RESET_PARAM)) {
          currentUrl.searchParams.delete(SW_RESET_PARAM);
        }

        if (recoveredByQuery) {
          window.history.replaceState(window.history.state, document.title, currentUrl.toString());
        }

        const recoverLogin = async () => {
          const cacheNames =
            'caches' in window && typeof caches.keys === 'function' ? await caches.keys() : [];
          const airTrustCacheNames = cacheNames.filter(
            (name) => name.startsWith('airtrust-') && !name.startsWith('airtrust-pilot-'),
          );
          const existingRegistrations =
            'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistrations() : [];
          const legacyRegistrations = existingRegistrations.filter((registration) => {
            try {
              return !new URL(registration.scope).pathname.startsWith('/pilot/');
            } catch {
              return true;
            }
          });
          const hasController =
            'serviceWorker' in navigator && navigator.serviceWorker.controller !== null;
          const shouldReloadOnce =
            hasController || airTrustCacheNames.length > 0 || legacyRegistrations.length > 0;

          await Promise.all(airTrustCacheNames.map((name) => caches.delete(name)));
          await Promise.all(legacyRegistrations.map((registration) => registration.unregister?.()));

          if (recoveredByQuery) {
            sessionStorage.removeItem(RECOVERY_KEY);
            return;
          }

          if (!shouldReloadOnce) {
            sessionStorage.removeItem(RECOVERY_KEY);
            return;
          }

          if (sessionStorage.getItem(RECOVERY_KEY) === '1') return;

          sessionStorage.setItem(RECOVERY_KEY, '1');
          currentUrl.searchParams.set(RECOVERY_PARAM, '1');
          window.location.replace(currentUrl.toString());
        };

        void recoverLogin().catch(() => {});
      })();
    </script>
    <script>
      (() => {
        const BOOT_RECOVERY_KEY = 'airtrust-app-boot-recovery-v1';
        const BOOT_RECOVERY_PARAM = 'airtrust_boot_recovery';
        const BOOT_RECOVERY_TS_PARAM = 'airtrust_boot_ts';
        const BOOT_TIMEOUT_MS = 15000;
        const BOOT_ERROR_PATTERN =
          /Failed to (?:fetch|load).*module|Importing a module script failed|Loading chunk|ChunkLoadError|dynamically imported module|CSS chunk load failed/i;
        const buildVersion =
          document.querySelector('meta[name="build-version"]')?.getAttribute('content') || 'unknown';
        const recoveryToken = `${buildVersion}:${window.location.pathname}`;
        let recoveryStarted = false;

        const safeSessionGet = (key) => {
          try {
            return window.sessionStorage.getItem(key);
          } catch {
            return null;
          }
        };

        const safeSessionSet = (key, value) => {
          try {
            window.sessionStorage.setItem(key, value);
          } catch {
            // Storage bloqueado: a recuperação ainda pode seguir sem deduplicação persistente.
          }
        };

        const safeSessionRemove = (key) => {
          try {
            window.sessionStorage.removeItem(key);
          } catch {
            // Best effort.
          }
        };

        const cleanupLegacyRuntime = async () => {
          try {
            const cacheNames =
              'caches' in window && typeof caches.keys === 'function' ? await caches.keys() : [];
            const legacyCaches = cacheNames.filter(
              (name) => name.startsWith('airtrust-') && !name.startsWith('airtrust-pilot-'),
            );
            await Promise.all(legacyCaches.map((name) => caches.delete(name)));
          } catch {
            // Best effort.
          }

          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              const legacyRegistrations = registrations.filter((registration) => {
                try {
                  return !new URL(registration.scope).pathname.startsWith('/pilot/');
                } catch {
                  return true;
                }
              });
              await Promise.all(
                legacyRegistrations.map((registration) => registration.unregister().catch(() => false)),
              );
            }
          } catch {
            // Best effort.
          }
        };

        const refreshCriticalAssets = async () => {
          try {
            const assetUrls = [
              ...new Set(
                Array.from(
                  document.querySelectorAll('script[src^="/assets/"],link[href^="/assets/"]'),
                )
                  .map((element) => element.getAttribute('src') || element.getAttribute('href'))
                  .filter(Boolean)
                  .map((value) => new URL(value, window.location.href).toString()),
              ),
            ];

            await Promise.allSettled(
              assetUrls.map(async (url) => {
                const response = await fetch(url, {
                  cache: 'reload',
                  credentials: 'same-origin',
                });
                const contentType = response.headers.get('content-type') || '';
                if (!response.ok || /text\/html/i.test(contentType)) {
                  throw new Error(`Asset inválido durante recuperação: ${url}`);
                }
              }),
            );
          } catch {
            // Best effort. O reload seguinte ainda buscará o HTML atual.
          }
        };

        const showBootFailure = () => {
          const root = document.getElementById('root');
          if (root?.childElementCount) return;
          if (document.getElementById('airtrust-boot-fallback')) return;

          const mountFallback = () => {
            if (!document.body || document.getElementById('airtrust-boot-fallback')) return;

            const shell = document.createElement('main');
            shell.id = 'airtrust-boot-fallback';
            shell.setAttribute('role', 'alert');
            shell.style.cssText =
              'min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;padding:24px;color:#0f172a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;';

            const card = document.createElement('section');
            card.style.cssText =
              'width:min(440px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px;box-shadow:0 12px 32px rgba(15,23,42,.08);text-align:center;';

            const title = document.createElement('h1');
            title.textContent = 'O AirTrust não conseguiu iniciar';
            title.style.cssText = 'font-size:20px;line-height:1.3;margin:0 0 10px;font-weight:700;';

            const text = document.createElement('p');
            text.textContent =
              'A página foi atualizada, mas os arquivos da aplicação não carregaram corretamente. Tente recarregar novamente.';
            text.style.cssText = 'font-size:14px;line-height:1.5;color:#475569;margin:0 0 18px;';

            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = 'Recarregar AirTrust';
            button.style.cssText =
              'border:0;border-radius:10px;background:#12356a;color:#fff;padding:11px 18px;font:600 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;';
            button.addEventListener('click', () => {
              button.disabled = true;
              safeSessionRemove(BOOT_RECOVERY_KEY);
              void (async () => {
                await cleanupLegacyRuntime();
                await refreshCriticalAssets();
                const nextUrl = new URL(window.location.href);
                nextUrl.searchParams.set(BOOT_RECOVERY_PARAM, buildVersion);
                nextUrl.searchParams.set(BOOT_RECOVERY_TS_PARAM, String(Date.now()));
                window.location.replace(nextUrl.toString());
              })();
            });

            card.append(title, text, button);
            shell.appendChild(card);
            document.body.appendChild(shell);
          };

          if (document.body) {
            mountFallback();
          } else {
            window.addEventListener('DOMContentLoaded', mountFallback, { once: true });
          }
        };

        const recoverBootFailure = async () => {
          const root = document.getElementById('root');
          if (root?.childElementCount) {
            safeSessionRemove(BOOT_RECOVERY_KEY);
            return;
          }
          if (recoveryStarted) return;
          recoveryStarted = true;

          if (safeSessionGet(BOOT_RECOVERY_KEY) === recoveryToken) {
            showBootFailure();
            return;
          }

          safeSessionSet(BOOT_RECOVERY_KEY, recoveryToken);
          await cleanupLegacyRuntime();
          await refreshCriticalAssets();

          const nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set(BOOT_RECOVERY_PARAM, buildVersion);
          nextUrl.searchParams.set(BOOT_RECOVERY_TS_PARAM, String(Date.now()));
          window.location.replace(nextUrl.toString());
        };

        const isCriticalAssetTarget = (target) => {
          if (target instanceof HTMLScriptElement && target.src) {
            return new URL(target.src, window.location.href).origin === window.location.origin;
          }
          if (target instanceof HTMLLinkElement && target.rel === 'stylesheet' && target.href) {
            return new URL(target.href, window.location.href).origin === window.location.origin;
          }
          return false;
        };

        const visibleUrl = new URL(window.location.href);
        if (
          visibleUrl.searchParams.has(BOOT_RECOVERY_PARAM) ||
          visibleUrl.searchParams.has(BOOT_RECOVERY_TS_PARAM)
        ) {
          visibleUrl.searchParams.delete(BOOT_RECOVERY_PARAM);
          visibleUrl.searchParams.delete(BOOT_RECOVERY_TS_PARAM);
          window.history.replaceState(window.history.state, document.title, visibleUrl.toString());
        }

        window.addEventListener(
          'error',
          (event) => {
            const message = event.message || event.error?.message || '';
            if (isCriticalAssetTarget(event.target) || BOOT_ERROR_PATTERN.test(message)) {
              void recoverBootFailure();
            }
          },
          true,
        );

        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason;
          const message = reason instanceof Error ? reason.message : String(reason || '');
          if (BOOT_ERROR_PATTERN.test(message)) {
            void recoverBootFailure();
          }
        });

        window.setTimeout(() => {
          const root = document.getElementById('root');
          if (!root || root.childElementCount === 0) {
            void recoverBootFailure();
            return;
          }
          safeSessionRemove(BOOT_RECOVERY_KEY);
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
