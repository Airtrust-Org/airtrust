# ============================================
# TEMPLATE DE PROMPT AIRTRUST
# Contexto fixo para todas as interações
# ============================================

projeto:
  nome: AirTrust
  descricao: Sistema de Gestão de Segurança e Operações Aeronáuticas
  tipo: Serverless Web Application
  
stack:
  backend:
    - Cloudflare Workers
    - Hono (framework)
    - D1 (SQLite serverless)
    - R2 (object storage)
  
  frontend:
    - React 19
    - Vite
    - Tailwind CSS
    - Lucide Icons
  
  database:
    - 75+ tabelas
    - Soft delete em todas
    - Auditoria: auditoria_avancada_v2
    - Timestamps: created_at, updated_at, deleted_at

estrutura:
  backend: src/worker/
  frontend: src/react-app/
  migrations: migrations/
  api: src/worker/api/v2/
  routes: src/worker/routes/

padroes:
  api:
    - Todos endpoints em /api/v2
    - CRUD completo (GET, POST, PUT, DELETE)
    - Soft delete obrigatório
    - Auditoria em todas operações
    - Paginação padrão: limit=20
  
  frontend:
    - Lazy loading de componentes
    - window.location.origin (nunca hardcode)
    - Tailwind para estilização
    - Lucide para ícones
  
  database:
    - Sempre usar prepared statements
    - Bind parameters para segurança
    - Soft delete: deleted_at IS NULL
    - Auditoria: registrar em auditoria_avancada_v2

modulos_principais:
  - funcionarios: Gestão de colaboradores
  - qualificacoes: Treinamentos, exames, checks
  - simuladores: Agendamento e fichas de sessão
  - certificados: Upload e gestão de documentos
  - compliance: Dashboard e relatórios
  - pasta_virtual: Documentos por funcionário

regras_criticas:
  - NUNCA criar arquivos .md de relatório
  - NUNCA usar localhost:8787 hardcoded
  - SEMPRE usar /api/v2 para novos endpoints
  - SEMPRE implementar soft delete
  - SEMPRE registrar auditoria
  - SEMPRE validar com curl após deploy

workflow:
  desenvolvimento:
    1. Ler código existente
    2. Fazer mudanças mínimas
    3. npm run build
    4. npm run deploy
    5. Testar com curl
    6. Validar na UI
  
  validacao:
    - Build deve passar
    - Endpoints devem retornar 200
    - UI deve carregar sem erros
    - Cache deve ser limpo (Cmd+Shift+R)

problemas_comuns:
  cache:
    - Navegador mantém JS antigo
    - Solução: Modo anônimo ou limpar cache
    - Headers no-cache já implementados
  
  endpoints:
    - Ordem de rotas importa (específicas antes de genéricas)
    - Rotas com /:id capturam tudo
    - Importação deve vir ANTES de CRUD
  
  deploy:
    - Aguardar 20-30s após deploy
    - Testar em modo anônimo
    - Verificar version no HTML

metricas:
  build_time: <5s ideal
  deploy_time: <30s
  api_response: <500ms
  score_minimo: 85

auditoria:
  tabela: audit_cascade
  campos:
    - modelo: qual IA foi usada
    - arquivo: arquivo modificado
    - comando: build/test/lint
    - tempo_ms: tempo de execução
    - sucesso: 1 ou 0
    - score: métrica de eficiência
