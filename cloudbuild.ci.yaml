timeout: "10800s"

options:
  machineType: E2_HIGHCPU_8

substitutions:
  _AIRTRUST_SHA: "unknown"

steps:
  - name: node:24
    id: bootstrap
    entrypoint: bash
    args:
      - -ceu
      - |
        echo "AIRTRUST_SHA=${_AIRTRUST_SHA}"
        test -f .ci-source-sha
        test -f .ci-origin-main-sha
        test -f .ci-merge-base-sha
        source_sha="$$(cat .ci-source-sha)"
        origin_main="$$(cat .ci-origin-main-sha)"
        merge_base="$$(cat .ci-merge-base-sha)"
        git_head="$$(git rev-parse HEAD)"
        test "$$source_sha" = "${_AIRTRUST_SHA}"
        test "$$git_head" = "$$source_sha"
        test "$$(git rev-parse origin/main)" = "$$origin_main"
        test "$$(git merge-base origin/main HEAD)" = "$$merge_base"
        echo "SOURCE_SHA=$$source_sha"
        echo "GIT_HEAD=$$git_head"
        echo "GIT_ORIGIN_MAIN=$$origin_main"
        echo "GIT_MERGE_BASE=$$merge_base"
        node --version
        npm ci --cache .npm --prefer-offline
        npm ci --prefix worker-airtrust --cache .npm --prefer-offline

  - name: node:24
    id: lint
    waitFor: ["bootstrap"]
    entrypoint: bash
    args:
      - -ceu
      - |
        export VITE_API_URL="http://127.0.0.1:8787"
        npm run lint

  - name: node:24
    id: build-content-gates
    waitFor: ["bootstrap"]
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends ripgrep
        chmod +x ./scripts/ci-demo-data-check.sh ./scripts/ci-internal-docs-check.sh ./scripts/production-audit-check.sh
        ./scripts/ci-internal-docs-check.sh --test
        ./scripts/ci-internal-docs-check.sh
        VITE_API_URL=http://127.0.0.1:8787 npm run build
        npm run check:demo-data

  - name: node:24
    id: frontend-coverage
    waitFor: ["lint", "build-content-gates"]
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends sqlite3
        sqlite3 --version
        npm run test:coverage

  - name: node:24
    id: worker-typecheck
    waitFor: ["lint", "build-content-gates"]
    entrypoint: bash
    args:
      - -ceu
      - |
        cd worker-airtrust
        npx tsc --noEmit

  - name: node:24
    id: worker-tests-1
    waitFor: ["worker-typecheck"]
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends sqlite3
        sqlite3 --version
        cd worker-airtrust
        npx vitest run --shard=1/2

  - name: node:24
    id: worker-tests-2
    waitFor: ["worker-tests-1"]
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends sqlite3 git
        sqlite3 --version
        unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR
        if [ -f .git ]; then
          echo "Replacing gitdir pointer with a real repository at the workspace root"
          rm -f .git
        fi
        if [ -f release/.git ]; then
          echo "Detaching uploaded git worktree pointer at release/.git"
          cat release/.git
          rm -f release/.git
        fi
        if [ ! -d .git ]; then
          git init
        fi
        git config user.email "ci@airtrust.local"
        git config user.name "AirTrust CI"
        if ! git remote get-url origin >/dev/null 2>&1; then
          git remote add origin https://gitlab.com/airtrust-group/airtrust.git
        fi
        if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
          git commit --allow-empty -m "ci: materialize HEAD for worker-tests-2"
        fi
        git update-ref refs/remotes/origin/main HEAD
        git rev-parse --abbrev-ref HEAD
        git rev-parse HEAD
        git rev-parse origin/main
        cd worker-airtrust
        npx vitest run --shard=2/2

  - name: node:24
    id: lms-smoke
    waitFor: ["lint", "build-content-gates"]
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends sqlite3
        sqlite3 --version
        RUNTIME_JWT_SECRET="$$(openssl rand -hex 32)"
        printf '%s=%s\n' "JWT_SECRET" "$$RUNTIME_JWT_SECRET" > worker-airtrust/.dev.vars
        npm run setup:lms:local:reset
        npm run integrity:ci
        npm run dev:worker:local > airtrust-worker.log 2>&1 &
        worker_pid=$$!
        trap 'kill "$$worker_pid" || true; rm -f worker-airtrust/.dev.vars' EXIT
        for i in $$(seq 1 60); do
          if curl -fsS http://localhost:8787/api/health >/dev/null; then
            echo "Local worker ready"
            break
          fi
          if [ "$$i" -eq 60 ]; then
            cat airtrust-worker.log
            exit 1
          fi
          sleep 2
        done
        npm run smoke:lms:local

  - name: node:24
    id: public-e2e
    waitFor: ["lint", "build-content-gates"]
    entrypoint: bash
    args:
      - -ceu
      - |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends curl procps iproute2
        npx playwright install --with-deps chromium

        RUNTIME_JWT_SECRET="$$(openssl rand -hex 32)"
        printf '%s=%s\n' "JWT_SECRET" "$$RUNTIME_JWT_SECRET" > worker-airtrust/.dev.vars

        npm run dev:worker:local > /tmp/worker.log 2>&1 &
        WORKER_PID=$$!

        cleanup() {
          kill "$$WORKER_PID" 2>/dev/null || true
          rm -f worker-airtrust/.dev.vars
        }
        trap cleanup EXIT

        for i in $$(seq 1 60); do
          if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
            echo "Local worker ready"
            break
          fi
          sleep 1
        done

        curl -fsS http://127.0.0.1:8787/api/health || {
          echo "===== worker.log ====="
          cat /tmp/worker.log
          exit 1
        }

        set +e
        CI=true \
        VITE_API_URL=http://127.0.0.1:8787 \
        npx playwright test \
          --config=playwright.ci.config.ts \
          e2e/ci/login-public-smoke.spec.ts
        pw_status=$$?
        set -e
        if [ "$$pw_status" -ne 0 ]; then
          echo "===== worker.log ====="
          cat /tmp/worker.log || true
          echo "===== processes ====="
          ps aux || true
          echo "===== listen :3000 ====="
          ss -ltnp | grep 3000 || true
          exit "$$pw_status"
        fi
