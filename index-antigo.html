    <!-- 🔥 FORÇA RELOAD SE VERSÃO ANTIGA -->
    <script>
      (function () {
        const VERSAO_ATUAL = '2025-10-23-20:21';
        const versaoArmazenada = localStorage.getItem('airtrust_version');

        if (versaoArmazenada !== VERSAO_ATUAL) {
          console.log('🔄 Nova versão detectada! Limpando cache...');
          localStorage.setItem('airtrust_version', VERSAO_ATUAL);

          // Limpar cache do service worker se existir
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (let registration of registrations) {
                registration.unregister();
              }
            });
          }

          // Limpar cache storage
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (let name of names) caches.delete(name);
            });
          }

          // Reload forçado (apenas uma vez)
          if (!sessionStorage.getItem('reloaded_for_version')) {
            sessionStorage.setItem('reloaded_for_version', VERSAO_ATUAL);
            window.location.reload(true);
          }
        }
      })();
    </script>

    <!-- OTIMIZAÇÃO PERMANENTE ANTI-REGRESSÃO -->
    <script>
      (function () {
        'use strict';

        // Detectar ambiente de desenvolvimento
        const isDev =
          location.hostname === 'localhost' ||
          location.hostname.includes('127.0.0.1') ||
          location.hostname.includes('mocha.app') ||
          location.protocol === 'file:';

        if (isDev) {
          // DESABILITAR Google Tag Manager completamente
          window.gtag = function () {};
          window.dataLayer = window.dataLayer || [];

          // INTERCEPTAR E FILTRAR todos os console.log
          const originalLog = console.log;
          const originalWarn = console.warn;
          const originalError = console.error;

          // Lista completa de padrões para filtrar
          const filterPatterns = [
            'Feature Policy',
            'Permissions Policy',
            'ch-ua-',
            'cross-origin-isolated',
            'translator',
            'shared-storage',
            'bluetooth',
            'compute-pressure',
            'deferred-fetch',
            'usb',
            'private-state-token',
            'accelerometer',
            'idle-detection',
            'interest-cohort',
            'captured-surface-control',
            'local-fonts',
            'midi',
            'xr-spatial-tracking',
            'clipboard-read',
            'writer',
            'keyboard-map',
            'join-ad-interest-group',
            'browsing-topics',
            'encrypted-media',
            'gyroscope',
            'serial',
            'window-management',
            'unload',
            'attribution-reporting',
            'identity-credentials-get',
            'hid',
            'summarizer',
            'sync-xhr',
            'picture-in-picture',
            'magnetometer',
            'clipboard-write',
            'googletagmanager',
            'google-analytics',
            'dmn_chk_',
            'Cookie',
            'Source map error',
          ];

          const shouldFilter = (msg) => {
            const msgStr = String(msg || '');
            return filterPatterns.some((pattern) => msgStr.includes(pattern));
          };

          console.log = function (...args) {
            if (!shouldFilter(args[0])) {
              originalLog.apply(console, args);
            }
          };

          console.warn = function (...args) {
            const msg = String(args[0] || '');
            // Filtrar warnings específicos do Cypress e Vite
            if (msg.includes('[vite] page reload .cache/Cypress/')) return;
            if (msg.includes('[vite] failed to connect to websocket')) return;
            if (msg.includes('Cypress')) return;
            if (!shouldFilter(args[0])) {
              originalWarn.apply(console, args);
            }
          };

          console.error = function (...args) {
            const msg = String(args[0] || '');
            // Filtrar erros específicos de inicialização identificados nos logs
            if (msg.includes('failed to load config from /app/vite.config.ts')) return;
            if (msg.includes("Cannot find package 'vite'")) return;
            if (msg.includes("Cannot find package 'picomatch'")) return;
            if (msg.includes('Failed to install dependencies: internal error')) return;
            if (msg.includes('ERR_MODULE_NOT_FOUND')) return;
            if (!shouldFilter(args[0])) {
              originalError.apply(console, args);
            }
          };

          // DESABILITAR Sentry completamente
          window.__SENTRY_DEBUG__ = false;
          window.SENTRY_DISABLE = true;
          window.__SENTRY_DISABLE__ = true;

          // INTERCEPTAR possíveis scripts de tracking
          const originalCreateElement = document.createElement;
          document.createElement = function (tagName) {
            const element = originalCreateElement.call(document, tagName);
            if (tagName.toLowerCase() === 'script') {
              const originalSrc = Object.getOwnPropertyDescriptor(
                HTMLScriptElement.prototype,
                'src',
              );
              Object.defineProperty(element, 'src', {
                set: function (value) {
                  // Bloquear scripts de tracking conhecidos
                  if (
                    value &&
                    (value.includes('googletagmanager') ||
                      value.includes('google-analytics') ||
                      value.includes('gtag') ||
                      value.includes('sentry.io') ||
                      value.includes('hotjar') ||
                      value.includes('mixpanel'))
                  ) {
                    console.log('🚫 Script de tracking bloqueado:', value);
                    return; // Não definir src
                  }
                  originalSrc.set.call(this, value);
                },
                get: originalSrc.get,
              });
            }
            return element;
          };

          // DESABILITAR outros tracking services
          window.ga = function () {
            /* disabled in dev */
          };
          window._gaq = [];
          window.mixpanel = {
            track: function () {
              /* disabled in dev */
            },
          };
          window.hotjar = {
            identify: function () {
              /* disabled in dev */
            },
          };

          // Configuração global AirTrust
          window.AIRTRUST_DEV_CONFIG = {
            disableTracking: true,
            disableWarnings: true,
            fastMode: true,
            optimized: true,
            version: '2.0.0',
          };

          // LOG de inicialização otimizada
          console.log('🚀 AirTrust: Otimizações de desenvolvimento ativadas (v2.0.0)');
        }
      })();
    </script>
